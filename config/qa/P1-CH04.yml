  # ===== PRATICIEN_AGILE : CA =====

  - id: "P1-CH04-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: JEFF_PATTON
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    themes_salim: [L, M]
    question: "J'accompagne un PO qui pense son backlog en features sans jamais se demander si elles créent de la valeur. Comment je l'aide à passer d'un backlog de fonctionnalités à un backlog orienté outcomes ?"
    reponse: "La distinction output/outcome traverse le chapitre, en particulier via le critère V (Valuable) d'INVEST, le plus souvent négligé, et via le Story Mapping qui force à nommer pour qui l'équipe construit et vers quoi elle avance. Le coach utilise le Story Mapping comme outil de diagnostic : quand la réponse à quel est notre Product Goal reste vague, faire un Story Map révèle soit le Product Goal soit les désaccords sur la direction produit, ce qui est tout aussi utile."
    douleur_terrain: "Le PO pense son backlog en features. Il ne se demande jamais si ces features créent de la valeur mesurable."
    source_expert: "Jeff Patton."
    page: 108
    extrait: "Le fait de tracer les activités utilisateur de bout en bout force l'équipe à nommer pour qui elle construit, et vers quoi elle avance."
    fiche_liee: "FP-P1-CH04-T06-05"
    fiche_destinee_a: [CA, PO]
    statut_reponse: confirmee
