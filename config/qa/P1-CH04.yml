  - id: "P1-CH04-DEV-03"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: MIKE_COHN
    dimensions: [quoi, pourquoi, comment, valeur]
    themes_salim: [I, M]
    question: "Je donne une estimation en points et deux sprints plus tard mon manager la traite comme une date de livraison garantie. Comment je m'en protège ?"
    reponse: "L'estimation en story points via l'estimation silencieuse est une mesure relative qui produit une fourchette, pas un engagement de date. Le format en 4 rounds (vider, reposer, discuter les écarts, ré-estimer) sert à obtenir un jugement collectif sur la taille relative, pas une promesse de delai. Si une story reste en désaccord après deux rounds, elle est trop floue et retourne en refinement, ce n'est pas un échec de l'équipe."
    douleur_terrain: "Le dev donne un chiffrage, le manager le transforme en date gravée dans le marbre. 2 sprints plus tard le dev est responsable du retard."
    source_expert: "Mike Cohn : estimation relative = outil de conversation, pas de contrat."
    page: 114
    extrait: "Avant d'entrer en Sprint Planning, le backlog doit être estimé. Pas pour satisfaire un manager friand de chiffres."
    fiche_liee: "FP-P1-CH04-T04-03"
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH04-04"]

  - id: "P1-CH04-DEV-04"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    themes_salim: [S]
    question: "Le PO me donne un critère d'acceptation flou type alors la performance est correcte. Comment je le renvoie sans bloquer la session des 3 amigos ?"
    reponse: "Le test du client de 12 ans : si quelqu'un sans bagage technique ne peut pas lire le ALORS et comprendre exactement ce que le produit doit faire, le critère est mal rédigé. Concrètement, alors la performance est correcte devient alors la page se charge en moins de 2 secondes. Si tu ne peux pas écrire un test depuis le critère, il n'est pas prêt, et c'est un signal objectif à renvoyer au PO, pas un jugement personnel."
    douleur_terrain: "Les critères trop vagues ne veulent rien dire et génèrent des débats d'interprétation en Sprint Review."
    source_expert: null
    page: 107
    extrait: "Les critères trop vagues. Alors la performance est correcte ne veut rien dire."
    fiche_liee: "FP-P1-CH04-T06-01"
    fiche_destinee_a: [DEV, PO]
