  - id: "P1-CH04-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: MIKE_COHN
    dimensions: [quoi, comment, quand, pourquoi, valeur]
    themes_salim: [S, L]
    question: "Mon équipe perd 40 minutes à chaque Sprint Planning sur des stories pas prêtes. Quand est-ce que je dois dire stop et comment je le formule sans braquer le PO ?"
    reponse: "C'est le symptôme d'une équipe sans Definition of Ready. La règle terrain : si une story génère plus de 2 questions de clarification avant l'estimation en Sprint Planning, elle sort et retourne au Refinement. Ca se dit avant le Sprint Planning, pas pendant : la DoR se construit et s'affiche en amont, elle n'est pas un jugement en séance."
    douleur_terrain: "J'ai vu cette séquence probablement deux cents fois. La story est mise de côté et le sprint planning perd 40 minutes."
    source_expert: null
    page: 117
    extrait: "J'ai vu cette séquence probablement deux cents fois. C'est le symptôme d'une équipe sans Definition of Ready."
    fiche_liee: "FP-P1-CH04-T04-02"
    fiche_destinee_a: [SM, PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH04-03"]

  - id: "P1-CH04-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: MIKE_COHN
    dimensions: [quoi, comment, quand, valeur, pourquoi]
    themes_salim: [S]
    question: "Mon Planning Poker dure deux heures et tourne en débat sans fin sur deux ou trois stories. Comment je structure une session d'estimation pour que ça n'arrive plus ?"
    reponse: "L'estimation silencieuse en 4 rounds : vider les stories (chacun pose son estimation en silence), reposer les points (60 à 70% des stories convergent directement), discuter les écarts (seuls le plus bas et le plus haut parlent, 2 minutes max), ré-estimer. Le SM prépare le matériel : post-its avec titre et critères d'acceptation, colonnes Fibonacci affichées. Condition non négociable : toutes les stories doivent avoir été affinées en Refinement avant la session."
    douleur_terrain: "Le biais du premier parleur ancre toutes les estimations suivantes et génère des débats prolongés sur des stories mal comprises."
    source_expert: "Mike Cohn, Agile Estimating and Planning (2005) : le biais du premier parleur est l'un des défauts structurels les plus fréquents du Planning Poker."
    page: 114
    extrait: "C'est de ce diagnostic que j'ai construit, au fil du terrain, une technique que j'appelle l'estimation silencieuse."
    fiche_liee: "FP-P1-CH04-T04-03"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH04-04"]

  - id: "P1-CH04-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, quand, comment, pourquoi, valeur]
    themes_salim: [S, M]
    question: "Une story arrive en Refinement et l'équipe dit qu'elle ne peut pas l'estimer. Comment je distingue un vrai spike d'une excuse pour ne pas s'engager ?"
    reponse: "Pose la question avant de forcer un chiffre : sait-on ce qu'il faudrait savoir pour estimer ? Si la réponse est non, c'est un spike, à time-boxer et lancer avant le Sprint Planning. Si la vraie contrainte est le délai et non l'incertitude, le spike n'est pas la bonne réponse : l'équipe décide quand même, assume le risque, et trace la décision."
    douleur_terrain: "Un spike sans question précise n'en est pas un. Si l'équipe ne peut pas formuler la question en une phrase avant de créer le ticket, le spike n'est pas prêt."
    source_expert: "Kent Beck, Extreme Programming Explained (2000) ; Ron Jeffries, Essential XP (2001)."
    page: 120
    extrait: "Kent Beck disait lui-même que le spike est utile quand tu es limité en connaissance, pas en temps."
    fiche_liee: "FP-P1-CH04-T04-04"
    fiche_destinee_a: [SM, PO, DEV]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  # ===== PRATICIEN_AGILE : PO =====

  - id: "P1-CH04-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: SGEP
    dimensions: [quoi, pourquoi, qui, valeur]
    themes_salim: [L, M]
    question: "Je valide qu'une story est codée et déployée, la DoD est respectée, mais six mois après personne ne se sert de la fonctionnalité. Ma DoD output suffit-elle ou ai-je besoin d'autre chose ?"
    reponse: "Le chapitre traite la DoD output : code reviewé, testé, déployé, critères d'acceptation vérifiés. Un encadré a été intégré après la section 5 DoD (p.115-116) pour nommer explicitement cette limite : la Definition of Outcome Done, qui porterait sur l'usage réel et la valeur produite après livraison, relève d'un référentiel complémentaire (SGEP) et n'est pas développée ici. Le texte est désormais clair sur la frontière, mais aucune fiche pratique ne couvre encore la DoOD elle-même."
    douleur_terrain: "Le PO valide que le code est livré mais pas que la valeur attendue est réalisée."
    source_expert: "SGEP : The Product Owner has the final say on the Definition of Outcome Done."
    page: 115
    extrait: "La DoD que tu viens de lire porte sur la sortie : ce qui est livré. Elle ne dit rien sur l'usage réel de ce qui est livré six mois après."
    fiche_liee: null
    fiche_destinee_a: [PO]
    statut_reponse: trou
    action_recommandee: "Texte intégré (p.115-116). Reste ouvert : produire un contenu (chapitre métriques ou fiche) sur la Definition of Outcome Done elle-même, pas seulement sa frontière avec la DoD."
    schemas_lies: []

  - id: "P1-CH04-PO-02"
    cible: PRATICIEN_AGILE
    role: PO
    expert: JEFF_PATTON
    dimensions: [quoi, comment, pourquoi, valeur]
    themes_salim: [S]
    question: "Mon backlog fait 300 items sans cohérence narrative et je n'arrive pas à expliquer la vision produit en une phrase. Le Story Mapping va-t-il m'aider à prioriser ou juste à visualiser ?"
    reponse: "Les deux. Le Story Mapping organise les stories sur deux axes, flux d'activités utilisateur et niveau d'enrichissement, et le résultat est une carte du produit, pas une liste de fonctionnalités. Cette carte permet de définir des releases cohérentes en coupant horizontalement, et c'est l'outil le plus concret pour formuler un Product Goal tangible quand la réponse à quel est notre Product Goal reste vague."
    douleur_terrain: "Le PO jongle entre une vision produit floue et un backlog de 300 items sans cohérence narrative."
    source_expert: "Jeff Patton, 2014."
    page: 108
    extrait: "Il y a un lien direct entre le Story Mapping et le Product Goal : la carte est l'outil le plus concret que je connaisse pour formuler un Product Goal tangible."
    fiche_liee: "FP-P1-CH04-T06-05"
    fiche_destinee_a: [PO, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH04-02"]

  - id: "P1-CH04-PO-03"
    cible: PRATICIEN_AGILE
    role: PO
    expert: MIKE_COHN
    dimensions: [quoi, pourquoi, comment, valeur]
    themes_salim: [S]
    question: "Mes stories sont indépendantes sur le papier mais dans notre système couplé, la moitié dépend d'une autre. Comment je gère ça quand INVEST me demande l'indépendance ?"
    reponse: "Le critère I d'INVEST est posé (aucune dépendance bloquante sur une autre). Un paragraphe a été intégré dans la section a Ce qui résiste dans la réalité (p.112) : quand une dépendance technique apparaît sur le Story Map, la noter explicitement comme un risque avec l'équipe ou le composant concerné, et en discuter au Refinement suivant. Le texte nomme désormais le risque, mais ne fournit pas de méthode complète de gestion des dépendances pour un système couplé de longue date."
    douleur_terrain: "Le PO en entreprise gère des systèmes couplés où les stories sont rarement indépendantes."
    source_expert: "Mike Cohn."
    page: 112
    extrait: "Quand une dépendance technique apparaît sur ton Story Map, ne la laisse pas dans un coin de la carte. Note-la explicitement comme un risque, avec l'équipe ou le composant concerné, et discute-en au Refinement suivant."
    fiche_liee: null
    fiche_destinee_a: [PO]
    statut_reponse: trou
    action_recommandee: "Texte intégré (p.112). Reste ouvert : fiche pratique PO sur la gestion des dépendances inter-équipes dans un système avec dette technique, voir T03."
    schemas_lies: []

  - id: "P1-CH04-PO-04"
    cible: PRATICIEN_AGILE
    role: PO
    expert: MIKE_COHN
    dimensions: [quoi, comment, pourquoi, valeur]
    themes_salim: [S, I]
    question: "J'ai 40 stories prêtes côté critères INVEST mais je dois en choisir 8 pour le prochain sprint. Sur quoi je base l'ordre si ce n'est pas juste l'intuition ?"
    reponse: "TROU. INVEST aide à savoir si une story est prête mais ne donne pas de méthode de priorisation multi-critères (valeur, risque, effort). Le Story Mapping aide à visualiser et structurer en releases, mais le chapitre ne fournit pas de framework de priorisation explicite au-delà de l'ordre du backlog."
    douleur_terrain: "Le PO priorise à l'intuition ou sous pression des stakeholders."
    source_expert: "Mike Cohn."
    page: null
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO]
    statut_reponse: trou
    action_recommandee: "Fiche pratique PO : priorisation multi-critères (valeur, risque, effort), à produire en complément du chapitre. Pas d'insertion dans le texte du chapitre lui-même : signaler comme renvoi vers un outil annexe."

  # ===== PRATICIEN_AGILE : DEV =====

  - id: "P1-CH04-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: LISA_CRISPIN
    dimensions: [quoi, pourquoi, qui, valeur]
    themes_salim: [L, I]
    question: "On me dit que la DoD c'est de la bureaucratie qui ralentit le sprint. Est-ce que c'est vraiment ça ou est-ce que ça me protège ?"
    reponse: "C'est un outil de protection, pas une contrainte. Une DoD avec minimum 8 critères empêche de livrer du code non testé, non déployable, ou non documenté. Elle évolue en 3 niveaux de maturité selon l'ancienneté de l'équipe en Scrum, et elle protège le dev des régressions et de la dette technique qui finit toujours par retomber sur lui."
    douleur_terrain: "Le dev vit la DoD comme une checklist imposée. Il ne voit pas que c'est lui qui en souffre en premier quand elle est trop courte."
    source_expert: "Lisa Crispin : The entire Scrum Team is responsible for quality and testing."
    page: 113
    extrait: "Évolution de la DoD : 3 niveaux de maturité."
