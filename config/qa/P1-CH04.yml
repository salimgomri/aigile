  - id: "P1-CH04-MG-03"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [quoi, pourquoi, comment, valeur]
    themes_salim: [M]
    question: "Mon équipe me dit que le backlog est trop gros et qu'il faut prioriser, mais je n'ai aucun repère pour juger si 300 items c'est beaucoup ou normal. Comment je me positionne sans devenir le PO ?"
    reponse: "Le repère terrain : un backlog sain fait deux à quatre fois la vélocité de l'équipe en points, ce n'est pas une norme issue de la littérature mais une convention praticienne testée. Au-delà, ce n'est pas le ratio en lui-même qui est le problème mais le manque de décision : un backlog de 300 points pour une vélocité de 40 dont la moitié date d'un an signale que personne n'a tranché sur ce qui reste pertinent. Le manager peut poser la question sans trancher à la place du PO : qu'est-ce qui, dans ce backlog, n'est plus pertinent et pourquoi ça reste ?"
    douleur_terrain: "Le manager voit un backlog qui grossit sans fin et ne sait pas si c'est normal ou un signal d'alerte à faire remonter."
    source_expert: null
    page: 122
    extrait: "Le repère que j'utilise depuis le terrain : deux à quatre fois la vélocité de l'équipe en points."
    fiche_liee: "FP-P1-CH04-T06-01"
    fiche_destinee_a: [MG, PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH04-01"]

  # ===== DECIDEUR =====

  - id: "P1-CH04-DC-01"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [quoi, pourquoi, comment, qui, valeur]
    themes_salim: [M, I]
    question: "J'ai mis trois équipes sous Scrum il y a 18 mois, elles font des cérémonies, mais je ne sais pas si le travail livré correspond à ce qu'on a réellement besoin. Sur quoi je m'appuie pour le savoir sans tout réauditer ?"
    reponse: "Le chapitre donne deux leviers concrets à demander aux équipes : un INVEST à 6/6 sur les stories qui entrent en sprint, et une DoD à minimum 8 critères vérifiables ET respectés, qui évolue selon 3 niveaux de maturité (débutante, confirmée, mature). Ces deux jauges sont vérifiables sans lire le backlog en entier. Le signal d'alerte le plus parlant pour un DSI : une DoD allégée sans décision explicite, qui produit une dette non tracée et une vélocité qui chute dans 3 à 5 sprints, souvent juste après une remontée de vélocité présentée comme un succès."
    douleur_terrain: "Le décideur a investi dans une transformation et n'a pas de signal précoce pour distinguer une équipe qui progresse d'une équipe qui a juste appris à faire semblant."
    source_expert: null
    page: 124
    extrait: "INVEST : 6/6 critères respectés avant Sprint Planning. DoD : minimum 8 critères définis, vérifiables ET respectés."
    fiche_liee: "FP-P1-CH04-T03-07"
    fiche_complementaire: "FP-P1-CH04-T02-09"
    fiche_destinee_a: [DC, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH04-05"]

  - id: "P1-CH04-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [quoi, pourquoi, quand, valeur, comment]
    themes_salim: [M, S]
    question: "Une équipe me demande un sprint entier pour explorer une faisabilité technique avant de s'engager sur le développement. Comment je distingue un investissement légitime d'un sprint perdu ?"
    reponse: "C'est un spike, et le critère qui tranche est le time-boxing décidé avant de commencer : deux à quatre heures pour une question simple, un jour pour une exploration technique, deux à trois jours maximum pour un prototype. Un spike qui dépasse un sprint signale que la question était trop large et doit être découpée. Le livrable est toujours le même, une page : la réponse à la question posée, ce qui a été exploré, les risques résiduels, la prochaine action. Si l'équipe ne peut pas formuler la question en une phrase avant de créer le ticket, ce n'est pas un spike légitime."
    douleur_terrain: "Le décideur voit un sprint sans fonctionnalité livrée et ne sait pas s'il s'agit d'un investissement nécessaire ou d'un évitement de l'engagement."
    source_expert: "Kent Beck, Extreme Programming Explained (2000) ; Ron Jeffries, Essential XP (2001)."
    page: 120
    extrait: "Deux à quatre heures pour une question simple. Un jour pour une exploration technique. Deux à trois jours au maximum pour un prototype."
    fiche_liee: "FP-P1-CH04-T04-04"
    fiche_destinee_a: [DC, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P1-CH04-DC-03"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [quoi, pourquoi, valeur, qui]
    themes_salim: [L, M]
    question: "On me présente des stories soi-disant terminées qui ressemblent surtout a du travail technique interne, sans que je voie le lien avec ce que demandent les clients. Comment je challenge ça sans entrer dans le détail technique ?"
    reponse: "Le critère à demander : la story exprime-t-elle sa valeur, pas son implémentation. Le chapitre donne un exemple direct : migrer la base de données vers PostgreSQL n'est pas une story valable telle quelle, mais permettre à l'équipe de déployer des releases sans fenêtre de maintenance grâce à la migration PostgreSQL dit pourquoi c'est important. Une story technique peut être légitime, à condition qu'elle réponde à la question pour qui et pourquoi, pas seulement quoi. C'est le critère V (Valuable) d'INVEST, identifié dans le chapitre comme le plus souvent négligé."
    douleur_terrain: "Le décideur reçoit des comptes-rendus de livraison qu'il ne peut pas relier à une valeur visible pour l'utilisateur ou le business."
    source_expert: null
    page: 100
    extrait: "Une story technique peut être légitime dans un backlog : mais elle doit exprimer sa valeur."
    fiche_liee: "FP-P1-CH04-T06-01"
    fiche_destinee_a: [DC, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH04-01"]

