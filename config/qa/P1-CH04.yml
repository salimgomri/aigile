    question: "En Refinement, le PO arrive sans rien et je me retrouve à formuler les critères d'acceptation à sa place. Comment je participe sans faire son travail ?"
    reponse: "Le développeur challenge la faisabilité technique et la décomposition de la story, et dans la session des 3 amigos il vérifie que c'est faisable sans surprise. Il ne rédige pas les critères d'acceptation, c'est la responsabilité du PO qui doit arriver avec un brouillon utilisable. Si ce brouillon n'existe pas, le problème n'est pas le rôle du dev mais la préparation du PO en amont."
    douleur_terrain: "Dans beaucoup d'équipes, le Refinement devient une session où les devs écrivent les stories parce que le PO n'est pas préparé."
    source_expert: "Dave Farley."
    page: 105
    extrait: "La session des 3 amigos : PO, un développeur, un QA. Avant le sprint. 30 à 45 minutes par story. Le PO apporte son brouillon."
