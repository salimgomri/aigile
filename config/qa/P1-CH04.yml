    themes_salim: [S]
    question: "Une session de Story Mapping que j'anime tourne au conflit ouvert entre parties prenantes sur la direction produit. Est-ce que j'ai raté quelque chose ?"
    reponse: "Non, c'est un signal attendu. Aligner des parties prenantes aux visions divergentes est la vraie difficulté dès l'étape 1, et révéler des désaccords profonds sur la direction produit qui n'avaient jamais été posés explicitement est une bonne nouvelle sur le fond, même si c'est douloureux sur le moment. Le rôle du coach n'est pas d'éviter ce conflit mais de le rendre productif : l'objectif n'est pas la carte parfaite, c'est une conversation partagée sur la direction produit."
    douleur_terrain: "L'outil semble simple en quatre étapes mais révèle des tensions organisationnelles que personne n'avait nommées."
