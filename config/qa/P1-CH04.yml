  # ===== PRATICIEN_AGILE : SM =====

  - id: "P1-CH04-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    themes_salim: [S]
    question: "Comment je facilite un Refinement sans devenir un proxy PO qui finit par écrire les stories à sa place ?"
    reponse: "Le SM facilite la session et fait avancer le rythme, le PO porte le contenu et le brouillon de critères. INVEST sert de grille partagée pour challenger une story sans décider à la place du PO. Si le SM se retrouve à formuler les criteres lui-même, c'est un signal que le PO arrive sans brouillon."
    douleur_terrain: "Dans les équipes sans PO fort, le SM finit par écrire les stories lui-même pour que le Refinement avance."
    source_expert: null
    page: 104
    extrait: "Son rôle dans la pratique : apporter un brouillon utilisable avant la session des 3 amigos. Pas un texte finalisé."
