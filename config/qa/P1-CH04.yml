    question: "Mon équipe a allégé sa Definition of Done le mois dernier sans m'en parler et la vélocité a remonté d'un coup. C'est bon signe ou je dois m'inquiéter ?"
    reponse: "C'est un signal d'alerte, pas une bonne nouvelle. La DoD doit évoluer en rétrospective, jamais unilatéralement, et ne doit jamais être allégée sans décision consciente et traçabilité explicite de la dette créée. Le repère terrain : DoD allégée sans décision explicite égale dette non tracée égale vélocité qui chute dans 3 à 5 sprints. Une remontée brutale de vélocité après allégement silencieux de la DoD est donc un indicateur à vérifier, pas à célébrer."
    douleur_terrain: "Le manager voit la vélocité remonter et le présente comme un succès en comité, sans savoir que c'est un signal de dette non tracée."
    source_expert: null
    page: 124
    extrait: "Alerte : DoD allégée sans décision explicite = dette non tracée = vélocité qui chute dans 3-5 sprints."
    fiche_liee: "FP-P1-CH04-T06-06"
    fiche_destinee_a: [MG, SM]
