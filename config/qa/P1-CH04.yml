  - id: "P1-CH04-DEV-05"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    themes_salim: [A]
    question: "On me demande d'automatiser des tests Selenium à partir des critères GWT avec l'aide d'un LLM. Qu'est-ce que ça change vraiment pour moi ?"
    reponse: "Le format GWT est du texte structuré, donc automatisable : un scénario GWT propre fourni à un agent IA génère le squelette de test Selenium, ce qui fait passer une tâche de 2 heures à 20 minutes. Le développeur reste responsable de valider, connecter et ajuster les détails spécifiques au contexte. La condition ne change pas : un ALORS vague donne un test vague, un ALORS mesurable donne un test utilisable."
    douleur_terrain: "Les tests de non-régression arrivent souvent dans une phase séparée, après la livraison, quand il est trop tard pour corriger sans tout casser."
    source_expert: null
    page: 106
    extrait: "Couple ça à un LLM : fournis un scénario GWT propre à un agent IA, il génère le squelette de test Selenium."
