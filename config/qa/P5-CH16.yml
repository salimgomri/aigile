  # === PAIR PROGRAMMING IA ===

  - id: "P5-CH16-SM-10"
    cible: PRATICIEN_AGILE
    role: SM
    expert: "Kent Beck (XP Pair Programming 1999)"
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Mon equipe produit du code deux fois plus vite avec l'IA mais chaque dev travaille seul. Le bus factor monte. Quand un dev part en vacances, le sprint deraille. Comment est-ce que je reintroduis le pair programming sans que l'equipe le vive comme un ralentissement impose ?"
    reponse: "L'argument pour le manager est direct : une story faite seul qui genere 3 jours de bugfix coute plus cher que deux personnes qui la font proprement du premier coup. Le SM identifie avec le Tech Lead les stories qui meritent un binome (code critique, nouveau module, onboarding, zone inconnue), planifie les binomes en variant les paires chaque sprint, et protege les sessions des interruptions. Signal de succes : les devs qui ont paire peuvent expliquer ce qu'ils ont fait a un troisieme dev sans documentation."
    douleur_terrain: "Quand un developpeur code avec Copilot ou Cursor, il produit vite mais seul. Le code sort. La connaissance reste dans une seule tete. Parfois dans aucune tete : il a accepte les suggestions de l'IA sans comprendre ce qu'il integrait."
    source_expert: "Kent Beck, Extreme Programming Explained (1999)"
    page: 343
    extrait: null
    fiche_liee: "FP V-16.6"
    fiche_destinee_a: [SM, DEV, CA]
    statut_reponse: confirmee
    action_recommandee: "Identifier avec le Tech Lead les 2-3 stories du prochain sprint qui meritent un binome. Planifier la rotation."
    schemas_lies: []

  - id: "P5-CH16-DEV-03"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "En pair programming avec l'IA dans le binome, je suis souvent Navigator. Je regarde le Driver interagir avec Copilot et on accepte les suggestions sans vraiment les questionner. Quel est mon vrai role de Navigator quand l'IA est dans la session ?"
    reponse: "Le Navigator change de mission quand l'IA est dans le binome. Il ne regarde plus seulement le code. Il verifie que ce que l'IA propose correspond aux criteres d'acceptance, que le Driver ne l'accepte pas par reflexe. Deux questions a poser a voix haute : 'Attends, est-ce que ce bout fait bien ce que le ALORS dit ?' et 'Est-ce que l'IA avait le bon contexte pour generer ca ?' Si le Driver a colle un fichier de 400 lignes dans le prompt, la suggestion est coherente avec ce fichier, pas forcement avec le reste du systeme."
    douleur_terrain: "Seul face a l'IA, un developpeur accepte une grande partie des suggestions sans les lire vraiment. En pair, ce reflexe tombe parce que le Navigator est la pour poser la question."
    source_expert: null
    page: 346
    extrait: null
    fiche_liee: "FP V-16.6"
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: "Pendant la prochaine session pair : noter combien de suggestions IA le Driver accepte sans discussion. Ce nombre est le diagnostic."
    schemas_lies: []

  - id: "P5-CH16-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "J'accompagne plusieurs equipes qui adoptent l'IA. Dans certaines, le pair programming s'est vide de sens : les deux devs acceptent les suggestions IA sans se parler, le senior garde toujours le clavier, les sessions depassent 2 heures. Quels sont les 4 signaux concrets qui me disent que la session ne produit rien d'utile ?"
    reponse: "Les 4 signaux : (1) Le senior garde toujours le clavier, la rotation n'est pas respectee, le junior decroche progressivement. Intervention SM : timer visible, rappel de la regle, pas de negociation. (2) Personne ne parle. Driver code en silence, Navigator consulte ses messages. Deux personnes dans la meme piece qui travaillent separement. (3) La session depasse 2 heures sans pause. Fatigue cognitive, ni le Driver ni le Navigator ne voient plus les erreurs. Regle : 2 heures max, pause 10 min, rotation a la reprise. (4) L'IA remplace le dialogue. Driver et Navigator acceptent les suggestions sans les discuter. Le plus frequent et le plus difficile a detecter de l'exterieur."
    douleur_terrain: "Le pair programming IA dysfonctionnel est invisible de l'exterieur. Les deux devs sont dans la meme piece, l'IA produit du code, les tests passent. Personne ne voit que la connaissance ne circule pas."
