  # === SIGNAUX DORA ===

  - id: "P5-CH16-SM-05"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    question: "Depuis que mon equipe utilise l'IA intensivement, la Deployment Frequency a explose. Mon manager est ravi. Mais je vois que le Change Failure Rate monte en meme temps. Comment est-ce que j'explique ce paradoxe a mon manager sans passer pour quelqu'un qui ralentit la machine, et quel seuil d'alerte me force a intervenir ?"
    reponse: "Le paradoxe DF en hausse + CFR en hausse est le premier signal d'alerte d'une equipe qui deploie plus vite qu'elle ne comprend. La regle pratique : surveille le CFR en priorite dans les 3 premiers mois d'usage intensif de l'IA. Si le CFR monte pendant que la DF monte, l'equipe va plus vite dans la mauvaise direction. C'est le signal pour ralentir et reviser la DoD. Pour ton manager : la reponse factuelle est 'La velocite a monte de X %. Le CFR a bouge de Y %. Je surveille le delta depuis 3 sprints. Je te reviens dans 2 sprints avec une lecture.' Ce n'est pas une excuse. C'est un suivi de qualite."
    douleur_terrain: "Le manager qui ne regarde que la DF est aveugle sur la qualite. L'equipe deploie plus souvent mais deploie des bugs. Le MTTR monte. Quelqu'un decouvre le probleme en production."
    source_expert: "Dave Farley (DORA)"
    page: 342
    extrait: null
    fiche_liee: "FP-P5-CH16-memo-reference-01"
    fiche_destinee_a: [SM, MG]
    statut_reponse: confirmee
    action_recommandee: "Regarder les 3 derniers sprints : la DF a-t-elle augmente ? Le CFR a-t-il bouge dans le meme sens ou en sens inverse ? Ce delta dit tout."
    schemas_lies: ["SVG-P5-CH16-02"]

  - id: "P5-CH16-DC-01"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, pourquoi, valeur]
    question: "J'ai autorise et finance l'adoption de l'IA dans mes equipes de developpement. La velocite est en hausse, tout le monde est satisfait. Comment est-ce que je sais si cette hausse de velocite est reelle et durable, ou si elle masque une degradation de la qualite qui va se repercuter sur mes couts de maintenance dans 6 mois ?"
    reponse: "Le signal fiable n'est pas la velocite. C'est le ratio DF/CFR. Si le Change Failure Rate augmente plus vite que la Deployment Frequency, la qualite se degrade pendant que la vitesse monte. L'IA ameliore la vitesse, pas automatiquement la fiabilite. Les metriques a surveiller en parallele : CFR et MTTR en parallele de DF et Lead Time for Changes. Principe : l'IA peut generer des tests plus complets, mais si les tests sont generes sans etre compris, ils ne couvrent pas les vrais cas limites. La dette technique invisible se manifeste quand quelqu'un doit toucher un module que personne ne comprend vraiment."
    douleur_terrain: "Le decideur qui reporte uniquement la velocite a sa direction de tutelle valide une transformation sans signal d'alerte qualite. Le probleme se manifeste 6 mois plus tard comme une hausse des incidents en production."
    source_expert: null
    page: 342
    extrait: null
    fiche_liee: "FP-P5-CH16-memo-reference-01"
    fiche_destinee_a: [DC, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P5-CH16-02"]

  # === PAIR PROGRAMMING ===

  - id: "P5-CH16-SM-06"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Mon equipe utilise l'IA en solo pour coder. Chaque dev produit plus vite. Mais le bus factor monte : le dev qui connait le module de paiement est le seul a comprendre ce qu'il a construit avec Copilot. Quand il prend des vacances le sprint deraille. Comment est-ce que je reintroduis le pair programming sans que l'equipe le vive comme un ralentissement impose ?"
    reponse: "La reponse au manager est directe et chiffree : une story faite seul qui genere 3 jours de bugfix coute plus cher que deux personnes qui la font proprement du premier coup. Ce n'est pas une position philosophique. Le SM ne decide pas quand faire du pair : il identifie avec le Tech Lead les stories qui meritent un binome (code critique, nouveau module, onboarding d'un dev recent, premiere story dans une zone inconnue). Il planifie les binomes (senior avec junior sur les zones a risque, deux devs de meme niveau sur les decisions d'architecture), varie les binomes d'un sprint a l'autre pour que la connaissance se distribue dans l'equipe, et protege les sessions des interruptions. Signal de succes : les devs qui ont paire peuvent expliquer ce qu'ils ont fait a un troisieme dev sans documentation."
    douleur_terrain: "Quand un developpeur code avec Copilot ou Cursor, il produit plus vite mais il produit seul. Le code sort, la connaissance reste dans une seule tete. Parfois dans la tete de personne : il a accepte les suggestions de l'IA sans vraiment comprendre ce qu'il integrait."
    source_expert: "Kent Beck (XP Pair Programming)"
    page: 343
    extrait: null
    fiche_liee: "FP-P5-CH16-checklist-detection-01"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: "Identifier avec le Tech Lead les 2-3 stories du prochain sprint qui meritent un binome. Planifier la rotation."
    schemas_lies: []

  - id: "P5-CH16-DEV-03"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "En pair programming avec l'IA dans le binome, je suis souvent le Navigator. Je regarde le Driver interagir avec Copilot et j'accepte les suggestions avec lui sans les questionner vraiment. Quel est mon vrai role de Navigator quand l'IA est dans la session, et comment est-ce que je contribue plutot que de doubler passivement le Driver ?"
    reponse: "Le Navigator change de mission quand l'IA est dans le binome. Il ne regarde plus seulement le code. Il verifie que ce que l'IA propose est juste, que le Driver ne l'accepte pas par reflexe, et que le code genere correspond aux criteres d'acceptation de la story. Deux questions clefs du Navigator : 'Attends, est-ce que ce bout fait bien ce que le ALORS dit ?' et 'Est-ce que l'IA avait le bon contexte pour generer ca ?' (si le Driver a colle un fichier de 400 lignes dans le prompt, la suggestion est coherente avec ce fichier, pas forcement avec le reste du systeme). Seul face a l'IA, un developpeur accepte une grande partie des suggestions sans les lire vraiment. En pair, ce reflexe tombe parce que le Navigator est la."
    douleur_terrain: "Le Navigator qui consulte ses messages pendant que le Driver code est deux personnes dans la meme piece qui travaillent separement. La connaissance ne bouge pas. C'est la surveillance deguisee en collaboration."
    source_expert: null
    page: 346
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: "Pendant la prochaine session pair : noter combien de suggestions IA le Driver accepte sans discussion. Ce nombre est ton diagnostic."
    schemas_lies: []

  - id: "P5-CH16-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "J'accompagne plusieurs equipes qui adoptent l'IA. Dans certaines, le pair programming s'est vide de sens : les deux devs acceptent les suggestions IA sans se parler, les sessions depassent 2 heures, le senior prend toujours le clavier. Comment est-ce que je diagnostique un pair programming IA dysfonctionnel et quels sont les 4 signaux qui me disent que la session ne produit rien d'utile ?"
    reponse: "Les 4 signaux que ca ne fonctionne pas : (1) Le senior prend toujours le clavier, la rotation n'est pas respectee, le junior regarde et decroche progressivement. Intervention directe : un timer visible sur l'ecran, rappel de la regle, pas de negociation. (2) Personne ne parle. Le Driver code en silence, le Navigator consulte ses messages. Ce sont deux personnes dans la meme piece qui travaillent separement. (3) Les sessions depassent 2 heures sans pause. La fatigue cognitive produit des erreurs que ni le Driver ni le Navigator ne voient plus. Maximum 2 heures, pause de 10 minutes, rotation a la reprise. (4) L'IA remplace le dialogue. Driver et Navigator acceptent les suggestions sans les discuter. Les deux s'en remettent a l'outil et se taisent. C'est le piege le plus frequent et le plus difficile a detecter de l'exterieur."
    douleur_terrain: "Le pair programming IA dysfonctionnel est invisible de l'exterieur. Les deux devs sont dans la meme piece, l'IA produit du code, les tests passent. Personne ne voit que la connaissance ne circule pas."
    source_expert: null
    page: 347
    extrait: null
    fiche_liee: "FP-P5-CH16-checklist-detection-01"
    fiche_destinee_a: [CA, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH16-SM-07"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "Quand est-ce que j'utilise le mob programming plutot que le pair programming, et comment est-ce que le mob fonctionne quand l'IA est dans la session ?"
    reponse: "Le mob programming s'utilise pour les decisions d'architecture : quand toute l'equipe doit s'aligner sur une decision structurante. Pas pour aller plus vite. Pour que tout le monde comprenne la meme chose au meme moment. Format : toute l'equipe sur un seul ecran, un seul clavier qui tourne toutes les 15 minutes. Avec l'IA dans le mob, l'outil est visible pour tous : tout le monde voit les prompts formules, les suggestions recues, les decisions prises et pourquoi. Le savoir circule sans qu'il y ait besoin de le documenter apres. Frequence : une ou deux fois par sprint maximum. Une session de mob sur une decision d'architecture vaut trois semaines de documentation que personne ne lira jamais."
    douleur_terrain: "L'equipe prend des decisions d'architecture via des PRs commentees que personne ne lit vraiment. La connaissance reste fragmentee. La mob session est perçue comme du temps perdu alors qu'elle evite des semaines de confusion."
