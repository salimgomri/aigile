questions:

  # === DYNAMIQUES INVISIBLES ===

  - id: "P5-CH16-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Mon equipe utilise l'IA depuis 3 sprints, la velocite a monte de 30 % et tout le monde dit que ca va bien en retro. Pourtant quelque chose me semble different dans la dynamique. Comment est-ce que je detecte concretement que des signaux negatifs s'accumulent sous les bonnes metriques, et quand est-ce que j'interviens avant que ce soit visible en DORA ?"
    reponse: "Trois dynamiques apparaissent presque toujours dans cet ordre : la depreciation silencieuse des seniors (moins d'initiative, moins de questions en retro, moins de participation aux decisions d'architecture), la confiance artificielle des juniors (livrent plus vite, comprennent moins), et l'asymetrie d'adoption (inegalites de productivite percue, tensions latentes). Le signal seniors ne se voit pas dans la velocite. Il se voit dans le Happiness Index : cherche la divergence entre satisfaction generale et satisfaction sur 'ma contribution a eu de l'impact ce sprint'. Quand l'une monte et l'autre descend, tu as un signal senior en retrait. Les DORA Metrics captent ce signal 3 a 5 sprints plus tard. Interviens avant."
    douleur_terrain: "La facilite du 'tout va bien' masque une erosion lente de la cohesion et de la comprehension collective. Le SM qui ne lit pas le Happiness Index en profondeur rate ce signal pendant des semaines."
    source_expert: null
    page: 334
    extrait: null
    fiche_liee: "FP-P5-CH16-checklist-detection-01"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: "Ajouter une question specifique dans le Happiness Index : 'Ma contribution a eu de l'impact ce sprint' (echelle 1-5). Suivre la divergence sprint par sprint."
    schemas_lies: ["SVG-P5-CH16-01"]

  - id: "P5-CH16-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "Un de mes seniors parle de moins en moins pendant le Sprint Planning depuis que l'IA pre-machique les stories. Il ne se plaint pas, il se retire. Comment est-ce que je nomme ca en retro sans que ca devienne une accusation contre l'IA ou contre lui, et quelle formulation concrète peut ouvrir la conversation sans cristalliser les positions ?"
    reponse: "Le signal se nomme comme une donnee d'equipe, pas comme une plainte. Exemple de formulation : 'depuis que l'IA est dans nos sprints, j'ai l'impression de moins contribuer sur les decisions qui comptent. Est-ce que d'autres le ressentent ?' C'est le senior qui ouvre la conversation, pas le SM. Le SM peut creer le contexte en retro en posant une question ouverte au groupe : 'Dans les 3 derniers sprints, y a-t-il eu des moments ou vous auriez pu contribuer differemment si l'IA n'avait pas ete la ?' Les reponses donnent le signal que les metriques ne voient pas."
    douleur_terrain: "Les seniors ne se plaignent pas. Ils se retirent. Si personne ne nomme ce retrait comme un probleme d'equipe, il devient une norme."
    source_expert: null
    page: 335
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH16-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    question: "Je suis developpeur junior. Avec l'IA je livre deux fois plus de features qu'avant. Mon manager est content, mon SM est content. Mais je realise que je valide des outputs sans comprendre pourquoi ca fonctionne. Dans 12 mois, quand l'outil change ou tombe en panne, est-ce que j'aurai les fondamentaux pour continuer seul, et comment est-ce que je construis ce filet maintenant sans ralentir l'equipe ?"
    reponse: "Non : si tu apprends seulement a valider des outputs, tu n'as pas les fondamentaux. La solution n'est pas de refuser l'IA. C'est de forcer ta comprehension avant chaque usage. Le nouveau format d'estimation aide : le Planning Poker ne porte plus sur l'effort mais sur le niveau de comprehension partagee. Si tu votes 3 (zones d'ombre subsistantes), la discussion s'ouvre. C'est la que tu apprends. En pair programming, demande a driver plutot qu'a naviguer : quand tu tiens le clavier, tu es oblige de formuler les prompts, de prendre les decisions, de les assumer. Le senior navigue et corrige sans prendre la main. C'est la difference entre regarder quelqu'un nager et apprendre a nager."
    douleur_terrain: "Le junior qui livre vite est felicite. Personne ne lui dit que sa dette de comprehension s'accumule. Il le decouvre 12 mois plus tard quand l'IA change et qu'il ne sait pas continuer seul."
    source_expert: null
    page: 336
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: "En pair programming : negocier de driver plutot que de naviguer, meme si c'est moins rapide au depart."
    schemas_lies: []

  - id: "P5-CH16-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Ma DSI veut un reporting mensuel sur l'usage de l'IA dans mes equipes. Je vois que la velocite monte mais je ne sais pas si c'est durable ou si ca cache des problemes. Quelles metriques est-ce que je surveille, dans quel ordre, et comment est-ce que je traduis ca en un rapport credible pour ma direction sans mentir sur les risques ?"
    reponse: "Le ratio DF/CFR est le premier indicateur : si le Change Failure Rate augmente plus vite que la Deployment Frequency, c'est une alerte qualite IA. Le taux de discussion reelle en Sprint Planning (cible superieure a 50 % versus validation passive d'outputs) dit si l'equipe comprend ce qu'elle fait ou si elle accepte les livrables pre-machiques sans questionner. La reponse factuelle pour ta direction : 'La velocite a monte de X %. Le CFR a bouge de Y %. Je surveille le delta depuis 3 sprints. Je te reviens dans 2 sprints avec une lecture.' C'est une reponse factuelle, pas une excuse."
    douleur_terrain: "Le manager qui reporte uniquement la velocite rassure sa direction sur un numero qui peut cacher une degradation de la qualite technique a 3-5 sprints de distance."
    source_expert: null
    page: 333
    extrait: null
    fiche_liee: "FP-P5-CH16-memo-reference-01"
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: "Tracker DF et CFR en parallele des le premier mois d'usage IA intensif."
    schemas_lies: ["SVG-P5-CH16-02"]

  - id: "P5-CH16-MG-02"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "Certains membres de mon equipe utilisent l'IA en cachette parce qu'il n'y a pas de politique officielle. Ceux qui l'utilisent livrent deux fois plus de stories. Ceux qui ne l'utilisent pas sont percus comme moins performants. Des tensions latentes apparaissent sans que personne n'en parle en Daily. Comment est-ce que je cree un cadre qui resout cette asymetrie sans pointer du doigt les uns ou les autres ?"
    reponse: "L'accord d'equipe IA est la reponse. Ce n'est pas une politique descendante. C'est un accord que l'equipe redige elle-meme en une retrospective de 60 minutes. Il repondre aux 6 questions que tout le monde se pose sans les poser a voix haute : quels outils sont autorises, comment signale-t-on un output IA, qui est responsable si ca bugue, comment integre-t-on un nouvel outil, comment preservon-nous les competences de l'equipe, comment detectons-nous les faux positifs IA. Une fois stabilise, il est partage avec la direction IT pour alignement. C'est une politique vecue, pas descendue."
    douleur_terrain: "L'asymetrie d'adoption sans accord cree des inegalites de productivite percue. Le developpeur qui utilise l'IA en cachette livre deux fois plus de stories. Personne n'ose en parler en Daily."
    source_expert: null
    page: 337
    extrait: null
    fiche_liee: "FP-P5-CH16-checklist-decision-01"
    fiche_destinee_a: [MG, SM]
    statut_reponse: confirmee
    action_recommandee: "Planifier la retro accord d'equipe IA. Avant de la lancer : demander a chaque membre d'ecrire anonymement une reponse a Q3 : 'Qui est responsable quand l'IA introduit un bug ?' Les reponses divergentes sont le diagnostic."
    schemas_lies: []

  # === DEFINITION OF DONE ===

  - id: "P5-CH16-DEV-02"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Notre DoD a ete ecrite avant qu'on utilise l'IA. Le code reviewe par un pair est coche, les tests unitaires passent a 100 %, mais les tests ont ete generes par l'IA et personne n'a verifie leur pertinence. Est-ce que notre story est vraiment Done, et comment est-ce qu'on adapte notre DoD pour couvrir les risques que l'IA introduit sans creer une usine a gaz ?"
    reponse: "La regle pratique du chapitre : si l'equipe utilise l'IA pour produire un livrable, elle doit pouvoir expliquer ce livrable sans l'aide de l'IA. Si elle ne peut pas, la story n'est pas Done : elle est simulee. Le tableau du chapitre donne les questions a poser pour chaque critere classique. Pour les tests : les tests ont-ils ete ecrits par l'equipe ou generes par l'IA ? Quelqu'un a-t-il verifie leur pertinence ? Pour la review de code : a-t-on relu le code genere par l'IA avec le meme niveau d'attention que le code ecrit a la main ? L'exercice de refonte DoD en retro prend 45 minutes : liste les criteres, pose la question pour chacun, ajoute un critere de validation humaine pour chaque risque identifie, vote sur les 3 prioritaires a renforcer ce sprint."
    douleur_terrain: "Les equipes cochent leur DoD avec des livrables IA qu'elles ne comprennent pas. La story est declaree Done. Le bug en production arrive 2 sprints plus tard sur un cas limite que l'IA avait ignore et que personne n'avait verifie."
    source_expert: null
    page: 338
    extrait: null
    fiche_liee: "FP-P5-CH16-checklist-decision-02"
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: "Revoie ta DoD ce sprint. Pour chaque critere : est-ce que l'IA pourrait satisfaire ca sans que l'equipe comprenne vraiment ? Ajoute un critere de validation humaine pour chaque risque identifie."
    schemas_lies: ["SVG-P5-CH16-03"]

  - id: "P5-CH16-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, comment, quand]
    question: "Je dois faciliter la refonte de notre DoD pour l'ere IA en retrospective. Je n'ai pas 2 heures a y passer. Comment est-ce que je structure cet exercice en 45 minutes pour que l'equipe identifie les vrais risques IA dans nos criteres actuels, et quel signal me dit que la session a marche ?"
    reponse: "L'exercice se fait en fin de retro en 4 etapes : (1) Lister les criteres DoD actuels sur un tableau, 10 minutes. (2) Pour chaque critere, poser la question 'Est-ce que l'IA pourrait satisfaire ce critere sans que l'equipe le comprenne vraiment ?' 15 minutes. (3) Pour chaque critere a risque, ajouter un critere de validation humaine explicite. Exemple : 'Le developpeur qui soumet la PR peut expliquer oralement pourquoi ce code fait ce qu'il fait, sans relire le code genere.' 15 minutes. (4) Vote sur les 3 criteres prioritaires a renforcer ce sprint. 5 minutes. Signal de succes : l'equipe identifie au moins 2 criteres qu'elle n'aurait jamais questionnes avant l'IA."
    douleur_terrain: "Le SM qui annonce 'on va revoir la DoD' sans format structure voit la session deraper en debat general sur l'IA. Les 45 minutes passent, rien n'est decide."
    source_expert: null
    page: 339
    extrait: null
    fiche_liee: "FP-P5-CH16-checklist-decision-02"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  # === ESTIMATION COLLECTIVE ===

  - id: "P5-CH16-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Mon equipe a abandonne le Planning Poker parce que l'IA genere deja les stories avec des estimations. La conversation d'estimation a disparaissait, mais c'est precisement la qu'on detectait les malentendus et construisait l'alignement. Comment est-ce que je restaure la valeur du desaccord productif sans revenir en arriere sur l'usage de l'IA ?"
    reponse: "La reponse n'est pas de supprimer l'IA du Sprint Planning. C'est de changer le role de l'estimation. Le nouveau format : avant le Sprint Planning, l'IA genere une premiere version des stories et criteres. Le Planning Poker ne porte pas sur l'effort, il porte sur le niveau de meme modele mental sur la story. 1 = tout le monde comprend exactement la meme chose. 3 = des zones d'ombre subsistent et doivent etre discutees. 8+ = la story n'est pas prete, la discussion doit avoir lieu avant le sprint. Le SM anime : il lit la story, l'equipe vote, pas de discussion avant le vote. La discussion s'ouvre seulement si les votes divergent. Ce changement preserve la valeur de l'estimation : la conversation, pas le chiffre."
    douleur_terrain: "Quand l'IA pre-mache les stories, l'equipe recoit un livrable et l'accepte. La conversation qui forcait la comprehension avant l'engagement disparait. La dette de comprehension s'accumule en silence."
    source_expert: "Mike Cohn (Planning Poker origine)"
    page: 340
    extrait: null
    fiche_liee: "FP-P5-CH16-memo-reference-02"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: "Au prochain Sprint Planning, changer la question d'estimation : pas 'combien de temps' mais 'quel est notre niveau de comprehension partagee ?'"
    schemas_lies: []

  - id: "P5-CH16-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, pourquoi, valeur]
    question: "Je genere mes user stories avec l'IA. Les criteres d'acceptance sont produits en quelques secondes. L'equipe les accepte sans discussion. Je livre plus vite, la prioritisation est facilitee. Mais si personne dans l'equipe ne comprend ce qu'elle valide, qu'est-ce que ca change pour la qualite reelle du produit que je suis cense piloter ?"
    reponse: "Si les criteres ont ete generes sans discussion, l'equipe comprend peut-etre ce qu'elle valide formellement, mais pas pourquoi ces criteres ont ete choisis plutot que d'autres. La DoD IA pose explicitement la question : 'Les criteres ont-ils ete generes par l'IA sans discussion ? L'equipe comprend-elle ce qu'elle valide ?' C'est le PO qui doit s'assurer que les criteres ont ete discutes, pas juste acceptes. La rule pratique du chapitre : si l'equipe ne peut pas expliquer le livrable sans l'IA, la story est simulee. Ce n'est pas un probleme de vitesse. C'est un probleme de qualite de la comprehension collective."
    douleur_terrain: "Le PO qui valide a vitesse IA sans s'assurer de la comprehension de l'equipe cree une dette de sens. La feature est livree. Elle ne correspond pas a ce que les stakeholders attendaient vraiment. Le PO le decouvre en Sprint Review."
    source_expert: null
    page: 338
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
