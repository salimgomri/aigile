  # === BUS FACTOR ET TRANSMISSION ===

  - id: "P5-CH16-SM-12"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur, quand]
    question: "Apres 2 sprints avec des binomes planifies, qu'est-ce qui change concretement dans la dynamique de l'equipe, et comment est-ce que je maintiens ce bus factor bas quand l'IA accelere la production de code ?"
    reponse: "Apres 2 sprints avec des binomes planifies, les questions en milieu de sprint diminuent. Les devs savent ce que leurs collegues savent. Le depart d'un developpeur cesse d'etre une catastrophe : il laisse derriere lui au moins une personne qui comprend ce qu'il a construit. Le bus factor ne disparait pas. Mais dans un environnement ou l'IA accelere la production de code et rend la connaissance encore plus fragile, maintenir ce bus factor bas est devenu l'une des responsabilites concretes du SM. La transmission ne se fait pas par la documentation. Elle se fait par le travail cote a cote."
    douleur_terrain: "Le SM qui ne planifie pas les binomes se retrouve avec un bus factor de 1 sur chaque module genere par IA. Personne ne comprend ce que le dev a produit avec Copilot, parfois pas meme le dev lui-meme."
