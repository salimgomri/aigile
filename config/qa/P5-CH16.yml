  # === WORKING AGREEMENT PREREQUIS ===

  - id: "P5-CH16-SM-09"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, pourquoi, quand]
    question: "Je veux lancer la session d'accord d'equipe IA mais mon equipe n'a pas de working agreement de base. Est-ce que je peux aller directement a l'accord IA ou est-ce qu'il faut commencer par le socle ?"
    reponse: "L'accord IA est une extension du socle working agreement. Si le socle n'existe pas (comment on decide, comment on donne du feedback, quand on est disponible), 30 minutes en retro pour ecrire et afficher 5 regles. Ensuite seulement l'accord IA. Sans ce socle, l'accord IA flotte dans le vide. Les questions sur la responsabilite (Q3) et la detection des problemes (Q6) presupposent que l'equipe sait deja comment elle regle ses desaccords en general."
    douleur_terrain: "Le SM qui lance l'accord IA dans une equipe sans working agreement de base se retrouve a debattre des fondamentaux (qui decide ?) pendant la session IA. Les 60 minutes ne suffisent plus."
