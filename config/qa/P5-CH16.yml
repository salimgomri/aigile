    question_manquante: "Comment gerer le pair programming IA en contexte remote/hybride quand les deux devs ne sont pas dans la meme piece ?"
    action: "Ajouter un encadre 'En pratique remote' apres la section 6b. Mentionner les outils (VS Code Live Share, JetBrains Code With Me), adapter la rotation (minuteur partagé, signal Slack), et preciser que la session remote se limite a 90 minutes maximum vs 2 heures en presentiel."

  - id: "T02"
    role: MG
    cible: MANAGER
    question_manquante: "Comment detecter en pratique l'asymetrie d'adoption au niveau individuel sans creer un climat de surveillance ?"
    action: "Ajouter un paragraphe concret dans la section 2c. Proposition : lors des 1-to-1 individuels, poser une seule question ouverte : 'Comment tu utilises l'IA aujourd'hui dans ton travail ?' Les reponses revelent l'adoption sans creer de sentiment de controle. Pas de liste nominative, pas de tracking individuel."

