  # === ACCORD D'EQUIPE IA ===

  - id: "P5-CH16-SM-08"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Je veux faciliter la creation d'un accord d'equipe IA en retrospective. Je n'ai jamais fait ca avant. Quelles sont les 6 questions a poser, dans quel ordre, combien de temps j'alloue a chaque question, et quel est le signal que l'accord est vivant et pas une affiche oubliee ?"
    reponse: "L'accord d'equipe IA se redige en une retro de 60 minutes avec 6 questions a 10 minutes chacune : Q1 (outils autorises, categories de donnees a proteger), Q2 (comment signaler un output IA dans le code/doc/criteres), Q3 (qui est responsable quand un output IA introduit un bug), Q4 (comment on decide collectivement d'integrer un nouvel outil IA), Q5 (comment on s'assure que les competences ne s'atrophient pas), Q6 (comment on detecte les outputs IA qui semblent corrects mais ne le sont pas). L'accord est redige en live, affiche dans l'espace d'equipe, revise tous les 2 mois. Signal de succes : l'accord est conteste au moins une fois dans les 30 jours. Ca veut dire qu'il est vivant. Avant de lancer la retro : demander a chaque membre d'ecrire anonymement une reponse a Q3. Les reponses divergentes sont le diagnostic."
    douleur_terrain: "L'accord d'equipe IA est l'artefact qui manque dans presque toutes les equipes. Les questions que tout le monde se pose sans les poser a voix haute deviennent des tensions latentes, des malentendus, des reproches implicites."
    source_expert: null
    page: 349
    extrait: null
    fiche_liee: "FP-P5-CH16-checklist-decision-01"
    fiche_destinee_a: [SM, MG]
    statut_reponse: confirmee
    action_recommandee: "Planifier la retro accord d'equipe IA. Avant de la lancer, demander a chaque membre d'ecrire anonymement une reponse a Q3."
    schemas_lies: []

  - id: "P5-CH16-MG-03"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi]
    question: "Mon equipe a produit un accord d'equipe IA. Ma direction IT m'a envoye une politique de securite IA qui est en contradiction partielle avec certains points de l'accord. Comment est-ce que je gere la tension entre ce que l'equipe a decide par en bas et ce que la direction descend par en haut ?"
    reponse: "L'accord d'equipe IA ne remplace pas une politique IT ou une directive juridique. Il la complete par en bas. Une fois stabilise, il est partage avec la direction IT pour alignement. Si tu supervises plusieurs equipes, utilise-le comme base : demande a chaque equipe de rediger le sien en 60 minutes, collecte les convergences sur Q1, Q3 et Q6, et construis ta politique maison a partir de ce qui revient dans toutes les equipes. C'est une politique vecue, pas descendue. C'est un point d'entree, pas un point final."
    douleur_terrain: "La politique IT IA descendue sans consultation des equipes est ignoree ou contournee. L'accord equipe construit par en bas est applicable des le lendemain mais fragile sans validation IT. Le manager est le pivot entre les deux."
    source_expert: null
    page: 340
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH16-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, pourquoi, valeur]
    question: "Je dirige plusieurs equipes Scrum qui adoptent l'IA. Certaines ont produit un accord d'equipe IA, d'autres pas. Comment est-ce que je construis une gouvernance IA coherente sur l'ensemble de mes equipes sans imposer un cadre que personne ne respectera ?"
    reponse: "La demarche est ascendante. Demander a chaque equipe de rediger son accord d'equipe IA en 60 minutes en retrospective. Collecter les convergences sur Q1 (outils et donnees), Q3 (responsabilite des bugs IA) et Q6 (detection des faux positifs IA). Construire la politique maison a partir de ce qui revient dans toutes les equipes. C'est une politique vecue, pas descendue. Elle s'applique parce que les equipes l'ont construite, pas parce qu'elle a ete imposee. Une fois stabilisee par l'ensemble des equipes, elle est partagee avec la direction IT et juridique pour validation et complement."
    douleur_terrain: "La politique IA imposee par une DSI sans consultation terrain est contournee en 30 jours. Les equipes continuent leurs pratiques informelles. L'accord equipe construit par les praticiens est applique parce qu'il a ete vecu."
    source_expert: null
