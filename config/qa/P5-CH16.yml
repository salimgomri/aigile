    action: "Ajouter un encadre 'solo avec l'IA' dans la section 6. Regle simple : si tu ne peux pas expliquer le code genere en une phrase sans le relire, c'est une story a 3 dans le nouveau format d'estimation. Elle doit etre discutee avant validation."

