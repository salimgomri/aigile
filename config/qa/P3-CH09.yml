      de l'exterieur. La politique DSI fixe le cadre : outils autorises, confidentialite,
      version Enterprise obligatoire. L'accord d'equipe fixe l'usage : quand signaler,
      qui valide, comment on teste. Les deux ne sont pas en conflit si la politique DSI
      definit les contraintes et laisse l'equipe decider des pratiques a l'interieur
      de ces contraintes. Le risque : la politique DSI descend jusqu'aux prompts,
      ce qui tue l'autonomie de l'equipe et donc l'adoption.
