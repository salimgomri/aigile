  - id: "P3-CH09-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Je coach une equipe qui utilise l'IA partout sans cadre de valeurs. Quel outil
      du chapitre 9 je pose en premier, comment j'interprete les resultats pour
      distinguer un probleme IA d'un probleme de culture d'equipe, et quelle
      intervention je propose apres ?
    reponse: >
      Le IA Readiness Check (5 questions, score /20) est le point d'entree. Score
      inferieur a 12 : adresser avant de generaliser l'usage IA en sprint. Attention :
      un score bas a la question 3 peut signaler une securite psychologique basse.
      Verifier avec le questionnaire Edmondson. L'intervention : accord IA en 1
      retrospective (30 min), 3 questions : usages transparents, outputs a signaler,
      accountability de la decision. Resultat : une page signee, affichee au mur.
    douleur_terrain: >
      Le coach arrive dans une equipe ou tout le monde utilise l'IA differemment,
      certains s'en vantent, d'autres le cachent, et le SM ne sait pas par ou commencer.
    source_expert: null
    page: 218
    extrait: null
    fiche_liee: null
