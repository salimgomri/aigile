  - id: "P3-CH09-CA-02"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    question: >
      Un client me demande pourquoi l'AIgile Manifesto de Salim Gomri et non simplement
      l'Agile Manifesto de 2001. Comment j'explique la difference, ce que l'un apporte
      que l'autre ne peut pas, et ce que l'AIgile Manifesto n'est pas ?
    reponse: >
      L'Agile Manifesto est incomplet, pas faux. Il a ete ecrit avant l'IA generative.
      Il ne dit rien sur ce qui change quand ChatGPT redige les stories ou Copilot
      genere le code. L'AIgile Manifesto n'est pas une extension officielle. Il ne parle
      pas au nom des 17 signataires de 2001. C'est une initiative de Salim Gomri,
      praticien agile, publiee en mai 2025 sur aigile.lu. Il n'est pas contre l'IA :
      il pose les conditions pour que l'IA augmente les equipes plutot que de les
      remplacer.
    douleur_terrain: >
      Le CA ne sait pas comment expliquer le positionnement de l'AIgile Manifesto sans
      que ca semble concurrentiel ou pretentieux face a l'original.
    source_expert: null
    page: 211
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [CA, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["A"]

  - id: "P3-CH09-CA-03"
    cible: PRATICIEN_AGILE
    role: CA
    expert: AI_SCRUM
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      Je vois ma direction deployer des outils IA sur des equipes dont le Daily est
      encore un rapport de statut et le backlog un monstre informe. Comment j'explique
      que l'IA va amplifier le probleme plutot que le resoudre, et sur quel principe
      de l'AIgile Manifesto je m'appuie ?
    reponse: >
      Le principe 7 est explicite : l'IA amplifie les forces et les faiblesses
      existantes. Une equipe avec un bon PO et un Sprint Goal clair produira de bien
      meilleures stories assistees par IA qu'une equipe confuse. L'IA n'est pas un
      correcteur de dysfonctionnements organisationnels. La formulation pour le manager :
      "Si le Scrum n'est pas solide, l'IA va accelerer les symptomes, pas les resoudre.
      On stabilise d'abord, on amplifie ensuite."
    douleur_terrain: >
      Le coach voit sa direction acheter des licences IA pour des equipes dont les
      retrospectives ne produisent aucune action concrete depuis 6 mois.
    source_expert: >
      AI and Scrum 2026 : "If your Scrum practice lacks direction or quality discipline,
      AI will amplify the dysfunction."
    page: 216
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["S", "A"]

