trous:

  - id: "T01"
    role: SM
    cible: PRATICIEN_AGILE
    question_manquante: >
      Quelle formulation concrete le SM utilise quand son manager dit "utilise l'IA
      pour tout" et qu'il veut poser un cadre sans passer pour quelqu'un qui freine ?
    page_insertion: 220
    apres: >
      "C'est celui qui utilise l'IA avec le plus de discernement : et qui aide son
      equipe a faire de meme."
    avant: >
      "Encadre En pratique : La posture AIgile, c'est savoir quand dire..."
    texte_propose: >
      Quand ton manager te dit "utilise l'IA pour tout, on doit aller plus vite",
      tu n'as pas a choisir entre obeir et resister. La reponse AIgile : "D'accord.
      On organise une session de 30 minutes avec l'equipe pour poser l'accord sur ce
      qu'on fait et ce qu'on signale. Comme ca tout le monde est aligne et on avance
      sur une base solide." Ce n'est pas un frein. C'est la condition pour que
      l'acceleration tienne.

  - id: "T02"
    role: DEV
    cible: PRATICIEN_AGILE
    question_manquante: >
      Comment le DEV garde le controle de son jugement quand l'IA genere 60 % ou plus
      du code en sprint ?
    page_insertion: 215
    apres: >
      "La competence de lire un output et de decider si c'est juste devient plus
      precieuse, pas moins."
    avant: >
      "Principe 4 : La transparence sur l'usage de l'IA est une responsabilite
      professionnelle"
    texte_propose: >
      En pratique : quand Copilot genere une fonction, pose-toi trois questions avant
      de merger. Est-ce que je comprends ce que ce code fait ligne par ligne ? Est-ce
      que je peux l'expliquer a un pair sans lire le prompt ? Est-ce que je peux en
      assumer la responsabilite si ca casse en prod ? Si la reponse est non a l'une
      des trois, le code n'est pas pret. Ce n'est pas une regle de lenteur. C'est une
      regle de discernement.

  - id: "T03"
    role: MG
    cible: MANAGER
    question_manquante: >
      Comment le manager distingue une equipe qui utilise l'IA de facon reflechie
      d'une equipe qui l'utilise de facon aveugle, sans lire lui-meme les outputs IA ?
    page_insertion: 221
    apres: >
      "Politique de confidentialite des outils IA utilises : connue de tous."
    avant: >
      "Le chapitre 10 entre dans le concret : la Prompt Library AIgile en action."
    texte_propose: >
      Comment tu sais si ton equipe utilise l'IA de facon reflechie ou de facon aveugle ?
      Trois signaux a surveiller sans lire les outputs toi-meme. Premier signal : le SM
      est capable d'expliquer en deux minutes quels outils IA sont dans la boucle et sur
      quelles ceremonies. Deuxieme signal : l'accord IA existe et a ete relu il y a moins
      de deux mois. Troisieme signal : l'equipe dit non a des outputs IA sans que personne
      ne s'en etonne. Si ces trois signaux sont au vert, l'IA est dans la boucle de facon
      consciente.

  - id: "T04"
    role: SM
    cible: PRATICIEN_AGILE
    question_manquante: >
      Les 10 principes sont exposes sans un seul exemple concret de situation reelle.
      Un SM ne peut pas retenir 10 principes sans ancrage terrain.
    page_insertion: 217
    apres: >
      "Encadre En pratique : Organisez un accord IA en 1 retrospective (30 min)"
    avant: >
      "Section 4 : L'IA Readiness Check"
    texte_propose: >
      Option recommandee : creer la fiche pratique FP-P3-CH09 avec les 10 principes
      et 1 exemple terrain par principe. Option alternative : note de renvoi en bas de
      section 3 : "Les 10 principes complets avec exemples terrain sont disponibles sur
      aigile.lu. Pour chaque principe, une situation concrete, un signal d'alerte et
      une formulation prete a utiliser en equipe."

  - id: "T05"
    role: SM
    cible: PRATICIEN_AGILE
    question_manquante: >
      Que fait le SM quand un seul membre de l'equipe maitrise l'IA et que les autres
      se desinvestissent ? (Guru IA)
    page_insertion: 216
    apres: >
      "Si l'IA fait tout le travail de redaction, l'equipe perd la competence de rediger."
    avant: >
