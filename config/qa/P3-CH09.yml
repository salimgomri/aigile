      pas un livrable. La DoR doit explicitement inclure : la story a ete relue et
      validee par le PO (pas juste generee), les criteres d'acceptance sont ecrits par
      un humain, le contexte metier est verifiable sans le prompt. Le Refinement
      change : il ne sert plus a ecrire les stories mais a inspecter et valider celles
      que l'IA a produites. Le PO reste accountable de la valeur, pas l'outil.
    douleur_terrain: >
      Le PO laisse les stories generees par IA entrer en sprint sans relecture serieuse
      parce qu'elles "ont l'air bien formulees". Les stories sont INVEST sur la forme
