  - id: "P3-CH09-RTE-01"
    cible: PRATICIEN_AGILE
    role: RTE
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      Je coordonne 4 equipes Scrum. Chacune utilise l'IA differemment : des outils
      differents, des niveaux de transparence differents, des accords internes qui ne
      sont pas alignes. Quel cadre je pose au niveau ART, et comment l'AIgile Manifesto
      s'applique a plusieurs equipes en meme temps ?
    reponse: >
      TROU. Le chapitre 9 ne traite pas l'usage de l'AIgile Manifesto au niveau
      multi-equipes ou ART. Les 4 valeurs s'appliquent a chaque equipe individuellement.
      L'accord de transparence IA peut etre homogeneise au niveau ART via le PI Planning :
      session dediee sur les accords IA inter-equipes, surtout sur la confidentialite
      des donnees (principe 6) et les outputs qui traversent les equipes. Ce contenu
      n'est pas dans le livre.
    douleur_terrain: >
      Le RTE voit 4 equipes avec 4 politiques IA implicites. Quand un output IA d'une
      equipe devient l'input d'une autre, personne ne sait si c'est transparent ou non.
    source_expert: null
    page: null
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [RTE]
    statut_reponse: trou
    action_recommandee: "A integrer dans Ch.13 ou en encart Ch.9 section 3. Voir trou T07."
    schemas_lies: []
    themes_salim: ["S", "A", "I"]

