  - id: "P3-CH09-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    question: >
      Comment j'utilise le IA Readiness Check en pratique, a quel moment du sprint je
      le pose, et comment j'interprete un score bas a la question 3 sans tirer la
      mauvaise conclusion ?
    reponse: >
      Le check se pose en debut de retrospective lors de la premiere conversation sur
      l'IA. Les questions 1, 2, 4 se completent seul avant la retro. Les questions 3
      et 5 s'ouvrent en discussion avec l'equipe. Un score bas a la question 3 n'est
      pas forcement un signal de maturite IA insuffisante : c'est peut-etre un signal
      de securite psychologique basse. Verifier avec le questionnaire Edmondson avant
      de conclure.
    douleur_terrain: >
      Le SM lance le check, voit un score bas sur la question 3 et conclut que l'equipe
      n'est pas prete pour l'IA, alors que le vrai probleme est la securite psychologique.
    source_expert: null
    page: 219
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P3-CH09-01"]
    themes_salim: ["S", "A", "M"]

  - id: "P3-CH09-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    question: >
      Quelle est la difference entre un usage IA cosmetique en Scrum et un usage
      vraiment augmente ? Comment je sais de quel cote se trouve mon equipe cette semaine ?
    reponse: >
      Cosmetique : generer un compte-rendu de retro qu'on aurait ecrit a la main de
      toute facon. Augmente : utiliser l'IA pour detecter un pattern de dysfonctionnement
      et adapter la facilitation en consequence. Le test : est-ce que l'output IA change
      une decision que l'equipe n'aurait pas prise seule ? Si non, c'est de l'acceleration,
      pas de l'augmentation. Les deux ont de la valeur, mais la confusion entre les deux
      empeche de progresser.
    douleur_terrain: >
      La majorite des equipes utilisent l'IA pour faire plus vite ce qu'elles faisaient
      deja, sans remettre en cause leurs pratiques. Le SM pense que l'equipe est "dans
      l'IA" alors qu'elle a juste remplace Word par ChatGPT.
    source_expert: null
    page: 213
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["A"]

  - id: "P3-CH09-SM-05"
    cible: PRATICIEN_AGILE
    role: SM
    expert: AI_SCRUM
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: >
      Un membre de mon equipe est devenu le "guru IA" et les autres se desinvestissent
      de l'IA. Comment je redistribue la competence sans creer de conflit, et pourquoi
      le principe 8 de l'AIgile Manifesto est directement concerne ?
    reponse: >
      TROU. Ce risque de concentration des competences IA n'est pas traite dans le
      chapitre 9. Le principe 8 (le developpement des competences humaines reste
      prioritaire) s'applique : si une seule personne maitrise l'IA dans l'equipe,
      le principe est viole collectivement. La reponse operationnelle : rotation des
      prompts et partage en retro, pas delegation permanente. Le trou merite une
      insertion ou une fiche pratique.
    douleur_terrain: >
      Le guru IA devient une dependance critique. Quand il part, l'equipe perd toutes
      ses pratiques IA d'un coup et ne sait meme pas par ou recommencer.
    source_expert: >
      AI and Scrum 2026 : "If one team member becomes the AI guru and others disengage,
      encourage knowledge sharing."
    page: 216
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
    statut_reponse: trou
    action_recommandee: "Inserer apres Principe 8 (p.216). Voir trou T05."
    schemas_lies: []
    themes_salim: ["A", "I"]

