  - id: "P3-CH09-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Mon manager vient de demander que toute l'equipe utilise ChatGPT pour accelerer
      les ceremonies. Je suis SM. Qui decide du cadre d'usage, comment je pose les
      4 valeurs AIgile sans passer pour un frein a l'innovation, et quel est le
      premier geste concret que je fais avant le prochain sprint ?
    reponse: >
      Le SM n'est pas le frein : il est le garant du cadre. Les 4 valeurs AIgile
      donnent la structure. Le premier geste : proposer un IA Readiness Check en
      retrospective (30 min) avant toute generalisation. Ce n'est pas un audit :
      c'est un point de depart de discussion. Resultat : un accord ecrit d'une page,
      valide par l'equipe, affiche au mur.
    douleur_terrain: >
      Le SM se retrouve ecrase entre la pression du manager qui veut aller vite et
      l'equipe qui utilise deja l'IA en ordre disperse sans aucun cadre de valeurs.
    source_expert: null
    page: 217
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["S", "A"]

  - id: "P3-CH09-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: >
      Un developpeur de mon equipe accepte sans relecture le code genere par Copilot.
      Comment je nomme ce risque sans pointer la personne, a quel moment dans le sprint
      je l'adresse, et quelle valeur AIgile est concernee ?
    reponse: >
      Le principe 3 nomme le risque : le jugement humain reste la ressource critique.
      Le bon moment : la retrospective, pas le Daily. La formulation : "On a un accord
      sur ce qu'on fait avant de merger du code genere par IA ?" Pas de personne visee.
      Le systeme est en cause, pas l'individu.
    douleur_terrain: >
      Le SM voit le code IA accepte en masse mais ne sait pas comment soulever le sujet
      sans mettre quelqu'un en difficulte devant l'equipe.
    source_expert: null
    page: 220
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, DEV]
    statut_reponse: confirmee
    action_recommandee: null
