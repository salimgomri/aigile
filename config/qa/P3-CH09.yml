  - id: "P3-CH09-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    question: >
      En tant que dev, je ne sais pas si je dois signaler chaque fois que j'utilise
      Copilot pour ecrire du code. Qui decide ce perimetre, pourquoi c'est important,
      et quel risque je prends en ne le signalant pas ?
    reponse: >
      La valeur 2 de l'AIgile Manifesto dit que la transparence sur l'usage IA est une
      responsabilite professionnelle. La repartition entre ce qu'on signale et ce qu'on
      n'a pas besoin de signaler se decide en equipe, pas unilateralement. L'accord IA
      d'une page signe collectivement est la reponse operationnelle. Utiliser l'IA sans
      le mentionner quand c'est pertinent est une forme de manque de clarte vis-a-vis
      de l'equipe.
    douleur_terrain: >
      Le dev ne sait pas si utiliser Copilot pour 80 % d'une fonction est a signaler.
      Il garde ca pour lui par defaut, ce qui cree une asymetrie d'information dans
      l'equipe.
    source_expert: null
    page: 215
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["S", "A", "L"]

  - id: "P3-CH09-DEV-02"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    question: >
      Si l'IA fait de plus en plus de code a ma place, est-ce que je perds mes
      competences ? Que dit l'AIgile Manifesto sur ce risque, et comment je dois
      utiliser l'IA pour que mes competences progressent plutot que de s'atrophier ?
    reponse: >
      Le principe 8 est explicite : le developpement des competences humaines reste
      prioritaire. Si l'IA fait tout le travail de redaction, l'equipe perd la
      competence de rediger. L'usage sain : utiliser l'IA pour accelerer, pas pour
      remplacer l'apprentissage. Concretement : utiliser l'IA pour analyser ses propres
      erreurs, pas pour les eviter. La competence de lire un output et de decider si
      c'est juste devient plus precieuse, pas moins.
    douleur_terrain: >
      Le dev junior delegue entierement la redaction du code a Copilot et ne comprend
      plus ce qu'il merge. Le senior le voit mais ne sait pas comment nommer ca sans
      passer pour antimoderne.
    source_expert: null
    page: 216
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["A", "I"]

  - id: "P3-CH09-DEV-03"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: AI_SCRUM
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    question: >
      L'IA genere du code qui semble correct mais accumule de la dette technique
      invisible. Comment je detecte ce piege avant que la DoD ne soit plus tenable,
      et pourquoi ce risque est pire avec l'IA qu'avec un collegue ?
    reponse: >
      L'IA favorise les ajouts (generation) sur les ameliorations (refactoring). Elle
      produit du code fonctionnel qui manque de coherence structurelle a l'echelle. Le
      dev doit explicitement demander du refactoring a l'IA et maintenir le meme niveau
      d'exigence qu'il appliquerait a une code review d'un collegue. Le principe 3
      s'applique : le jugement humain reste la ressource critique. Si le dev ne comprend
      pas le code genere ligne par ligne, il ne peut pas en assumer la responsabilite
      en prod.
    douleur_terrain: >
      L'equipe qui adopte l'IA code plus vite mais refactore moins. La dette s'accumule
      en silence. Le SM ne la voit pas parce que la velocite est stable.
    source_expert: >
      AI and Scrum 2026 : "Code duplication increased from ~8% to ~12% as AI coding
      assistance became more common. Refactoring activity dropped sharply."
    page: 215
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["L", "A"]

