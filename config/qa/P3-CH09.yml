  - id: "P3-CH09-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      J'utilise ChatGPT pour generer des user stories. Mon SM me demande si c'est
      transparent vis-a-vis de l'equipe. Quelle valeur AIgile s'applique, comment je
      formule l'accord d'equipe, et qu'est-ce que ca change dans mon travail de PO ?
    reponse: >
      La valeur 3 s'applique : transparence algorithmique plutot qu'opacite des modeles.
      L'equipe doit savoir quand l'IA est dans la boucle. La valeur 4 complete : le
      jugement humain reste sur l'output. Les stories generees sont une proposition de
      depart. L'accord d'equipe (30 min en retro) formalise : quels outputs IA doivent
      etre signales avant livraison, et qui est accountable de la decision finale.
    douleur_terrain: >
      Le PO utilise l'IA pour accelerer la redaction des stories mais n'a pas pose la
      question de la transparence avec l'equipe. Le sujet sort au mauvais moment,
      en plein sprint.
    source_expert: null
    page: 213
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["S", "A"]

  - id: "P3-CH09-PO-02"
    cible: PRATICIEN_AGILE
    role: PO
    expert: AI_SCRUM
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    question: >
      L'IA accelere tellement les livraisons que je n'arrive plus a valider la valeur
      produite avant le prochain sprint. Est-ce un probleme d'outil, un probleme de
      processus, et que dit l'AIgile Manifesto sur ce risque ?
    reponse: >
      TROU. Le PO comme goulot d'etranglement a l'ere IA n'est pas developpe dans le
      chapitre 9. La valeur 4 (responsabilite humaine plutot que delegation de la
      decision) s'applique : si le PO n'a pas le temps de valider, la responsabilite
      de la valeur n'est plus tenue par un humain. Ce n'est pas un probleme d'outil :
      c'est un signal organisationnel. La reponse operationnelle n'est pas dans ce
      chapitre.
    douleur_terrain: >
      L'equipe livre des features en quelques heures. Le PO ne peut pas valider la
      valeur a ce rythme. Il dit oui par defaut, ce qui est exactement ce que l'AIgile
      Manifesto cherche a eviter.
    source_expert: >
      AI and Scrum 2026 : "Teams found the AI could create features faster than the
      organization could validate their desirability."
    page: null
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO]
    statut_reponse: trou
