  - id: "P3-CH09-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      Je manage 2 equipes Scrum et je veux qu'elles utilisent l'IA pour livrer plus
      vite. Comment je mets ca en place sans imposer une politique qui detruise la
      dynamique d'equipe, quel accord je dois attendre avant de generaliser, et comment
      je sais si l'adoption est saine ?
    reponse: >
      La valeur 3 de l'AIgile Manifesto est explicite : accord d'equipe avant
      deploiement. Pas de politique IA imposee de l'exterieur. Le signal d'une adoption
      saine : l'equipe a un accord ecrit sur les usages transparents, signe
      collectivement. Le signal d'une adoption problematique : l'equipe utilise l'IA
      mais ne sait pas signaler les outputs avant livraison. Le IA Readiness Check
      (5 questions, score /20) donne une photo de la maturite avant de generaliser.
    douleur_terrain: >
      Le manager impose ChatGPT pour tout et l'equipe l'utilise de facon desordonnee,
      cachee, ou refuse par principe, sans que personne n'ose en parler ouvertement.
    source_expert: null
    page: 213
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []
    themes_salim: ["A", "M"]

  - id: "P3-CH09-MG-02"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    question: >
      Mon equipe utilise l'IA pour generer les stories, le code, les syntheses de retro.
      Comment je sais si elle garde le jugement humain sur ces outputs ou si elle delegue
      trop, sans avoir a lire les outputs moi-meme ?
    reponse: >
