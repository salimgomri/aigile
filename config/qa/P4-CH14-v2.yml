trous:

  - id: "CH14-TROU-01"
    sujet: "Aucune question sur la communication avec le PO pendant la Sprint Review"
    impact: >
      Le chapitre précise que le PO mène la Sprint Review. Mais aucune
      question ne traite comment le SM prépare le PO à présenter devant
      un manager résultat-orienté ou process-anxieux.
    action: "Ajouter CH14-PO-02 lors de la prochaine révision du YAML"

  - id: "CH14-TROU-02"
    sujet: "Le chapitre mentionne le tableau de suivi des décisions comme outil de visibilité"
    impact: >
      L'outil n'est pas décrit dans ce chapitre. La question sur comment
      construire ce tableau est absente. Renvoie vers ch.8 sans détailler.
    action: "Vérifier si ch.8 couvre ce point. Sinon, noter comme trou structurel."

  - id: "CH14-TROU-03"
    sujet: "Roadmap horizon glissant de Roman Pichler : aucune question sur sa mise en oeuvre"
    impact: >
      Outil cité p.306 pour le manager process-anxieux mais aucune question
      ne guide sa mise en pratique (qui la produit, quel outil, quel rythme
      de mise à jour).
    action: "Ajouter une question SM ou CA sur la mise en oeuvre de cet outil"

