  - id: "P4-CH13-MG-02"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Je manage 3 equipes Scrum dans un contexte SAFe. Comment je lis en un coup d'oeil la situation PI de mes equipes sans assister a toutes les ceremonies, et quelle information je dois avoir dans mon dashboard pour prendre une decision d'arbitrage ?"
    reponse: "Dans un contexte ART avec Check-in OKR adapte, le manager reçoit une visibilite sur deux dimensions simultanement : la progression sprint de l'equipe ET la progression PI de l'ART. Le score de confiance OKR (1 a 5) se decline en Confidence Rate OKR sur les Key Results strategiques et en Confidence Rate PI Objectives sur les engagements de l'increment en cours. Les deux coexistent dans le dashboard. Le delai de mise a jour est de 15 minutes apres la Sprint Review. Ces deux informations combinees permettent une prise de decision plus rapide sur les arbitrages ressources et priorites."
    douleur_terrain: "Le manager passe trop de temps a collecter l'information dans plusieurs outils et ceremonies. Il n'a pas de vue synthetique actionnable."
    source_expert: null
    page: 293
    extrait: null
