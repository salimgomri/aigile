  - id: "P4-CH13-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Mon equipe technique me dit que 2 jours de PI Planning c'est du temps perdu. Comment je justifie ce cout a ma direction et comment je sais si le PI Planning a vraiment servi ou si c'est devenu une ceremonie ?"
    reponse: "Le retour systematique des equipes qui ont vecu un PI Planning serieusement facilite : les 2 jours d'alignement initial evitent 3 a 4 semaines de reajustements en cours de PI. La mesure concrete d'un PI Planning efficace est le taux de dependances identifiees avant les sprints : cible superieure a 70% identifiees en PI Planning vs decouvertes en sprint. Si tu decouvres plus en sprint qu'au PI Planning, la cadence ne sert pas a grand-chose. Second indicateur : la duree PI Planning effective vs planifiee, indicateur de maturite de facilitation. Si le PI Planning ne change rien aux plans des equipes, il n'a servi a rien."
    douleur_terrain: "Le manager doit defendre un cout visible (2 jours mobilises) face a des benefices diffus et difficiles a chiffrer sans mesure en place."
    source_expert: null
    page: 285
    extrait: null
    fiche_liee: "FP-P4-CH13-gonogo-piplanning-06"
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
