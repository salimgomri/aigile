  - id: "P4-CH13-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, pourquoi, valeur]
    question: "Mon DAF me demande pourquoi on investit dans SAFe alors qu'on est 35 personnes en 4 equipes. J'ai besoin d'un argument ROI defend able en comite de direction sans jargon agile."
    reponse: "L'argument ROI de SAFe lite tient en deux points chiffrables : reduction des reajustements en cours de PI (les 2 jours de PI Planning evitent 3 a 4 semaines de remise a plat inter-equipes selon le retour systematique des organisations qui l'ont vecu), et reduction des blocages en cascade par dependances non tracees. Le 18eme State of Agile Digital.ai 2025 identifie SAFe comme le framework le plus utilise a grande echelle. La version adaptee PME (SAFe lite) reduit l'infrastructure sans sacrifier la logique d'alignement. Le critere de succes chiffrable : pourcentage de Business Value livree en fin de PI, cible superieure a 80%."
    douleur_terrain: "Le decideur doit defendre un investissement en langage financier face a un interlocuteur qui ne voit que le cout des ceremonies et des certifications."
    source_expert: "18eme State of Agile | Digital.ai | 2025"
