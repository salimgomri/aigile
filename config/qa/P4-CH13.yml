questions:

  - id: "P4-CH13-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Mon manager vient d'annoncer qu'on passe a SAFe avec nos 3 equipes. Je sais deja que c'est surdimensionne. Comment je le lui dis sans passer pour quelqu'un qui bloque la transformation, et quelle alternative concrete je lui propose ?"
    reponse: "SAFe est concu pour des ARTs de 50 a 125 personnes. En dessous de 3 equipes, la surcharge ceremonie est garantie sans benefice d'alignement reel. Tu proposes un cadre alternatif : avec 3 equipes, LeSS ou Nexus couvrent les besoins. Si la decision SAFe est deja prise au niveau organisationnel, l'objectif n'est pas de le demonter mais d'en adopter uniquement les elements a valeur : Team Objectives, cadence PI, Scrum of Scrums. Tu nommes explicitement les ceremonies inutiles et tu les supprimes avec accord de ta direction."
    douleur_terrain: "Le SM est seul face a une decision top-down. Il sait que ca va creer de la friction mais n'a pas l'autorite formelle pour bloquer."
    source_expert: null
    page: 283
    extrait: null
    fiche_liee: "FP-P4-CH13-canvas-safelite-05"
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: "Preparer un guide de selection par taille d'equipe pour la conversation avec le management"
    schemas_lies: []

  - id: "P4-CH13-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Je suis SM dans un ART de 5 equipes. Mon equipe depend d'une livraison de l'equipe platform pour le sprint 4. Je l'ai identifie en sprint 2. C'est trop tard pour faire quoi et c'est encore tenable pour faire quoi ?"
    reponse: "La regle N-2 s'applique : si ton equipe a besoin d'une livraison au sprint N, cette livraison doit etre dans le backlog de l'autre equipe au sprint N-2 minimum. En sprint 2 pour une dependance sprint 4, tu es exactement a la limite : c'est encore adressable mais c'est un risque actif, pas de la planification. La conversation doit avoir lieu immediatement au Scrum of Scrums suivant : proprietaire + delai + statut visible. Dans les contextes a forte complexite technique ou dependances croisees multiples, N-3 est plus prudent."
    douleur_terrain: "Le SM decouvre la dependance trop tard et ne sait pas si le PI est encore sauvable."
    source_expert: null
    page: 284
    extrait: null
    fiche_liee: "FP-P4-CH13-checklist-dependances-01"
    fiche_destinee_a: [SM, RTE]
    statut_reponse: confirmee
    action_recommandee: "Documenter chaque dependance : proprietaire + delai + statut avant le prochain sprint"
    schemas_lies: ["SVG-P4-CH13-01"]

  - id: "P4-CH13-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, quand, valeur]
    question: "Pendant le Confidence Vote de fin de PI Planning, tout le monde vote 4 ou 5 par politesse. Je sais que c'est faux. Qu'est-ce que je fais concretement avant de cloturer la seance ?"
    reponse: "Tu interviens avant la cloture. Tu demandes a chaque equipe de justifier son score en une phrase. Si aucune reserve n'est exprimee sur un PI ambitieux, c'est un signal de dysfonctionnement, pas de maturite. Tu fais ce tour equipe par equipe. Les cas a discuter remontent avant la pleniere. Un ART qui demarre sur un consensus force produit exactement le resultat inverse."
    douleur_terrain: "Le vote de confiance devient un rituel de politesse. Le SM ne sait pas comment le casser sans casser la seance."
    source_expert: null
    page: 286
    extrait: null
    fiche_liee: "FP-P4-CH13-gonogo-piplanning-06"
    fiche_destinee_a: [SM, RTE]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P4-CH13-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Mon equipe formule ses Team Objectives comme des stories a livrer. Le PO liste les features du sprint. Comment je leur explique que ca ne constitue pas un Team Objective et quelle reformulation je leur propose sur le terrain ?"
    reponse: "La distinction est dans la formulation : en termes de resultats business, pas de stories livrees. Livrer 23 story points sur le module de paiement n'est pas un Team Objective. Permettre au client de finaliser un achat sans intervention support l'est. La reformulation n'est pas cosmetique : elle change le perimetre de decision en sprint. Pour chaque feature du backlog, tu poses la question : quel est le changement observable pour l'utilisateur ou le business ? La reponse a cette question est le Team Objective."
    douleur_terrain: "L'equipe confond plan d'execution et engagement sur la valeur. Le SM n'a pas de formulation simple pour expliquer la difference."
    source_expert: null
    page: 287
    extrait: null
    fiche_liee: "FP-P4-CH13-memo-teamobjectives-02"
    fiche_destinee_a: [SM, PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P4-CH13-SM-05"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "On a mis en place SAFe il y a 6 mois sur 2 equipes. Le PI Planning se fait mais ne change rien aux plans. Les equipes repartent avec les memes priorites qu'avant la seance. Quel diagnostic je pose et par quoi je commence pour sortir du cargo cult ?"
    reponse: "Le signe le plus fiable du cargo cult SAFe : le PI Planning ne change rien aux plans des equipes. Trois symptomes cles a verifier : PI Planning sans vraie priorisation business (le backlog ART n'est pas priorise avant la seance), Team Objectives copies du backlog technique (pas de valeur business formulee), Confidence Vote ou tout le monde vote 5 par politesse. Si les trois sont presents, SAFe est devenu un rituel de conformite. Tu commences par les Team Objectives : reformuler en valeur business avant le prochain PI Planning. C'est le levier le plus rapide et le plus visible."
    douleur_terrain: "Le SM voit que ca ne sert a rien mais n'a pas le vocabulaire pour nommer le probleme ni le levier pour le sortir."
    source_expert: null
    page: 292
    extrait: null
    fiche_liee: ["FP-P4-CH13-dashboard-kpis-03", "FP-P4-CH13-memo-teamobjectives-02"]
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: "Reformuler les Sprint Goals en termes de valeur business des le prochain sprint"
    schemas_lies: []

  - id: "P4-CH13-RTE-01"
    cible: PRATICIEN_AGILE
    role: RTE
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "C'est mon premier PI Planning avec 5 equipes qui ne se sont jamais coordonnees. Comment je structure les 2 jours pour que les equipes repartent avec des plans realistes et des dependances identifiees, et quelle est ma mesure de succes a la cloture ?"
    reponse: "L'agenda des 2 jours est structure en 6 blocs : Jour 1 matin vision produit en pleniere (3h, Business Owner + Architecte), Jour 1 apres-midi breakouts equipes sprint planning + Team Objectives draft (4h, chaque equipe SM+PO), Jour 1 soir draft plan review 3 minutes par equipe en pleniere (1h, anime par RTE). Jour 2 matin ajustements post-draft et resolution dependances inter-equipes (2h), Management Review et Problem Solving en parallele (2h, risques systemiques). Jour 2 apres-midi ROAMing des risques + Confidence Vote fist-of-five (2h, cloture). La mesure de succes a la cloture : Confidence Vote superieur ou egal a 3.5/5 avec reserves reelles exprimees, et 70% des dependances identifiees avant la fin de la seance."
    douleur_terrain: "Le RTE ne sait pas comment eviter que les 2 jours deviennent une reunion de statut ou que les equipes partent sans avoir adresse leurs dependances croisees."
    source_expert: null
    page: 285
    extrait: null
    fiche_liee: ["FP-P4-CH13-checklist-dependances-01", "FP-P4-CH13-agenda-piplanning-04"]
    fiche_destinee_a: [RTE, SM]
    statut_reponse: confirmee
    action_recommandee: "Se faire coacher par une personne ayant deja vecu plusieurs PI avant le premier PI Planning"
    schemas_lies: ["SVG-P4-CH13-02"]

  - id: "P4-CH13-RTE-02"
    cible: PRATICIEN_AGILE
    role: RTE
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Comment je distingue un risque qui doit aller en ROAMing d'un risque qui doit bloquer le Confidence Vote, et quel traitement je donne a chaque categorie ROAM en fin de PI Planning ?"
    reponse: "ROAM est l'outil de traitement des risques non resolus au Confidence Vote. Quatre categories : Resolved (le risque est resolu avant la fin du PI Planning), Owned (une personne nommee en prend la responsabilite), Accepted (le risque est accepte en connaissance de cause, l'equipe choisit de ne pas le traiter), Mitigated (un plan de mitigation est defini et trace). Un risque qui bloque le Confidence Vote sous 3.5/5 doit ouvrir une discussion avant de relancer un vote. Si la discussion ne le resout pas, il entre dans ROAM avec un proprietaire explicite. Sans proprietaire nomme, le risque reste non gere quelle que soit sa categorie ROAM."
    douleur_terrain: "Le RTE ne sait pas arbitrer entre ce qui bloque le vote et ce qui peut etre ROAMe. La seance deraille ou les risques sont entasses dans ROAM sans traitement reel."
    source_expert: null
    page: 287
    extrait: null
    fiche_liee: "FP-P4-CH13-checklist-dependances-01"
    fiche_destinee_a: [RTE, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P4-CH13-RTE-03"
    cible: PRATICIEN_AGILE
    role: RTE
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Je suis SM senior qui absorbe le role de RTE dans une PME de 25 personnes avec 3 equipes. Quelles responsabilites du RTE je ne peux pas deleguer ou ignorer, et comment je sais que je suis en surcharge ?"
    reponse: "Le RTE porte trois responsabilites non delegables : facilitation du PI Planning (logistique et animation), Scrum of Scrums inter-equipes (visibilite sur les dependances et blocages), et sante de l'ART au niveau programme (flux, metriques, risques systemiques). Ces responsabilites doivent etre explicitement assignees meme sans titre. Tu es en surcharge quand les dependances inter-equipes ne sont plus tracees entre deux sprints, ou quand le Scrum of Scrums se transforme en reunion de statut sans action. En dessous de 5 equipes dans une PME, le role peut etre absorbe. Au-dela, un RTE dedie est plus prudent."
    douleur_terrain: "Le SM senior ne sait pas ou s'arrete son role d'equipe et ou commence le role RTE. Il gere les deux mais ne couvre pas tout."
    source_expert: null
    page: 290
    extrait: null
    fiche_liee: "FP-P4-CH13-canvas-safelite-05"
    fiche_destinee_a: [RTE, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P4-CH13-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Comment je formule un Team Objective avec mon equipe qui soit suffisamment oriente valeur business pour le Product Manager ART, et suffisamment concret pour que l'equipe sache ce qu'elle s'engage a faire ?"
    reponse: "La formulation d'un Team Objective oriente valeur repose sur une question simple : quel changement observable pour l'utilisateur ou le business est produit par ce travail ? Reduire le temps de connexion utilisateur de 40% est un Team Objective. Implementer les 3 APIs de l'equipe platform ne l'est pas. Chaque Team Objective recoit une valeur business estimee de 1 a 10 par le Product Manager de l'ART. En fin de PI, le pourcentage de valeur livree est calcule sur cette base, pas sur le pourcentage de stories terminees. Le stretch objective permet de nommer une ambition sans l'engager fermement : si la capacite le permet apres sprint 3, sans contraindre le PI."
    douleur_terrain: "Le PO est pris entre le backlog technique de l'equipe et les objectifs strategiques du Product Manager ART. Il ne sait pas comment traduire l'un en l'autre."
    source_expert: null
    page: 287
    extrait: null
    fiche_liee: "FP-P4-CH13-memo-teamobjectives-02"
    fiche_destinee_a: [PO, SM]
