  - id: "P4-CH13-DC-01"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    question: "J'ai decide de deployer SAFe sur 3 equipes il y a 9 mois. Mon DRH me dit que ca marche, mon DSI me dit que ca ralentit. Quels indicateurs me permettent de trancher objectivement et sur quoi je dois agir en priorite ?"
    reponse: "Trois KPIs structurants pour evaluer la maturite SAFe : taux de Business Value livree en fin de PI (cible superieure a 80%), taux de dependances identifiees en PI Planning vs decouvertes en sprint (cible superieure a 70%), et Confidence Vote PI au lancement (cible superieure ou egale a 3.5/5). Si les trois sont sous seuil simultanement, le deploiement SAFe n'a pas encore produit de coordination reelle. Si le Confidence Vote est toujours a 5 par politesse, c'est un signal de dysfonctionnement prioritaire a corriger. Le contexte de 3 equipes est techniquement sous le perimetre SAFe complet (50-125 personnes) : evaluer si LeSS ou Nexus seraient plus adaptes."
    douleur_terrain: "Le decideur a investi sur une promesse d'alignement et ne sait pas si le deploiement produit des resultats reels ou un theater agile couteux."
    source_expert: null
    page: 293
    extrait: null
    fiche_liee: "FP-P4-CH13-dashboard-kpis-03"
    fiche_destinee_a: [DC, MG]
