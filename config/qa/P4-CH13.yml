  - id: "P4-CH13-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Une organisation a 4 equipes et veut passer a SAFe. Comment je la conseille pour choisir entre SAFe, LeSS et Nexus, et quel critere est determinant au-dela de la taille ?"
    reponse: "Le critere determinant au-dela de la taille est la structure du produit et du backlog. Un seul produit avec un seul backlog commun : LeSS ou Nexus sont a privilegier. Plusieurs perimetres produits ou un backlog fragmente par equipe : SAFe lite structure mieux cette realite meme a faible echelle. Pour 2 a 5 equipes sur un seul produit, explorer LeSS ou Nexus avant SAFe. Pour 5 equipes et plus avec perimetres multiples, SAFe lite apporte la structure necessaire. Appliquer SAFe a moins de 3 equipes produit une surcharge garantie sans benefice d'alignement."
    douleur_terrain: "Le CA est en face d'un management qui a deja decide SAFe sans analyse du contexte. Il doit proposer une alternative credible ou adapter SAFe sans le demonter."
    source_expert: null
    page: 289
    extrait: null
    fiche_liee: "FP-P4-CH13-canvas-safelite-05"
    fiche_destinee_a: [CA, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P4-CH13-CA-02"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Une PME de 40 personnes avec 4 equipes veut garder la logique PI sans l'infrastructure SAFe complete. Qu'est-ce que je conserve obligatoirement, qu'est-ce que je supprime sans risque, et quelle est la version minimale qui reste operationnelle ?"
    reponse: "La version minimale operationnelle repose sur trois elements non negociables : cadence commune (toutes les equipes sur le meme rythme PI), objectifs partages (Team Objectives, minimum 3 par equipe), identification des dependances (Scrum of Scrums, trace systematique). Ces trois elements peuvent etre implementes avec un PI de 10 semaines, sans Release Train Engineer dedie, sans System Team, sans les 7 competences SAFe. Pour les structures de moins de 30 personnes, un mini-PI de 4 heures remplace les 2 jours de PI Planning complet. La cadence PI et le Confidence Vote restent, sans exception."
    douleur_terrain: "Le coach ne sait pas ou tracer la ligne entre ce qui est essentiel et ce qui est bureaucratie additive dans SAFe."
    source_expert: null
    page: 290
    extrait: null
    fiche_liee: "FP-P4-CH13-canvas-safelite-05"
    fiche_destinee_a: [CA, SM]
