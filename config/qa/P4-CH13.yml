  - id: "P4-CH13-MG-03"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    question: "En fin de PI, j'ai 65% de Business Value livree sur mes Team Objectives. C'est un probleme ou un resultat acceptable, et comment je l'interprete avant mon prochain comite de direction ?"
    reponse: "65% est en dessous du seuil de reference : la cible terrain sur plusieurs ARTs est superieure a 80% de Business Value du PI. En dessous de 80%, la cadence PI ne produit pas l'alignement business attendu. SAFe ne fixe pas de seuil officiel, ce seuil est issu de la pratique terrain. A 65%, deux diagnostics sont possibles : soit le PI Planning a ete trop ambitieux (Team Objectives surestimes), soit des dependances non identifiees ont bloque des livraisons en cours de PI. Le taux de dependances identifiees en PI Planning vs decouvertes en sprint (cible 70%) est l'indicateur complementaire pour isoler la cause."
    douleur_terrain: "Le manager ne sait pas si 65% est une performance normale ou un signal d'alerte. Il n'a pas de reference pour calibrer son interpretation."
    source_expert: null
    page: 293
    extrait: null
