# BLOC 7 : CA

  - id: "P2-CH08-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [quoi, comment, pourquoi]
    themes_salim: [M, A]
    question: >
      Comment diagnostiquer si la Boucle OKR Vivante est reelle ou si c'est
      un theatre de reporting ?
    reponse: >
      Deux signaux de theatre : (1) le score de confiance OKR est toujours a 4
      ou 5 sprint apres sprint sans variation ; (2) les cadrans sont verts en
      permanence meme quand le terrain dit le contraire. Si la culture
      organisationnelle punit les equipes qui remontent des signaux negatifs,
      le Check-in devient un exercice de communication positive. Le modele ne
      resout pas ce probleme : il necessite un manager qui accepte que les
      donnees remontantes puissent changer ses priorites.
    douleur_terrain: >
      Le Coach voit les cadrans verts semaine apres semaine. Mais il sait que
      l'equipe est en difficulte. La boucle tourne mais elle ne dit pas la verite.
    source_expert: null
    page: "198-199"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-CA-02"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [quoi, comment, quand]
    themes_salim: [A, I]
    question: >
      Comment accompagner le passage de la Boucle OKR Vivante a la variante
      SAFe pour un Agile Release Train ?
    reponse: >
      Trois adaptations dans un ART : (1) la question sur le blocage devient
      "Dependance inter-equipes non resolue ?" ; (2) le score de confiance OKR
      devient Confidence Rate PI Objectives ; (3) le rythme de Check-in s'aligne
      sur le PI Planning. Le chapitre 13 couvre cette adaptation en detail.
    douleur_terrain: >
      Le Coach introduit la Boucle OKR dans un contexte SAFe et se retrouve
      avec deux rythmes incompatibles : le sprint bimensuel et le PI trimestriel.
    source_expert: null
    page: "186"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [CA, RTE]
    statut_reponse: confirmee
