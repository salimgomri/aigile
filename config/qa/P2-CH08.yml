# BLOC 3 : Dashboard 6 cadrans

  - id: "P2-CH08-SM-09"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi]
    themes_salim: [M]
    question: >
      Le cadran On Budget necessite les donnees de cout que je n'ai pas acces.
      Que faire ?
    reponse: >
      C'est le seul cadran que le SM ne pilote pas seul : c'est le manager ou
      le budget holder qui le met a jour. Si ce partage n'est pas possible,
      utiliser un indicateur proxy : le nombre de sprints dans les delais sur
      les 3 derniers mois. En regie jours-homme : un sprint a 80 % de capacite
      reelle vs 100 % planifiee dit deja beaucoup. Le SM fournit la donnee
      brute, le manager complete le cadran.
    douleur_terrain: >
      Le SM n'a acces ni aux couts ni aux donnees budgetaires. Il ne peut pas
      alimenter le cadran On Budget sans creer un probleme de gouvernance.
    source_expert: null
