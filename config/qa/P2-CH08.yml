  - id: "P2-CH08-MG-03"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [quoi, pourquoi, comment]
    themes_salim: [S]
    question: >
      Le SM me dit que la cascade OKR est trop descendante et que les equipes
      subissent les OKR sans les influencer. Est-ce un vrai probleme et comment
      le corriger ?
    reponse: >
      Oui, c'est l'Erreur 2 : cascade top-down pure. Les equipes apprennent a
      cocher les cases sans que les OKR influencent reellement leurs decisions.
      La Boucle OKR Vivante est bidirectionnelle : les equipes remontent signaux,
      blocages, risques ; le manager ajuste ses priorites et annote dans l'outil.
      Si le manager n'ajuste jamais ses priorites suite aux remontees, la boucle
      devient descendante de facto.
    douleur_terrain: >
      Le manager croit avoir mis en place une boucle bidirectionnelle parce qu'il
      lit le dashboard. Mais il n'a jamais modifie une priorite suite a une
      remontee d'equipe.
    source_expert: null
    page: "181"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-MG-04"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [quoi, comment, valeur]
    themes_salim: [M]
    question: >
      Comment calculer le cout par sprint pour alimenter le cadran On Budget
      si mon organisation travaille en regie jours-homme ?
    reponse: >
      Multiplier le nombre de jours consommes par le taux journalier moyen.
      Exemple : 8 personnes x 10 jours x 550 euros/jour = 44 000 euros par
      sprint. Le budget planifie correspond a la capacite nominale. Le budget
      reel integre les absences, les jours non facturables, les incidents.
      Seuil d'alerte : depassement superieur a 10 % sur deux sprints consecutifs.
    douleur_terrain: >
      Le manager n'a pas de reference pour calculer le cout sprint. Il utilise
      des approximations qui varient chaque sprint. La comparaison dans le temps
      devient impossible.
    source_expert: null
    page: "189"
    extrait: null
    fiche_liee: "FP-P2-CH08-dashboard-03"
    fiche_destinee_a: [MG]
