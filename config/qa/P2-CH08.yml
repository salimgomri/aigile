# BLOC 5 : PO

  - id: "P2-CH08-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: CHRISTINA_WODTKE
    dimensions: [quoi, comment, pourquoi, valeur]
    themes_salim: [S, L]
    question: >
      Comment reformuler les Key Results de mon equipe pour qu'ils mesurent
      un resultat et non une livraison ?
    reponse: >
      Christina Wodtke dans Radical Focus : ce que l'equipe livre n'est pas ce
      que le client ressent. Test simple : le Key Result change-t-il si l'equipe
      livre le module par un autre moyen ? Si oui, c'est un resultat. Si non,
      c'est une tache deguisee. Formule de bascule : remplacer "livrer X" par
      "porter [metrique] de Y a Z d'ici fin de trimestre".
    douleur_terrain: >
      Le PO croit avoir des OKR valides parce qu'il a rempli le template. Mais
      chaque Key Result est une tache deguisee. L'equipe ne peut pas piloter
      sa priorite de sprint sur ces Key Results.
    source_expert: "Christina Wodtke, Radical Focus : ce que l'equipe livre n'est pas ce que le client ressent."
    page: "180-181"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-PO-02"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, quand, pourquoi]
    themes_salim: [S, I]
    question: >
      La regle de derivation OKR-Sprint : comment je verifie que chaque Sprint
      Goal est bien relie a un Key Result avant de lancer le Sprint Planning ?
    reponse: >
      Regle documentee dans le chapitre : chaque Sprint Goal doit repondre a
      "En quoi ce sprint contribue-t-il a un Key Result ?". Si la reponse est
      "on ne sait pas", le sprint n'a pas d'alignement strategique. Reparer
      avant de demarrer le sprint, pas apres. Le PO est accountable de cette
      verification, pas le SM.
    douleur_terrain: >
      Le PO demarre le Sprint Planning sans avoir verifie le lien OKR. A mi-
      trimestre, le management realise que les 6 derniers sprints n'ont pas
      avance les Key Results.
    source_expert: null
    page: "190"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-PO-03"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [quoi, pourquoi, valeur]
    themes_salim: [S, L]
    question: >
      Le PO se dit "les OKR c'est pas mon role, c'est le management qui les
      fixe". Est-ce juste ?
    reponse: >
      Non. Les Key Results eclairent directement les priorites du backlog. Un
      PO qui comprend les OKR de l'organisation decide mieux ce qui entre dans
      le sprint suivant. C'est son meilleur outil de priorisation : il peut
      defendre ses choix de backlog avec un argument strategique, pas seulement
      fonctionnel.
    douleur_terrain: >
      Le PO priorise sous pression des stakeholders sans argument strategique.
      Il cede au stakeholder le plus bruyant au lieu de piloter par les OKR.
    source_expert: null
