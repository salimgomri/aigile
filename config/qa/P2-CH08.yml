  - id: "P2-CH08-SM-05"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, quand, valeur]
    themes_salim: [S, M]
    question: >
      Mon equipe n'a pas de pipeline CI/CD. Est-ce que la Boucle OKR Vivante
      est quand meme applicable ?
    reponse: >
      Oui. Version terrain minimale : 3 cadrans seulement. On Time (Sprint Goal
      atteint), Bien-etre (Niko-Niko manuel), Blocages (Q3 oral). Les 3 autres
      cadrans arrivent quand l'infrastructure le permet. La roadmap de
      deploiement propose 4 phases sur 7 sprints : commencer avec Q1 uniquement
      en Sprints 1-2, puis monter graduellement.
    douleur_terrain: >
      Le SM pense que le Dashboard 6 cadrans necessite des outils sophistiques.
      Il reporte l'adoption indefiniment. En attendant, le rework ad hoc
      continue.
    source_expert: null
