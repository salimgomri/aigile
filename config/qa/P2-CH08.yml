  - id: "P2-CH08-SM-10"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, valeur]
    themes_salim: [M]
    question: >
      Le score de confiance OKR (1 a 5) : comment je calibre l'echelle avec
      le PO pour que ce ne soit pas subjectif ?
    reponse: >
      Trois ancres de calibration : 1 = tres peu confiants (le blocage actuel
      met directement l'Objective a risque), 3 = sur la bonne voie mais des
      risques existent, 5 = tres confiants (aucun obstacle majeur). Un score
      a 2 genere dans l'application une narrative du type : "L'equipe exprime
      une faible confiance dans l'atteinte de l'Objective. Action recommandee :
      revue de priorite backlog en lien avec les Key Results."
    douleur_terrain: >
      Le SM et le PO donnent des scores differents parce qu'ils n'ont pas la
      meme definition du "2". La calibration se fait une seule fois, en debut
      de mise en place.
    source_expert: null
    page: "185"
    extrait: null
    fiche_liee: "FP-P2-CH08-dashboard-03"
    fiche_destinee_a: [SM, PO]
    statut_reponse: confirmee
