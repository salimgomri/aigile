  - id: "P2-CH08-DEV-02"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    themes_salim: [L, M]
    question: >
      Mon manager utilise la velocite de l'equipe pour promettre des dates
      au comite de direction. Comment le burn-up me protege de cette situation ?
    reponse: >
      Le burn-up donne une fourchette de dates avec trois scenarios de velocite
      (Max, Avg, Min). La reponse au management devient "entre S8 et S9 selon
      la velocite des prochains sprints", pas une date unique. Le cone de
      confiance se retrecit sprint apres sprint : au Sprint 8, il ne reste plus
      qu'un ou deux sprints d'ecart. Si le manager prend la date Max comme
      engagement, le burn-up montre immediatement que c'est le scenario le plus
      optimiste.
    douleur_terrain: >
      Le dev donne une estimation en Sprint Planning. Le manager la transforme
      en date de livraison gravee dans le marbre. Deux sprints plus tard, le
      scope a gonfle de 15 % et le dev est tenu responsable du retard.
    source_expert: null
    page: "191-193"
    extrait: null
    fiche_liee: "FP-P2-CH08-reference-02"
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
