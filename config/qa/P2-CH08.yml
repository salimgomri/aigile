  - id: "P2-CH08-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    themes_salim: [S, A]
    question: >
      Un blocage organisationnel est remonte en Q3 et le manager ne repond
      pas. Combien de temps j'attends avant d'agir ?
    reponse: >
      Garde-fou a mettre en place avant de demarrer la Boucle : si une decision
      manager reste sans reponse apres 5 jours ouvres, le SM formule une
      decision par defaut et la documente dans l'outil : "Sans reponse du
      manager, l'equipe a applique la decision X." Ce moment est visible dans
      le dashboard. C'est une protection, pas une sanction. Documenter dans
      l'outil rend l'absence de reponse visible, ce qui cree une pression
      naturelle sans confrontation directe.
    douleur_terrain: >
      Le SM remonte un blocage. Le manager ne repond pas. Le SM relance.
      Silence. Le sprint suivant demarre avec le meme blocage non resolu.
      L'equipe perd confiance dans le systeme de remontee.
    source_expert: null
    page: "195"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
