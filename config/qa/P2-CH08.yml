# BLOC 10 : DC

  - id: "P2-CH08-DC-01"
    cible: DECIDEUR
    role: DC
    expert: JOHN_DOERR
    dimensions: [quoi, pourquoi, comment, valeur]
    themes_salim: [S, I]
    question: >
      J'ai deploye les OKR dans toute l'organisation il y a 6 mois. Les equipes
      les affichent en janvier et les oublient en fevrier. Pourquoi et comment
      reparer ca sans tout recommencer ?
    reponse: >
      C'est le symptome de l'Erreur 3 : revue trimestrielle deconnectee du
      rythme Sprint. Pas de boucle = pas de signal = OKR decores sur les murs
      en janvier, oublies en fevrier. La reparation ne necessite pas de repartir
      de zero : ajouter le Check-in 5 questions en fin de Sprint Review dans
      chaque equipe. John Doerr dans Measure What Matters : les OKR ne sont
      pas un outil de reporting, ce sont un outil d'alignement. La boucle de
      retour frequente est ce qui les maintient vivants.
    douleur_terrain: >
      Le DSI a investi dans un seminaire OKR, des coaches, des outils. En mars,
      personne ne sait plus quels sont les Key Results du trimestre.
    source_expert: "John Doerr, Measure What Matters : les OKR ne sont pas un outil de reporting, ce sont un outil d'alignement."
    page: "180-182"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DC]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, pourquoi, valeur]
    themes_salim: [S, A]
    question: >
      Le modele de cascade bidirectionnelle necessite que le manager prenne des
      decisions dans l'outil apres chaque Review. Si le manager ne joue pas le
      jeu, le systeme s'effondre ?
    reponse: >
      Oui, c'est la limite documentee. Ce qui conditionne tout : un manager qui
      accepte que les donnees remontantes puissent changer ses priorites, et une
      equipe qui croit que ses signaux seront entendus. Ces deux conditions
      relevent de la securite psychologique et de la culture organisationnelle
      (chapitre 15). Le garde-fou des 5 jours ouvres cree une pression naturelle :
      si la decision n'est pas annotee, l'equipe documente et agit. Ce moment
      est visible dans le dashboard.
    douleur_terrain: >
      Le DSI a deploye la Boucle OKR Vivante. Les managers lisent les dashboards
      mais n'annotent jamais. L'equipe remonte des blocages depuis 3 sprints.
      La boucle devient une illusion d'ecoute.
    source_expert: null
    page: "198-199"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DC, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

