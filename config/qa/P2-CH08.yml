  - id: "P2-CH08-MG-02"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [quoi, comment, valeur]
    themes_salim: [M]
    question: >
      Comment je lis le Dashboard 6 cadrans en moins de 30 secondes pour
      decider si j'ai besoin d'intervenir ?
    reponse: >
      Lecture RAG en trois etapes : (1) Scanner les 6 couleurs. Tout vert :
      aucune intervention requise. (2) Un ambre ou un rouge : ouvrir le cadran
      en detail, lire la narrative generee. (3) Rouge avec flag blocage
      organisationnel actif : annoter directement dans l'application (decision,
      deblocage, date). Chaque annotation est attachee au sprint et visible par
      l'equipe au sprint suivant.
    douleur_terrain: >
      Le manager ouvre le dashboard et ne sait pas quoi regarder en premier.
      Il lit tout, passe 10 minutes, et ne prend toujours pas de decision.
    source_expert: null
    page: "186"
    extrait: null
    fiche_liee: "FP-P2-CH08-dashboard-03"
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
