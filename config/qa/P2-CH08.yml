# BLOC 8 : RTE

  - id: "P2-CH08-RTE-01"
    cible: PRATICIEN_AGILE
    role: RTE
    expert: DEAN_LEFFINGWELL
    dimensions: [qui, quoi, comment, quand, valeur]
    themes_salim: [I, M]
    question: >
      Comment utiliser la Boucle OKR Vivante pour maintenir l'alignement
      entre 3 equipes sur un meme PI Objective sans attendre la fin du PI ?
    reponse: >
      La cascade bidirectionnelle est le mecanisme : chaque equipe remonte ses
      blocages via Q3 et son score de confiance via Q4. Le RTE consolide ces
      signaux sprint par sprint et intervient avant que la divergence ne devienne
      structurelle. Dean Leffingwell identifie ce gap dans SAFe : sans point de
      synchronisation frequent, les OKR Portfolio et les realites terrain
      divergent a chaque PI.
    douleur_terrain: >
      Le RTE attend le PI Review pour decouvrir que deux equipes ont pris des
      directions divergentes depuis 6 semaines. La correction prend un PI complet.
    source_expert: "Dean Leffingwell, SAFe : sans synchronisation frequente, OKR Portfolio et realites terrain divergent a chaque PI."
