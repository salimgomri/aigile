# BLOC 2 : Les 3 erreurs OKR classiques

  - id: "P2-CH08-SM-07"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, pourquoi, valeur]
    themes_salim: [S]
    question: >
      Mon equipe a un Sprint Goal qui consiste a "livrer le module de
      facturation". Le management appelle ca un Key Result. Est-ce correct ?
    reponse: >
      Non. C'est l'Erreur 1 : confondre Key Result et tache Sprint. Quand un
      Key Result est une tache, il devient un engagement de livraison deguise
      en objectif. L'equipe perd la flexibilite d'adapter le "comment" en cours
      de route. Un vrai Key Result mesure un resultat : "Porter le taux de
      conversion de 61 % a 75 %" est un Key Result. Le module est peut-etre le
      moyen d'y arriver. Ou pas. C'est l'equipe qui decide.
    douleur_terrain: >
      Le SM voit ses Sprint Goals rediges en taches de livraison. Il ne sait
      pas comment requalifier ca sans mettre le management en opposition.
    source_expert: "Christina Wodtke, Radical Focus : ce que l'equipe livre n'est pas ce que le client ressent."
    page: "180-181"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-SM-08"
    cible: PRATICIEN_AGILE
    role: SM
    expert: DEAN_LEFFINGWELL
    dimensions: [quoi, pourquoi, quand, valeur]
    themes_salim: [I, M]
    question: >
      Les OKR de l'organisation sont revus en fin de trimestre. Entre les deux,
      personne n'en parle. Qu'est-ce que ca coute concretement ?
    reponse: >
      Douze semaines sans signal de progression, c'est six sprints de deux
      semaines perdus. Dean Leffingwell identifie ce probleme dans SAFe : sans
      point de synchronisation frequent, les OKR Portfolio et les realites
      terrain divergent a chaque PI. La sortie : le Check-in integre en fin de
      Sprint Review. Un signal toutes les deux semaines, pas une reunion de plus.
    douleur_terrain: >
      Le SM sait que les OKR trimestriels ne correspondent plus au terrain depuis
      6 semaines, mais personne n'a defini quand et comment les reajuster.
    source_expert: "Dean Leffingwell, SAFe : sans synchronisation frequente, les OKR Portfolio divergent des realites terrain a chaque PI."
    page: "181-182"
    extrait: null
