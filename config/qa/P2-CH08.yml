  - id: "P2-CH08-CA-03"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, comment, quand, valeur]
    themes_salim: [S, I]
    question: >
      Comment accompagner une equipe qui refuse la Boucle OKR Vivante en
      disant "encore un truc a remplir" ?
    reponse: >
      La resistance vient d'une experience passee avec des outils de reporting
      qui n'ont jamais change quoi que ce soit. La reponse n'est pas de
      convaincre mais de demonstrer : deployer d'abord uniquement Q1 (Sprint
      Goal atteint, 15 secondes, une question fermee). Deux sprints plus tard,
      montrer qu'un blocage remonte en Q3 et est reellement debloque par le
      manager. Ce signal change tout : "nos remontees changent quelque chose."
    douleur_terrain: >
      Le Coach introduit le Check-in. L'equipe repond "on a deja trois ceremonies,
      c'est trop". Le Coach n'a pas d'argument terrain parce qu'il n'a pas
      commence par la version minimale.
    source_expert: null
    page: "196"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [CA, SM]
    statut_reponse: confirmee
