  - id: "P2-CH08-SM-14"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, valeur]
    themes_salim: [L, M]
    question: >
      Comment lire le burn-up pour repondre au manager sur la date de livraison
      du MVP sans donner une fausse promesse ?
    reponse: >
      Lecture avec scope fixe : tracer la ligne horizontale au niveau du MVP en
      points. Elle coupe les trois courbes de projection (Max, Avg, Min).
      Projeter chaque intersection verticalement sur l'axe X. On obtient une
      fourchette de dates. La reponse au management : "entre S8 et S9, selon la
      velocite des prochains sprints." C'est une reponse honnete, tracable,
      avec deux bornes exploitables.
    douleur_terrain: >
      Le SM donne une date unique au manager. La date passe, le scope n'est pas
      livre. La credibilite du SM s'effondre alors que le probleme etait une
      question de methode de lecture, pas de performance d'equipe.
    source_expert: null
    page: "193"
    extrait: null
    fiche_liee: "FP-P2-CH08-reference-02"
    fiche_destinee_a: [SM, PO, MG]
