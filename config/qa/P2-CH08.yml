  - id: "P2-CH08-SM-06"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    themes_salim: [M, I]
    question: >
      La Team Predictability est a 65 %. Est-ce une alerte ou est-ce
      acceptable ?
    reponse: >
      Les seuils RAG sont des points de depart, pas des verdicts. Vert : 80 %
      et plus. Ambre : 60-79 %. Rouge : sous 60 %. Mais une equipe junior a
      65 % en progression constante sur 6 sprints vaut mieux qu'une equipe
      senior a 90 % qui plafonne. C'est la tendance sur 6 sprints qui parle,
      pas le chiffre isole d'un sprint.
    douleur_terrain: >
      Le manager voit 65 % et declare l'equipe en difficulte. Le SM n'a pas
      d'outil pour contextualiser ce chiffre avec la courbe de progression.
    source_expert: null
    page: "190"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, MG]
    statut_reponse: confirmee
