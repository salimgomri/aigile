# BLOC 1 : Le probleme structurel

  - id: "P2-CH08-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    themes_salim: [S, A, M]
    question: >
      Mon manager attend un bilan OKR en fin de Sprint Review et je dois
      improviser a partir de mes donnees Scrum. Comment mettre fin a ce
      rework subi de 2 heures par sprint ?
    reponse: >
      Le rework provient de l'absence de lien structure entre les donnees Sprint
      (velocite, DORA, Niko-Niko) et le langage OKR du manager. La Boucle OKR
      Vivante connecte ces deux systemes via un Check-in 5 questions en fin de
      Sprint Review et un Dashboard 6 cadrans accessible en temps reel. Le SM
      saisit les donnees au fil de l'eau, pas en session de rattrapage. Quinze
      minutes apres la Review, le manager se connecte et lit un RAG sans que le
      SM ait produit un seul slide.
    douleur_terrain: >
      Le SM consolide velocite, Niko-Niko et DORA a la main chaque fin de sprint
      pour repondre a "on en est ou sur les six cadrans ?". Ce rework subi ne
      s'accumule pas, ne se compare pas dans le temps, et recommence a zero au
      sprint suivant.
    source_expert: null
    page: "178-179"
    extrait: null
    fiche_liee: "FP-P2-CH08-checklist-decision-01"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, quand]
    themes_salim: [S, M]
    question: >
      Qui pose les 5 questions du Check-in, qui y repond, et a quel moment
      exact de la ceremonie ?
    reponse: >
      Le Check-in a lieu en fin de Sprint Review, pas dans un meeting separe.
      Repartition des roles : la Dev Team repond a Q1 (Sprint Goal atteint,
      Oui / Partiel / Non). Le PO repond a Q2 (scope creep). Le SM repond a
      Q3 (blocage organisationnel hors equipe). Le PO et le SM renseignent
      ensemble Q4 (score de confiance OKR 1 a 5). Le SM repond seul a Q5
      (risque identifie pour le sprint suivant, en post-review). La Dev Team
      n'a qu'une seule question : deliberement, pour minimiser sa charge
      administrative.
    douleur_terrain: >
      Le SM pose 5 questions en desordre, l'equipe repond tout le monde en
      meme temps, et les reponses ne vont dans aucun outil. Le protocole
      exact evite cette confusion.
    source_expert: null
    page: "183-185"
    extrait: null
    fiche_liee: "FP-P2-CH08-checklist-decision-01"
    fiche_destinee_a: [SM, PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, comment, quand, valeur]
    themes_salim: [A, M]
    question: >
      Le manager ne se connecte jamais au dashboard apres la Review. Comment
      installer cette habitude sans le relancer manuellement a chaque sprint ?
    reponse: >
      Communiquer la deadline une seule fois : "le dashboard est a jour 15 min
      apres la Review." Pas a chaque sprint. Le SM ne relance pas. L'autonomie
      de connexion du manager s'installe apres 2 a 3 mois, rarement avant, et
      seulement si le manager ne gere pas trop d'equipes en meme temps. Pour
      les managers multi-equipes : centraliser les cadrans de toutes les equipes
      dans la meme vue.
    douleur_terrain: >
      Le SM envoie un lien par email apres chaque Review. Le manager clique
      une fois sur deux. L'historique ne s'accumule pas. Le tableau de bord
      devient un artefact sans lecteur.
    source_expert: null
    page: "194"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
