    question: >
      Le Happiness Index est visible dans le dashboard manager. Est-ce que
      j'expose des donnees individuelles ?
    reponse: >
      Non. Regle explicite : le Happiness Index dans le dashboard manager ne
      presente que la moyenne d'equipe sur le sprint, jamais les scores
      individuels. La regle est validee avec l'equipe avant activation de ce
      cadran. Si l'equipe refuse, le cadran n'est pas active.
    douleur_terrain: >
      Le SM active le cadran Bien-etre sans prevenir l'equipe. Un membre realise
      que son score individuel Niko-Niko est visible par le manager. La
      confiance est detruite.
