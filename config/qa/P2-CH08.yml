# BLOC 9 : MG

  - id: "P2-CH08-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, quand]
    themes_salim: [A, M]
    question: >
      Dois-je assister a la Sprint Review pour voir le dashboard OKR ?
    reponse: >
      Non. Le manager n'assiste pas au Check-in : il se connecte au dashboard
      quand il veut, apres la Review. Regle d'or : le dashboard est a jour
      15 minutes apres la Sprint Review. Pas un email. Pas un PDF en attente.
      Un acces en temps reel, disponible depuis n'importe quel appareil.
    douleur_terrain: >
      Le manager pense qu'il doit assister a la Sprint Review pour obtenir les
      donnees. Il y va, prend 15 minutes de retard, pose une question, et repart.
      L'equipe vit ca comme une intrusion.
    source_expert: null
    page: "183"
    extrait: null
    fiche_liee: null
