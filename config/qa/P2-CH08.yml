  - id: "P2-CH08-DEV-03"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [quoi, pourquoi, quand]
    themes_salim: [M, I]
    question: >
      Le score de confiance OKR que le SM et le PO renseignent : en quoi
      ca me concerne en tant que dev ?
    reponse: >
      Un score bas (1 ou 2) genere une recommandation d'action sur les priorites
      backlog. Si le Key Result menace est lie a une couche technique (performance,
      securite, fiabilite), le dev est directement implique dans la decision de
      replanification. Le score bas est un signal que le prochain Sprint Planning
      va etre impacte. Mieux vaut le savoir maintenant que de decouvrir le
      changement de priorite en debut de sprint.
    douleur_terrain: >
      Le dev decouvre en Sprint Planning que les priorites ont change sans
      explication strategique. Il refait son estimation sur des stories qu'il
      ne comprend pas encore. La session dure 4 heures au lieu de 2.
    source_expert: null
    page: "185"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV]
    statut_reponse: confirmee
