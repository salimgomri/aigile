# BLOC 4 : Burn-up

  - id: "P2-CH08-SM-12"
    cible: PRATICIEN_AGILE
    role: SM
    expert: MIKE_COHN
    dimensions: [quoi, pourquoi, valeur]
    themes_salim: [L, M]
    question: >
      Mon manager prefere le burndown parce qu'il voit "ce qu'il reste a
      faire". Comment lui expliquer que le burn-up est plus fiable ?
    reponse: >
      Le burndown donne une fausse impression de controle quand le scope est
      instable. Mike Cohn dans Succeeding with Agile : un burndown stable dans
      un contexte de scope instable est plus dangereux qu'une mauvaise nouvelle
      explicite, parce qu'il empeche la conversation d'avoir lieu. Le burn-up
      trace deux courbes (scope total et points cumules valides) et rend le
      scope creep immediatement visible.
    douleur_terrain: >
      Le SM sait que le scope a gonfle de 20 % depuis le S1 mais le burndown
      descend normalement. Le manager croit que tout va bien. La conversation
      sur la date n'a pas lieu.
    source_expert: "Mike Cohn, Succeeding with Agile : un burndown stable dans un contexte de scope instable est plus dangereux qu'une mauvaise nouvelle explicite."
    page: "191-192"
    extrait: null
    fiche_liee: "FP-P2-CH08-reference-02"
    fiche_destinee_a: [SM, PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P2-CH08-SM-13"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, quand, pourquoi]
    themes_salim: [L, I]
    question: >
      A partir de quel sprint est-il pertinent de produire le burn-up ?
    reponse: >
      Pas avant le S1 : le gabarit d'estimation n'est pas encore calibre et la
      velocite fluctue. Pour les equipes sans historique, attendre S3 ou S4
      quand la velocite se stabilise et que le gabarit est rode. Certaines
      equipes estiment des le Sprint 1 avec de bons resultats quand le contexte
      est connu et l'equipe se connait deja.
    douleur_terrain: >
      Le SM produit un burn-up au Sprint 1 avec une velocite hypothetique. Le
      cone de confiance est si large qu'il ne sert a rien. Le management perd
      confiance dans l'outil.
    source_expert: null
    page: "193-194"
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, PO]
    statut_reponse: confirmee
    action_recommandee: null
