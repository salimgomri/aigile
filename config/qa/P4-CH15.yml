  - id: "P4-CH15-DC-01"
    cible: DECIDEUR
    role: DC
    expert: "Ron Westrum"
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Je suis DSI. Mon directeur de la transformation me parle de culture générative et de sécurité psychologique. Je dois décider si je finance un programme sur ce sujet ou pas. Comment je sais si la culture de mon organisation est un frein réel à la performance de livraison, qui me prouve le lien entre culture et résultats, et quel est le ROI minimum attendu ?"
    reponse: "Le rapport DORA 2024 confirme que les équipes opérant dans une culture générative ont des scores DORA significativement meilleurs que celles dans une culture pathologique, toutes autres choses étant égales. La culture n'est pas un prérequis théorique : c'est un facteur causal mesuré. Le signal pour le DSI : faire passer le Westrum Culture Survey sur aigile.lu à son périmètre. Le résultat dira plus que le dashboard de vélocité. Un ART bien coordonné avec un management aligné dans un contexte culturel pathologique n'ira pas loin."
    douleur_terrain: "Le DSI entend parler de culture depuis des années mais n'a jamais eu de donnée mesurable qui justifie un investissement devant son board."
    source_expert: "DORA 2024 / Westrum, 2004"
    page: 325
    extrait: null
    fiche_liee: "FP-IV-15.6"
    fiche_destinee_a: [DC]
    statut_reponse: confirmee
    action_recommandee: null
