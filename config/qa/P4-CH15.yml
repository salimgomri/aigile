nouvelles_questions:
  - id: "P4-CH15-SM-06"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Je fais les 5 gestes de securite psychologique depuis 2 sprints. Je ne sais pas si j'avance ou si je plafonne. Comment j'evalue ma propre contribution a la securite de l'equipe sans attendre le prochain score Edmondson, et quel est le signal concret que mon comportement change quelque chose ?"
    reponse: "Le geste 6 est le seul qui se retourne vers soi : une fois par sprint, identifier une situation ou tu aurais pu modeliser le comportement souhaite et tu ne l'as pas fait. Pas pour te juger. Pour voir si le pattern se repete. Le signal que ca change quelque chose : quelqu'un d'autre commence a prendre des risques interpersonnels apres toi. Un DEV qui admet ne pas savoir en Daily. Un PO qui reconnait une mauvaise priorite en Sprint Review. La modelisation SM est contagieuse si elle est coherente."
    douleur_terrain: "Le SM fait des gestes isolement mais ne sait pas si c'est lui qui cree le mouvement ou si l'equipe avance independamment de lui."
