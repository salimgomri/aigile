  - id: "P4-CH15-PO-02"
    cible: PRATICIEN_AGILE
    role: PO
    expert: "Timothy R. Clark"
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Je suis PO. En Sprint Planning, un DEV remet en question une decision de backlog que j'ai prise. C'est la troisieme fois ce sprint. Je dois reagir devant toute l'equipe. Comment je reponds pour que ce moment construise le Contributor Safety plutot que de le detruire, et qu'est-ce que je ne dois surtout pas faire ?"
    reponse: "La reaction du PO face au desaccord d'un DEV sur une priorite est l'un des signaux les plus visibles du niveau 3 (Contributor Safety). Ce qu'il faut faire : accueillir le desaccord devant l'equipe, demander a comprendre le raisonnement avant de defendre la decision, puis expliquer le contexte qui a determine la priorite. Ce qu'il ne faut pas faire : defendre la decision immediatement, couper court, ou signaler non verbalement que la question n'est pas bienvenue. Le PO qui accueille le desaccord visible construit la permission collective de contribuer. Celui qui le recadre la detruit."
    douleur_terrain: "Le PO sent qu'il perd en autorite s'il cede trop facilement. Il confond accueil du desaccord et abandon de la decision."
    source_expert: "Timothy R. Clark, The 4 Stages of Psychological Safety, 2020"
    page: 322
    extrait: null
    fiche_liee: "FP-IV-15.2"
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P4-CH15-MG-03"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "On vient de vivre un incident grave dans mon equipe : j'ai sanctionne publiquement une erreur d'estimation en Sprint Review. Le score Edmondson du trimestre dernier etait 4.8/7. Je n'ai pas de nouvelle mesure prevue avant 2 mois. Dois-je attendre ou puis-je mesurer maintenant, et si oui comment ?"
    reponse: "Le delai trimestriel est une recommandation pour l'usage courant. Apres un incident grave (conflit public, erreur sanctionnee devant l'equipe, changement de manager brutal), une mesure ponctuelle hors cycle est legitime. L'utiliser comme signal d'entree pour une conversation, pas comme verdict a presenter en reunion. Dans ce cas precis : mesurer anonymement dans les 2 semaines suivant l'incident, partager uniquement le score agrege avec l'equipe, nommer l'incident dans la conversation qui suit, et laisser l'equipe identifier ce dont elle a besoin."
    douleur_terrain: "Le manager a cree le probleme sans le savoir et ne sait pas si attendre aggrave ou si mesurer maintenant est intrusif."
    source_expert: null
    page: 321
