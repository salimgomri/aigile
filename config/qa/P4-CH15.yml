  - id: "P4-CH15-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    question: "J'ai investi sur la coordination inter-équipes (SAFe, PI Planning) et sur l'alignement management (OKR, dashboards). Les résultats ne sont pas à la hauteur. Mon coach me dit que la culture est le troisième socle manquant. Comment j'évalue si c'est un diagnostic valide ou une façon de me vendre une nouvelle prestation ?"
    reponse: "Les trois dimensions de la Partie 4 sont interdépendantes : coordination inter-équipes, relation manager, culture (sécurité psychologique, maturité, Westrum). Un ART bien coordonné avec un management aligné dans un contexte culturel pathologique n'ira pas loin. Une culture générative dans une organisation sans cadence commune non plus. C'est la combinaison des trois qui crée les conditions de la performance durable. Le test pour valider le diagnostic : passer le Westrum Culture Survey et comparer avec les scores DORA actuels. Si les scores DORA sont faibles ET le Westrum est en zone pathologique ou bureaucratique, le diagnostic est fondé."
    douleur_terrain: "Le DSI a déjà payé deux fois pour des programmes qui ne tenaient pas leurs promesses. Il n'a pas de critère objectif pour valider un nouveau diagnostic."
    source_expert: null
    page: 325
