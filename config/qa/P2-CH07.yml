    reponse: "Croise la demande avec le tableau page 167 et la section dette technique (page 168). Si le CFR est réellement élevé (au-delà de 15%, niveau Low, page 166) et que les signaux de dette sont présents (MTTR qui s'allonge, lead time qui croît sans raison, stories qui rebondissent, page 168-169), la demande est légitime : c'est de la dette technique à traiter dans le Product Backlog, avec urgence documentée et coût de non-traitement (page 169). Si au contraire le CFR est déjà bas et la DF aussi, tu es peut-être dans le profil 'illusion de qualité' (page 167) : l'équipe teste déjà tout manuellement, et ajouter du temps de test ne résoudra pas le vrai problème, qui est le Lead Time et la réactivité en cas d'incident."
