  - id: "P2-CH07-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: LISA_CRISPIN
    themes_salim: ["S", "M"]
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Les DORA doivent-elles figurer dans ma Sprint Review, et si oui comment je les présente sans avoir l'air d'usurper le rôle du SM ou des devs ?"
    reponse: "Le cadran Qualité du Dashboard (Chapitre 8) peut être présenté en Review comme signal d'ingénierie : tu rends les DORA visibles aux stakeholders sans les interpreter toi-même (page 171, indicateur secondaire = taux de bugs entrants en tendance). Attention au piège identifié page 171 : ne confonds pas nombre de bugs traités et qualité réelle. Une équipe qui traite vingt bugs par sprint n'est pas une équipe de qualité, elle produit beaucoup de défauts. L'indicateur valide est le taux de bugs entrants, en baisse sur cinq sprints."
    douleur_terrain: "Le PO présente des features livrées en Review mais ignore complètement l'état de santé technique du produit, jusqu'au jour où un incident majeur arrive et personne n'avait vu venir la dégradation."
    source_expert: "Forsgren, Humble, Kim, Accelerate : ce qui compte, c'est la réduction du flux de défauts, pas la vitesse de traitement."
    page: 171
    extrait: "Il existe un indicateur complémentaire valide : le taux de bugs entrants par sprint, pas les bugs traités, les bugs détectés. Si le nombre de nouveaux bugs détectés diminue sur cinq sprints, la qualité s'améliore structurellement."
    fiche_liee: "FP-P2-CH07-memo-reference-01"
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

