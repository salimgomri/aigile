  - id: "P2-CH07-DC-01"
    cible: DECIDEUR
    role: DC
    expert: LISA_CRISPIN
    themes_salim: ["S", "M"]
    dimensions: [qui, quoi, pourquoi, valeur]
    question: "La qualité technique est-elle la responsabilité du testeur ou de toute l'équipe Scrum, et est-ce que recruter plus de QA va résoudre nos problèmes de CFR ?"
    reponse: "Toute l'équipe. La qualité est intégrée à chaque sprint, pas validée en fin de cycle, et le chapitre relie les DORA à la DoD. Recruter un QA supplémentaire ne règle pas un CFR élevé si la cause est l'absence de tests automatisés ou de CI/CD (page 168, signaux à surveiller). La dette technique ne prévient pas : elle devient visible quand le CFR monte, que le MTTR s'allonge, et que le lead time pour une modification simple passe de 2 heures à 3 jours (page 168)."
    douleur_terrain: "Le DSI pense que recruter un QA va régler les problèmes de qualité. Ce n'est pas le bon modèle en Scrum, et l'investissement ne produit pas l'amélioration attendue sur les DORA."
    source_expert: null
    page: 168
    extrait: "La dette technique ne prévient pas. Elle devient visible quand le change failure rate monte, que le MTTR s'allonge, et que le lead time pour une modification simple passe de 2 heures à 3 jours."
