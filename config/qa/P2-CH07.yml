  - id: "P2-CH07-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    themes_salim: ["L", "M"]
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Comment je distingue un problème de processus Scrum d'un problème d'engineering grâce aux DORA, et comment je traduis ça en langage business pour ma propre direction ?"
    reponse: "Grille de lecture page 167 : CFR élevé + Deployment Frequency basse pointe vers un problème technique, pas organisationnel. Pour traduire en business, utilise le calcul du coût d'incident (page 170-171) : MTTR supérieur à 1 jour multiplié par le nombre d'heures, le nombre de personnes mobilisées et le taux journalier. Exemple chiffré : MTTR de 8h, 3 devs + 1 SM mobilisés, taux de 50 euros/h, coût direct de 1600 euros, plus le coût indirect (support client, risque SLA) (page 171). Un MTTR chiffré en euros ouvre des portes que les termes techniques ferment (page 170)."
    douleur_terrain: "Le manager confond lenteur de livraison (problème de process, Sprint Planning ou priorisation) et fragilité du code (problème engineering, dette technique). Les deux ont des solutions complètement différentes et le manager applique le mauvais remède."
    source_expert: null
    page: 171
    extrait: "MTTR = 8h. Équipe mobilisée : 3 devs + 1 SM. Taux journalier moyen : 400 euros. Coût direct : 8h x 4 personnes x 50 euros/h = 1600 euros. Plus le coût indirect (support client, risque SLA)."
    fiche_liee: "FP-P2-CH07-memo-reference-02"
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P2-CH07-02"]

