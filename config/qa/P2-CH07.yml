  - id: "P2-CH07-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: DAVE_FARLEY
    themes_salim: ["M"]
    dimensions: [quoi, comment, pourquoi, valeur]
    question: "Quelles sont les 4 métriques DORA, pourquoi ces 4 précisément et pas d'autres, et comment je situe mon équipe sur les niveaux Elite/High/Medium/Low ?"
    reponse: "Deployment Frequency (cadence de livraison), Lead Time for Changes (temps entre le premier commit et la prod), Change Failure Rate (pourcentage de déploiements causant un incident) et Mean Time to Recovery (temps de rétablissement après incident). Ces 4 métriques se sont révélées systématiquement corrélées a la performance organisationnelle dans les recherches DORA : ni la taille de l'équipe, ni le langage, ni le framework agile (page 163). Les niveaux Elite de référence : DF plusieurs fois par jour, LT moins d'1 heure, CFR 0-5%, MTTR moins d'1 heure (page 172). Note : ces seuils sont basés sur le rapport State of DevOps 2019, les editions 2023-2024 ont légèrement relevé certains seuils Elite (page 163)."
    douleur_terrain: "Le dev entend parler de DORA en reunion mais ne comprend pas pourquoi ces 4 métriques précisément, et confond souvent vitesse de livraison et qualité."
    source_expert: "Nicole Forsgren, Jez Humble, Gene Kim, Accelerate, 2018"
    page: 163
    extrait: "Résultat : quatre métriques se sont révélées systématiquement corrélées a la performance organisationnelle. Pas la taille de l'équipe. Pas le langage de programmation. Pas le framework agile utilise. Ces quatre métriques-là."
    fiche_liee: "FP-P2-CH07-memo-reference-01"
    fiche_destinee_a: [DEV, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P2-CH07-01"]

  - id: "P2-CH07-DEV-02"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: DAVE_FARLEY
    themes_salim: ["L", "M"]
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    question: "Mon équipe casse souvent la prod et le Change Failure Rate est dans le rouge. Par où je commence pour l'améliorer, et comment je sais que c'est vraiment un problème de CFR et pas juste un mauvais sprint ?"
    reponse: "Lis toujours le CFR en combinaison avec la Deployment Frequency (page 166). Si la DF est basse et le CFR bas, c'est souvent une illusion de qualité : l'équipe déploie si rarement qu'elle a le temps de tout tester manuellement (page 166 et tableau page 167, profil DF basse + CFR bas). Si la DF est haute et le CFR haute, l'équipe déploie souvent mais casse beaucoup : tests insuffisants, et la réponse est d'aller plus lentement pour aller plus vite (page 167). Niveau Elite du CFR : 0 a 5%. Au-delà de 15%, le pipeline est instable (page 166)."
    douleur_terrain: "Le dev voit que son équipe casse souvent la prod mais isole le CFR sans le croiser avec la fréquence de déploiement, et tire la mauvaise conclusion."
    source_expert: null
    page: 167
    extrait: "DF haute + CFR haute : L'équipe déploie souvent mais casse beaucoup. Tests insuffisants. Aller plus lentement pour aller plus vite."
    fiche_liee: "FP-P2-CH07-checklist-decision-01"
    fiche_destinee_a: [DEV, CA, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P2-CH07-02"]

  - id: "P2-CH07-DEV-03"
