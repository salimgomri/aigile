    dimensions: [qui, quoi, comment, quand]
    question: "Comment je mesure le Lead Time for Changes si mon équipe n'a pas de pipeline CI/CD sophistique, sans attendre 6 mois d'outillage avant de commencer ?"
    reponse: "TROU PARTIEL. Le chapitre explique ce que mesure le Lead Time, du commit a la prod (page 164), et fournit le tableau de niveaux (Elite moins d'1h, Low plus de 1 mois, page 164). Mais il ne décrit pas de méthode de mesure manuelle pour une équipe sans CI/CD. Le chapitre recommande de démarrer par la Deployment Frequency avant le Lead Time (page 164, encart En pratique), ce qui répond indirectement : commence par compter les déploiements a la main avant de t'attaquer au Lead Time."
    douleur_terrain: "Le dev travaille dans une organisation peu mature DevOps. Les DORA lui semblent inaccessibles sans infrastructure technique avancée, et il abandonne avant d'essayer."
    source_expert: null
    page: 164
    extrait: "Démarrez par une seule DORA : la Deployment Frequency. Installez un compteur simple (post-it sur le tableau ou champ dans ton CI). Après 3 sprints, tu as une baseline."
    fiche_liee: null
    fiche_destinee_a: [DEV]
    statut_reponse: trou
    action_recommandee: "Ajouter un encart En pratique sous la section Lead Time for Changes (page 164-165) : méthode de mesure manuelle (horodatage premier commit vs date de mise en prod, même via un tableur), avant d'introduire un outillage CI/CD dédié."
