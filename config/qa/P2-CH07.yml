    question: "Les DORA Metrics me concernent-elles si je ne suis pas développeur, et comment je m'en sers sans passer pour quelqu'un qui joue les ingénieurs ?"
    reponse: "Oui, mais autrement que les devs. Tu n'es pas l'ingénieur, tu es le facilitateur (page 169). Le chapitre propose trois questions ouvertes a poser en rétrospective, quinze minutes en debut de cérémonie : qu'est-ce qui empêche de déployer plus souvent, qu'est-ce qui prend le plus de temps quand un bug arrive en prod, et quel pourcentage des déploiements se passe sans stress (page 170). Ton rôle : faire émerger les frictions, pas les corriger toi-même."
    douleur_terrain: "Le SM non-tech évite le sujet DORA de peur de devoir répondre à des questions techniques qu'il ne maîtrise pas."
    source_expert: null
    page: 169
    extrait: "En tant que Scrum Master, tu n'es pas responsable de l'implementation des pratiques DevOps. [...] Mais tu es responsable de créer les conditions dans lesquelles ces ameliorations peuvent avoir lieu."
    fiche_liee: "FP-P2-CH07-memo-reference-01"
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
