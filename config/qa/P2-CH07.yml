  - id: "P2-CH07-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    themes_salim: ["I", "M"]
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "J'ai investi dans une transformation agile sur plusieurs équipes. Comment je sais si le pipeline technique se dégrade avant que ça devienne une crise visible, et à quel seuil dois-je m'alarmer ?"
    reponse: "Jeff Sutherland documente que quand la dette technique dépasse 20% de la capacité de l'équipe, la vélocité ne baisse pas progressivement, elle s'effondre, et chaque modification déclenche des effets de bord imprévus (page 168). Les signaux à surveiller avant ce point de bascule (page 168-169) : Change Failure Rate en hausse, MTTR qui s'allonge, lead time qui croît sans raison apparente, et stories qui rebondissent (une story Done qui revient en sprint à cause d'un bug en prod). Si plus de 15% des stories fermées rouvrent, le DoD (Definition of Done, vu au Chapitre 3) est insuffisant ou le code est trop risqué à modifier (page 169). La dette technique doit être visible dans le Product Backlog, estimée, priorisée, avec une urgence documentée et un coût de non-traitement (page 169)."
    douleur_terrain: "Le DSI découvre la dégradation du pipeline au moment où un incident majeur éclate, alors que les signaux étaient visibles plusieurs sprints avant dans les DORA, mais personne ne les avait rendus visibles à la direction."
    source_expert: "Jeff Sutherland"
    page: 168
    extrait: "Jeff Sutherland l'a documenté : quand la dette dépasse 20% de la capacité de l'équipe, la vélocité ne baisse pas progressivement. Elle s'effondre. Chaque modification déclenche des effets de bord que personne n'avait prévus."
    fiche_liee: "FP-P2-CH07-memo-reference-02"
    fiche_destinee_a: [DC, MG]
