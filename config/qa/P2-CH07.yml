    question: "Comment intégrer les DORA dans le Dashboard Manager sans créer une bureaucratie de mesure ni demander a l'équipe de remplir un tableau de plus ?"
    reponse: "Le cadran Qualité du Dashboard 6 cadrans (Chapitre 8) s'alimente du CFR comme métrique principale et du taux de bugs entrants en tendance comme indicateur secondaire (page 171). La mesure est cote CI/CD, pas manuelle. Démarre par une seule DORA, la Deployment Frequency, avec un compteur simple, post-it sur le tableau ou champ dans le CI. Après 3 sprints tu as une baseline, puis ajoute le Lead Time for Changes (page 164). Ne pas mesurer les 4 simultanément : l'effort de collecte noie le signal."
    douleur_terrain: "Dès qu'on parle de métriques engineering, le premier réflexe est un tableau Excel qui prend 2h à remplir chaque sprint."
