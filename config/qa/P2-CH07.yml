    question: "Si je compare deux équipes, l'une avec un Scoring Deliverable élevé mais des DORA dans le rouge, l'autre avec des DORA au niveau Elite mais un Scoring Deliverable faible, laquelle est en meilleure santé réelle ?"
    reponse: "TROU PARTIEL. Le chapitre ne traite pas cette comparaison directement, mais pose les bases pour y répondre. Les DORA mesurent la santé du pipeline technique (page 161-162) : une équipe avec des DORA dans le rouge accumule de la dette qui finira par s'effondrer (seuil des 20%, page 168), même si elle livre bien aujourd'hui. Une équipe avec des DORA Elite mais un Scoring Deliverable faible livre un produit fragile en surface (valeur, documentation, feedback utilisateur, cf. Ch.12) sur un pipeline solide : le risque est plus facile à corriger, car le moteur technique fonctionne. Aucune des deux n'est en bonne santé : les deux dashboards se complètent, ils ne se substituent pas l'un à l'autre."
    douleur_terrain: "Le DSI pilote 5 équipes avec un seul indicateur consolidé et classe l'équipe au Scoring élevé comme 'la meilleure', sans voir qu'elle accumule une dette technique qui va coûter beaucoup plus cher dans 2 trimestres que le retard de l'autre équipe."
