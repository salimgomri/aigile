  - id: "P1-CH03-DC-01"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    themes_salim: ["M"]
    question: "Mon équipe passe 30% de son temps en réunions Scrum. Est-ce normal ?"
    reponse: "Non. Les cérémonies Scrum bien calibrées représentent environ 12h par sprint, soit 15% du temps disponible sur un sprint de deux semaines. Avec le Backlog Refinement, environ 17h, soit 17 à 18% à 20-22% selon le calendrier. C'est le coût de l'empirisme. Si ce pourcentage choque le management, c'est une conversation à avoir, pas une cérémonie à supprimer."
    douleur_terrain: "Les DSI voient leurs équipes en réunion permanente et commencent à questionner le modèle agile lui-même."
    source_expert: null
    page: 89
    extrait: "Cérémonies Scrum : environ 12h par sprint soit 15% du temps disponible. Avec Refinement : environ 17h soit 20 à 22% du temps. C'est le coût de l'empirisme."
    fiche_liee: "FP-I-3.5-management-positionnement"
    fiche_destinee_a: [MG, DC]
    statut_reponse: confirmee
    action_recommandee: null
