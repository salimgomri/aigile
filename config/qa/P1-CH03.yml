  - id: "P1-CH03-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    themes_salim: ["S", "M"]
    question: "À quelles cérémonies dois-je assister en tant que manager pour apporter de la valeur sans perturber l'équipe ?"
    reponse: "La Sprint Review est la seule cérémonie où la présence du management apporte de la valeur : minimum 5 parties prenantes actives, pas spectatrices, posant des questions ou prenant des décisions. Assister aux autres cérémonies (Daily, Planning, Refinement, Rétro) perturbe l'auto-organisation, même sans un mot dit."
    douleur_terrain: "Le manager qui assiste au Daily pour voir comment ça avance fait exactement ce qu'il ne faut pas faire. Mais personne ne lui dit."
