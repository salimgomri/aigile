  - id: "P1-CH03-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [quoi, pourquoi, quand, valeur]
    themes_salim: ["M"]
    question: "Comment savoir si une cérémonie qui existe dans le calendrier produit vraiment de la valeur, plutôt que d'occuper du temps ?"
    reponse: "TROU : Le chapitre raconte l'exemple d'une Sprint Review de 2012 qui était un théâtre malgré sa présence dans le calendrier, mais ne traduit jamais ce constat en coût pour le décideur qui finance la transformation. Le critère le plus proche fourni dans le chapitre est la règle générale : une cérémonie sans décision de sortie n'est pas une cérémonie, c'est une réunion."
    douleur_terrain: "Le DSI finance une transformation agile, voit les cérémonies dans le calendrier de toutes les équipes, mais ne peut pas distinguer celles qui fonctionnent de celles qui sont du théâtre."
    source_expert: null
    page: null
    extrait: "Alerte : une cérémonie sans décision de sortie n'est pas une cérémonie, c'est une réunion."
