questions:

  - id: "P1-CH03-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    themes_salim: ["S", "I", "M"]
    question: "Mon Daily est devenu un rapport de statut. Comment le recadrer ?"
    reponse: "Le Daily de 15 minutes max doit être centré sur le Sprint Goal, pas les tâches individuelles. Le chapitre propose deux questions orientées objectif : qu'est-ce que j'ai fait pour atteindre l'objectif du sprint, est-ce que j'ai des points de blocage. Signal de succès : tout le monde parle au Sprint Goal."
    douleur_terrain: "Le Daily tour-de-table est le pattern le plus répandu et le plus contre-productif."
    source_expert: null
    page: 82
    extrait: "Dans ma pratique, deux questions suffisent : 1. Qu'est-ce que j'ai fait pour atteindre l'objectif du sprint ? 2. Est-ce que j'ai des points de blocage ?"
    fiche_liee: "FP-I-3.1-daily-reporting-alignement"
    fiche_destinee_a: [SM, DEV]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P1-CH03-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    themes_salim: ["S", "I", "M"]
    question: "La Rétro se termine toujours sans action concrète. Qu'est-ce qui produit ce pattern ?"
    reponse: "Une rétrospective efficace produit une seule action réelle, assignée à une personne nommée, datée, vérifiable à la prochaine rétro. La rétro dysfonctionnelle chronique a presque toujours une cause en amont : sécurité psychologique basse, ou perte de confiance dans le suivi des actions. Le geste concret pour reconstruire la confiance : ouvrir chaque rétro en relisant publiquement l'action du sprint précédent."
    douleur_terrain: "L'équipe génère des post-its, puis la même chose se reproduit au sprint suivant."
    source_expert: "Esther Derby et Diana Larsen, structure en 5 phases : Set the Stage, Gather Data, Generate Insights, Decide What to Do, Close."
    page: 87
    extrait: "Une action tenue vaut dix actions oubliées."
    fiche_liee: "FP-I-3.2-diagnostic-retro-rituel-theatre"
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

