  - id: "P1-CH03-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, pourquoi, valeur]
    themes_salim: ["S", "I"]
    question: "Le Daily est censé m'aider à livrer le Sprint Goal. Dans mon équipe c'est un rapport au manager. Comment le dire ?"
    reponse: "Le Daily appartient à l'équipe, pas au management. Le Scrum Guide 2020 a supprimé les trois questions individuelles précisément parce qu'elles orientent vers l'individu plutôt que vers l'objectif collectif. Reformuler le Daily autour du Sprint Goal renforce l'appartenance à l'équipe : chacun parle de sa contribution, pas de ses tâches personnelles."
    douleur_terrain: "Le dev dit ce que le manager veut entendre, pas ce qui bloque vraiment."
    source_expert: "Scrum Guide 2020 : suppression des trois questions individuelles"
    page: 82
    extrait: "Quand chaque membre parle de sa contribution à l'objectif commun : pas de ses réunions, pas de ses tâches personnelles : les gens se sentent réellement impliqués dans quelque chose de collectif."
    fiche_liee: "FP-I-3.1-daily-reporting-alignement"
    fiche_destinee_a: [SM, DEV]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P1-CH03-DEV-02"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    themes_salim: ["S", "L"]
    question: "Mon Sprint Planning prend 4 heures et la moitié du temps on clarifie des stories pas prêtes. Comment réduire ?"
    reponse: "La première maladie du Sprint Planning est un backlog non raffiné : l'équipe découvre des stories sous-spécifiées en séance, on débat, on clarifie, on replanifie. Ce travail aurait dû avoir lieu avant, lors du Backlog Refinement. La règle terrain : le backlog doit avoir en permanence au moins deux sprints de stories raffinées et ordonnées."
    douleur_terrain: "Le dev arrive au Sprint Planning sans stories claires. Il sort épuisé avant même d'avoir codé."
    source_expert: null
    page: 84
    extrait: "L'équipe arrive au planning et découvre des stories sous-spécifiées. On débat. On clarifie. On replanifie. Ce travail aurait dû avoir lieu avant."
    fiche_liee: null
    fiche_destinee_a: [SM, DEV]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P1-CH03-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    themes_salim: ["S", "L", "M"]
    question: "Je dois conduire la Sprint Review avec des managers qui ne comprennent pas Scrum. Comment la rendre utile ?"
    reponse: "Ne pas démarrer par une démonstration. Le PO, pas le SM, ouvre la session par une question : voilà ce qu'on voulait valider ce sprint, qu'est-ce que tu en penses avant qu'on montre quoi que ce soit. C'est important que ce soit le PO qui pose cette question car c'est lui qui a formulé l'hypothèse du sprint et qui assume la responsabilité de la valeur. Si c'est le SM, ça reste de la facilitation."
    douleur_terrain: "Le PO anime une Review devant des managers qui regardent leur téléphone. Aucune décision n'en sort."
    source_expert: null
    page: 85
    extrait: "Voilà ce qu'on voulait valider ce sprint : qu'est-ce que tu en penses avant qu'on montre quoi que ce soit ?"
    fiche_liee: "FP-I-3.3-ouvrir-review-par-question"
    fiche_destinee_a: [PO]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P1-CH03-PO-02"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    themes_salim: ["S", "I"]
    question: "Le Sprint Goal n'est jamais vraiment formulé dans mon équipe, on coupe direct en tâches. Qui doit le porter et comment ?"
    reponse: "Un Sprint Planning efficace a deux parties clairement séparées : d'abord le quoi et le pourquoi, formuler le Sprint Goal et sélectionner les items qui le servent, ensuite le comment, décomposer le travail en tâches. Le Sprint Goal n'est pas formulé par le PO seul : il émerge de la conversation entre le PO et les Developers lors de la Partie 1 du Planning. Si tu mélanges les deux parties, tu finis avec un Sprint Goal faible et un plan surchargé."
    douleur_terrain: "À la fin du planning, l'équipe sait exactement quoi faire mais personne ne saurait dire pourquoi ce sprint a de la valeur."
    source_expert: null
    page: 84
    extrait: "Le Sprint Goal n'est pas formulé par le PO seul. Il émerge de la conversation entre le PO et les Developers lors de la Partie 1 du Planning."
    fiche_liee: "FP-I-3.6-sprint-goal-partie1"
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P1-CH03-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    themes_salim: ["S", "I", "M"]
    question: "Comment diagnostiquer si les cérémonies d'une équipe sont des rituels vivants ou du théâtre agile ?"
    reponse: "Les signaux de cérémonies saines sont mesurables : Daily 15 minutes max avec au moins une décision de sortie, Sprint Goal formulé avant le découpage en tâches, Sprint Review avec minimum 5 parties prenantes actives ayant posé au moins une question ou pris une décision, Rétrospective avec 1 action concrète assignée datée suivie. L'alerte la plus forte : mêmes actions d'une rétro à l'autre, signe de confiance brisée ou d'obstacle organisationnel non adressé."
    douleur_terrain: "Le Coach arrive dans une équipe qui fait du Scrum depuis 2 ans. Les cérémonies existent mais aucune amélioration n'est visible. C'est du Scrum zombi."
    source_expert: "Esther Derby et Diana Larsen, structure en 5 phases de la rétrospective"
    page: 90
    extrait: "Alerte : mêmes actions d'une rétro à l'autre = confiance brisée OU obstacle organisationnel non adressé."
    fiche_liee: "FP-I-3.2-diagnostic-retro-rituel-theatre"
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P1-CH03-01"]

  - id: "P1-CH03-CA-02"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, quand, valeur]
    themes_salim: ["S", "I"]
    question: "Une équipe enchaîne les sprints en retard à cause des mêmes obstacles récurrents. Quelle technique utiliser et à quel moment ?"
    reponse: "Le prémortem, animé par le Scrum Master en fin de Sprint Review. Une seule question : on est dans deux semaines, le sprint vient de se terminer, c'est raté, qu'est-ce qui s'est passé. Trois minutes en silence, chacun écrit, on récolte et on lit à voix haute. Pour chaque risque nommé : soit on modifie le périmètre ou on clarifie la dépendance en Sprint Planning, soit on acte une vigilance explicite. Durée réelle 20 à 30 minutes."
    douleur_terrain: "L'équipe gère les mêmes obstacles en urgence, sprint après sprint, sans jamais les anticiper."
    source_expert: null
    page: 86
    extrait: "J'ai utilisé ça avec une équipe de 9 personnes qui enchaînait les sprints en retard. Après trois prémortem, les escalades imprévues vers le manager ont pratiquement disparu."
    fiche_liee: "FP-I-3.4-premortem"
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

