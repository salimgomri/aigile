  - id: "P1-CH03-MG-02"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    themes_salim: ["I", "M"]
    question: "Une rétro produit toujours les mêmes 2-3 actions sans effet visible. C'est un problème de format ou autre chose ?"
    reponse: "Changer le format ne résout rien si la cause est en amont : soit les gens ne se sentent pas en sécurité pour dire les vraies choses, soit ils ont perdu confiance dans le suivi des actions. Dans les deux cas, c'est la confiance qu'il faut reconstruire, sur plusieurs sprints, avec des preuves concrètes. Le signal d'alerte mesurable : mêmes actions d'une rétro à l'autre."
    douleur_terrain: "Le manager change le format de la rétro chaque trimestre en espérant que ça débloque quelque chose. Rien ne change."
