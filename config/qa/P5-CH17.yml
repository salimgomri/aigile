  - id: "P5-CH17-DC-03"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "Je pense que l'IA devrait permettre à mes équipes de doubler leur capacité de livraison. Mon manager agile me répond que c'est plus nuancé. Qui a raison, et comment je différencie ce qui est accélérable de ce qui ne l'est pas ?"
    reponse: "L'IA accélère les tâches mécaniques, répétitives, à faible incertitude. Elle n'accélère pas le jugement, la compréhension des besoins clients, la résolution de problèmes complexes, la construction de confiance dans une équipe. Un manager qui peut répondre avec des données et des nuances vaut mieux qu'un manager qui dit oui et livre dans le mur. La question n'est pas 'est-ce que l'IA multiplie la capacité ?' mais 'quelle part de la capacité est mécanisable, et qu'est-ce qu'on fait du temps récupéré ?'"
    douleur_terrain: "Le DSI a vu des demos impressionnantes de l'IA et a conclu à une multiplication directe. La réalité terrain est que la part mécanique varie énormément selon les équipes et les contextes."
