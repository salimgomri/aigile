  - id: "P5-CH17-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, pourquoi, valeur]
    question: "Mon organisation n'a pas encore de politique IA d'entreprise. Est-ce que j'attends ou est-ce que j'autorise mes managers à prendre des initiatives locales, et avec quelles limites ?"
    reponse: "Autoriser les IA policies locales sans attendre la politique d'entreprise. Une IA policy locale couvre le périmètre d'une équipe, pas de l'organisation. Elle est complémentaire : quand la politique d'entreprise arrivera, les policies locales seront intégrées, pas remplacées. La différence avec l'accord d'équipe IA du chapitre 16 : la policy est un cadre de gouvernance et de responsabilité. L'accord est un engagement collectif de pratique. Les deux sont nécessaires."
    douleur_terrain: "Le DSI hésite entre laisser faire et risquer l'incohérence, ou attendre et laisser ses équipes opérer sans cadre. L'absence de cadre n'est pas neutre : elle expose le manager, pas l'organisation."
    source_expert: null
    page: 362
    extrait: null
    fiche_liee: "FP-V-17.3"
    fiche_destinee_a: [DC, MG]
    statut_reponse: provisoire
