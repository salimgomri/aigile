  # ── QUESTIONS ISSUES DES TROUS (T01/T02/T03) ────────────────

  - id: "P5-CH17-MG-06"
    cible: MANAGER
    role: MG
    expert: MIKE_COHN
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Ma direction demande combien de temps l'IA fait réellement gagner à mon équipe. Je dis 'une partie significative des tâches mécaniques' mais elle veut un chiffre. Comment je le produis sans sortir un chiffre inventé ?"
    reponse: "Une mesure sur 1 sprint suffit. Demande à chaque membre de noter le temps gagné grâce à l'IA sur des tâches qu'il aurait faites seul de toute façon. Une estimation par sprint, pas une mesure au chronomètre. Ce chiffre te donne un ordre de grandeur honnête à présenter. Il a aussi un effet secondaire utile : il force l'équipe à prendre conscience de ce qu'elle délègue réellement à l'IA, ce qui prépare la conversation sur la qualité des révisions."
    douleur_terrain: "Le manager argumente avec 'une partie de nos tâches' mais ne peut pas chiffrer. La direction entend une esquive. Un seul sprint de mesure transforme une intuition en donnée terrain."
    source_expert: "Mike Cohn : la mesure empirique d'une seule itération vaut plus que dix réunions d'estimation. Même principe appliqué à la part mécanique."
    page: 358
    extrait: null
    fiche_liee: "FP-P5-CH17"
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: "Ajouter encadré En pratique p.358 section 3 apres le premier script Direction/Reponse, avant le deuxieme bloc concurrents"
