  - id: "P5-CH17-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: JEFF_SUTHERLAND
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Mes Sprint Goals sont atteints à 100% depuis que l'équipe utilise l'IA pour les formuler. Mon manager est ravi. Moi je ne suis pas sûr que ce soit un signe de santé. Comment je détecte si l'atteinte mesure la valeur ou juste la conformité à ce que l'IA a formulé ?"
    reponse: "Un Sprint Goal atteint à 100% plusieurs sprints de suite peut signifier deux choses opposées : soit l'équipe est en excellente forme, soit l'IA a appris à formuler des goals atteignables plutôt qu'ambitieux. Le test est simple : en Planning, poser la question directe 'Si on formulait ce goal sans l'IA ce matin, on dirait quoi ?' Si l'équipe ne répond pas spontanément, c'est le signal. La valeur d'un Sprint Goal n'est pas dans son atteinte, elle est dans la tension qu'il crée entre ce que l'équipe peut faire et ce que le client attend vraiment. Quand cette tension disparaît, le goal mesure la conformité à l'IA, pas la valeur."
    douleur_terrain: "Le SM voit 100% d'atteinte et hésite à sonner l'alarme. La réussite visible le paralyse. Il ne sait pas distinguer l'équipe performante de l'équipe qui a optimisé le mauvais indicateur."
    source_expert: "Jeff Sutherland : le Sprint Goal est le pilier Inspection de l'empirisme Scrum. Si l'IA calibre le goal pour qu'il soit atteignable plutot qu'ambitieux, on a casse l'inspection. L'équipe inspecte sa conformité à l'IA, pas sa valeur livrée."
    page: 357
    extrait: null
    fiche_liee: "FP-P5-CH17"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: "Ajouter paragraphe p.357 section 2 apres le tableau de traduction, avant l'encadre En pratique KPI taux de revision"
    schemas_lies: []

  - id: "P5-CH17-DC-04"
    cible: DECIDEUR
    role: DC
    expert: MIKE_COHN
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "J'autorise mes managers à rédiger des IA policies locales en attendant notre politique d'entreprise. Quand la politique globale arrivera, est-ce que les policies locales deviennent obsolètes ou est-ce qu'elles restent utiles ?"
    reponse: "Les policies locales ne deviennent pas obsolètes. Elles se recentrent. La politique d'entreprise prend en charge le périmètre global (outils autorisés au niveau du SI), la conformité légale (RGPD, contrats fournisseurs IA, assurances) et les standards de sécurité. La policy locale conserve la traçabilité, la responsabilité au niveau équipe, et le rythme de révision en rétrospective. En pratique, les décisions prises localement sur 6 mois donnent à la DSI des données terrain pour construire la politique globale. Une policy locale bien construite est un sous-ensemble de la politique d'entreprise, pas un doublon."
    douleur_terrain: "Le DSI hésite à lancer les policies locales parce qu'il craint de créer un bazar qu'il devra défaire. La réalité est inverse : les policies locales réduisent le risque pendant la période d'attente et alimentent la réflexion sur la politique globale."
    source_expert: "Mike Cohn : principe de subsidiarité agile. Les décisions se prennent au niveau le plus bas qui a l'information. La policy locale couvre ce que l'équipe contrôle. La politique d'entreprise couvre ce qui dépasse l'équipe."
    page: 362
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DC, MG]
    statut_reponse: confirmee
    action_recommandee: "Ajouter paragraphe p.362 section 5 apres le paragraphe sur la difference policy/accord d'equipe IA chapitre 16, avant saut vers section 6"
