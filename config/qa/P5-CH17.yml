  # ── SM ──────────────────────────────────────────────────────

  - id: "P5-CH17-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Mon manager regarde le tableau de bord depuis que l'équipe utilise l'IA : tout est vert, il est satisfait. Moi je vois des signaux qui ne remontent pas dans les métriques. Comment je lui amène ça sans passer pour quelqu'un qui sabote la bonne nouvelle ?"
    reponse: "Les métriques classiques ont un lag de 2 à 4 sprints. Avec l'IA ce lag est plus court et plus dangereux : une équipe peut livrer parfaitement 6 sprints et s'effondrer au sprint 7 non pas parce qu'un problème est apparu, mais parce qu'un problème s'est accumulé. Prépare un point mensuel de 15 minutes hors cérémonie avec ton manager : apporte-lui ce que les chiffres ne montrent pas encore. C'est toi qui ouvres la porte."
    douleur_terrain: "Le SM voit le silence en Review, les rétros sans tension, les questions techniques qui disparaissent. Le manager voit une vélocité en hausse et un CFR stable. Ces deux lectures coexistent et c'est le SM qui doit réconcilier les deux sans casser la confiance."
    source_expert: null
    page: 360
    extrait: null
    fiche_liee: "FP-P5-CH17"
    fiche_destinee_a: [SM]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH17-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "Vélocité en hausse, questions en Daily qui disparaissent. Est-ce un progrès ou un signal d'alarme, et comment je fais la différence en Sprint ?"
    reponse: "Vélocité en hausse + diminution des questions en Daily = risque de perte d'alignement, pas de progrès. Poser cette question à un membre de l'équipe cette semaine : 'Est-ce que tu comprends vraiment ce que tu as livré lors du dernier sprint ?' La réponse dira plus que n'importe quel tableau de bord."
    douleur_terrain: "Le SM confond silence et maturité. Une équipe qui ne questionne plus n'est pas une équipe efficace : c'est une équipe qui a décroché mentalement de ce qu'elle livre."
    source_expert: null
    page: 361
    extrait: null
    fiche_liee: "FP-P5-CH17"
    fiche_destinee_a: [SM]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH17-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Je suis SM et je lis ce chapitre pour préparer une conversation avec mon manager sur les signaux de burnout IA. Comment je lui amène ces signaux sans qu'il les perçoive comme une critique de son pilotage ?"
    reponse: "Les mêmes signaux s'appliquent au SM qu'au manager. Apporte-les toi-même à la table, ne les attends pas. Formuler les signaux comme des observations terrain, pas comme des critiques de la méthode de pilotage : 'Voici ce que j'observe depuis 3 sprints. Je veux qu'on en parle avant que ça devienne structurel.'"
    douleur_terrain: "Le SM hésite à remonter des signaux négatifs à son manager quand les métriques sont vertes. Il craint d'être perçu comme un frein ou comme quelqu'un qui invente des problèmes."
    source_expert: null
    page: 360
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
    statut_reponse: provisoire
    action_recommandee: null
