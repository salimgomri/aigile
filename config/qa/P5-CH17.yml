  # ── DEV ─────────────────────────────────────────────────────

  - id: "P5-CH17-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, pourquoi, quand, valeur]
    question: "En tant que dev, le taux de révision de mes outputs IA tombe à zéro parce que je fais confiance aux suggestions. Mon manager voit ça comme de l'efficacité. Pourquoi est-ce un signal d'alarme et qui doit le nommer ?"
    reponse: "Un taux de révision proche de 0% est un signal d'alarme : soit le prompt est parfait (rare), soit l'équipe ne relit plus. Le KPI managérial IA est précisément ce ratio : combien de propositions IA ont été modifiées avant intégration vs acceptées telles quelles. C'est le SM qui doit nommer ce signal au manager, mais c'est le dev qui en porte les conséquences en production."
    douleur_terrain: "Le dev adopte le mode 'accepter tout' parce que ça va plus vite et que personne ne lui demande de réviser. La dette cognitive s'accumule silencieusement."
    source_expert: null
    page: 357
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV, SM]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  # ── CA ──────────────────────────────────────────────────────

  - id: "P5-CH17-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Je coache un manager qui se félicite des métriques IA de son équipe. La table de traduction SM/Manager du chapitre 14 ne suffit plus. Quelle nouvelle lecture dois-je lui apprendre à faire, et comment je structure cette conversation de coaching ?"
    reponse: "La table de traduction doit être mise à jour pour l'ère IA. Le même chiffre ne dit plus la même chose : vélocité +30% ne signifie pas que l'équipe comprend ce qu'elle livre. CFR stable peut masquer une dégradation relative si le nombre de déploiements a aussi augmenté. Le coach structure la conversation autour de 3 questions : 'Qu'est-ce que ce chiffre ne mesure pas ?' + 'Quel signal humain est-il associé ?' + 'Quel serait le signe avant-coureur d'un problème dans 2 trimestres ?'"
    douleur_terrain: "Le manager agile formé avant l'IA a des réflexes de lecture des métriques qui ne sont plus valides. Le coach doit désapprendre avant de réapprendre."
    source_expert: null
    page: 356
    extrait: null
    fiche_liee: "FP-P5-CH17"
    fiche_destinee_a: [CA, MG]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  # ── MG ──────────────────────────────────────────────────────

  - id: "P5-CH17-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Ma direction me dit que l'IA multiplie la capacité de l'équipe et que je peux donc doubler les objectifs du trimestre. Comment je réponds sans passer pour quelqu'un qui freine la transformation IA, et quels arguments concrets je prépare avant cette réunion ?"
    reponse: "L'IA accélère certaines tâches mécaniques, répétitives, à faible incertitude. Elle n'accélère pas le jugement, la compréhension des besoins clients, la résolution de problèmes complexes, la construction de la confiance. Or c'est précisément sur ces dimensions non-mécaniques que la valeur business est créée. Script : 'L'IA accélère une partie significative de nos tâches mécaniques. Le pourcentage restant pour la compréhension client, décisions d'architecture, résolution de conflits : prend le même temps. Augmenter le volume sans augmenter la capacité humaine ne ferait qu'accélérer les erreurs.'"
    douleur_terrain: "Le manager agile est coincé entre une direction qui voit l'IA comme un multiplicateur de capacité et une équipe qui signale une surcharge cognitive. Il doit tenir les deux bouts sans capituler sur aucun."
    source_expert: null
    page: 358
    extrait: null
    fiche_liee: "FP-V-17.4"
    fiche_destinee_a: [MG]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH17-MG-02"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "Mon Happiness Index est à 3.8/5 de moyenne. Ma direction dit que l'équipe est en bonne forme. Moi je ne suis pas sûr. Comment je lis ce chiffre autrement à l'ère de l'IA ?"
    reponse: "Regarder les scores individuels, pas la moyenne. Une moyenne 3.8 peut cacher un senior à 2 et trois juniors à 4.5. A l'ère de l'IA, le Happiness Index homogène (scores tous proches) est lui-même un signal : possible conformisme déclaré. L'équipe répond ce qu'elle pense qu'on veut entendre. Le départ soudain d'un senior sans signal préalable est le signal le plus coûteux et le moins anticipé."
    douleur_terrain: "Le manager utilise la moyenne pour rassurer sa direction. Mais la moyenne efface exactement les cas critiques qu'il devrait détecter."
    source_expert: null
    page: 357
    extrait: null
    fiche_liee: "FP-P5-CH17"
    fiche_destinee_a: [MG]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH17-MG-03"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Je n'ai pas de politique IA dans mon équipe. Ma direction n'a rien décidé. Est-ce que j'attends ou est-ce que je prends l'initiative, et si oui comment ?"
    reponse: "Prendre l'initiative sans attendre la DSI. Une IA policy locale se rédige en 30 minutes : une politique d'équipe, pas d'entreprise. 6 rubriques : Périmètre (outils autorisés), Traçabilité (comment signaler un output IA intégré), Responsabilité (qui valide, qui est accountable en prod), Confidentialité (données hors prompt : noms clients, infos financières, code sous NDA), Révision (toutes les 2 rétros), Format (1 page A4, affiché, signé collectivement). L'absence de cadre ne protège pas le manager, elle l'expose."
    douleur_terrain: "Le manager attend une décision d'entreprise qui ne vient pas. Entre-temps son équipe utilise l'IA sans règle du jeu, et c'est lui qui répond si un output IA introduit une erreur en production."
    source_expert: null
    page: 361
    extrait: null
    fiche_liee: "FP-P5-CH17"
    fiche_destinee_a: [MG]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH17-MG-04"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "Ma direction demande des données sur la productivité IA. J'ai les chiffres. Comment je les présente de façon honnête sans sous-vendre ce qu'on a accompli et sans sur-promettre sur ce que l'IA va faire ?"
    reponse: "Présenter les données factuelles : +30% vélocité, CFR stable, Lead Time en baisse. Puis ouvrir immédiatement la question de ce que ces données ne montrent pas encore : l'impact sur la qualité des décisions techniques dans 2 trimestres. Si la direction perçoit la question retournée comme une esquive, reformuler : 'Je vous propose qu'on définisse ensemble les indicateurs de qualité technique qu'on veut suivre sur les 2 prochains trimestres. J'ai une première ébauche.' Arriver préparé."
    douleur_terrain: "Le manager a des bonnes nouvelles à annoncer mais sait qu'elles sont incomplètes. Il craint que parler des limites des données soit perçu comme de la modestie mal placée."
    source_expert: null
    page: 359
    extrait: null
    fiche_liee: "FP-V-17.4 / FP-V-17.5"
    fiche_destinee_a: [MG]
    statut_reponse: provisoire
    action_recommandee: null
    schemas_lies: []

  - id: "P5-CH17-MG-05"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Je détecte des signaux de burnout IA dans mon équipe. Quelle est la différence avec le burnout classique du chapitre 6, comment je réagis, et avec qui ?"
    reponse: "Le burnout IA coexiste avec une productivité élevée : c'est ce qui le rend invisible. L'équipe livre beaucoup mais ses membres ont mentalement décroché de ce qu'ils livrent. 5 signaux spécifiques IA : silence en Sprint Review, rétros sans tension, Happiness Index homogène, questions techniques rarissimes, turnover soudain d'un senior sans signal préalable. La correction ne se fait pas en rétrospective. Elle se fait en tête-à-tête : avec le senior qui s'est tu, avec le dev dont le Happiness Index est en dessous de la moyenne depuis 3 sprints."
    douleur_terrain: "Le manager confond productivité et santé d'équipe. Une équipe en burnout IA peut avoir un tableau de bord vert pendant 6 sprints et s'effondrer au sprint 7."
    source_expert: null
    page: 359
    extrait: null
    fiche_liee: "FP-P5-CH17"
