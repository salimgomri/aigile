  # ── DC ──────────────────────────────────────────────────────

  - id: "P5-CH17-DC-01"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "J'évalue mes managers sur leur posture IA. Quels signaux concrets me permettent de savoir si un manager pilote réellement l'IA ou s'il se contente de lire les métriques vertes ?"
    reponse: "3 indicateurs de gouvernance locale active : (1) l'IA policy one-pager existe, a été partagé et révisé au moins une fois, (2) le manager a mené un tête-à-tête individuel avec chaque senior de son équipe sur la perception de leur rôle à l'ère de l'IA, (3) le ratio DF/CFR est suivi : si le CFR augmente plus vite que la DF, c'est une alerte qualité. Le mode de vérification du deuxième indicateur : une question directe en entretien trimestriel manager/DSI suffit. La réponse ne va pas dans un dashboard. Elle s'entend."
    douleur_terrain: "Le DSI voit les tableaux de bord verts et ne sait pas si c'est le reflet d'une vraie maîtrise IA ou d'un optimisme de présentation. Il n'a pas de grille pour distinguer les deux."
    source_expert: null
    page: 364
    extrait: null
    fiche_liee: "FP-V-17.5"
    fiche_destinee_a: [DC]
    statut_reponse: provisoire
    action_recommandee: null
