      - id: "P5-CH18-DC-03"
        cible: DECIDEUR
        role: DC
        expert: null
        dimensions: [qui, quoi, comment, pourquoi, quand]
        question: "Si 2 des 4 fondations pré-déploiement IA manquent dans mon organisation, quelle est la décision à prendre et pourquoi déployer quand même est une erreur stratégique ?"
        reponse: "Différer l'outillage. Déployer avant les fondations revient à accélérer dans la mauvaise direction. Les 4 questions de la checklist : (1) tes équipes savent-elles ce qu'elles construisent ? (2) les rôles IA sont-ils clairs dans la pratique ? (3) sais-tu qui est accountable de la gouvernance des données IA ? (4) l'apprentissage est-il tracé ? 2 non ou plus : différer."
        douleur_terrain: "Le dirigeant pense que les fondations se construiront en parallèle du déploiement. Six mois plus tard les pratiques sont incohérentes, certains managers doutent du ROI, et les fondations ne sont toujours pas là."
        source_expert: null
        page: 362
        extrait: "Si 2 réponses ou plus sont non, différez l'outillage."
        fiche_liee: "FP-V-18.1"
        fiche_destinee_a: [DC, MG]
