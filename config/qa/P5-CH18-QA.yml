      - id: "P5-CH18-MG-01"
        cible: MANAGER
        role: MG
        expert: null
        dimensions: [qui, quoi, comment, pourquoi, valeur]
        question: "Comment je sais si mon équipe adopte vraiment l'IA ou fait semblant, quels indicateurs je regarde, et à quelle fréquence ?"
        reponse: "4 KPIs du chapitre : (1) ratio DF/CFR, si le CFR monte plus vite que la DF c'est une alerte qualité. (2) Ratio stories solo vs collaboration : asymétrie à 60 % du code sur 3 sprints = signal. (3) Taux de discussion réelle en Sprint Planning, cible supérieure à 50 %. (4) Tête-à-tête senior : au moins 1 par trimestre sur la perception du rôle à l'ère de l'IA."
        douleur_terrain: "Le manager reçoit des tableaux de bord d'adoption positifs mais le CFR augmente. Il ne sait pas si c'est l'IA qui dégrade la qualité ou un autre facteur."
        source_expert: null
        page: 358
        extrait: null
        fiche_liee: "FP-V-18.1"
        fiche_destinee_a: [MG]
        schemas_lies: []
