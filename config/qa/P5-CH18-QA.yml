    questions:

      - id: "P5-CH18-SM-01"
        cible: PRATICIEN_AGILE
        role: SM
        expert: null
        dimensions: [qui, quoi, pourquoi, quand, valeur]
        question: "Le déploiement IA dans mon organisation change quoi dans mes cérémonies, quand est-ce que je dois agir, et comment je mesure si ça dérape ?"
        reponse: "L'IA révèle ce qui était déjà défaillant. Si le Sprint Planning était passif avant, il devient encore plus passif avec l'IA. Le SM surveille le taux de discussion réelle : cible supérieure à 50 % vs validation passive d'outputs IA. Signal d'alarme : en dessous de 50 % deux sprints de suite."
        douleur_terrain: "Le SM voit ses cérémonies se vider de substance quand l'équipe valide les outputs IA sans les challenger. Personne ne le nomme parce que la production a l'air d'augmenter."
        source_expert: null
        page: 357
        extrait: null
        fiche_liee: "FP-V-18.1"
        fiche_destinee_a: [SM]
        schemas_lies: []
        statut_reponse: provisoire
        action_recommandee: null

      - id: "P5-CH18-SM-02"
        cible: PRATICIEN_AGILE
        role: SM
        expert: null
        dimensions: [qui, quoi, comment, pourquoi, valeur]
        question: "Comment je détecte un résistant silencieux à l'IA dans mon équipe avant que ça devienne un problème de livraison visible, et quelle action je prends en premier ?"
        reponse: "Ratio de stories complétées en solo vs en collaboration : si un seul dev pousse 60 % du code du sprint sur 3 sprints consécutifs, l'asymétrie d'adoption est probable. Ce signal est visible depuis l'outil de suivi sans accès aux cérémonies. Première action : tête-à-tête individuel, une seule question d'ouverture."
        douleur_terrain: "Le SM voit une adoption IA déclarée en réunion mais aucun changement de pratique réel. Il ne peut pas objectiver la résistance silencieuse et se retrouve à gérer une crise 3 mois plus tard."
        source_expert: null
        page: 358
        extrait: null
        fiche_liee: "FP-V-18.3"
        fiche_destinee_a: [SM, MG]
        schemas_lies: []
        statut_reponse: provisoire
        action_recommandee: null

      - id: "P5-CH18-DEV-01"
        cible: PRATICIEN_AGILE
        role: DEV
        expert: null
        dimensions: [qui, quoi, pourquoi, valeur]
        question: "L'IA va-t-elle rendre ma valeur de dev invisible ou la révéler, et comment je sais de quel côté je suis ?"
        reponse: "Le chapitre l'illustre depuis le terrain bancaire : les devs qui comprenaient vraiment l'intention métier derrière leurs tickets ont vu leur valeur exploser avec l'IA. Ceux qui exécutaient mécaniquement ont eu peur. La question n'est pas l'outil, c'est ce que tu apportes au-delà de l'exécution. Si tu sais pourquoi tu codes ce que tu codes, l'IA te libère du comment."
        douleur_terrain: "Le dev senior fait le même travail depuis 5 ans. Avec l'IA, la partie mécanique de son travail disparaît. Il ne sait pas ce qui reste de précieux dans ce qu'il fait."
        source_expert: null
        page: 363
        extrait: null
        fiche_liee: null
        fiche_destinee_a: [DEV]
        schemas_lies: []
        statut_reponse: provisoire
        action_recommandee: null

      - id: "P5-CH18-PO-01"
        cible: PRATICIEN_AGILE
        role: PO
        expert: null
        dimensions: [qui, quoi, pourquoi, valeur]
        question: "La fondation Clarté du chapitre 18 me concerne-t-elle directement en tant que PO, et qu'est-ce que ça change concrètement si elle manque quand l'IA arrive ?"
        reponse: "Oui, directement. Clarté signifie que les équipes savent ce qu'elles produisent et pourquoi. C'est l'accountability du PO sur la direction produit. Sans vision produit explicite, l'IA accélère la production de la mauvaise chose. Le PO sans Sprint Goal clair aggrave l'effet avec l'IA : plus vite dans la mauvaise direction."
        douleur_terrain: "Le PO pense que la fondation Clarté est un problème de management ou de SM. Il découvre 3 sprints après le déploiement IA que son backlog flou a généré deux fois plus de features inutiles."
        source_expert: null
        page: 360
        extrait: "Sans clarté, l'IA accélère la production de la mauvaise chose."
        fiche_liee: "FP-V-18.1"
        fiche_destinee_a: [PO]
        schemas_lies: []
        statut_reponse: provisoire
        action_recommandee: null

      - id: "P5-CH18-CA-01"
        cible: PRATICIEN_AGILE
        role: CA
        expert: null
        dimensions: [qui, quoi, comment, pourquoi, valeur]
        question: "Comment j'aide un dirigeant à comprendre pourquoi son annonce IA n'a pas suffi, sans qu'il prenne ça comme une critique de sa décision ?"
        reponse: "Bridges : le changement est l'événement externe (l'outil qui arrive), la transition est le processus interne par lequel les équipes lâchent leurs anciens repères. Annoncer le changement prend une heure. La transition prend des mois. Le Coach nomme la distinction changement/transition dès le premier échange avec le dirigeant, avant que la résistance ne soit interprétée comme un échec."
        douleur_terrain: "Le Coach est appelé 3 mois après le déploiement quand la résistance est déjà installée et que le dirigeant cherche qui a échoué. Il doit recentrer sans accabler."
        source_expert: "William Bridges, Transitions: Making Sense of Life's Changes. Changement = événement externe. Transition = processus interne par lequel les équipes lâchent leurs anciens repères."
        page: 363
        extrait: null
        fiche_liee: "FP-V-18.3"
        fiche_destinee_a: [CA]
        schemas_lies: []
        statut_reponse: provisoire
        action_recommandee: null

      - id: "P5-CH18-CA-02"
        cible: PRATICIEN_AGILE
        role: CA
        expert: null
        dimensions: [qui, quoi, comment, quand, valeur]
        question: "Quelle question je pose à un résistant silencieux à l'IA pour ouvrir la résistance sans la confronter, et à quel moment je la pose ?"
        reponse: "Question terrain du chapitre : 'Qu'est-ce qui te freinerait pour utiliser l'IA sur ta prochaine tâche ?' Cette formulation nomme le frein avant de le corriger. Elle invite sans confronter. Elle se pose en tête-à-tête individuel, pas en réunion, pas après un incident."
        douleur_terrain: "Le Coach organise des formations de masse sur l'IA. Les résistants silencieux assistent, hochent la tête, et ne changent rien. La communication de masse ne fonctionne pas sur ce profil."
        source_expert: null
        page: 364
        extrait: "Cette question ouvre la résistance sans la confronter. Elle nomme le frein avant que tu le corriges."
        fiche_liee: "FP-V-18.3"
        fiche_destinee_a: [CA, SM]
        schemas_lies: []
        statut_reponse: provisoire
