      - id: "P5-CH18-MG-02"
        cible: MANAGER
        role: MG
        expert: null
        dimensions: [qui, quoi, comment, pourquoi, quand]
        question: "Je dois construire une IA policy pour mon équipe : je la fais seul, avec l'équipe, ou dans quel ordre, et quelle est la condition pour qu'elle soit réellement appliquée ?"
        reponse: "Rédiger en solo d'abord pour poser le cadre, puis soumettre à l'équipe en rétrospective pour amendements. 30 minutes en équipe suffisent. L'important est le débat, pas la perfection. La condition d'application : elle est discutée, pas décrétée. Une policy non discutée n'est pas appliquée. Une policy trop longue n'est pas lue."
        douleur_terrain: "Le manager publie une IA policy rédigée seul ou par la DSI. Personne ne la lit. 2 mois plus tard, les pratiques sont incohérentes et personne ne sait que la policy existe."
        source_expert: null
        page: 357
        extrait: "Une policy non discutée n'est pas appliquée. Une policy trop longue n'est pas lue."
        fiche_liee: "FP-V-18.2"
        fiche_destinee_a: [MG, SM]
        schemas_lies: []
        statut_reponse: provisoire
        action_recommandee: null

      - id: "P5-CH18-DC-01"
        cible: DECIDEUR
        role: DC
        expert: null
        dimensions: [qui, quoi, pourquoi, valeur]
        question: "Quelles sont les 3 décisions IA que je ne peux pas déléguer, pourquoi elles me reviennent à moi personnellement, et qu'est-ce qui se passe si je ne les prends pas ?"
        reponse: "Décision 1 : tracer la ligne IA/humain, ce que l'IA décide seule vs ce qui reste humain. C'est un choix de valeurs, pas un choix technique. Décision 2 : clarifier les rôles IA, quand l'IA produit une erreur client, qui est accountable ? Décision 3 : installer l'apprentissage continu. Pas un projet. Une capacité d'adaptation permanente. Si tu délègues ces 3 décisions : 3 mois plus tard tu as 3 cultures IA dans la même organisation."
        douleur_terrain: "Le DSI délègue la gouvernance IA à la DSI technique ou aux équipes. Il pense avoir traité le sujet. 3 mois plus tard les risques sont invisibles et les équipes ont inventé chacune leurs propres règles."
        source_expert: null
        page: 366
        extrait: null
        fiche_liee: "FP-V-18.2"
        fiche_destinee_a: [DC]
        schemas_lies: []
        statut_reponse: provisoire
        action_recommandee: null

      - id: "P5-CH18-DC-02"
        cible: DECIDEUR
        role: DC
        expert: null
        dimensions: [qui, quoi, pourquoi, valeur]
        question: "1 dirigeant sur 5 a une gouvernance mature des agents IA selon Deloitte 2026. Comment je sais si je suis dans les 20 % ou dans les 80 % ?"
        reponse: "Les 80 % déploient sans avoir défini qui supervise, valide, et répond quand ça se passe mal. Le test : est-ce que tu peux nommer aujourd'hui (1) qui supervise les agents IA en production, (2) qui valide leurs outputs avant impact client, (3) qui répond en cas d'incident IA ? Si une réponse est floue : tu es dans les 80 %."
        douleur_terrain: "Le DSI pense avoir une gouvernance IA parce qu'il a une policy IT générale. La gouvernance des agents IA est un périmètre distinct : supervision continue, validation humaine, accountability en cas d'incident."
        source_expert: "Deloitte, State of AI in the Enterprise — The untapped edge, January 2026"
        page: 366
        extrait: null
        fiche_liee: "FP-V-18.2"
        fiche_destinee_a: [DC]
