  question: Le SM et moi on se marche dessus en permanence sur la gestion des stakeholders, et personne
    ne sait vraiment qui doit gerer quoi. Comment on trace cette frontiere sans que ca devienne une bataille
    de territoire ?
  reponse: Le PO gere la relation valeur, qui veut quoi et pourquoi. Le SM gere la relation process, comment
    ces besoins entrent dans l'equipe sans la destabiliser. Cette frontiere se dessine en 20 minutes,
    en dehors de l'equipe, entre les deux.
  douleur_terrain: Quand PO et SM se marchent dessus sur les stakeholders, c'est en general parce que
    personne n'a jamais pris ces 20 minutes pour clarifier qui fait quoi.
  source_expert: null
