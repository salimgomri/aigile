  question: Le PO ajoute une story en milieu de sprint et l'equipe l'accepte sans discuter, comme d'habitude.
    Quelles questions on devrait se poser collectivement avant d'accepter, et qu'est-ce qui distingue
    une equipe qui questionne d'une equipe qui bloque ?
  reponse: 'Une equipe mature questionne pour comprendre, pas pour bloquer : quelle est la valeur de cette
    story dans le contexte du Sprint Goal, peut-on l''absorber sans compromettre l''engagement, et si
    on allege la DoD, comment on compense sur le sprint suivant.'
  douleur_terrain: L'equipe qui accepte tout sans negocier et qui ferme les yeux sur la DoD pour livrer
    dans les temps croit etre flexible, alors qu'elle abandonne sa co-responsabilite sur le Sprint Goal.
  source_expert: null
