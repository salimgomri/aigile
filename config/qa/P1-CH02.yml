  question: Mon PO me dit qu'il ne peut pas dire non a une demande de la direction sans validation hierarchique.
    Est-ce un probleme de competence chez lui que je dois traiter en coaching, ou autre chose ?
  reponse: 'C''est une alerte organisationnelle : un PO qui ne peut pas dire non sans validation hierarchique
    signale un probleme structurel, pas une competence de role. Le levier du manager est de reconstruire
    explicitement avec le PO son perimetre de decision, par ecrit, avec les parties prenantes en salle,
    comme un accord organisationnel et non un episode de formation.'
  douleur_terrain: Le manager qui envoie son PO en formation priorisation alors que le probleme est un
    perimetre de decision jamais defini va observer zero changement et conclure, a tort, que le PO n'est
    pas a la hauteur.
  source_expert: null
  page: 72
  extrait: 'Alerte organisationnelle : PO ne peut pas dire non sans validation hierarchique = probleme
    structurel, pas de competence de role.'
