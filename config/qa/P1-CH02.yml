  question: Mon SM ne semble jamais 'faire' grand-chose en dehors des ceremonies, et je commence a me
    demander si son temps est bien utilise. Comment je distingue un bon signal d'un mauvais, sans juste
    regarder s'il est en reunion ?
  reponse: 'Un SM qui passe plus de 20% de son temps a faciliter des ceremonies n''exerce probablement
    pas son vrai role : l''essentiel se passe entre les ceremonies, en conversations informelles, resolution
    d''obstacles et travail d''influence sur l''organisation. Demander a voir le journal d''obstacles
    (enleves vs rendus visibles) donne un signal concret de cette activite invisible.'
  douleur_terrain: 'Le manager qui juge la valeur du SM sur sa presence visible en reunion encourage exactement
    le mauvais comportement : un SM qui sur-anime pour se rendre visible au lieu de travailler en arriere-plan
    sur les obstacles reels.'
  source_expert: null
  page: 63
  extrait: Un Scrum Master qui passe plus de 20 % de son temps a faciliter des ceremonies n'est probablement
    pas en train d'exercer son vrai role.
