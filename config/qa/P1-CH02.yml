  question: On me presente le Squad Health Check comme un outil de mesure d'equipe. En tant que decideur,
    est-ce que je peux integrer ses resultats dans un dashboard de pilotage global, ou est-ce que je vais
    casser l'outil en faisant ca ?
  reponse: Le resultat peut s'integrer dans le dashboard manager sous la dimension Maturite equipe du
    cadran RAG, mais a condition de garder la distinction rouge interne (l'equipe peut agir) versus rouge
    externe (l'organisation doit agir, en escalade et non en retro). Le decideur lit le dashboard pour
    reperer les rouges externes recurrents qui appellent une decision de sa part, pas pour classer les
    equipes entre elles.
  douleur_terrain: Le decideur qui demande un classement d'equipes base sur le Squad Health Check provoque,
    en aval, un vote moins sincere et donc un outil moins fiable pour lui-meme.
  source_expert: Kniberg et Sunden 2014
  page: 74
  extrait: Integrez le resultat dans ton dashboard manager (chapitre 8) sous la dimension Maturite equipe
    du cadran RAG.
