  question: Je passe mes journees a recueillir des demandes du metier et a les transcrire en stories pour
    la tech. Est-ce que je suis vraiment PO ou juste un traducteur, et qu'est-ce que ca change concretement
    ?
  reponse: Transmettre sans decider et acheminer sans prioriser, c'est le profil du proxy PO, un intermediaire
    passif. Un vrai PO prend des decisions, dit non, priorise sans consensus permanent et a une vision
    claire articulee de facon comprehensible par l'equipe.
  douleur_terrain: 'Le PO proxy a le titre mais pas le pouvoir : il porte la responsabilite du backlog
    sans avoir l''autorite de le faconner.'
  source_expert: null
  page: 68
  extrait: 'Ce n''est pas un PO. C''est un intermediaire passif : ce que la communaute agile appelle un
    proxy PO : quelqu''un qui transmet sans decider, qui achemine sans prioriser.'
  fiche_liee: FP-P1-CH02-po-proxy-vs-decideur-01
