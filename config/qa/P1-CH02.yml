  question: Le chapitre dit que 65% des organisations consolident ou eliminent les roles agiles specifiques,
    et que 26% des praticiens font moins de coaching framework en migrant vers de l'hybride. Si je suis
    en train de reduire mes postes SM, comment je sais si je suis dans la bonne tendance ou si je suis
    en train de detruire de la valeur que je ne vois pas ?
  reponse: 'Trou : le chapitre donne les deux statistiques structurelles (consolidation des roles, migration
    vers l''hybride) mais ne fournit pas de critere de decision pour le decideur qui doit choisir entre
    reduire un poste SM et investir dans sa montee en impact organisationnel.'
  douleur_terrain: Le decideur lit deux signaux macro qui pointent dans des directions ambivalentes (les
    roles se contractent / les roles montent en strategie) sans avoir de grille pour savoir lequel s'applique
    a sa propre organisation avant de couper un poste.
  source_expert: 18e State of Agile, State of Agile 2025
  page: 62
  extrait: 'Les roles bifurquent : certains montent vers la strategie, d''autres se contractent. Comprendre
    dans quel sens ton role evolue n''est pas optionnel.'
  fiche_liee: null
