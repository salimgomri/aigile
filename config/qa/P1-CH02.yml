  question: Je veux comparer la vitesse de mes equipes pour identifier celle qui a besoin d'aide, mais
    je n'ai aucun outil 'officiel' pour ca dans Scrum. Le Squad Health Check, c'est utilisable pour ce
    genre de comparaison entre equipes ?
  reponse: 'Non : ce qui compte est la tendance de chaque equipe, pas le score absolu ni la comparaison
    entre equipes. Une equipe qui passe de rouge a ambre sur la collaboration en deux sprints est plus
    saine qu''une equipe stable au vert depuis six mois sans mouvement. L''outil est une conversation
    d''equipe, pas un audit comparatif externe.'
  douleur_terrain: Le manager qui transforme le Squad Health Check en classement d'equipes detruit la
    sincerite du vote et la securite psychologique qui permettent au score de signifier quoi que ce soit.
  source_expert: Kniberg et Sunden 2014
  page: 73
  extrait: Ce qui m'interesse n'est pas le score global, ni meme la couleur absolue d'une dimension. C'est
    la tendance.
