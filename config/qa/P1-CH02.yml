  question: Mon manager me reproche de ne pas etre assez visible en reunion. Si je suis sous les 20% de
    temps en facilitation comme le chapitre le recommande, comment je justifie ce temps invisible sans
    donner l'impression de ne rien faire ?
  reponse: 'Tenir un journal d''obstacles hebdomadaire en deux colonnes : obstacles enleves et obstacles
    rendus visibles. Ce journal devient la preuve terrain de la valeur ajoutee, presentable au manager
    en quelques minutes.'
