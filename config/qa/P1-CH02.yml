  question: Apres six mois dans le poste, comment je sais si je remplis vraiment mon role de SM ou si
    je me limite a la facilitation d'equipe sans avoir d'impact plus large ?
  reponse: 'Le SGEP est explicite : le SM est accountable de la qualite de l''adoption Scrum dans toute
    l''organisation, pas seulement dans son equipe. Un SM qui n''a aucun impact au-dela de son equipe
    apres 6 mois n''exerce pas son role complet : il facilite, il n''agit pas.'
  douleur_terrain: Le SM peut tres bien faire son travail d'equipe pendant des annees sans jamais se demander
    si son perimetre d'impact aurait du s'elargir.
  source_expert: SGEP 2026
  page: 67
