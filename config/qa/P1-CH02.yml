  question: Mon CODIR parle de supprimer les postes de SM parce qu'ils ne 'produisent rien de visible'.
    Comment je montre ce que j'ai vraiment debloque ce sprint pour ne pas etre la prochaine ligne coupee
    ?
  reponse: 65% des organisations subissent une pression a la consolidation ou elimination des roles Agile
    specifiques. Le SM qui ne demontre pas de valeur mesurable au-dela de la facilitation est en position
    de vulnerabilite. Le journal d'obstacles (enleves vs rendus visibles) devient la preuve terrain a
    presenter.
  douleur_terrain: Un SM qui ne peut pas montrer ce qu'il a debloque ce sprint est indefendable en CODIR,
    meme s'il fait un excellent travail.
  source_expert: State of Agile 2025
  page: 67
