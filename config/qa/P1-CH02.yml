  question: Chez nous, c'est le lead dev ou l'architecte qui tranche seul les decisions techniques, et
    tout le monde appelle ca de l'auto-organisation. Est-ce que c'est vraiment le cas, et comment je le
    fais remarquer sans froisser personne ?
  reponse: 'Le SGEP est clair : l''equipe Scrum decide collectivement comment elle travaille. Le lead
    dev a de l''influence, pas de l''autorite. Si cette nuance n''est pas tenue, ce n''est pas une equipe
    auto-organisee mais du mini-management technique deguise.'
  douleur_terrain: Le cas du lead dev ou de l'architecte qui decide seul revient souvent et se cache derriere
    le vocabulaire de l'auto-organisation, ce qui rend le probleme invisible meme aux yeux de l'equipe
    concernee.
