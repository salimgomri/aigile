  question: Pendant un audit d'equipe, je vois une dimension du Squad Health Check stable au rouge depuis
    des mois. Avant de pousser un plan de coaching equipe, qu'est-ce que je dois verifier d'abord ?
  reponse: 'Avant de chercher a changer l''equipe sur un rouge stable, regarder deux choses : d''abord
    si ce rouge bouge (tendance), ensuite s''il est lie a une contrainte externe (support de la hierarchie,
    outillage impose, charge de reunions hors-equipe). Ces causes ne se traitent pas en retrospective
    : rouge interne, l''equipe peut agir, rouge externe, l''organisation doit agir en escalade.'
  douleur_terrain: Un coach qui lance un plan de coaching equipe sur un rouge en realite externe va frustrer
    l'equipe en lui demandant de resoudre un probleme qui ne depend pas d'elle.
  source_expert: Kniberg et Sunden 2014
  page: 74
  extrait: 'Distinguez imperativement : rouge interne (l''equipe peut agir) vs rouge externe (l''organisation
    doit agir : traiter en escalade, pas en retro).'
