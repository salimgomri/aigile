  question: On me demande de 'dire non' a des demandes de la direction, mais je suis middle-manager avec
    dix parties prenantes hierarchiques et des contraintes contractuelles que je ne peux pas ignorer.
    Comment je tiens ce role sans m'epuiser sur des conflits que je ne peux pas gagner seul ?
  reponse: Demander a un PO de dire non sans lui donner l'autorite pour le faire, c'est lui demander de
    l'heroisme. Le vrai travail n'est pas de former le PO a mieux prioriser, mais de reconstruire avec
    le management son perimetre de decision, par ecrit, avec les parties prenantes en salle, comme un
    accord organisationnel.
  douleur_terrain: 'Seulement 49% des Product Managers peuvent gerer la chaine de delivery complete et
    mesurer la valeur business/client : l''autre moitie travaille en aveugle, sans donnees, sans autorite
    ou sans outils.'
