  question: J'arrive chez un client ou le SM est techniquement brillant mais n'a aucun poids politique,
    et inversement un autre SM moins rigoureux sur Scrum obtient de meilleurs resultats grace a son reseau.
    Comment j'aide le premier sans lui dire de devenir politique ?
  reponse: 'Naviguer entre l''equipe qui a besoin d''un espace protege et le management qui veut visibilite,
    reporting et garanties, sans devenir l''outil de l''un contre l''autre, est probablement la competence
    la plus difficile du role et la moins enseignee. Les deux dimensions comptent : competences Scrum
    et competences politiques (construire des alliances, lire les dynamiques de pouvoir, influencer sans
    autorite).'
  douleur_terrain: Le coach voit regulierement des SM brillants techniquement echouer par manque de competences
    politiques, et des SM moins rigoureux reussir grace a elles, sans que personne ne nomme cette competence
    manquante comme un axe de coaching legitime.
  source_expert: null
  page: 66
  extrait: J'ai vu des SM brillants techniquement echouer parce qu'ils n'avaient pas les competences politiques
    pour exister dans leur organisation.
