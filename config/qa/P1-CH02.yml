  question: La derniere fois que j'ai souleve un probleme de qualite en plein sprint, on m'a fait sentir
    que je manquais de flexibilite. Pourquoi est-ce que je n'oserai probablement plus le faire, et est-ce
    que c'est moi le probleme ?
  reponse: 'La securite psychologique n''est pas un bonus, c''est le prerequis de l''auto-organisation.
    Sans elle, les Developers font ce qu''on leur dit, et c''est rationnel : un developpeur puni implicitement
    pour avoir dit non n''osera plus soulever le probleme au sprint suivant.'
  douleur_terrain: 'Une equipe qui ne questionne jamais n''est pas fiable, elle est docile : elle livre
    ce qu''on lui demande, pas ce dont le produit a besoin.'
