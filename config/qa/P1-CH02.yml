  question: Quelqu'un me demande quel est mon Product Goal et comment on mesure qu'on l'a atteint. Si
    je ne peux pas repondre en moins de 30 secondes sans dire 'ca depend', qu'est-ce que ca signifie pour
    mon equipe ?
  reponse: 'Si la reponse prend plus de 30 secondes ou commence par ''ca depend'', le Product Goal n''est
    pas clair et l''equipe travaille sans boussole strategique. Un Product Goal bien formule tient en
    2-3 phrases : qui beneficie, de quoi, pour quel resultat mesurable.'
  douleur_terrain: Le PO peut prioriser un backlog entier sans jamais avoir formule une destination claire,
    et personne ne s'en rend compte jusqu'a ce qu'on lui pose la question.
  source_expert: null
