  question: Le Scrum Guide 2020 a remplace 'equipe de developpement' par 'Developers'. En quoi ca change
    concretement ma place si je ne suis pas codeur (testeur, UX, analyste) ?
  reponse: 'Le changement de terminologie reflete une realite importante : Developers designe toutes les
    personnes qui travaillent a la creation de l''increment, testeurs, UX designers, analystes, ingenieurs.
    Cette terminologie ouvre la porte a une equipe pluridisciplinaire sans hierarchie implicite entre
    les metiers.'
  douleur_terrain: Dans beaucoup d'equipes, les non-codeurs restent percus comme des supports peripheriques
    alors que le SGEP les place co-responsables du Sprint Goal au meme titre que les ingenieurs.
