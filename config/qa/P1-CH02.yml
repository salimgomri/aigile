  question: J'ai un sponsor qui me presente une transformation agile reussie sur la base de la vitesse
    de livraison des equipes. Quel test simple je peux poser pour verifier si les PO ont vraiment l'autorite
    que ca suppose ?
  reponse: 'Le test d''autorite PO : demander au PO s''il peut refuser une user story demandee par la
    direction. Si la reponse est non, le PO n''a pas le perimetre de decision reel, et c''est un probleme
    organisationnel a nommer, pas une question de competence individuelle a corriger.'
  douleur_terrain: Un decideur qui valide une transformation sur la vitesse seule peut financer pendant
    des annees une organisation ou les PO restent des proxys, sans jamais avoir pose la question qui aurait
    revele le probleme.
  source_expert: null
