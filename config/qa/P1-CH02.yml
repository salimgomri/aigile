  question: Pendant une retro, l'equipe touche enfin un sujet sensible et j'ai le reflexe de dire 'je
    sens qu'on est sur quelque chose d'important, on continue ?'. Pourquoi cette phrase est un probleme
    et qu'est-ce que je dis a la place ?
  reponse: 'Cette phrase contient un biais : le SM seme son ressenti avant que l''equipe ait decide quoi
    que ce soit, et oriente deja la reponse. La phrase neutre est : ''Voulez-vous continuer cette discussion
    ou passer au prochain sujet ?'' Pas de couleur, pas de jugement, l''equipe arbitre seule.'
  douleur_terrain: Un SM junior croit laisser le choix a l'equipe alors qu'il vient de le faire a sa place
    avec un seul mot charge.
  source_expert: null
  page: 64
  extrait: 'La phrase neutre, celle qui laisse vraiment l''equipe decider, est beaucoup plus simple :
    Voulez-vous continuer cette discussion ou passer au prochain sujet ?'
  fiche_liee: FP-P1-CH02-phrases-neutres-retro-01
