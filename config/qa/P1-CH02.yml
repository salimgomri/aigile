  question: En retro, je dois gerer le temps sans casser l'ambiance. Concretement, comment je fais le
    decompte sans que ca devienne flicage, et a quel moment precis je coupe quelqu'un qui parle ?
  reponse: 'Le SM garde le timer pour lui. Ce que l''equipe voit : des pancartes de couleur (verte, orange,
    rouge), visibles de loin et sans bruit, decompte silencieux. Le SM coupe uniquement quand la personne
    a fini de parler, jamais a mi-phrase.'
  douleur_terrain: Couper quelqu'un a mi-phrase detruit en quelques secondes la securite psychologique
    que l'equipe a mis du temps a construire.
  source_expert: null
