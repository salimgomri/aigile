  - id: "P5-CH19-PO-02"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    question: "Je veux utiliser l'IA pour analyser le feedback des parties prenantes et prioriser mon backlog plus vite. Quelles sont les limites que l'IA ne voit pas, comment je construis un prompt qui garde le contrôle de la décision côté humain, et quelle valeur je perds si je délègue trop ?"
    reponse: "Le chapitre pose la règle des 5 composantes du prompt professionnel (Rôle, Contexte, Tâche, Format, Validation). La composante Validation est le garde-fou humain : 'Je relirai cet output à la lumière de ce que je sais de l'équipe. Ce plan est un point de départ.' Pour le PO, la priorisation basée sur l'analyse IA reste une proposition. La décision de priorisation intègre des dimensions que l'IA ne voit pas : tension stakeholders, dette relationnelle, contexte politique."
    douleur_terrain: "Le PO utilise l'IA pour aller plus vite mais n'a pas formalisé où s'arrête l'IA et où commence son jugement."
