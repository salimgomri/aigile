    role: DC
    expert: "Deloitte State of AI 2026"
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "J'ai déployé l'IA dans 4 départements ce trimestre. Je vois des gains de productivité mais aussi des tensions et des incidents que je n'anticipe pas. Comment je sais si mes fondations IA sont solides ou fragiles, qui me donne ce diagnostic, et qu'est-ce que je dois décider en priorité ?"
    reponse: "Le chapitre répond directement. Le IA Readiness Check : 4 fondations (Clarté, Rôles, Gouvernance, Apprentissage), score 1 à 4 par fondation. Score 4-8 : fondations insuffisantes, commencer par la fondation à 1. Score 9-12 : déploiement progressif, commencer par les équipes les plus matures. Score 13-16 : accélérer. Ce que le chapitre ajoute : un total hétérogène (4+4+1+1) n'est pas le même qu'un 10 homogène (3+2+3+2). Toujours commencer par la fondation à 1. Référence : Deloitte State of AI 2026, seulement 1 dirigeant sur 5 dispose d'un modèle mature de gouvernance des agents IA autonomes."
    douleur_terrain: "Le décideur n'a pas de référentiel pour évaluer sa maturité IA. Il pilote à la vélocité et aux incidents. Les deux signaux sont en retard."
