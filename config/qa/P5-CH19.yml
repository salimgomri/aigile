  - id: "P5-CH19-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [quoi, comment, pourquoi, quand, valeur]
    question: "J'ai toujours préparé mes rétros, mes reviews et mes rapports manuellement. Avec l'IA je peux récupérer 5 à 6 heures par sprint. Vers quoi est-ce que je déplace ce temps, comment je le justifie à mon organisation, et quelle valeur concrète je produis qui ne produisais pas avant ?"
    reponse: "Le chapitre distingue heures récupérées et heures déplacées. Ce bloc de 5-8h par sprint descend à 1h30-2h avec une pratique AIgile structurée. Ces heures ne sont pas libérées : elles sont déplacées vers le travail relationnel, la lecture de la dynamique d'équipe, la détection des signaux faibles. Ce que l'IA ne peut pas faire. Valeur concrète : lire le silence d'une Daily, savoir quand un Sprint Goal 'atteint à 90%' cache un accord tacite pour éviter le vrai problème."
    douleur_terrain: "Le SM ressent qu'il 'délègue à l'IA' des tâches qu'il faisait avec soin. Culpabilité ou, à l'inverse, enthousiasme non canalisé qui le déconnecte de l'équipe."
    source_expert: null
    page: 377
    extrait: null
    fiche_liee: "FP-P5-CH19-prompt-02"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: "Tenir un journal des 'actes que seul moi peux faire' sur 3 sprints. Observer si l'IA a augmenté ou réduit ce temps."
    schemas_lies: []

  - id: "P5-CH19-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: "Donald Schon"
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: "Comment je développe concrètement une pratique réflexive sur mon usage de l'IA, qui me challenge si je dérive, et quelle différence ça fait pour mon équipe si je fais ça sérieusement plutôt que juste 'd'utiliser l'IA' ?"
    reponse: "Schön (1983) distingue réflexion-en-action (pendant l'acte) et réflexion-sur-l'action (après). Le SM AIgile observe l'impact de l'IA sur la dynamique de son équipe, ajuste, nomme ce qu'il voit. Ce n'est pas passif. Question réflexive centrale : est-ce que l'outil que j'utilise renforce ou affaiblit l'intelligence collective de mon équipe ? Le protocole de supervision pair à pair (90 minutes) est l'outil proposé pour se challenger sans manager."
    douleur_terrain: "Le SM adopte l'IA par accumulation de pratiques sans jamais évaluer l'impact sur l'équipe. Aucun pair ne lui pose la question difficile."
    source_expert: "Schon, The Reflective Practitioner, 1983"
    page: 369
