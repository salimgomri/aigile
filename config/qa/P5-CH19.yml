  - id: "P5-CH19-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Je livre plus vite avec Cursor mais je comprends de moins en moins l'architecture que je construis. Quand est-ce que ça devient un risque réel, qui est accountable si le code IA génère une erreur que je n'ai pas vue, et comment je justifie de prendre plus de temps sur l'analyse sans perdre ma crédibilité ?"
    reponse: "Le chapitre est direct : quand l'IA génère du code, le goulot n'est plus dans le développement, il est dans l'analyse qui précède. Un développeur qui donne une description vague obtient du code vague : syntaxiquement correct, structurellement cohérent, fonctionnellement à côté. Le rôle bascule : le dev analyse, modélise, challenge la spec, puis pilote l'IA. Ce n'est pas un retour en arrière. Sur la responsabilité : le chapitre 19 (section manager) pose la question explicitement, sans réponse normative. La DoD doit inclure la traçabilité des décisions architecturales."
    douleur_terrain: "Le dev qui va vite avec l'IA est félicité. Celui qui prend du temps pour analyser avant de prompter parait lent. L'organisation récompense le mauvais signal."
