    role: DC
    expert: null
    dimensions: [qui, quoi, pourquoi, quand]
    question: "Je dois décider ce que l'IA peut faire seule dans mon organisation et ce qui reste humain. C'est un choix politique que je ne peux pas déléguer à la DSI. Quels sont les 3 décisions que je ne peux pas déléguer, à qui je les confie pour les opérationnaliser, et quel est le risque si je ne les prends pas avant le prochain trimestre ?"
    reponse: "Le chapitre structure ces 3 décisions non-délégables : Décision 1 (tracer la ligne IA autonome vs humain : choix de valeurs et responsabilité), Décision 2 (clarifier les rôles dans le nouveau contexte : qui est responsable quand l'IA produit une erreur), Décision 3 (installer une culture d'apprentissage continu : le change IA n'est pas un projet, c'est une capacité d'adaptation). Risque de l'absence de décision : 80% des organisations déploient de l'IA agentique sans avoir défini qui supervise, qui valide, qui répond quand quelque chose se passe mal (Deloitte 2026)."
    douleur_terrain: "Le DSI attend une décision de gouvernance que le CODIR n'a pas prise. La DSI déploie avec les mains liées ou prend elle-même des décisions de valeurs qui n'ont pas à lui appartenir."
