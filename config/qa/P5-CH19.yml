  - id: "P5-CH19-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "Mon équipe utilise l'IA partout depuis 3 sprints. La vélocité monte mais les seniors parlent de moins en moins en Planning. Comment je détecte ce signal avant qu'il devienne irréversible, qui doit intervenir, et qu'est-ce que je nomme concrètement en rétro pour que l'équipe comprenne ce qui se passe ?"
    reponse: "Le chapitre nomme ce signal 'décrochage sans le savoir' : Juniors livrent plus vite, comprennent moins. Le SM AIgile observe la dynamique, pas juste la vélocité. L'accord d'équipe IA est l'outil pour nommer ce que personne n'ose : quand signale-t-on l'usage IA, comment on préserve l'alignement collectif en estimation. Ce n'est pas une policy imposée, c'est co-construit par l'équipe. En rétro : poser la question 'Est-ce que notre estimation collective a encore du sens quand l'IA pré-formule nos stories ?'"
    douleur_terrain: "Le SM voit les métriques progresser et ressent une gêne qu'il ne sait pas nommer. L'IA est silencieuse dans les dashboards. Visible à 3 mois."
    source_expert: null
    page: 369
    extrait: null
    fiche_liee: "FP-P5-CH19-checklist-01"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: "Introduire l'accord d'équipe IA dans la prochaine rétro sous forme de 5 questions co-construites."
    schemas_lies: []

  - id: "P5-CH19-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: "L'estimation collective prend 40 minutes et mon manager dit que c'est un gâchis qu'on peut compresser avec l'IA. Comment je lui explique que ces 40 minutes ne sont pas du temps perdu, qui porte cet argument, et quelle valeur mesurable je lui donne pour qu'il ne revienne pas à la charge ?"
    reponse: "Le chapitre est explicite : 40 minutes d'estimation collective, ce n'est pas du gâchis. C'est là que l'équipe s'aligne vraiment, que les malentendus sur la story remontent, que l'intelligence collective se construit. Quand l'IA compresse ce temps à 10 minutes, l'alignement collectif disparait. Le SM protège délibérément cette friction productive. Argument au manager : la vélocité monte à court terme, mais les incidents de compréhension augmentent à 60-90 jours."
    douleur_terrain: "Manager lit 'Planning 10 minutes au lieu de 40' comme un gain d'efficacité. Le SM voit que l'équipe aligne de moins en moins avant de livrer."
    source_expert: null
    page: 369
    extrait: null
    fiche_liee: "FP-P5-CH19-checklist-01"
    fiche_destinee_a: [SM, MG]
    statut_reponse: confirmee
