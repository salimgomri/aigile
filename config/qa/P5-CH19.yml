  - id: "P5-CH19-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand]
    question: "L'IA pré-rédige mes stories maintenant. Mon équipe les accepte sans les challenger comme avant. Qui valide que la story a du sens, à quel moment dans le sprint, et comment je réintroduis le débat sans ralentir la cadence ?"
    reponse: "Le chapitre nomme ce point dans l'accord d'équipe IA : 'L'IA pré-rédige : qui valide ?' C'est une question à trancher collectivement, pas individuellement. La réponse dépend de l'accord d'équipe : le PO garde la responsabilité du 'pourquoi' même si l'IA formule le 'comment'. La DoD peut être réécrite pour inclure une étape de validation humaine des stories pré-rédigées par IA avant qu'elles entrent en sprint."
    douleur_terrain: "Le PO gagne du temps sur la rédaction mais perd la conversation de clarification avec l'équipe. Stories mieux rédigées, moins comprises."
