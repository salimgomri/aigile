  - id: "P5-CH19-DEV-02"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [quoi, comment, pourquoi, valeur]
    question: "Comment je construis un prompt professionnel pour une tâche de développement complexe, quelle composante échoue en premier, et quelle valeur concrète je gagne par rapport à une description vague ?"
    reponse: "Les 5 composantes du prompt professionnel : Rôle (contexte d'expertise à l'IA), Contexte (situation réelle), Tâche (action attendue précisément), Format (cadre le format de l'output), Validation (garde-fou humain). La composante qui échoue en premier : le Contexte. Le dev décrit la feature demandée mais pas les briques impactées, le schéma de données, les effets de bord sur l'architecture existante. L'IA avance quand même. Gain concret : 10 à 15 prompts maîtrisés couvrent la majorité des situations récurrentes."
    douleur_terrain: "Le dev envoie une description fonctionnelle et s'étonne que le code ne s'intègre pas. Il corrige à la main. Il répète. Il ne prompt pas mieux."
    source_expert: null
