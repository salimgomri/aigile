  # ============================================================
  # ROLE : CA / PRATICIEN_AGILE
  # ============================================================

  - id: "P3-CH11-CA-01"
    cible: PRATICIEN_AGILE
    role: CA
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      J'entre dans une mission de coaching. Comment utiliser les 9 patterns pour structurer
      un diagnostic d'equipe en 2 retros observees plutot que de passer 3 mois a tater le terrain ?
    reponse: >
      Les 9 patterns donnent un cadre d'observation immediat. En 2 retros observees, le Coach
      peut identifier le pattern dominant et orienter les 3 premiers mois sur ce pattern precis
      plutot que sur un plan generique. La grille : silence en retro = P1, "pourquoi on fait ca" =
      P2, actions jamais realisees = P3 ou P6, SM qui parle plus que l'equipe = P7, tension visible
      entre membres = P8, bugs recurrents et velocite en baisse = P9. Les patterns sont rarement purs.
      Identifier le pattern primaire et les 1 ou 2 secondaires donne un plan de coaching structure.
    douleur_terrain: >
      Le Coach arrive dans une mission sans grille de diagnostic. Il passe 2 mois en observation
      avant de poser un diagnostic clair. L'organisation perd confiance et le contrat se raccourcit.
    source_expert: null
    page: 248
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P3-CH11-01"]

  - id: "P3-CH11-CA-02"
    cible: PRATICIEN_AGILE
    role: CA
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      La cause racine d'un pattern peut etre organisationnelle (culture manageriale, structure matricielle).
      Comment le Coach distingue ce qu'il peut traiter en retro de ce qui necessite une intervention systemique ?
    reponse: >
      Certains patterns ont une cause organisationnelle. Identifier P1 (securite psychologique basse) est utile.
      Mais si la cause racine est une culture manageriale toxique, le format de retro ne suffira pas.
      Le SM est un miroir, pas un chirurgien. Regle des 3 retros : si le meme pattern revient
      3 sprints consecutifs sans amelioration mesurable, le probleme est dans le contexte organisationnel.
      Le Coach escalade vers le sponsor agile ou les RH. Ce n'est pas un echec. C'est le bon canal.
    douleur_terrain: >
      Le Coach tente de traiter un probleme systemique avec des formats retro. Il s'epuise
      sur des symptomes sans acceder aux causes. L'organisation reste bloquee et le Coach perd sa credibilite.
    source_expert: null
    page: 247
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [CA, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  # ============================================================
  # ROLE : MG / MANAGER
  # ============================================================

  - id: "P3-CH11-MG-01"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      Mon equipe utilise la Retro IA. J'ai envie d'acceder aux donnees pour comprendre
      ce qui se passe vraiment. Est-ce une bonne idee et quel est le risque si je le fais ?
    reponse: >
      Non. Les donnees de retro restent dans l'equipe. Le SM reste proprietaire de son diagnostic.
      Si l'equipe sait que le management accede au verbatim des echanges, la retro devient theatrale
      instantanement. C'est le pattern P6 (Scrum Theatre) introduit par le management lui-meme.
      Ce que le manager peut legitimement recevoir : un signal agrege (pattern detecte, niveau de sante
      d'equipe, tendance sur 3 sprints). Pas le detail des conversations.
      La confidentialite des donnees saisies dans aigile.lu/retro est explicitement posee dans le chapitre.
    douleur_terrain: >
      Le manager bien intentionne demande a voir les retros pour "mieux soutenir l'equipe".
      L'equipe le sait. Elle filtre ce qu'elle dit. La qualite des retros chute. Le manager
      obtient l'inverse de ce qu'il cherchait.
    source_expert: null
    page: 260
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-MG-02"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Mon equipe est en P3 (Impuissance apprise). Ses decisions sont annulees ou ignorees
      depuis des mois. Le probleme vient probablement de moi. Qu'est-ce que ce livre attend de moi
      concretement, pas en theorie ?
    reponse: >
      Le chapitre nomme explicitement cette situation. Un SM qui diagnostique P3 dans ton equipe
      ne te pointe pas du doigt : il te donne l'opportunite d'agir avant que le probleme
      devienne visible par tous. 3 actions concretes attendues : 1) rendre visibles 2 ou 3 decisions
      d'equipe realisees ce sprint, 2) ne pas annuler une decision d'equipe sans explication explicite,
      3) inscrire au moins 1 action d'equipe en backlog avant la fin du sprint suivant.
      Ce ne sont pas des conseils RH. Ce sont les conditions minimales pour que P3 commence a reculer.
    douleur_terrain: >
      Le manager sait que son equipe est demotivee. Il ne fait pas le lien entre ses propres annulations
      de decisions et l'impuissance apprise qu'il observe. La retro seule ne peut pas resoudre ca.
    source_expert: null
    page: 260
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-MG-03"
    cible: MANAGER
    role: MG
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      Mon equipe est en P5 : WIP eleve, Happiness Index en chute, burnout potentiel.
      Quelle est ma responsabilite directe et quel signal me dit que c'est moi la cause racine ?
    reponse: >
      P5 (Surcharge insoutenable) a souvent une cause manageriale directe : la capacite de l'equipe
      est chroniquement sous-estimee ou deliberement ignoree. Le Definition of Done est sacrifie
      sous la pression. La dette technique ou humaine s'accumule en silence jusqu'a l'incident.
      Signal que tu es la cause : l'equipe accepte toutes les demandes sans jamais dire non.
      Ce n'est pas de la bonne volonte. C'est de la peur ou de l'impuissance. Le format Retro Oxygene
      ne resoudra pas ce probleme si tu continues a ajouter de la charge sans discuter de la capacite.
      La retro peut nommer la situation. C'est toi qui dois agir sur la charge.
    douleur_terrain: >
      Le manager voit la velocite baisser et interprete ca comme un probleme de performance d'equipe.
      Il ajoute de la pression. L'equipe s'effondre. Le manager comprend trop tard que c'etait
      un probleme de capacite, pas de competence.
    source_expert: >
      Christina Maslach | Burnout The Cost of Caring | 1981
    page: 252
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  # ============================================================
  # ROLE : DC / DECIDEUR
  # ============================================================

  - id: "P3-CH11-DC-01"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      J'ai investi dans une transformation agile sur 3 equipes depuis 18 mois.
      Comment je sais si les retrospectives produisent quelque chose de reel
      et pas juste du "bien-etre au travail" sans impact mesurable ?
    reponse: >
      Le KPI concret du chapitre : taux de realisation des actions de retro superieur a 70%
      sur 3 sprints glissants. En dessous de ce seuil sur 3 sprints consecutifs : signal a
      investiguer, pas a corriger en retro. C'est un indicateur systeme, pas un indicateur
      de performance individuelle. Deuxieme indicateur : score du questionnaire diagnostic,
      suivi au fil des sprints comme indicateur de sante d'equipe. Si le pattern primaire
      ne change pas apres 6 sprints d'intervention : le probleme est organisationnel,
      pas dans l'equipe.
    douleur_terrain: >
