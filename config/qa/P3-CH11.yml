trous:

  - id: "T01"
    statut: ouvert
    role: SM
    cible: PRATICIEN_AGILE
    question_manquante: >
      Les 3 types d'echecs d'Edmondson (Basic, Complex, Intelligent) sont-ils integres
      dans la Retro IA pour affiner le traitement de P1 ?
    action: >
      Cette taxonomie enrichirait naturellement P1. Enrichissement possible en Retro IA
      ou fiche complementaire. Source : Amy Edmondson | Psychological Safety and Learning
      Behavior in Work Teams | 1999. Texte propose a inserer apres la fiche P1, page 249 :
      "Une precision issue du terrain : tous les silences en retro ne viennent pas de la meme cause.
      Amy Edmondson distingue 3 types d'echecs. Les echecs basiques (non-respect d'une procedure connue),
      les echecs complexes (systeme interdependant qui s'emballe), et les echecs intelligents
      (experimentation a haut risque dans un territoire inconnu). Diagnostiquer P1 sans distinguer
      ces 3 types, c'est risquer d'appliquer la meme solution a des situations qui n'en ont pas
      la meme cause racine. L'outil Retro IA integre cette distinction dans la generation du plan."

  - id: "T02"
    statut: resolu
    role: SM
    cible: PRATICIEN_AGILE
    question_manquante: >
      Le questionnaire parle de 7 questions en certains endroits et de 8 questions dans la
      description principale. Quelle est la vraie valeur et pourquoi ce chiffre varie ?
    action: >
      Incoherence interne a corriger avant impression. Le chapitre indique 8 questions
      dans la section 2 (p.245) et dans les KPIs (p.260). Le sous-titre et le master v3 mentionnaient 7.
      Valeur officielle retenue : 8 questions. Verifier coherence dans tous les textes marketing et la plateforme aigile.lu/retro.

  - id: "T03"
    statut: resolu
    role: MG
    cible: MANAGER
    question_manquante: >
      Comment le manager presente les resultats d'un pattern P5 a sa propre direction
      sans etre percu comme "incapable de gerer son equipe" ?
    action: >
      Angle manquant pour le manager intermediaire. Texte propose a inserer dans la "Note pour les managers" p.260 :
      "Si tu identifies P5 dans ton equipe, la conversation avec ta direction n'est pas
      'mon equipe est epuisee'. C'est 'nous avons accepte plus de charge que notre capacite reelle
      depuis N sprints. Voici les donnees. Voici le cout si on continue. Voici ce qu'on doit
      retirer du backlog pour stabiliser.' C'est une conversation de gestion de capacite,
      pas une discussion RH."

  - id: "T04"
    statut: resolu
    role: CA
    cible: PRATICIEN_AGILE
    question_manquante: >
      Existe-t-il une sequence recommandee pour utiliser les 9 patterns dans une formation
      de SM debutant, ou le chapitre s'adresse-t-il uniquement aux SMs experimentes ?
    action: >
      Le chapitre ne traite pas cet angle. Recommandation : ajouter 1 paragraphe en introduction
      signalant que le questionnaire peut etre utilise par un SM debutant des son premier sprint
      comme grille d'observation, sans necessiter de maitrise de tous les patterns.

