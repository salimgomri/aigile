  - id: "P3-CH11-DC-02"
    cible: DECIDEUR
    role: DC
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, valeur]
    question: >
      Ce chapitre dit que certains patterns ont une cause organisationnelle et que le SM
      ne peut pas les resoudre seul. Qui doit agir et quel est mon role de decideur
      quand la cause racine, c'est la culture managiale de mon organisation ?
    reponse: >
      Le SM est un miroir, pas un chirurgien. Il peut nommer le probleme. Il ne peut pas
      changer une culture manageriale sans ton autorite. Quand le SM escalade apres 3 retros
      sans amelioration (P1, P3, P5 a cause organisationnelle), il remonte vers le sponsor
      agile ou les RH. C'est toi, ou quelqu'un qui te reporte. Ta responsabilite concrete :
      creer les conditions d'un changement reel (autorite donnee aux equipes,
      decisions respectees, capacite protegee) ou accepter que la transformation reste cosmetique.
    douleur_terrain: >
      Le Directeur a mandate une transformation agile. Les SMs facilitent. Les patterns
      persistants reviennent trimestre apres trimestre. Personne n'ose nommer que la cause
      est dans la culture du comite de direction lui-meme.
