  - id: "P3-CH11-SM-01"
    cible: PRATICIEN_AGILE
    role: SM
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Mon equipe manque toujours de souffle en retro. Meme format, memes personnes qui parlent,
      memes non-dits. Comment je detecte AVANT la seance quel dysfonctionnement domine,
      et qui fait ce diagnostic : moi seul ou avec l'equipe ?
    reponse: >
      Le diagnostic est fait par le SM seul, avant la retro, en 3 minutes sur 8 questions.
      Pas l'equipe : parce que le SM observe ce que l'equipe ne dit pas (la personne silencieuse depuis 2 sprints,
      la tension non nommee, la joie forcee au daily). Ce diagnostic est une hypothese de travail,
      pas un verdict. L'equipe peut l'invalider des les premieres minutes. C'est une information,
      pas un echec. L'outil aigile.lu/retro traite les reponses et identifie le pattern primaire parmi les 9 patterns.
    douleur_terrain: >
      Le SM applique le meme format quelle que soit la situation. 4L/1W sur une equipe en impuissance apprise (P3),
      c'est contre-productif. Un format Starfish sur une equipe sans direction (P2) ne produit rien.
    source_expert: >
      Esther Derby & Diana Larsen | Agile Retrospectives Making Good Teams Great | 2006 :
      "Set the Stage before any data gathering."
    page: 245
    extrait: null
    fiche_liee: "FP-III-11.1-diagnostic-retro"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P3-CH11-01"]

  - id: "P3-CH11-SM-02"
    cible: PRATICIEN_AGILE
    role: SM
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Je suis SM depuis 3 ans. Je connais les formats Derby. Pourquoi la structure en 5 phases
      reste incontournable meme quand je change le format selon le pattern detecte ?
    reponse: >
      Les 5 phases Derby (Set the Stage, Gather Data, Generate Insights, Decide What to Do, Close)
      ne sont pas un format. C'est une architecture. Elles definissent l'ordre dans lequel
      une equipe peut entrer dans une conversation difficile, en extraire quelque chose d'utile,
      et en sortir avec un engagement reel. Les 9 patterns changent le contenu de chaque phase,
      pas la structure. Sur P1 (securite basse) : le Set the Stage est anonymise et allonge.
      Sur P5 (surcharge) : le Gather Data porte sur le WIP reel. Sur P6 (Scrum Theatre) :
      le Generate Insights pose la question de l'intention. Le cadre tient. C'est le curseur qui bouge.
    douleur_terrain: >
      Le SM en formation saute le Set the Stage pour "gagner du temps". L'equipe entre dans
      le Gather Data froide, sur la defensive, et produit des donnees de surface.
    source_expert: >
      Esther Derby & Diana Larsen | Agile Retrospectives Making Good Teams Great | 2006
    page: 247
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-SM-03"
    cible: PRATICIEN_AGILE
    role: SM
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      J'ai anime la meme retro sur le meme pattern depuis 3 sprints consecutifs et rien ne change.
      A quel moment est-ce que j'arrete de refaciliter et qu'est-ce que j'escalade, a qui, et comment ?
    reponse: >
      Regle des 3 retros : si le meme pattern revient 3 sprints consecutifs sans amelioration
      mesurable, le probleme n'est pas dans l'equipe, il est dans le contexte organisationnel.
      Ne refacilite pas une 4eme fois. Escale signifie nommer formellement le blocage au manager direct
      de l'equipe, avec donnees et contexte documentes. Si aucun changement apres 2 sprints supplementaires :
      remonte au sponsor agile ou aux RH selon la nature du blocage. Ce n'est pas une defaite pour le SM.
      C'est le bon canal. Le signal d'escalade est simple : 3 sprints sans aucun signal d'amelioration
      pour le pattern detecte.
    douleur_terrain: >
      Le SM refacilite indefiniment en esperant un resultat different. Il epuise son credit
      sans jamais nommer le blocage organisationnel a qui peut agir dessus.
    source_expert: null
    page: 256
    extrait: null
    fiche_liee: "FP-III-11.3-regle-3-retros-escalade"
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-SM-04"
    cible: PRATICIEN_AGILE
    role: SM
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Comment mesurer que ma retro a eu un impact reel sans monter un dashboard de KPIs ?
    reponse: >
      Chaque pattern a un signal d'amelioration concret et observable. P1 : quelqu'un dit
      en retro quelque chose qu'il n'aurait jamais dit 6 mois plus tot. P3 : l'equipe realise
      une action qui touche a quelque chose qu'elle croyait hors de son controle.
      P6 : l'equipe commence a modifier elle-meme le format d'une ceremonie pour qu'elle lui soit utile.
      Ces signaux sont qualitatifs mais observables. Documente-les en 2 lignes apres chaque retro.
      3 sprints sans aucun signal : c'est ton declencheur d'escalade, pas un sujet de reformulation.
    douleur_terrain: >
      Le SM ne sait pas si ses retros ameliorent quoi que ce soit. Il n'a ni signal clair ni seuil de decision.
      Il continue par habitude, pas par conviction.
    source_expert: null
    page: 256
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-SM-05"
    cible: PRATICIEN_AGILE
    role: SM
    expert: ESTHER_DERBY
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Mon equipe cumule plusieurs patterns en meme temps (signe visible de tension + silence + ceremonies inutiles).
      Comment je choisis lequel adresser en retro sans disperser l'energie ?
    reponse: >
      Les patterns sont rarement purs. La majorite des equipes cumulent 2 ou 3 patterns simultanement.
      Regle d'intervention : adresse le pattern primaire en retro. Nomme les patterns secondaires
      comme contexte au management ou dans ton analyse de la situation organisationnelle.
      Tenter d'adresser plusieurs patterns en meme temps dans une seule retro disperse l'energie
      sans produire de changement durable. L'outil aigile.lu/retro identifie le pattern primaire
      et les patterns secondaires a partir des 8 questions.
    douleur_terrain: >
      Le SM detecte plusieurs problemes et veut tout adresser en une heure. La retro part dans tous
      les sens, ne produit rien d'actionnable, et l'equipe ressort plus fatiguee qu'avant.
    source_expert: null
    page: 248
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM, CA]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: ["SVG-P3-CH11-01"]

  - id: "P3-CH11-SM-06"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      P7 me concerne directement : je parle trop en retro. Comment je mesure ca,
      comment je me corriger, et est-ce que je peux le detecter seul ?
    reponse: >
      P7 est le seul pattern difficile a detecter seul. Il faut se faire observer par un pair.
      Signal concret : le SM sort d'une retro de 60 minutes en ayant parle moins de 10 minutes.
      Format recommande : Lean Coffee avec time-boxing strict. Regle du facilitateur :
      une question pour dix mots de l'equipe. Utilise le silence comme outil : attends 7 secondes
      avant de relancer. La cause racine : le facilitateur comble le silence par reflexe,
      empechant l'equipe de trouver ses propres reponses. Il confond son role avec celui d'expert
      et propose des solutions au lieu de poser des questions.
    douleur_terrain: >
      Le SM certifie sort de chaque retro convaincu qu'il a bien facilite. L'equipe, elle, n'a
      rien decide par elle-meme. La retro tourne en monologue ou en debat entre 2 personnes.
    source_expert: null
    page: 253
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-SM-07"
    cible: PRATICIEN_AGILE
    role: SM
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Il y a un conflit ouvert entre 2 membres de mon equipe (P8). Est-ce que je dois
      les faire parler en retro pour "crever l'abces" ou au contraire separer la resolution
      du conflit de la retro collective ?
    reponse: >
      Separe absolument. Si le conflit est entre 2 personnes specifiques : mediation bilaterale
      d'abord, pas en groupe. Le SM n'intervient pas en mediation bilaterale. Il cree les
      conditions de securite en groupe, et escalade vers RH ou coach externe pour la resolution
      du conflit individuel. Pas "si necessaire" : des que le conflit est interpersonnel.
      Les SMs qui essaient d'abord aggravent souvent le probleme en prenant involontairement
      parti. Avant toute intervention, le SM verifie sa propre neutralite. S'il a une relation
      de confiance asymetrique avec l'un des deux membres, il fait appel a un tiers.
    douleur_terrain: >
      Le SM bien intentionne tente une mediation en seance. Un des deux membres se sent expose
      devant le groupe. La tension monte, la confiance dans le SM chute, et le conflit empire.
    source_expert: null
    page: 254
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  # ============================================================
  # ROLE : DEV / PRATICIEN_AGILE
  # ============================================================

  - id: "P3-CH11-DEV-01"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Je me tais en retro parce que la derniere fois que j'ai souleve un probleme, rien n'a change.
      Est-ce que ce pattern est reconnu dans ce livre et est-ce qu'il existe un format retro
      qui peut reellement changer ca ?
    reponse: >
      Oui. C'est le pattern P3 (Impuissance apprise), formalise par Martin Seligman (Helplessness, 1975).
      Tu n'es pas passif : tu as appris que parler ne change rien. C'est la reaction rationnelle
      a un systeme qui ignore les decisions d'equipe. Le format recommande est "What's in our control ?" :
      on separe ce que l'equipe controle completement, ce qu'elle peut influencer, et ce qui lui echappe.
      100% des actions portent sur la premiere colonne. Signal d'amelioration : l'equipe realise
      une action qui touche a quelque chose qu'elle croyait hors de son controle.
    douleur_terrain: >
      Le dev en P3 a propose des ameliorations pendant 6 mois. Aucune n'a ete mise en oeuvre.
      Il a conclu que les retros sont du theatre. C'est le symptome le plus grave d'une equipe en souffrance.
    source_expert: >
      Martin Seligman | Helplessness | 1975
    page: 250
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-DEV-02"
    cible: PRATICIEN_AGILE
    role: DEV
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      La dette technique de mon equipe est invisible pour tout le monde sauf nous.
      La retro peut-elle vraiment servir a la rendre visible et a obtenir du temps pour la resorber ?
    reponse: >
      C'est precisement le pattern P9 (Dette technique cachee). La cause racine : la pression
      du delivery a rendu invisible le cout croissant de la dette. L'equipe n'a pas de langage
      commun avec le management pour parler de qualite. Le format recommande est "Tableau de bord technique" :
      visualiser la dette en mappant les zones du code qui causent le plus d'incidents,
      puis decider collectivement quoi arreter de faire pour avoir le temps de reparer.
      Signal d'amelioration : le PO inclut lui-meme des items de reduction de dette dans le Sprint Backlog
      sans que l'equipe le lui demande.
    douleur_terrain: >
      L'equipe parle de "rembourser la dette" depuis 6 mois sans jamais le faire. La velocite baisse sprint
      apres sprint. Personne n'a les mots pour expliquer pourquoi a quelqu'un qui ne lit pas le code.
    source_expert: null
    page: 255
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [DEV, SM, MG]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  # ============================================================
  # ROLE : PO / PRATICIEN_AGILE
  # ============================================================

  - id: "P3-CH11-PO-01"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Mon equipe n'a pas de Sprint Goal clair depuis 4 sprints. Les ceremonies se font
      mais personne n'y croit. Quel pattern est-ce et comment en sortir ?
    reponse: >
      C'est le pattern P2 (Perte de sens / direction floue). Le lien entre le travail quotidien
      et la strategie produit est invisible. Les Sprint Goals sont absents ou si vagues
      qu'ils n'orientent rien. Format recommande : North Star Retro. Activite centrale :
      relier chaque item du Sprint Backlog a un objectif lisible. Questions cles :
      "Qu'est-ce qui a du sens ?" / "Qu'est-ce qui n'en a pas ?".
      Signal d'amelioration : l'equipe commence a questionner elle-meme le Sprint Goal
      avant de le valider. Ce signal designe aussi un probleme de role PO : si le Product Owner
      est peu present ou ne donne pas de cap clair, ce pattern reviendra systematiquement.
    douleur_terrain: >
      Les developpeurs executent sans comprendre pourquoi. "Pourquoi on fait ca ?" revient
      a chaque sprint sans reponse claire. Les ceremonies semblent deconnectees du reel.
    source_expert: null
    page: 250
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
    schemas_lies: []

  - id: "P3-CH11-PO-02"
    cible: PRATICIEN_AGILE
    role: PO
    expert: null
    dimensions: [qui, quoi, comment, pourquoi, quand, valeur]
    question: >
      Les actions de retro de mon equipe finissent toujours en "on va mieux communiquer".
      Rien de concret, rien de mesurable. L'IA peut-elle generer des actions inscriptibles
      au Sprint Backlog ?
    reponse: >
      Oui. Le plan personnalise genere par aigile.lu/retro inclut des actions inscriptibles
      au Sprint Backlog, pas des intentions vagues. La condition : les 8 questions de diagnostic
      doivent decrire precisement la situation reelle, pas une version idealisee.
      L'IA genere une hypothese de structure a partir du pattern detecte. Le SM ajuste.
      L'outil ne voit pas ta salle, n'entend pas les silences, ne percoit pas la tension entre membres.
      Il genere un plan adapte. Toi, tu l'appliques avec ton jugement de facilitateur.
    douleur_terrain: >
      Le PO voit les actions de retro notees dans Confluence et jamais realisees. Il doute
      de l'utilite de l'exercice. Les retros consomment 1h par sprint sans ROI visible.
    source_expert: null
    page: 259
    extrait: null
    fiche_liee: null
    fiche_destinee_a: [PO, SM]
    statut_reponse: confirmee
    action_recommandee: null
