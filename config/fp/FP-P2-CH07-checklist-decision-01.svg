<text x="68" y="823" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">POUR LE MANAGER : DISTINGUER PROCESS ET ENGINEERING</text>

<text x="68" y="850" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">CFR &#233;lev&#233; + DF basse &#8594; probl&#232;me technique, pas organisationnel.</text>
<text x="68" y="872" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Une demande de "plus de temps pour les tests" est l&#233;gitime si le CFR est r&#233;ellement &#233;lev&#233;</text>
<text x="68" y="888" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">(&gt; 15 %, niveau Low) et que les signaux de dette technique sont pr&#233;sents.</text>

