<rect x="54" y="276" width="738" height="22" style="fill:#0f2240;"/>
<text x="68" y="291" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">&#201;TAPE 2 : IDENTIFIE LE PROFIL ET L'ACTION PRIORITAIRE</text>

<!-- Header colonnes -->
<line x1="68" y1="312" x2="778" y2="312" style="stroke:#febd10;stroke-width:1px;"/>
<text x="68" y="326" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#0f2240;letter-spacing:1px;">PROFIL OBSERV&#201;</text>
<text x="270" y="326" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#0f2240;letter-spacing:1px;">CE QUE &#199;A SIGNIFIE</text>
<text x="560" y="326" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#0f2240;letter-spacing:1px;">ACTION PRIORITAIRE</text>
<line x1="68" y1="334" x2="778" y2="334" style="stroke:#e0e0e0;stroke-width:0.5px;"/>

<!-- Ligne 01 -->
<text x="68" y="354" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#febd10;">01</text>
<text x="88" y="354" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">DF haute + CFR haute</text>
<text x="270" y="354" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">&#201;quipe d&#233;ploie souvent</text>
<text x="270" y="368" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">mais casse beaucoup.</text>
<text x="560" y="354" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Aller plus lentement pour</text>
<text x="560" y="368" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">aller plus vite. Tests.</text>
<line x1="68" y1="380" x2="778" y2="380" style="stroke:#e0e0e0;stroke-width:0.5px;"/>

<!-- Ligne 02 -->
<text x="68" y="400" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#febd10;">02</text>
<text x="88" y="400" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">DF basse + MTTR long</text>
<text x="270" y="400" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">D&#233;ploiements rares et</text>
<text x="270" y="414" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">douloureux. Chaque incident</text>
<text x="270" y="428" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">est une crise.</text>
<text x="560" y="400" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Automatiser, r&#233;duire la</text>
<text x="560" y="414" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">taille des changements.</text>
<line x1="68" y1="440" x2="778" y2="440" style="stroke:#e0e0e0;stroke-width:0.5px;"/>

<!-- Ligne 03 -->
<text x="68" y="460" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#febd10;">03</text>
<text x="88" y="460" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">LT long + DF basse</text>
<text x="270" y="460" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Pipeline engorg&#233;.</text>
<text x="560" y="460" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Cherche les handoffs et</text>
<text x="560" y="474" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">validations manuelles qui</text>
<text x="560" y="488" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">bloquent le flux.</text>
<line x1="68" y1="498" x2="778" y2="498" style="stroke:#e0e0e0;stroke-width:0.5px;"/>

<!-- Ligne 04 -->
<text x="68" y="518" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#febd10;">04</text>
<text x="88" y="518" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">DF basse + CFR bas</text>
<text x="270" y="518" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Illusion de qualit&#233; : tout est</text>
<text x="270" y="532" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">test&#233; manuellement.</text>
<text x="560" y="518" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">V&#233;rifier Lead Time et</text>
<text x="560" y="532" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">r&#233;activit&#233; en cas d'incident.</text>
<line x1="68" y1="544" x2="778" y2="544" style="stroke:#e0e0e0;stroke-width:0.5px;"/>

<!-- Ligne 05 -->
<text x="68" y="564" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#febd10;">05</text>
<text x="88" y="564" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Tous niveaux Elite</text>
<text x="270" y="564" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">&#201;quipe mature DevOps.</text>
<text x="560" y="564" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Partager les pratiques avec</text>
<text x="560" y="578" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">les autres &#233;quipes.</text>

