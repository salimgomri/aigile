<!-- ============================================================ -->
<!-- ETAPE 1 : situer le CFR (test illusion de qualite) -->
<!-- ============================================================ -->
<rect x="54" y="160" width="738" height="100" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<rect x="54" y="160" width="738" height="22" style="fill:#0f2240;"/>
<text x="68" y="175" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">&#201;TAPE 1 : LE CFR SEUL NE DIT RIEN. CROISE-LE AVEC LA DF.</text>

<text x="68" y="200" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">CFR bas + DF basse &#8594; m&#233;fie-toi : peut-&#234;tre une illusion de qualit&#233; (tout test&#233; &#224; la main).</text>
<text x="68" y="220" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">CFR excellent sans explication de mesure concr&#232;te &#8594; signal &#224; creuser (chiffre gonfl&#233; ou non mesur&#233;).</text>
<text x="68" y="240" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#bbb;">Une &#233;quipe qui n'a jamais mesur&#233; le dit spontan&#233;ment : ses chiffres sont flous, pas faussement parfaits.</text>

<!-- ============================================================ -->
<!-- TABLEAU GO/NO-GO PRINCIPAL -->
<!-- ============================================================ -->
