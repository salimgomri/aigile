<text x="68" y="656" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">&#9633; Profil identifi&#233; et partag&#233; avec l'&#233;quipe</text>
<text x="68" y="680" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">&#9633; Action prioritaire choisie (1 seule)</text>
<text x="68" y="704" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">&#9633; M&#233;trique de suivi d&#233;finie (3 sprints)</text>
<text x="68" y="728" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">&#9633; Obstacle organisationnel signal&#233; au SM</text>
<text x="68" y="752" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">&#9633; Si gaming suspect&#233; : creuser avant d'agir</text>

