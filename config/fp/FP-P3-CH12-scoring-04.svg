<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap');</style>
  </defs>

  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
  <rect x="0" y="0" width="54" height="1123" fill="#febd10"/>
  <text transform="rotate(-90,27,560)" x="-290" y="32"
        font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0f2240" letter-spacing="2">
    LE SYST&#200;ME S.A.L.I.M.
  </text>

  <!-- HEADER -->
  <rect x="54" y="0" width="740" height="78" fill="#ffffff"/>
  <text x="72" y="24" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#bbbbbb" letter-spacing="1">
    QUESTIONNAIRE &gt; &#201;VALUATION LIVRABLE
  </text>
  <rect x="680" y="8" width="100" height="22" rx="11" fill="#febd10"/>
  <text x="730" y="22" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240"
        text-anchor="middle" font-weight="bold">FP III-12.4</text>
  <line x1="72" y1="32" x2="748" y2="32" stroke="#febd10" stroke-width="1"/>
  <text x="72" y="58" font-family="Georgia,serif" font-size="23" fill="#0f2240" font-weight="bold">
    Scoring Deliverable : &#233;valuer la solidit&#233; d'une story
  </text>
  <text x="72" y="74" font-family="EB Garamond,Georgia,serif" font-size="11"
        font-style="italic" fill="#febd10">
    9 dimensions &#183; Score /100 &#183; Outil de diagnostic, pas d'&#233;valuation de performance.
  </text>

  <!-- BLOC 4 CHAMPS GOLD -->
  <rect x="54" y="78" width="740" height="64" fill="#febd10"/>
  <text x="72" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">POUR QUI</text>
  <text x="72" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">SM &#183; PO &#183; CA &#183; DC</text>
  <line x1="232" y1="84" x2="232" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="248" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">QUOI</text>
  <text x="248" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">Mesurer la solidit&#233; structurelle d'un livrable</text>
  <line x1="432" y1="84" x2="432" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="448" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">QUAND L'UTILISER</text>
  <text x="448" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">Sprint Review &#183; Backlog refinement &#183; Pilotage DSI</text>
  <line x1="622" y1="84" x2="622" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="636" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">VALEUR APPORT&#201;E</text>
  <text x="636" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">Rendre visible la dette structurelle t&#244;t</text>
  <text x="72" y="128" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">MOYENNE BETA</text>
  <text x="72" y="138" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">Environ 30 sur 100. Ce chiffre n'est pas une performance &#224; optimiser : c'est un niveau de d&#233;part.</text>

  <!-- HEADER TABLEAU -->
  <rect x="54" y="148" width="740" height="18" fill="#0f2240"/>
  <text x="72" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">#</text>
  <text x="102" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">DIMENSION &#192; &#201;VALUER</text>
  <text x="380" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">QUESTION CL&#201;</text>
  <text x="620" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">SCORE (0-15)</text>
  <text x="710" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">NOTES</text>

  <!-- 9 dimensions -->
  <!-- D1 Clarte -->
  <rect x="54" y="166" width="740" height="52" fill="#fafaf7"/>
  <line x1="54" y1="218" x2="794" y2="218" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="184" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">01</text>
  <text x="102" y="184" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">Clart&#233;</text>
  <text x="102" y="198" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">La story est-elle comprise</text>
  <text x="102" y="209" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">sans explication orale ?</text>
  <text x="380" y="187" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Un dev qui lit cette story sait exactement quoi faire ?</text>
  <rect x="620" y="170" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="170" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D2 Testabilite -->
  <rect x="54" y="218" width="740" height="52" fill="#ffffff"/>
  <line x1="54" y1="270" x2="794" y2="270" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="236" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">02</text>
  <text x="102" y="236" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">Testabilit&#233;</text>
  <text x="102" y="250" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Les crit&#232;res d'acceptation</text>
  <text x="102" y="261" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">sont-ils v&#233;rifiables ?</text>
  <text x="380" y="239" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Peut-on &#233;crire un test automatis&#233; depuis les crit&#232;res ?</text>
  <rect x="620" y="222" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="222" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D3 Independance -->
  <rect x="54" y="270" width="740" height="52" fill="#fafaf7"/>
  <line x1="54" y1="322" x2="794" y2="322" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="288" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">03</text>
  <text x="102" y="288" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">Ind&#233;pendance</text>
  <text x="102" y="302" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Livrable sans bloquer</text>
  <text x="102" y="313" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">une autre story ?</text>
  <text x="380" y="291" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Cette story peut &#234;tre livr&#233;e ind&#233;pendamment des autres ?</text>
  <rect x="620" y="274" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="274" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D4 DoD -->
  <rect x="54" y="322" width="740" height="52" fill="#ffffff"/>
  <line x1="54" y1="374" x2="794" y2="374" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="340" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">04</text>
  <text x="102" y="340" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">DoD</text>
  <text x="102" y="354" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Tous les crit&#232;res DoD</text>
  <text x="102" y="365" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">sont-ils adressables ?</text>
  <text x="380" y="343" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">La story peut satisfaire chaque item de la DoD de l'&#233;quipe ?</text>
  <rect x="620" y="326" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="326" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D5 Valeur business -->
  <rect x="54" y="374" width="740" height="52" fill="#fafaf7"/>
  <line x1="54" y1="426" x2="794" y2="426" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="392" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">05</text>
  <text x="102" y="392" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">Valeur business</text>
  <text x="102" y="406" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">La valeur est-elle</text>
  <text x="102" y="417" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">explicite et mesurable ?</text>
  <text x="380" y="395" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">La valeur apport&#233;e &#224; l'utilisateur est-elle clairement nomm&#233;e ?</text>
  <rect x="620" y="378" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="378" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D6 Risques -->
  <rect x="54" y="426" width="740" height="52" fill="#ffffff"/>
  <line x1="54" y1="478" x2="794" y2="478" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="444" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">06</text>
  <text x="102" y="444" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">Gestion des risques</text>
  <text x="102" y="458" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Les risques techniques</text>
  <text x="102" y="469" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">sont-ils identifi&#233;s ?</text>
  <text x="380" y="447" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Les risques et points d'incertitude sont-ils nomm&#233;s dans la story ?</text>
  <rect x="620" y="430" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="430" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D7 Dependances -->
  <rect x="54" y="478" width="740" height="52" fill="#fafaf7"/>
  <line x1="54" y1="530" x2="794" y2="530" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="496" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">07</text>
  <text x="102" y="496" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">D&#233;pendances</text>
  <text x="102" y="510" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Les d&#233;pendances</text>
  <text x="102" y="521" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">externes sont-elles connues ?</text>
  <text x="380" y="499" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Les syst&#232;mes ext&#233;rieurs concern&#233;s sont-ils list&#233;s et contact&#233;s ?</text>
  <rect x="620" y="482" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="482" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D8 Dette technique -->
  <rect x="54" y="530" width="740" height="52" fill="#ffffff"/>
  <line x1="54" y1="582" x2="794" y2="582" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="548" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">08</text>
  <text x="102" y="548" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">Dette technique</text>
  <text x="102" y="562" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">La story cr&#233;e-t-elle</text>
  <text x="102" y="573" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">de la dette consciente ?</text>
  <text x="380" y="551" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Si elle en cr&#233;e, est-elle document&#233;e et pilot&#233;e ?</text>
  <rect x="620" y="534" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="534" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- D9 Tracabilite -->
  <rect x="54" y="582" width="740" height="52" fill="#fafaf7"/>
  <line x1="54" y1="634" x2="794" y2="634" stroke="#e0e0e0" stroke-width="0.6"/>
  <text x="72" y="600" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">09</text>
  <text x="102" y="600" font-family="Georgia,serif" font-size="10" fill="#0f2240" font-weight="bold">Tra&#231;abilit&#233;</text>
  <text x="102" y="614" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Le lien besoin / story</text>
  <text x="102" y="625" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">est-il documenté ?</text>
  <text x="380" y="603" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Peut-on retracer cette story jusqu'&#224; l'OKR ou la demande initiale ?</text>
  <rect x="620" y="586" width="82" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>
  <rect x="714" y="586" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="2"/>

  <!-- ZONE CALCUL -->
  <rect x="54" y="638" width="740" height="16" fill="#0f2240"/>
  <text x="72" y="651" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#ffffff" font-weight="bold">CALCUL ET INTERPR&#201;TATION</text>

  <!-- 3 colonnes calcul -->
  <rect x="54" y="654" width="246" height="80" fill="#fafaf7"/>
  <rect x="302" y="654" width="246" height="80" fill="#fafaf7"/>
  <rect x="550" y="654" width="244" height="80" fill="#fafaf7"/>
  <line x1="300" y1="654" x2="300" y2="734" stroke="#e0e0e0" stroke-width="0.8"/>
  <line x1="548" y1="654" x2="548" y2="734" stroke="#e0e0e0" stroke-width="0.8"/>

  <text x="72" y="672" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">CALCUL DU SCORE</text>
  <text x="72" y="688" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">Total des 9 dimensions</text>
  <text x="72" y="702" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">Note chaque dimension</text>
  <text x="72" y="716" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">de 0 &#224; 11 points.</text>
  <text x="72" y="730" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#bbbbbb">Max : 99 pts (arrondi 100)</text>

  <text x="318" y="672" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">LECTURE DU SCORE</text>
  <text x="318" y="690" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#cc3333">0-30 : Structuration &#224; engager</text>
  <text x="318" y="706" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#b8860b">31-60 : Qualit&#233; partielle</text>
  <text x="318" y="722" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#2a7a2a">61-100 : Livrable solide</text>

  <text x="566" y="672" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">ACTIONS PRIORITAIRES</text>
  <text x="566" y="690" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">1. ______________________</text>
  <text x="566" y="706" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">2. ______________________</text>
  <text x="566" y="722" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">3. ______________________</text>

  <!-- RAPPEL USAGE -->
  <rect x="54" y="738" width="740" height="44" fill="#0f2240" rx="0"/>
  <text x="72" y="756" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#febd10" font-weight="bold">
    &#192; retenir : ce score est un outil de diagnostic, pas d'&#233;valuation de performance.
  </text>
  <text x="72" y="772" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff">
    Un score de 30 ne dit pas que l'&#233;quipe est mauvaise. Il dit que les livrables ont un potentiel de structuration.
  </text>
  <text x="72" y="786" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff">
    Disponible en version num&#233;rique sur aigile.lu
  </text>

  <!-- FOOTER -->
  <line x1="54" y1="1083" x2="794" y2="1083" stroke="#febd10" stroke-width="1"/>
  <rect x="372" y="1076" width="50" height="20" rx="10" fill="#0f2240"/>
  <text x="397" y="1090" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#febd10"
        text-anchor="middle" font-weight="bold">III-12</text>
  <text x="72" y="1097" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">
    SOURCE : Le Syst&#232;me S.A.L.I.M. &#183; Chapitre 12 &#183; aigile.lu
  </text>
  <text x="748" y="1097" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb"
        text-anchor="end">Le Syst&#232;me S.A.L.I.M.</text>

</svg>