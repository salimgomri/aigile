  <text transform="translate(17,1050) rotate(-90)"
        font-family="Georgia,serif" font-size="10" font-weight="bold"
        fill="#0f2240" letter-spacing="2">LE SYST&#200;ME S.A.L.I.M.</text>
  <rect x="54" y="0" width="740" height="75" fill="#ffffff"/>
  <text x="72" y="22" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#bbbbbb" letter-spacing="1">RELATION MANAGER > SUIVI</text>
  <rect x="695" y="8" width="90" height="22" rx="11" fill="#febd10"/>
  <text x="740" y="23" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">FP IV-14.6</text>
  <line x1="72" y1="30" x2="748" y2="30" stroke="#febd10" stroke-width="1"/>
  <text x="72" y="58" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#0f2240">Tableau de suivi des d&#233;cisions</text>
  <text x="72" y="74" font-family="Georgia,serif" font-size="10" font-style="italic" fill="#febd10">Chaque escalade sans r&#233;ponse devient visible. Pour le manager et sa hi&#233;rarchie.</text>
  <rect x="54" y="78" width="740" height="68" fill="#febd10"/>
  <text x="72" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">POUR QUI</text>
  <text x="72" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">SM</text>
  <line x1="252" y1="85" x2="252" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="257" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUOI</text>
  <text x="257" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Tracer toutes les</text>
  <text x="257" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">escalades et leur statut</text>
  <text x="257" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">de d&#233;cision</text>
  <line x1="437" y1="85" x2="437" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="442" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUAND L&#39;UTILISER</text>
  <text x="442" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Ouvert d&#232;s le sprint</text>
  <text x="442" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">1, mis &#224; jour 15 min</text>
  <text x="442" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">apr&#232;s chaque Sprint</text>
  <line x1="622" y1="85" x2="622" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="627" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">VALEUR APPORT&#201;E</text>
  <text x="627" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Rend visible</text>
  <text x="627" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">l&#8217;inaction.</text>
  <text x="627" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Prot&#232;ge le SM et</text>

  <rect x="72" y="162" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="176" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.8">PRINCIPE</text>

  <rect x="72" y="184" width="676" height="44" fill="#fafaf7" rx="2"/>
  <circle cx="86" cy="196" r="3" fill="#febd10"/>
  <text x="96" y="200" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Vit dans le dashboard, pas dans un fichier partag&#233; ou un email.</text>
  <circle cx="86" cy="210" r="3" fill="#febd10"/>
  <text x="96" y="214" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Ouvert d&#232;s le sprint 1, avant la premi&#232;re escalade. L&#8217;outil doit exister avant d&#8217;en avoir besoin.</text>
  <circle cx="86" cy="224" r="3" fill="#febd10"/>
  <text x="96" y="228" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Visible par le manager et par sa hi&#233;rarchie. L&#8217;absence d&#8217;action est lisible par tous.</text>
  <rect x="72" y="236" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="250" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.8">STRUCTURE : 5 COLONNES</text>

  <rect x="72" y="258" width="676" height="24" fill="#0f2240" rx="2"/>
  <text x="82" y="274" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff" letter-spacing="0.8">DATE</text>
  <text x="162" y="274" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff" letter-spacing="0.8">D&#201;CISION DEMAND&#201;E</text>
  <text x="362" y="274" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff" letter-spacing="0.8">D&#201;LAI</text>
  <text x="442" y="274" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff" letter-spacing="0.8">CONS&#201;QUENCE</text>
  <text x="602" y="274" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff" letter-spacing="0.8">STATUT</text>
  <rect x="72" y="282" width="676" height="36" fill="#fafaf7" rx="2"/>
  <text x="82" y="296" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">Date de</text>
  <text x="82" y="309" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">l&#8217;escalade</text>
  <text x="162" y="296" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">Description pr&#233;cise de la</text>
  <text x="162" y="309" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">d&#233;cision attendue</text>
  <text x="362" y="296" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">Date limite</text>
  <text x="362" y="309" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">de</text>
  <text x="442" y="296" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">Si rien n&#8217;est</text>
  <text x="442" y="309" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">d&#233;cid&#233;, il se</text>
  <text x="602" y="296" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">En attente / Prise /</text>
  <text x="602" y="309" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.8">D&#233;l&#233;gu&#233;e</text>
