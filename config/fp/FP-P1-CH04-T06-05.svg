  <ellipse cx="19" cy="34" rx="7" ry="22" style="fill:none;stroke:#0f2240;stroke-width:1.1px;opacity:0.3;" transform="rotate(8 19 34)"/>
  <circle cx="19" cy="6" r="3.2" style="fill:#0f2240;"/>
  <path d="M19,9 L19,28 M19,16 L11,24 M19,16 L27,24 M19,28 L13,40 M19,28 L25,40"
        style="stroke:#0f2240;stroke-width:1.6px;stroke-linecap:round;fill:none;"/>
</g>


<!-- TEXTE VERTICAL -->
<g transform="matrix(-0,-1,1,-0,-893.165,946.835)">
  <text x="-36.025px" y="920px"
        style="font-family:'Georgia',serif;font-size:11px;fill:#0f2240;">
    L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px
             26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px
             68.29px 72.906px 76.201px 86.73px"
            y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px
               920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">
      E SYST&#200;ME S.A.L.I.M.
    </tspan>
  </text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">M&#201;MO / R&#201;F&#201;RENCE &gt; STORY MAPPING</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP I-4.5</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">Story Mapping : la carte du produit</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">Voir le produit en entier, pas en liste.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">PO / CA / RTE</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Structure en 2 axes pour visualiser le produit et faire &#233;merger le Product Goal</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">D&#233;but de projet, quand l'&#233;quipe perd le fil de sa vision produit, ou en PI Planning multi-&#233;quipes</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Un backlog de 300 items devient une carte lisible, avec des releases coh&#233;rentes</text>

<!-- LIGNE 1 : 2 colonnes -->
<text x="72" y="172" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">LES 2 AXES</text>
<path d="M72,178l300,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="198" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">Horizontal</text>
<text x="72" y="213" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Flux d'activit&#233;s de l'utilisateur, de gauche</text>
<text x="72" y="227" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&#224; droite. Les epics au sens Patton.</text>
<text x="72" y="251" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">Vertical</text>
<text x="72" y="266" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Variantes et enrichissements, du plus</text>
<text x="72" y="280" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">essentiel en haut au plus optionnel en bas.</text>
<text x="72" y="304" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.7;">Le r&#233;sultat : une carte du produit, pas une</text>
<text x="72" y="318" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.7;">liste de fonctionnalit&#233;s.</text>

<text x="424" y="172" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">SCH&#201;MA DE LA CARTE</text>
<path d="M424,178l298,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>

<!-- mini story map illustration -->
<g font-family="'Helvetica'" font-size="7.5px" fill="#fff" text-anchor="middle">
<rect x="424" y="190" width="148" height="22" style="fill:#0f2240;"/>
<text x="498" y="204">Epic 1</text>
<rect x="576" y="190" width="146" height="22" style="fill:#0f2240;"/>
<text x="649" y="204">Epic 2</text>

<rect x="424" y="216" width="148" height="20" style="fill:#888;"/>
<text x="498" y="229">Story minimale</text>
<rect x="576" y="216" width="146" height="20" style="fill:#888;"/>
<text x="649" y="229">Story minimale</text>

<rect x="424" y="240" width="148" height="20" style="fill:#bbb;"/>
<text x="498" y="253">Enrichissement</text>
<rect x="576" y="240" width="146" height="20" style="fill:#bbb;"/>
<text x="649" y="253">Enrichissement</text>
</g>
<line x1="424" y1="238" x2="722" y2="238" style="stroke:#febd10;stroke-width:1.3px;stroke-dasharray:3,2;"/>
<text x="726" y="241" style="font-family:'Helvetica';font-size:7px;fill:#0f2240;opacity:0.6;">V1</text>

<text x="424" y="282" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Couper horizontalement = version</text>
<text x="424" y="296" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">fonctionnelle minimale, puis V2, puis V3.</text>

<!-- LIGNE 2 pleine largeur : etapes -->
<text x="72" y="356" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">COMMENT FAIRE EN PRATIQUE (90 MINUTES)</text>
<path d="M72,362l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>

<g font-family="'EB Garamond','Georgia',serif" font-size="9.5px" fill="#0f2240">
<text x="72" y="386">01. Identifie les epics : les grandes activit&#233;s utilisateur, de bout en bout.</text>
<text x="84" y="400" style="font-style:italic;opacity:0.65;font-size:9px;">Au sens Patton. Voir le bloc RTE ci-dessous pour la coh&#233;rence en environnement SAFe.</text>

<text x="72" y="424">02. D&#233;compose chaque activit&#233; en t&#226;ches utilisateur : les &#233;tapes concr&#232;tes.</text>

<text x="72" y="448">03. Pour chaque t&#226;che, liste les stories qui l'impl&#233;mentent : minimal en haut, enrichissements en bas.</text>

<text x="72" y="472">04. Trace des lignes horizontales de release : premi&#232;re coupe = version de d&#233;part fonctionnelle.</text>
<text x="84" y="486" style="font-style:italic;opacity:0.65;font-size:9px;">MVP = exp&#233;rience minimale qui teste une hypoth&#232;se, pas une version all&#233;g&#233;e.</text>
</g>

<!-- LIGNE 3 : lien Product Goal -->
<rect x="54" y="510" width="740" height="84" style="fill:#fafaf7;"/>
<text x="72" y="532" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">LE LIEN AVEC LE PRODUCT GOAL</text>
<path d="M72,538l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="558" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quand la r&#233;ponse &#224; quel est notre Product Goal reste vague : fais un Story Map. Tracer les activit&#233;s</text>
<text x="72" y="574" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">utilisateur de bout en bout force l'&#233;quipe &#224; nommer pour qui elle construit et vers quoi elle avance.</text>
<text x="72" y="588" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Le Product Goal &#233;merge, ou les d&#233;saccords deviennent visibles : tout aussi utile.</text>

<!-- LIGNE 4a : ce qui resiste pour CA -->
<text x="72" y="630" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">CE QUI R&#201;SISTE DANS LA R&#201;ALIT&#201; (POUR LE COACH AGILE)</text>
<path d="M72,636l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<circle cx="78" cy="656" r="2.5" style="fill:#febd10;"/>
<text x="88" y="660" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Aligner des parties prenantes aux visions divergentes. Si &#231;a tourne au conflit, c'est attendu :</text>
<text x="88" y="675" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">l'outil r&#233;v&#232;le des d&#233;saccords jamais pos&#233;s explicitement. Bonne nouvelle sur le fond, douloureux</text>
<text x="88" y="690" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">sur le moment : ce n'est pas un &#233;chec de facilitation.</text>
<circle cx="78" cy="711" r="2.5" style="fill:#febd10;"/>
<text x="88" y="715" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">D&#233;pendances techniques : note-les explicitement comme un risque sur la carte, avec l'&#233;quipe ou</text>
<text x="88" y="730" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">le composant concern&#233;, et discute-en au Refinement suivant.</text>

<!-- LIGNE 4b : bloc RTE multi-equipes -->
<rect x="54" y="746" width="740" height="78" style="fill:#fafaf7;"/>
<text x="72" y="768" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">POUR LE RTE : EPIC PATTON OU EPIC SAFe ?</text>
<path d="M72,774l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="794" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">En environnement multi-&#233;quipes, le mot epic n'a pas le m&#234;me sens ici (grande activit&#233; utilisateur,</text>
<text x="72" y="810" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">au sens Patton) qu'en SAFe (gouvernance propre). Pr&#233;cise lequel est utilis&#233; en d&#233;but de session :</text>
<text x="72" y="822" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.7;">trente secondes de clarification &#233;vitent des malentendus en PI Planning deux semaines plus tard.</text>

<!-- bandeau bas -->
<rect x="54" y="858" width="740" height="56" style="fill:#0f2240;"/>
<text x="72" y="880" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#febd10;">L'OBJECTIF N'EST PAS LA CARTE PARFAITE</text>
<text x="72" y="898" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#fff;">C'est une conversation partag&#233;e sur la direction produit. Ton premier Story Map sera imparfait. Commencez l&#224;.</text>

