            y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px
               920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">
      E SYST&#200;ME S.A.L.I.M.
    </tspan>
  </text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">STRAT&#201;GIE &gt; CADRAGE</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP I-4.9</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">La transformation produit des r&#233;sultats ?</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">Pose le probl&#232;me avant de choisir la solution.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">DC / MG</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Canvas en 5 blocs pour cadrer un comit&#233; de pilotage sur la maturit&#233; backlog de plusieurs &#233;quipes</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Comit&#233; de pilotage, revue de transformation &#224; 12-18 mois, arbitrage budg&#233;taire</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Relier en une page les jauges INVEST/DoD &#224; la question business : et apr&#232;s ?</text>

<!-- LIGNE 1 : 2 colonnes -->
<rect x="72" y="158" width="324" height="120" style="fill:#fafaf7;"/>
<text x="84" y="180" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">1. CONTEXTE</text>
<path d="M84,186l300,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="84" y="206" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quel est le contexte ou le probl&#232;me &#224;</text>
<text x="84" y="220" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">adresser ?</text>
<text x="84" y="242" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">Plusieurs &#233;quipes sous Scrum depuis 12 &#224;</text>
<text x="84" y="256" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">18 mois, font les c&#233;r&#233;monies, mais aucun</text>
<text x="84" y="270" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">signal clair sur la solidit&#233; r&#233;elle du backlog.</text>

<rect x="406" y="158" width="316" height="120" style="fill:#fafaf7;"/>
<text x="418" y="180" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">2. OBJECTIF</text>
<path d="M418,186l292,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="418" y="206" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quel objectif voulons-nous atteindre et</text>
<text x="418" y="220" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">pourquoi maintenant ?</text>
<text x="418" y="242" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">Obtenir un signal pr&#233;coce, comparable</text>
<text x="418" y="256" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">entre &#233;quipes, distinguant une &#233;quipe qui</text>
<text x="418" y="270" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">progresse d'une &#233;quipe qui fait semblant.</text>

<!-- LIGNE 2 : pleine largeur elements cles -->
<rect x="72" y="292" width="650" height="148" style="fill:#fafaf7;"/>
<text x="84" y="314" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">3. &#201;L&#201;MENTS CL&#201;S</text>
<path d="M84,320l626,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="84" y="340" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quels sont les composants, contraintes ou &#233;l&#233;ments importants ?</text>

<circle cx="90" cy="362" r="2.5" style="fill:#febd10;"/>
<text x="100" y="366" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">INVEST 6/6 et DoD &#224; minimum 8 crit&#232;res vérifi&#233;s : deux jauges v&#233;rifiables sans tout lire.</text>

<circle cx="90" cy="384" r="2.5" style="fill:#febd10;"/>
<text x="100" y="388" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Comparer les &#233;carts entre &#233;quipes, pas les valeurs absolues : 5/6 et 6/6 sur INVEST ne se</text>
<text x="100" y="402" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">comparent qu'en tenant compte de l'anciennet&#233; Scrum (3 niveaux de maturit&#233; DoD).</text>

<circle cx="90" cy="424" r="2.5" style="fill:#febd10;"/>
<text x="100" y="428" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Ce que ces jauges NE couvrent PAS : la valeur r&#233;ellement r&#233;alis&#233;e apr&#232;s livraison</text>
<text x="100" y="442" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">(Definition of Outcome Done, non trait&#233;e dans ce chapitre).</text>

<!-- LIGNE 3 : 2 colonnes solution / etapes -->
<rect x="72" y="454" width="324" height="146" style="fill:#fafaf7;"/>
<text x="84" y="476" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">4. APPROCHE</text>
<path d="M84,482l300,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="84" y="502" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quelle approche proposons-nous ?</text>
<text x="84" y="524" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">Demander &#224; chaque SM une lecture INVEST</text>
<text x="84" y="538" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">et DoD avant le comit&#233;. Positionner chaque</text>
<text x="84" y="552" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">&#233;quipe sur la grille de maturit&#233; DoD avant</text>
<text x="84" y="566" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">de comparer leurs v&#233;locit&#233;s. V&#233;rifier si une</text>
<text x="84" y="580" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">remont&#233;e r&#233;cente de v&#233;locit&#233; cache un</text>
<text x="84" y="594" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.75;">all&#233;gement DoD non trac&#233;.</text>

<rect x="406" y="454" width="316" height="146" style="fill:#fafaf7;"/>
<text x="418" y="476" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">5. PROCHAINES &#201;TAPES</text>
<path d="M418,482l292,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="418" y="502" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quelles sont les prochaines &#233;tapes ?</text>
<text x="418" y="526" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&#9633; Recueillir les 4 indicateurs (FP I-4.7)</text>
<text x="418" y="544" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&#9633; Positionner chaque &#233;quipe sur les 3</text>
<text x="430" y="558" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">niveaux de maturit&#233; DoD</text>
<text x="418" y="576" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&#9633; Pr&#233;parer la transition vers les m&#233;triques</text>
<text x="430" y="590" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">de la Partie 2 (delivery vs r&#233;sultats)</text>

<!-- LIGNE 4 : points d'attention et risques, fond alerte -->
<rect x="54" y="616" width="740" height="120" style="fill:#fafaf7;"/>
<text x="72" y="640" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#cc3333;">POINTS D'ATTENTION ET RISQUES</text>
<path d="M72,646l650,0" style="fill:none;stroke:#cc3333;stroke-width:1px;"/>

<text x="72" y="668" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">ARBITRAGE BUDG&#201;TAIRE</text>
<text x="72" y="686" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Ces KPIs r&#233;pondent &#224; savoir si ce qui sort du sprint est solide. Ils ne r&#233;pondent pas &#224; savoir</text>
<text x="72" y="700" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">si &#231;a cr&#233;e de la valeur business : 52% des organisations ratent ce lien (State of Agile 2025,</text>
<text x="72" y="714" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Digital.ai). Ne pas pr&#233;senter la solidit&#233; du backlog comme une preuve de ROI.</text>

<text x="424" y="668" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">RISQUES D'ADOPTION</text>
<text x="424" y="686" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Une remont&#233;e de v&#233;locit&#233; pr&#233;sent&#233;e comme un</text>
<text x="424" y="700" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">succ&#232;s peut masquer un all&#233;gement DoD non</text>
<text x="424" y="714" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">trac&#233; : v&#233;rifier avant de c&#233;l&#233;brer.</text>

<!-- bandeau bas : lien vers la suite -->
<rect x="54" y="752" width="740" height="56" style="fill:#0f2240;"/>
<text x="72" y="774" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#febd10;">CE CANVAS PR&#201;PARE LA PARTIE SUIVANTE</text>
<text x="72" y="792" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#fff;">La solidit&#233; du backlog est une condition n&#233;cessaire, pas suffisante. La Partie 2 traite la connexion delivery / r&#233;sultats business.</text>

