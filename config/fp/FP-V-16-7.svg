<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style>
</defs>
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>
<text transform="translate(13,900) rotate(-90)"
      font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0f2240"
      letter-spacing="2">LE SYST&#200;ME S.A.L.I.M.</text>
<g transform="translate(8,60)">
  <circle cx="18" cy="18" r="16" fill="none" stroke="#0f2240" stroke-width="2"/>
  <circle cx="18" cy="18" r="11" fill="none" stroke="#0f2240" stroke-width="1.5"/>
  <circle cx="18" cy="18" r="6"  fill="none" stroke="#0f2240" stroke-width="1"/>
  <circle cx="18" cy="18" r="2"  fill="#0f2240"/>
</g>
<rect x="54" y="0" width="740" height="72" fill="#ffffff"/>
<text x="72" y="28" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#bbbbbb">M&#201;MO R&#201;F&#201;RENCE . BUS FACTOR IA</text>
<rect x="686" y="8" width="94" height="22" rx="11" fill="#febd10"/>
<text x="733" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-16.7</text>
<line x1="72" y1="36" x2="766" y2="36" stroke="#febd10" stroke-width="1"/>
<text x="72" y="58" font-family="Georgia,serif" font-size="26" fill="#0f2240" font-weight="bold">Bus factor : la responsabilit&#233; du SM</text>
<text x="72" y="71" font-family="EB Garamond,Georgia,serif" font-size="11" font-style="italic" fill="#febd10">La transmission ne se fait pas par la documentation. Elle se fait par le travail c&#244;te &#224; c&#244;te.</text>
<rect x="54" y="78" width="740" height="66" fill="#febd10"/>
<line x1="239" y1="86" x2="239" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="424" y1="86" x2="424" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="609" y1="86" x2="609" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<text x="72"  y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">POUR QUI</text>
<text x="252" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUOI</text>
<text x="437" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUAND L'UTILISER</text>
<text x="622" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">VALEUR APPORT&#201;E</text>
<text x="72"  y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">SM / MG</text>
<text x="252" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Bus factor, binômes planifi&#233;s, transmission du savoir</text>
<text x="437" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">D&#232;s que l'&#233;quipe produit du code avec l'IA</text>
<text x="622" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Rendre le d&#233;part d'un dev non catastrophique</text>
<rect x="66" y="154" width="662" height="52" rx="4" fill="#1A1A1A"/><text x="397" y="171" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">D&#201;FINITION</text><text x="397" y="185" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff" text-anchor="middle">Le bus factor : le nombre minimum de personnes qui, si elles &#233;taient renvers&#233;es par un bus,</text><text x="397" y="198" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff" text-anchor="middle">rendraient le projet incontrolable. Bus factor de 1 = fragilit&#233; totale. L'IA l'aggrave.</text><rect x="66" y="214" width="662" height="36" rx="3" fill="#f8f8f5" stroke="#febd10" stroke-width="0.8"/><text x="76" y="229" font-family="Helvetica,Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#0f2240">POURQUOI L'IA AGGRAVE LE BUS FACTOR</text><text x="76" y="243" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Un d&#233;veloppeur code seul avec Copilot. Il produit vite. Le code sort. La connaissance reste dans une seule t&#234;te. Parfois dans aucune.</text>
<rect x="66" y="258" width="662" height="22" rx="3" fill="#0f2240"/>
<text x="76" y="273" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">LE R&#212;LE DU SM : 4 RESPONSABILIT&#201;S CONCR&#200;TES</text>
<rect x="66" y="280" width="662" height="168" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/><text x="76" y="296" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">01</text><text x="100" y="296" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Identifier les stories qui m&#233;ritent un bin&#244;me</text><text x="100" y="309" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Avec le Tech Lead : code critique, nouveau module, onboarding d'un dev r&#233;cent, zone inconnue. Stories r&#233;p&#233;titives et corrections mineures : non.</text><line x1="76" y1="320" x2="714" y2="320" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="338" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">02</text><text x="100" y="338" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Planifier les bin&#244;mes et les varier</text><text x="100" y="351" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Senior + junior sur les zones &#224; risque. Deux devs de m&#234;me niveau sur l'architecture. Varier les bin&#244;mes chaque sprint : si toujours les m&#234;mes, la connaissance reste &#224; 2 t&#234;tes.</text><line x1="76" y1="362" x2="714" y2="362" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="380" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">03</text><text x="100" y="380" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Prot&#233;ger les sessions des interruptions</text><text x="100" y="393" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Pas de messages en attente, pas de r&#233;unions qui d&#233;bordent. Une session interrompue toutes les 20 minutes ne produit rien d'utile.</text><line x1="76" y1="404" x2="714" y2="404" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="422" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">04</text><text x="100" y="422" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">V&#233;rifier la transmission effective</text><text x="100" y="435" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Signal : les devs qui ont pair&#233; peuvent expliquer ce qu'ils ont fait &#224; un 3&#232;me dev sans documentation. Si non : c'&#233;tait du code &#224; deux. Pas du pair programming.</text><line x1="76" y1="446" x2="714" y2="446" stroke="#e0e0e0" stroke-width="0.5"/>
<rect x="66" y="458" width="662" height="22" rx="3" fill="#0f2240"/>
<text x="76" y="473" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">L'ARGUMENT POUR LE MANAGER : 'POURQUOI 2 PERSONNES SUR 1 T&#194;CHE ?'</text>
<rect x="66" y="480" width="662" height="78" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/><text x="76" y="493" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">R&#233;ponse directe : une story faite seul qui g&#233;n&#232;re 3 jours de bugfix co&#251;te plus</text>
<text x="76" y="506" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">cher que deux personnes qui la font proprement du premier coup.</text>
<text x="76" y="519" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333"></text>
<text x="76" y="532" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Ordre de grandeur : un bug en production co&#251;te entre 15 et 100 fois plus qu'un</text>
<text x="76" y="545" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">bug d&#233;tect&#233; pendant le d&#233;veloppement (NIST, 2002).</text>
<text x="76" y="558" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Une session pair de 4 heures qui &#233;vite ce bug co&#251;te 8 heures de dev.</text>
<rect x="66" y="570" width="662" height="60" rx="4" fill="#febd10" opacity="0.12" stroke="#febd10" stroke-width="0.8"/><text x="76" y="586" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">APR&#200;S 2 SPRINTS AVEC DES BIN&#212;MES PLANIFI&#201;S</text><text x="76" y="601" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Les questions en milieu de sprint diminuent. Les devs savent ce que leurs coll&#232;gues savent.</text>
<text x="76" y="614" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Le d&#233;part d'un d&#233;veloppeur cesse d'&#234;tre une catastrophe : il laisse derri&#232;re lui au moins</text>
<text x="76" y="627" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">une personne qui comprend ce qu'il a construit.</text>

<line x1="66" y1="1068" x2="752" y2="1068" stroke="#febd10" stroke-width="0.8"/>
<rect x="368" y="1074" width="58" height="20" rx="10" fill="#0f2240"/>
<text x="397" y="1088" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#febd10" text-anchor="middle" font-weight="bold">V-16.7</text>
<text x="72"  y="1089" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M. &#8212; Chapitre 16</text>
<text x="677" y="1089" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">Le Syst&#232;me S.A.L.I.M.</text>
</svg>