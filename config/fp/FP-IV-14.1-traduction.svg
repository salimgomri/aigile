<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 794 1123" width="794" height="1123"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>FP IV-14.1 Table de traduction SM Manager</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap');</style>
  </defs>
  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>

  <!-- BANDE LATERALE -->
  <rect x="0" y="0" width="54" height="1123" fill="#febd10"/>
  <!-- LOGO CERCLES CONCENTRIQUE -->
  <g transform="translate(27,80)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#0f2240" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0f2240" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="8"  fill="none" stroke="#0f2240" stroke-width="1"/>
    <circle cx="0" cy="0" r="3"  fill="#0f2240"/>
    <!-- silhouette -->
    <ellipse cx="0" cy="-30" rx="5" ry="6" fill="#0f2240"/>
    <line x1="0" y1="-24" x2="0" y2="-10" stroke="#0f2240" stroke-width="2.5"/>
    <line x1="-8" y1="-20" x2="8" y2="-20" stroke="#0f2240" stroke-width="2"/>
    <line x1="0" y1="-10" x2="-6" y2="2"  stroke="#0f2240" stroke-width="2"/>
    <line x1="0" y1="-10" x2="6"  y2="2"  stroke="#0f2240" stroke-width="2"/>
  </g>
  <!-- TEXTE VERTICAL -->
  <text transform="translate(17,1050) rotate(-90)"
        font-family="Georgia,serif" font-size="10" font-weight="bold"
        fill="#0f2240" letter-spacing="2">
    LE SYST&#200;ME S.A.L.I.M.
  </text>
  <!-- HEADER -->
  <rect x="54" y="0" width="740" height="75" fill="#ffffff"/>
  <text x="72" y="22" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#bbbbbb"
        letter-spacing="1">RELATION MANAGER > TRADUCTION</text>
  <!-- Badge FP -->
  <rect x="695" y="8" width="90" height="22" rx="11" fill="#febd10"/>
  <text x="740" y="23" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="9" font-weight="bold" fill="#0f2240">FP IV-14.1</text>
  <!-- Filet gold -->
  <line x1="72" y1="30" x2="748" y2="30" stroke="#febd10" stroke-width="1"/>
  <!-- Titre -->
  <text x="72" y="58" font-family="Georgia,serif" font-size="24" font-weight="bold"
        fill="#0f2240">Table de traduction SM / Manager</text>
  <!-- Sous-titre -->
  <text x="72" y="74" font-family="Georgia,serif" font-size="10" font-style="italic"
        fill="#febd10">Parle son langage sans perdre le tien</text>
  <!-- BLOC 4 CHAMPS -->
  <rect x="54" y="78" width="740" height="68" fill="#febd10"/>
  <text x="72" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">POUR QUI</text>
  <text x="72" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">SM, CA</text>
  <line x1="252" y1="85" x2="252" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="257" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUOI</text>
  <text x="257" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Reformuler les signaux</text>
  <text x="257" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">terrain en co&#251;ts</text>
  <text x="257" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">business</text>
  <line x1="437" y1="85" x2="437" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="442" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUAND L&#39;UTILISER</text>
  <text x="442" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Avant tout &#233;change</text>
  <text x="442" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">avec le manager, avant une</text>
  <text x="442" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">escalade</text>
  <line x1="622" y1="85" x2="622" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="627" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">VALEUR APPORT&#201;E</text>
  <text x="627" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Z&#233;ro malentendus. Les</text>
  <text x="627" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">d&#233;cisions arrivent</text>
  <text x="627" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">plus vite.</text>

  <!-- TABLE TRADUCTION -->
  <rect x="72" y="160" width="676" height="24" fill="#0f2240" rx="2"/>
  <text x="82" y="176" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="1">LANGAGE SM (TERRAIN)</text>
  <text x="420" y="176" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="1">TRADUCTION MANAGER (BUSINESS)</text>
  <line x1="380" y1="160" x2="380" y2="472" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <rect x="72" y="184" width="676" height="48" fill="#ffffff"/>
  <line x1="72" y1="232" x2="748" y2="232" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="380" y1="184" x2="380" y2="232" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="82" y="202" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">"La v&#233;locit&#233; a baiss&#233; de 15 %"</text>
  <circle cx="394" cy="200" r="3" fill="#febd10"/>
  <text x="404" y="204" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">"On a une baisse de productivit&#233;"</text>
  <rect x="72" y="232" width="676" height="48" fill="#fafaf7"/>
  <line x1="72" y1="280" x2="748" y2="280" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="380" y1="232" x2="380" y2="280" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="82" y="250" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">"L&#8217;&#233;quipe a atteint le Sprint</text>
  <text x="82" y="265" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">Goal"</text>
  <circle cx="394" cy="248" r="3" fill="#febd10"/>
  <text x="404" y="252" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">"On a livr&#233; ce qu&#8217;on avait dit"</text>
  <rect x="72" y="280" width="676" height="48" fill="#ffffff"/>
  <line x1="72" y1="328" x2="748" y2="328" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="380" y1="280" x2="380" y2="328" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="82" y="298" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">"Le Happiness Index est en baisse"</text>
  <circle cx="394" cy="296" r="3" fill="#febd10"/>
  <text x="404" y="300" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">"Risque de turn-over &#224; 3 mois"</text>
  <rect x="72" y="328" width="676" height="48" fill="#fafaf7"/>
  <line x1="72" y1="376" x2="748" y2="376" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="380" y1="328" x2="380" y2="376" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="82" y="346" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">"On a une dette technique"</text>
  <circle cx="394" cy="344" r="3" fill="#febd10"/>
  <text x="404" y="348" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">"Chaque fonctionnalit&#233; co&#251;te plus</text>
  <text x="404" y="363" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">cher"</text>
  <rect x="72" y="376" width="676" height="48" fill="#ffffff"/>
  <line x1="72" y1="424" x2="748" y2="424" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="380" y1="376" x2="380" y2="424" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="82" y="394" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">"D&#233;pendance bloqu&#233;e depuis 2</text>
  <text x="82" y="409" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">semaines"</text>
  <circle cx="394" cy="392" r="3" fill="#febd10"/>
  <text x="404" y="396" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">"Sans d&#233;cision, on retarde de 3</text>
  <text x="404" y="411" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">semaines"</text>
  <rect x="72" y="424" width="676" height="48" fill="#fafaf7"/>
  <line x1="72" y1="472" x2="748" y2="472" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="380" y1="424" x2="380" y2="472" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="82" y="442" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0f2240">"CFR &#224; 18 % sur 2 sprints"</text>
  <circle cx="394" cy="440" r="3" fill="#febd10"/>
  <text x="404" y="444" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">"18 % des mises en prod ont eu un</text>
  <text x="404" y="459" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">correctif"</text>
  <!-- REGLE OR -->
  <rect x="72" y="484" width="676" height="36" fill="#0f2240" rx="4"/>
  <text x="410" y="497" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="8" font-weight="bold" fill="#febd10" letter-spacing="1">RÈGLE D&#39;OR</text>
  <text x="410" y="512" text-anchor="middle" font-family="Georgia,serif"
        font-size="9" font-style="italic" fill="#ffffff">
    Un obstacle chiffr&#233; est actionnable. Un obstacle sans chiffre reste une plainte.
  </text>
  <!-- FOOTER -->
  <line x1="72" y1="1078" x2="748" y2="1078" stroke="#febd10" stroke-width="1"/>
  <rect x="372" y="1083" width="50" height="18" rx="9" fill="#0f2240"/>
  <text x="397" y="1095" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="8" font-weight="bold" fill="#febd10">IV-14.1</text>
  <text x="72" y="1095" font-family="Helvetica,Arial,sans-serif" font-size="7"
        fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M.</text>
  <text x="748" y="1095" text-anchor="end" font-family="Helvetica,Arial,sans-serif"
        font-size="7" fill="#bbbbbb">Chapitre 14 · Partie 4</text>
</svg>