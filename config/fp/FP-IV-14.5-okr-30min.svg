<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 794 1123" width="794" height="1123"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>FP IV-14.5 Agenda OKR 30 minutes</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap');</style>
  </defs>
  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>

  <!-- BANDE LATERALE -->
  <rect x="0" y="0" width="54" height="1123" fill="#febd10"/>
  <!-- LOGO CERCLES CONCENTRIQUE -->
  <g transform="translate(27,80)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#0f2240" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0f2240" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="8"  fill="none" stroke="#0f2240" stroke-width="1"/>
    <circle cx="0" cy="0" r="3"  fill="#0f2240"/>
    <!-- silhouette -->
    <ellipse cx="0" cy="-30" rx="5" ry="6" fill="#0f2240"/>
    <line x1="0" y1="-24" x2="0" y2="-10" stroke="#0f2240" stroke-width="2.5"/>
    <line x1="-8" y1="-20" x2="8" y2="-20" stroke="#0f2240" stroke-width="2"/>
    <line x1="0" y1="-10" x2="-6" y2="2"  stroke="#0f2240" stroke-width="2"/>
    <line x1="0" y1="-10" x2="6"  y2="2"  stroke="#0f2240" stroke-width="2"/>
  </g>
  <!-- TEXTE VERTICAL -->
  <text transform="translate(17,1050) rotate(-90)"
        font-family="Georgia,serif" font-size="10" font-weight="bold"
        fill="#0f2240" letter-spacing="2">
    LE SYST&#200;ME S.A.L.I.M.
  </text>
  <!-- HEADER -->
  <rect x="54" y="0" width="740" height="75" fill="#ffffff"/>
  <text x="72" y="22" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#bbbbbb"
        letter-spacing="1">RELATION MANAGER > OKR</text>
  <!-- Badge FP -->
  <rect x="695" y="8" width="90" height="22" rx="11" fill="#febd10"/>
  <text x="740" y="23" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="9" font-weight="bold" fill="#0f2240">FP IV-14.5</text>
  <!-- Filet gold -->
  <line x1="72" y1="30" x2="748" y2="30" stroke="#febd10" stroke-width="1"/>
  <!-- Titre -->
  <text x="72" y="58" font-family="Georgia,serif" font-size="24" font-weight="bold"
        fill="#0f2240">Agenda OKR : 30 minutes par trimestre</text>
  <!-- Sous-titre -->
  <text x="72" y="74" font-family="Georgia,serif" font-size="10" font-style="italic"
        fill="#febd10">30 minutes qui &#233;vitent des mois de d&#233;rive silencieuse.</text>
  <!-- BLOC 4 CHAMPS -->
  <rect x="54" y="78" width="740" height="68" fill="#febd10"/>
  <text x="72" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">POUR QUI</text>
  <text x="72" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">SM, MG</text>
  <line x1="252" y1="85" x2="252" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="257" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUOI</text>
  <text x="257" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Structurer la boucle OKR</text>
  <text x="257" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">trimestrielle avec le</text>
  <text x="257" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">management</text>
  <line x1="437" y1="85" x2="437" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="442" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUAND L&#39;UTILISER</text>
  <text x="442" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">En d&#233;but de</text>
  <text x="442" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">trimestre, puis check-in</text>
  <text x="442" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">de 5 min en Sprint Review</text>
  <line x1="622" y1="85" x2="622" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="627" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">VALEUR APPORT&#201;E</text>
  <text x="627" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Aligne delivery et</text>
  <text x="627" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">r&#233;sultats business</text>
  <text x="627" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">sans grand-messe.</text>

  <rect x="72" y="162" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="176" font-family="Helvetica,Arial,sans-serif" font-size="8"
        font-weight="bold" fill="#ffffff" letter-spacing="0.8">AGENDA TYPE : R&#201;UNION OKR TRIMESTRIELLE</text>
  <rect x="72" y="186" width="334" height="102" fill="#fafaf7" rx="4"/>
  <rect x="72" y="186" width="334" height="22" fill="#febd10" rx="4"/>
  <rect x="72" y="200" width="334" height="8" fill="#febd10"/>
  <text x="82" y="201" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#0f2240">0-5 min</text>
  <text x="172" y="201" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Revue du trimestre pr&#233;c&#233;dent</text>
  <circle cx="86" cy="218" r="3" fill="#febd10"/>
  <text x="96" y="222" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Qu&#8217;est-ce qu&#8217;on a livr&#233; ?</text>
  <circle cx="86" cy="240" r="3" fill="#febd10"/>
  <text x="96" y="244" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Qu&#8217;est-ce qu&#8217;on n&#8217;a pas livr&#233; ?</text>
  <circle cx="86" cy="262" r="3" fill="#febd10"/>
  <text x="96" y="266" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Pourquoi ?</text>
  <rect x="414" y="186" width="334" height="102" fill="#fafaf7" rx="4"/>
  <rect x="414" y="186" width="334" height="22" fill="#febd10" rx="4"/>
  <rect x="414" y="200" width="334" height="8" fill="#febd10"/>
  <text x="424" y="201" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#0f2240">5-15 min</text>
  <text x="514" y="201" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Alignement sur l&#8217;Objectif du trimestre</text>
  <circle cx="428" cy="218" r="3" fill="#febd10"/>
  <text x="438" y="222" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Le manager pr&#233;sente la priorit&#233; business.</text>
  <circle cx="428" cy="240" r="3" fill="#febd10"/>
  <text x="438" y="244" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Le SM valide la faisabilit&#233; sprint.</text>
  <rect x="72" y="298" width="334" height="102" fill="#fafaf7" rx="4"/>
  <rect x="72" y="298" width="334" height="22" fill="#febd10" rx="4"/>
  <rect x="72" y="312" width="334" height="8" fill="#febd10"/>
  <text x="82" y="313" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#0f2240">15-25 min</text>
  <text x="172" y="313" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">D&#233;finition des 2-3 R&#233;sultats Cl&#233;s</text>
  <circle cx="86" cy="330" r="3" fill="#febd10"/>
  <text x="96" y="334" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Formul&#233;s par l&#8217;&#233;quipe.</text>
  <circle cx="86" cy="352" r="3" fill="#febd10"/>
  <text x="96" y="356" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Valid&#233;s par le manager.</text>
  <circle cx="86" cy="374" r="3" fill="#febd10"/>
  <text x="96" y="378" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Mesurables et dat&#233;s.</text>
  <rect x="414" y="298" width="334" height="102" fill="#fafaf7" rx="4"/>
  <rect x="414" y="298" width="334" height="22" fill="#febd10" rx="4"/>
  <rect x="414" y="312" width="334" height="8" fill="#febd10"/>
  <text x="424" y="313" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#0f2240">25-30 min</text>
  <text x="514" y="313" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Accord sur le rythme</text>
  <circle cx="428" cy="330" r="3" fill="#febd10"/>
  <text x="438" y="334" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Dashboard &#224; jour 15 min apr&#232;s chaque Sprint Review.</text>
  <circle cx="428" cy="352" r="3" fill="#febd10"/>
  <text x="438" y="356" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Escalades document&#233;es.</text>
  <circle cx="428" cy="374" r="3" fill="#febd10"/>
  <text x="438" y="378" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Check-in OKR en fin de Sprint Review.</text>
  <rect x="72" y="424" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="438" font-family="Helvetica,Arial,sans-serif" font-size="8"
        font-weight="bold" fill="#ffffff" letter-spacing="0.8">CE QUI N&#8217;A PAS SA PLACE ICI</text>
  <rect x="72" y="448" width="676" height="50" fill="#ffffff" rx="2"/>
  <text x="86" y="464" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#10005; D&#233;tails techniques et choix d&#8217;architecture</text>
  <text x="86" y="478" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#10005; Estimations en story points</text>
  <text x="86" y="492" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#10005; Revue de code ou de backlog</text>
  <rect x="72" y="512" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="526" font-family="Helvetica,Arial,sans-serif" font-size="8"
        font-weight="bold" fill="#ffffff" letter-spacing="0.8">KPIS DE LA RELATION MANAGER</text>
  <rect x="72" y="536" width="676" height="72" fill="#fafaf7" rx="2"/>
  <circle cx="86" cy="550" r="3" fill="#febd10"/>
  <text x="96" y="554" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">D&#233;lai de r&#233;solution des escalades : cible < 5 jours ouvr&#233;s</text>
  <circle cx="86" cy="566" r="3" fill="#febd10"/>
  <text x="96" y="570" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">R&#233;unions OKR tenues dans le trimestre : cible 100 %</text>
  <circle cx="86" cy="582" r="3" fill="#febd10"/>
  <text x="96" y="586" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">D&#233;cisions manager trac&#233;es dans le dashboard</text>
  <circle cx="86" cy="598" r="3" fill="#febd10"/>
  <text x="96" y="602" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Engagement manager : pose-t-il des questions bas&#233;es sur les donn&#233;es ?</text>
  <!-- FOOTER -->
  <line x1="72" y1="1078" x2="748" y2="1078" stroke="#febd10" stroke-width="1"/>
  <rect x="372" y="1083" width="50" height="18" rx="9" fill="#0f2240"/>
  <text x="397" y="1095" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="8" font-weight="bold" fill="#febd10">IV-14.5</text>
  <text x="72" y="1095" font-family="Helvetica,Arial,sans-serif" font-size="7"
        fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M.</text>
  <text x="748" y="1095" text-anchor="end" font-family="Helvetica,Arial,sans-serif"
        font-size="7" fill="#bbbbbb">Chapitre 14 · Partie 4</text>
</svg>