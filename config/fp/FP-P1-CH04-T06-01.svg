<text x="72" y="1089"
      style="font-family:'Helvetica';font-size:7.5px;fill:#bbb;">SOURCE : Le Syst&#232;me S.A.L.I.M.</text>
<text x="677" y="1089"
      style="font-family:'Helvetica';font-size:7.5px;fill:#bbb;">Le Syst&#232;me S.A.L.I.M.</text>
</svg>