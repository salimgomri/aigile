  <text x="542" y="534" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Principe 1. 1 outil, 1 c&#233;r&#233;monie.</text>
  <text x="542" y="546" font-family="Helvetica,sans-serif" font-size="8" fill="#febd10"
