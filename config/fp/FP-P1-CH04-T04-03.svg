<rect x="0" y="0" width="794" height="1123" style="fill:#fff;"/>
<rect x="0" y="0" width="54" height="1123" style="fill:#febd10;"/>

<!-- LOGO (recree vectoriel, position equivalente a l'asset cat1.svg) -->

<g transform="translate(8,40)">
  <ellipse cx="19" cy="34" rx="17" ry="38" style="fill:none;stroke:#0f2240;stroke-width:1.1px;opacity:0.55;" transform="rotate(8 19 34)"/>
  <ellipse cx="19" cy="34" rx="12" ry="30" style="fill:none;stroke:#0f2240;stroke-width:1.1px;opacity:0.4;" transform="rotate(8 19 34)"/>
  <ellipse cx="19" cy="34" rx="7" ry="22" style="fill:none;stroke:#0f2240;stroke-width:1.1px;opacity:0.3;" transform="rotate(8 19 34)"/>
  <circle cx="19" cy="6" r="3.2" style="fill:#0f2240;"/>
  <path d="M19,9 L19,28 M19,16 L11,24 M19,16 L27,24 M19,28 L13,40 M19,28 L25,40"
        style="stroke:#0f2240;stroke-width:1.6px;stroke-linecap:round;fill:none;"/>
</g>


<!-- TEXTE VERTICAL -->
<g transform="matrix(-0,-1,1,-0,-893.165,946.835)">
  <text x="-36.025px" y="920px"
        style="font-family:'Georgia',serif;font-size:11px;fill:#0f2240;">
    L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px
             26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px
             68.29px 72.906px 76.201px 86.73px"
            y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px
               920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">
      E SYST&#200;ME S.A.L.I.M.
    </tspan>
  </text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">CHECKLIST D&#201;CISION &gt; ESTIMATION</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP I-4.3</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">Estimation silencieuse en 4 rounds</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">Pas de biais du premier parleur. Backlog estim&#233; jusqu'&#224; 4x moins de temps.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">SM / DEV</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">D&#233;roul&#233; en 4 rounds pour remplacer le Planning Poker classique</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">En session d'estimation, apr&#232;s un Refinement rigoureux</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Moins de d&#233;bats, convergence plus rapide, vitesse pas qualit&#233;</text>

<!-- Conditions prealables -->
<rect x="72" y="158" width="650" height="50" style="fill:#fafaf7;"/>
<text x="84" y="178" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">CONDITIONS PR&#201;ALABLES, NON N&#201;GOCIABLES</text>
<text x="84" y="196" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Toute l'&#233;quipe a lu toutes les stories avant la session. Le SM pr&#233;pare : post-its + Fibonacci (1 2 3 5 8 13 20 ? inf).</text>

<!-- ROUND 1 -->
<circle cx="90" cy="245" r="14" style="fill:#0f2240;"/>
<text x="90" y="250" text-anchor="middle" style="font-family:'Helvetica';font-size:11px;font-weight:bold;fill:#febd10;">1</text>
<rect x="112" y="224" width="610" height="46" style="fill:#fafaf7;"/>
<text x="124" y="242" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">VIDER LES STORIES</text>
<text x="124" y="258" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Chaque membre note silencieusement son estimation, post-it retourn&#233;. Personne ne parle, personne</text>
<text x="124" y="272" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">ne regarde les autres. Retournement simultan&#233;. Le SM note l'&#233;cart min/max.</text>

<!-- ROUND 2 -->
<circle cx="90" cy="305" r="14" style="fill:#0f2240;"/>
<text x="90" y="310" text-anchor="middle" style="font-family:'Helvetica';font-size:11px;font-weight:bold;fill:#febd10;">2</text>
<rect x="112" y="284" width="610" height="46" style="fill:#fff;"/>
<text x="124" y="302" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">REPOSER LES POINTS</text>
<text x="124" y="318" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&#201;cart faible : validation directe, on passe. &#201;cart fort : story marqu&#233;e pour le round 3.</text>
<text x="124" y="332" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.7;">Rep&#232;re : entre 6 et 7 stories sur 10 convergent directement. Ton &#233;quipe trouvera son ratio.</text>

<!-- ROUND 3 -->
<circle cx="90" cy="365" r="14" style="fill:#0f2240;"/>
<text x="90" y="370" text-anchor="middle" style="font-family:'Helvetica';font-size:11px;font-weight:bold;fill:#febd10;">3</text>
<rect x="112" y="344" width="610" height="46" style="fill:#fafaf7;"/>
<text x="124" y="362" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">DISCUTER LES &#201;CARTS</text>
<text x="124" y="378" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Seuls parlent : le plus bas et le plus haut. 2 minutes max chacun. Pas de d&#233;bat g&#233;n&#233;ral.</text>
<text x="124" y="392" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.7;">Le d&#233;saccord r&#233;v&#232;le ce que la story n'avait pas dit explicitement.</text>

<!-- ROUND 4 -->
<circle cx="90" cy="425" r="14" style="fill:#0f2240;"/>
<text x="90" y="430" text-anchor="middle" style="font-family:'Helvetica';font-size:11px;font-weight:bold;fill:#febd10;">4</text>
<rect x="112" y="404" width="610" height="46" style="fill:#fff;"/>
<text x="124" y="422" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">R&#201;ESTIMER</text>
<text x="124" y="438" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">2e round sur les stories discut&#233;es. Convergence en g&#233;n&#233;ral.</text>
<text x="124" y="452" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.7;">&#201;cart persistant apr&#232;s 2 rounds : story trop floue, retour en Refinement. Ne pas forcer.</text>

<!-- fleches verticales -->
<g style="stroke:#febd10;stroke-width:2px;">
<line x1="90" y1="259" x2="90" y2="291"/>
<line x1="90" y1="319" x2="90" y2="351"/>
<line x1="90" y1="379" x2="90" y2="411"/>
</g>

<!-- Nota Bene -->
<rect x="72" y="478" width="650" height="56" style="fill:#0f2240;"/>
<text x="84" y="500" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#febd10;">NOTA BENE</text>
<text x="84" y="518" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#fff;">L'estimation silencieuse acc&#233;l&#232;re. Elle ne remplace pas le Refinement. Une story floue</text>
<text x="84" y="532" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#fff;">estim&#233;e silencieusement reste une story floue.</text>

<!-- bloc manager -->
<text x="72" y="582" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">CE QUE LE MANAGER OBSERVE</text>
<path d="M72,588l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="608" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Si l'&#233;quipe change sa fa&#231;on d'estimer, ce n'est pas un caprice de process. Le signal &#224; observer :</text>
<text x="72" y="624" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">une convergence plus rapide en round 2 sur 6 &#224; 7 stories sur 10. C'est un indicateur de maturit&#233;</text>
<text x="72" y="640" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">d'&#233;quipe, pas un raccourci de qualit&#233;, et &#231;a se traduit par moins d'heures de r&#233;union.</text>

<!-- bloc dev : estimation = conversation pas contrat -->
<rect x="54" y="680" width="740" height="86" style="fill:#fafaf7;"/>
<text x="72" y="704" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">POUR LE D&#201;VELOPPEUR : UNE ESTIMATION N'EST PAS UNE DATE</text>
<path d="M72,710l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="730" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">L'estimation en story points est relative : elle donne une fourchette, pas un engagement de date.</text>
<text x="72" y="746" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Si une story reste en d&#233;saccord apr&#232;s deux rounds, elle est trop floue et retourne en Refinement :</text>
<text x="72" y="760" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">ce n'est pas un &#233;chec de l'&#233;quipe.</text>

<!-- Source citation -->
<text x="72" y="800" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.6;">Mike Cohn, Agile Estimating and Planning (2005) : le biais du premier parleur ancre toutes les estimations suivantes.</text>

