<line x1="54" y1="658" x2="794" y2="658" style="stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="72" y="598" style="font-family:Helvetica;font-size:10px;font-weight:bold;fill:#febd10;">06</text>
<text x="110" y="598" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">Score partag&#233; avec l'&#233;quipe + conversation ouverte</text>
<text x="110" y="614" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Score agr&#233;g&#233; seulement. Ouvrir : quelles conditions ont chan</text>
