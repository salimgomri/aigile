<text x="72" y="518" style="font-family:Helvetica;font-size:10px;font-weight:bold;fill:#febd10;">05</text>
<text x="110" y="518" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">Un geste de s&#233;curit&#233; visible appliqu&#233; par le SM</text>
<text x="110" y="534" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Cette semaine devant l'&#233;quipe. Geste 1 ou 2 de la FP IV-15.2 (Lea</text>
<text x="110" y="548" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">rner ou Inclusion Safety).</text>
