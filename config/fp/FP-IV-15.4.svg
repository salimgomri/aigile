<rect x="54" y="768" width="740" height="40" style="fill:#febd10;opacity:0.12;"/>
<text x="424" y="784" text-anchor="middle" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#0f2240;">La securite psychologique est fragile. Elle peut etre detruite en un incident.</text>
<text x="424" y="800" text-anchor="middle" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#0f2240;">La restauration passe par accumulation de moments surs, pas par une declaration.</text>
<text x="424" y="826" text-anchor="middle" style="font-family:Helvetica;font-size:7.5px;fill:#bbbbbb;">Voir aussi : FP IV-15.1 (Diagnostic Edmondson) &#183; FP IV-15.2 (6 gestes SM) &#183; FP IV-15.3 (Dashboard Culture)</text>
