<line x1="262" y1="82" x2="262" y2="144" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="276" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">QUOI</text>
<text x="276" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Sequence intervention apres incident ayant detruit ou diminu</text>
<text x="276" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">e la securite psychologique.</text>
<line x1="466" y1="82" x2="466" y2="144" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="480" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">QUAND</text>
<text x="480" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Dans les 48h apres incident grave : erreur sanctionnee </text>
<text x="480" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">en public, conflit ouvert en ceremonie.</text>
<line x1="628" y1="82" x2="628" y2="144" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="642" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">VALEUR APPORT&#201;E</text>
<text x="642" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Ne pas laisser l'incident se solidifier en silence</text>
<text x="642" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">. Chaque jour sans action = validation implicite.</text>
<line x1="54" y1="150" x2="794" y2="150" style="stroke:#febd10;stroke-width:1.5px;"/>
<rect x="54" y="158" width="740" height="22" style="fill:#0f2240;"/>
<text x="72" y="172" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">#</text>
<text x="110" y="172" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">CRIT&#200;RE</text>
<text x="528" y="172" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">GO</text>
<text x="572" y="172" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">NO GO</text>
<text x="626" y="172" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">PRIORIT&#201;</text>
<text x="714" y="172" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">NOTES</text>
