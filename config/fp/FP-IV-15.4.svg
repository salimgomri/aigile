<text x="72" y="56" style="font-family:Georgia,serif;font-size:24px;font-weight:bold;fill:#0f2240;">Protocole Apr&#232;s Incident Culturel</text>
<text x="72" y="72" style="font-family:Georgia,serif;font-size:11px;font-style:italic;fill:#febd10;">Mesure hors cycle &#183; Actions SM &#183; Recuperation securite psychologique</text>
