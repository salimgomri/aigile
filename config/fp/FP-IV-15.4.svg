<text x="72" y="198" style="font-family:Helvetica;font-size:10px;font-weight:bold;fill:#febd10;">01</text>
<text x="110" y="198" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">L'incident est nomm&#233; explicitement</text>
<text x="110" y="214" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Dire ce qui s'est pass&#233; sans minimiser ni relativiser. Le silence</text>
<text x="110" y="228" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;"> valide l'incident.</text>
