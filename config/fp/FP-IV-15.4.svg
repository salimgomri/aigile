<text x="72" y="438" style="font-family:Helvetica;font-size:10px;font-weight:bold;fill:#febd10;">04</text>
<text x="110" y="438" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">One-to-one MG avec le SM sur l'impact observ&#233;</text>
<text x="110" y="454" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Nommer l'impact comportemental (estimations conservatrices, silence en</text>
<text x="110" y="468" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;"> retro...) sans attaquer l'intention.</text>
