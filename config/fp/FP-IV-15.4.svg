<text x="72" y="358" style="font-family:Helvetica;font-size:10px;font-weight:bold;fill:#febd10;">03</text>
<text x="110" y="358" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">One-to-one SM avec la personne impact&#233;e</text>
<text x="110" y="374" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Avant la prochaine c&#233;r&#233;monie collective. Pas de discussion d</text>
<text x="110" y="388" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">e groupe sur l'incident.</text>
