<text x="72" y="278" style="font-family:Helvetica;font-size:10px;font-weight:bold;fill:#febd10;">02</text>
<text x="110" y="278" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">La mesure Edmondson hors cycle est lanc&#233;e</text>
<text x="110" y="294" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Anonyme, dans les 2 semaines. Score agr&#233;g&#233; uniquement. Jamai</text>
<text x="110" y="308" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">s corr&#233;l&#233; &#224; des noms.</text>
