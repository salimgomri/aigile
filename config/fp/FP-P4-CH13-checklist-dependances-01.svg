<text x="520" y="233" style="font-family:&#x27;Helvetica&#x27;;font-size:8px;fill:#fff;text-anchor:middle;">Sprint N</text>
<text x="520" y="244" style="font-family:&#x27;Helvetica&#x27;;font-size:7px;fill:#fff;text-anchor:middle;">Blocage en cascade</text>
