<text x="80" y="185"
      style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:10px;fill:#fff;">Si ton &#233;quipe d&#233;pend d&#x27;une livraison au sprint N, cette livraison doit &#234;tre dans le backlog de l&#x27;autre &#233;quipe au sprint N-2 minimum.</text>

