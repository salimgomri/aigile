<text x="590" y="236" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">N-3 si complexit&#233;</text>
<text x="590" y="247" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">technique &#233;lev&#233;e</text>

<!-- CHECKLIST DEPENDANCES -->
<rect x="66" y="272" width="662" height="24" style="fill:#0f2240;"/>
<text x="80" y="288" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#fff;">CHECKLIST : CHAQUE D&#201;PENDANCE IDENTIFI&#201;E DOIT AVOIR</text>

<!-- Lignes checklist -->
<rect x="66" y="296" width="662" height="1" style="fill:#e0e0e0;"/>
<!-- Item 1 -->
<rect x="66" y="297" width="662" height="40" style="fill:#fff;"/>
<text x="80" y="313" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#febd10;">01</text>
<text x="105" y="311" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#0f2240;">Un propri&#233;taire nomm&#233;</text>
<text x="105" y="325" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#555;">Si personne ne sait qui d&#233;bloque, personne ne d&#233;bloque. Un nom. Pas une &#233;quipe.</text>
<rect x="66" y="337" width="662" height="1" style="fill:#e0e0e0;"/>
<!-- Item 2 -->
<rect x="66" y="338" width="662" height="40" style="fill:#fafaf7;"/>
<text x="80" y="354" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#febd10;">02</text>
<text x="105" y="352" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#0f2240;">Un d&#233;lai explicit&#233;</text>
<text x="105" y="366" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#555;">Sprint N-2 minimum. Date pr&#233;cise si possible. Pas "bient&#244;t".</text>
<rect x="66" y="378" width="662" height="1" style="fill:#e0e0e0;"/>
<!-- Item 3 -->
<rect x="66" y="379" width="662" height="40" style="fill:#fff;"/>
<text x="80" y="395" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#febd10;">03</text>
<text x="105" y="393" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#0f2240;">Un statut visible</text>
<text x="105" y="407" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#555;">En cours / Bloqu&#233; / R&#233;solu. Mis &#224; jour au Scrum of Scrums hebdo.</text>
<rect x="66" y="419" width="662" height="1" style="fill:#e0e0e0;"/>
<!-- Item 4 -->
<rect x="66" y="420" width="662" height="40" style="fill:#fafaf7;"/>
<text x="80" y="436" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#febd10;">04</text>
<text x="105" y="434" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#0f2240;">Une escalade si bloqu&#233;e au sprint N-1</text>
<text x="105" y="448" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#555;">Sprint 3 d&#x27;un PI de 5 sprints : options = livrable partiel sprint 4 OU descope + Owned dans ROAM.</text>
<rect x="66" y="460" width="662" height="1" style="fill:#e0e0e0;"/>

<!-- BLOC ROAM -->
<rect x="66" y="469" width="662" height="24" style="fill:#0f2240;"/>
<text x="80" y="485" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#fff;">TRAITEMENT ROAM : RISQUES NON R&#201;SOLUS AU CONFIDENCE VOTE</text>

<!-- 4 colonnes ROAM -->
<rect x="66" y="493" width="165" height="100" style="fill:#2a7a2a;rx:2px;"/>
<text x="148" y="508" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#fff;text-anchor:middle;">R</text>
<text x="148" y="522" style="font-family:&#x27;Helvetica&#x27;;font-size:8.5px;font-weight:bold;fill:#fff;text-anchor:middle;">RESOLVED</text>
<text x="148" y="538" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#fff;text-anchor:middle;">R&#233;solu avant</text>
<text x="148" y="550" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#fff;text-anchor:middle;">la fin du PI Planning</text>

<rect x="237" y="493" width="163" height="100" style="fill:#febd10;rx:2px;"/>
<text x="318" y="508" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#0f2240;text-anchor:middle;">O</text>
<text x="318" y="522" style="font-family:&#x27;Helvetica&#x27;;font-size:8.5px;font-weight:bold;fill:#0f2240;text-anchor:middle;">OWNED</text>
<text x="318" y="538" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#0f2240;text-anchor:middle;">Propri&#233;taire nomm&#233;</text>
<text x="318" y="550" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#0f2240;text-anchor:middle;">qui prend en charge</text>

<rect x="406" y="493" width="163" height="100" style="fill:#e07000;rx:2px;"/>
<text x="487" y="508" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#fff;text-anchor:middle;">A</text>
<text x="487" y="522" style="font-family:&#x27;Helvetica&#x27;;font-size:8.5px;font-weight:bold;fill:#fff;text-anchor:middle;">ACCEPTED</text>
<text x="487" y="538" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#fff;text-anchor:middle;">Risque connu</text>
<text x="487" y="550" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#fff;text-anchor:middle;">accept&#233; en conscience</text>

<rect x="575" y="493" width="153" height="100" style="fill:#cc3333;rx:2px;"/>
<text x="651" y="508" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#fff;text-anchor:middle;">M</text>
<text x="651" y="522" style="font-family:&#x27;Helvetica&#x27;;font-size:8.5px;font-weight:bold;fill:#fff;text-anchor:middle;">MITIGATED</text>
<text x="651" y="538" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#fff;text-anchor:middle;">Plan de mitigation</text>
<text x="651" y="550" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#fff;text-anchor:middle;">trac&#233; et nomm&#233;</text>

<text x="148" y="578" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8px;font-style:italic;fill:#2a7a2a;text-anchor:middle;">Le mieux</text>
<text x="318" y="578" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8px;font-style:italic;fill:#0f2240;text-anchor:middle;">Acceptable</text>
<text x="487" y="578" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8px;font-style:italic;fill:#e07000;text-anchor:middle;">&#192; surveiller</text>
<text x="651" y="578" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8px;font-style:italic;fill:#cc3333;text-anchor:middle;">Risque r&#233;siduel</text>

<!-- SCRUM OF SCRUMS FORMAT -->
<rect x="66" y="606" width="662" height="24" style="fill:#0f2240;"/>
<text x="80" y="622" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#fff;">SCRUM OF SCRUMS : FORMAT 15 MINUTES</text>

<rect x="66" y="630" width="662" height="36" style="fill:#fafaf7;"/>
<text x="80" y="643" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#febd10;">Q1</text>
<text x="105" y="643" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:10px;fill:#0f2240;">Quelle d&#233;pendance mon &#233;quipe a vers une autre &#233;quipe cette semaine ?</text>
<text x="80" y="659" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#bbb;">Chaque SM r&#233;pond en 1 phrase. Pas de d&#233;tails en s&#233;ance.</text>

<rect x="66" y="666" width="662" height="1" style="fill:#e0e0e0;"/>
<rect x="66" y="667" width="662" height="36" style="fill:#fff;"/>
<text x="80" y="680" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#febd10;">Q2</text>
<text x="105" y="680" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:10px;fill:#0f2240;">Qui en est propri&#233;taire ?</text>
<text x="80" y="696" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#bbb;">Un nom. Si personne ne sait : c&#x27;est le premier blocage &#224; r&#233;soudre.</text>

<rect x="66" y="703" width="662" height="1" style="fill:#e0e0e0;"/>
<rect x="66" y="704" width="662" height="36" style="fill:#fafaf7;"/>
<text x="80" y="717" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#febd10;">Q3</text>
<text x="105" y="717" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:10px;fill:#0f2240;">Quel est son statut ?</text>
<text x="80" y="733" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#bbb;">En cours / Bloqu&#233; / R&#233;solu. Tout le reste va en r&#233;union s&#233;par&#233;e, programm&#233;e sur le champ.</text>

<!-- RÈGLE FINALE -->
<rect x="66" y="750" width="662" height="44" style="fill:#0f2240;rx:4px;"/>
<text x="397" y="769" style="font-family:&#x27;Georgia&#x27;,serif;font-size:11px;font-weight:bold;fill:#febd10;text-anchor:middle;">Le Scrum of Scrums n&#x27;est pas un espace de r&#233;solution.</text>
<text x="397" y="785" style="font-family:&#x27;Georgia&#x27;,serif;font-size:11px;font-weight:bold;fill:#fff;text-anchor:middle;">C&#x27;est un espace de d&#233;tection.</text>

