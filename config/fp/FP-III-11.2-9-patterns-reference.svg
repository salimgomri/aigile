<text x="72" y="1089" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#bbb;">SOURCE : Le Syst&#232;me S.A.L.I.M.</text>
<text x="677" y="1089" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#bbb;">Chapitre 11 . Partie 3</text>

