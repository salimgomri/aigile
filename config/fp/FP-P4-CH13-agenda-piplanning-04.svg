<text x="418" y="518" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#bbb;">En parall&#232;le des &#233;quipes.</text>
<text x="710" y="468" style="font-family:&#x27;Helvetica&#x27;;font-size:7.5px;fill:#bbb;text-anchor:middle;">parall&#232;le</text>

