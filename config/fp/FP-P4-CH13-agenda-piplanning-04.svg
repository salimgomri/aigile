<text x="80" y="390" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9.5px;fill:#555;">Livrable : &#233;tat global des d&#233;pendances visible. Blocages identifi&#233;s avant Jour 2.</text>
<text x="614" y="362" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#febd10;">3 min max</text>
<text x="614" y="376" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#febd10;">par &#233;quipe</text>

