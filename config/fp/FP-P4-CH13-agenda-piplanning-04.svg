<text x="80" y="248" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9.5px;fill:#555;">Livrable : Backlog ART prioris&#233; visible par toutes les &#233;quipes. Vision produit partag&#233;e.</text>
<text x="614" y="220" style="font-family:&#x27;Helvetica&#x27;;font-size:8px;fill:#bbb;">Pr&#233;requis</text>
