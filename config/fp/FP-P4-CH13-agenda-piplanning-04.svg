<text x="80" y="584" style="font-family:&#x27;Helvetica&#x27;;font-size:10px;font-weight:bold;fill:#0f2240;">ROAMing + Confidence Vote</text>
<text x="80" y="598" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9.5px;fill:#555;">Anim&#233; par : RTE. ROAMing des risques. Confidence Vote fist-of-five par &#233;quipe.</text>
<text x="80" y="612" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9.5px;fill:#555;">Livrable : plans PI valid&#233;s. Risques ROAM&#233;s et nomm&#233;s. Vote sup. 3.5 sur 5.</text>
<text x="614" y="584" style="font-family:&#x27;Helvetica&#x27;;font-size:8px;fill:#bbb;">Condition</text>
<text x="614" y="598" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#cc3333;">Vote min.</text>
<text x="614" y="612" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#cc3333;">3.5 / 5</text>

