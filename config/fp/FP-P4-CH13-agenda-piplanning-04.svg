<text x="80" y="305" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9.5px;fill:#555;">Anim&#233; par : chaque &#233;quipe (SM + PO)</text>
<text x="80" y="319" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9.5px;fill:#555;">Livrable : 5 plans sprints draft + Team Objectives r&#233;dig&#233;s en valeur + d&#233;pendances identifi&#233;es.</text>
<text x="614" y="291" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;font-style:italic;fill:#febd10;">Min. 3 TO</text>
