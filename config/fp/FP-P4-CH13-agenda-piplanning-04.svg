<text x="131" y="710" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;fill:#fff;text-anchor:middle;">Confiant</text>
<text x="131" y="724" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;fill:#fff;text-anchor:middle;">PI peut d&#233;marrer</text>

<rect x="206" y="674" width="130" height="60" style="fill:#febd10;rx:2px;"/>
<text x="271" y="692" style="font-family:&#x27;Helvetica&#x27;;font-size:18px;font-weight:bold;fill:#0f2240;text-anchor:middle;">3</text>
