<text x="271" y="724" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;fill:#0f2240;text-anchor:middle;">Acceptable si justifi&#233;</text>

<rect x="346" y="674" width="130" height="60" style="fill:#cc3333;rx:2px;"/>
<text x="411" y="692" style="font-family:&#x27;Helvetica&#x27;;font-size:18px;font-weight:bold;fill:#fff;text-anchor:middle;">1-2</text>
<text x="411" y="710" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;fill:#fff;text-anchor:middle;">Pas confiant</text>
<text x="411" y="724" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:8.5px;fill:#fff;text-anchor:middle;">Discussion avant relance</text>

<rect x="496" y="674" width="232" height="60" style="fill:#0f2240;rx:2px;"/>
<text x="612" y="692" style="font-family:&#x27;Helvetica&#x27;;font-size:9px;font-weight:bold;fill:#febd10;text-anchor:middle;">Tous &#224; 5 sans r&#233;serve ?</text>
<text x="612" y="708" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#fff;text-anchor:middle;">Demande 1 phrase par &#233;quipe.</text>
<text x="612" y="722" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:9px;font-style:italic;fill:#cc3333;text-anchor:middle;">Signal de dysfonctionnement.</text>

