  <line x1="72" y1="380" x2="748" y2="380" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="108" y1="314" x2="108" y2="380" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="420" y1="314" x2="420" y2="380" stroke="#e0e0e0" stroke-width="0.5"/>
