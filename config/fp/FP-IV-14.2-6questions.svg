  <text x="430" y="348" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">organisationnels</text>
  <text x="628" y="334" font-family="Georgia,serif" font-size="8" fill="#0f2240">Sprint Review</text>
  <text x="628" y="348" font-family="Georgia,serif" font-size="8" fill="#0f2240">(fin de</text>
  <text x="628" y="362" font-family="Georgia,serif" font-size="8" fill="#0f2240">c&#233;r&#233;monie)</text>
  <rect x="72" y="380" width="676" height="66" fill="#fafaf7"/>
  <line x1="72" y1="446" x2="748" y2="446" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="108" y1="380" x2="108" y2="446" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="420" y1="380" x2="420" y2="446" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="618" y1="380" x2="618" y2="446" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="86" y="418" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#febd10">4</text>
  <text x="118" y="400" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Comment &#231;a va, les gens ?</text>
  <text x="430" y="400" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Dashboard : Happiness</text>
  <text x="430" y="414" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Index / Cadran Bien-&#234;tre</text>
  <text x="628" y="400" font-family="Georgia,serif" font-size="8" fill="#0f2240">Seul</text>
  <rect x="72" y="446" width="676" height="66" fill="#ffffff"/>
  <line x1="72" y1="512" x2="748" y2="512" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="108" y1="446" x2="108" y2="512" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="420" y1="446" x2="420" y2="512" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="618" y1="446" x2="618" y2="512" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="86" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#febd10">5</text>
  <text x="118" y="466" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">On avance vers nos OKR ?</text>
  <text x="430" y="466" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">OKR Check-in /</text>
  <text x="430" y="480" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Confidence Rate</text>
  <text x="628" y="466" font-family="Georgia,serif" font-size="8" fill="#0f2240">1:1 mensuel ou</text>
  <text x="628" y="480" font-family="Georgia,serif" font-size="8" fill="#0f2240">r&#233;union</text>
  <text x="628" y="494" font-family="Georgia,serif" font-size="8" fill="#0f2240">OKR</text>
  <rect x="72" y="512" width="676" height="66" fill="#fafaf7"/>
  <line x1="72" y1="578" x2="748" y2="578" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="108" y1="512" x2="108" y2="578" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="420" y1="512" x2="420" y2="578" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="618" y1="512" x2="618" y2="578" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="86" y="550" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#febd10">6</text>
  <text x="118" y="532" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Que dois-je d&#233;cider maintenant</text>
  <text x="118" y="547" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">?</text>
  <text x="430" y="532" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Escalades trac&#233;es</text>
  <text x="430" y="546" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">dans le dashboard</text>
  <text x="628" y="532" font-family="Georgia,serif" font-size="8" fill="#0f2240">Conversation</text>
  <rect x="72" y="588" width="676" height="32" fill="#0f2240" rx="4"/>
  <text x="410" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#febd10" letter-spacing="1">DISCIPLINE</text>
  <text x="410" y="615" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#ffffff">Ne pas transformer en r&#233;union ce que le dashboard peut r&#233;soudre seul.</text>
