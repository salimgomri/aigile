  <line x1="618" y1="182" x2="618" y2="248" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="86" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#febd10">1</text>
  <text x="118" y="202" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Est-ce que l&#8217;&#233;quipe</text>
  <text x="118" y="217" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">livre ce qu&#8217;elle promet ?</text>
  <text x="430" y="202" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Dashboard : On Time /</text>
  <text x="430" y="216" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Team Predictability</text>
  <text x="628" y="202" font-family="Georgia,serif" font-size="8" fill="#0f2240">Seul</text>
  <rect x="72" y="248" width="676" height="66" fill="#fafaf7"/>
  <line x1="72" y1="314" x2="748" y2="314" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="108" y1="248" x2="108" y2="314" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="420" y1="248" x2="420" y2="314" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="618" y1="248" x2="618" y2="314" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="86" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#febd10">2</text>
  <text x="118" y="268" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Est-ce que je suis dans les temps</text>
  <text x="118" y="283" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">et le budget ?</text>
  <text x="430" y="268" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Dashboard : On Time + On</text>
  <text x="430" y="282" font-family="Georgia,serif" font-size="8.5" font-style="italic" fill="#0f2240">Budget</text>
  <text x="628" y="268" font-family="Georgia,serif" font-size="8" fill="#0f2240">Seul</text>
