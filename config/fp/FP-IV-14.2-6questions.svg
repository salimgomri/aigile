  <text x="86" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#febd10">3</text>
  <text x="118" y="334" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">Qu&#8217;est-ce qui bloque vraiment</text>
  <text x="118" y="349" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#0f2240">l&#8217;&#233;quipe ?</text>
