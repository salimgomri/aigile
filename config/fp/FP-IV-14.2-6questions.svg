  <!-- Sous-titre -->
  <text x="72" y="74" font-family="Georgia,serif" font-size="10" font-style="italic"
        fill="#febd10">Si ces 6 questions ont des r&#233;ponses claires, la relation fonctionne.</text>
  <!-- BLOC 4 CHAMPS -->
  <rect x="54" y="78" width="740" height="68" fill="#febd10"/>
  <text x="72" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">POUR QUI</text>
  <text x="72" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">MG, DC</text>
  <line x1="252" y1="85" x2="252" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="257" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUOI</text>
  <text x="257" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">V&#233;rifier que le</text>
  <text x="257" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">manager a acc&#232;s aux 6</text>
  <text x="257" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">r&#233;ponses cl&#233;s</text>
  <line x1="437" y1="85" x2="437" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="442" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUAND L&#39;UTILISER</text>
  <text x="442" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">En d&#233;but de</text>
  <text x="442" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">collaboration, en Sprint</text>
  <text x="442" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Review, en 1:1 mensuel</text>
  <line x1="622" y1="85" x2="622" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="627" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">VALEUR APPORT&#201;E</text>
  <text x="627" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Supprime les r&#233;unions</text>
  <text x="627" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">de statut inutiles. Le</text>
  <text x="627" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">dashboard r&#233;pond</text>

  <rect x="72" y="160" width="676" height="22" fill="#0f2240" rx="2"/>
