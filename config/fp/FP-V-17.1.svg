<text x="72" y="237" font-family="Georgia,serif" font-size="10.5"
      fill="#0f2240" font-weight="bold">V&#233;locit&#233; +30&#160;%</text>
<text x="72" y="253" font-family="Georgia,serif" font-size="9"
      fill="#0f2240" font-style="italic">Sprint apr&#232;s sprint</text>
<text x="265" y="240" font-family="Georgia,serif" font-size="9.5"
      fill="#bbbbbb" font-style="italic">L&#39;&#233;quipe est plus</text>
<text x="265" y="255" font-family="Georgia,serif" font-size="9.5"
      fill="#bbbbbb" font-style="italic">productive</text>
<text x="507" y="234" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Produit plus vite. Comprend-elle</text>
<text x="507" y="248" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">ce qu&#39;elle produit ? V&#233;rifier le</text>
<text x="507" y="262" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">CFR et la qualit&#233; des Sprint Reviews.</text>
<line x1="54" y1="288" x2="794" y2="288" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- LIGNE 2 : CFR -->
<rect x="54" y="288" width="740" height="70" fill="#ffffff"/>
<line x1="248" y1="288" x2="248" y2="358" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="490" y1="288" x2="490" y2="358" stroke="#e0e0e0" stroke-width="0.8"/>
<text x="72" y="307" font-family="Georgia,serif" font-size="10.5"
      fill="#0f2240" font-weight="bold">CFR stable &#224; 8&#160;%</text>
<text x="72" y="323" font-family="Georgia,serif" font-size="9"
      fill="#0f2240" font-style="italic">Change Failure Rate constant</text>
<text x="265" y="310" font-family="Georgia,serif" font-size="9.5"
      fill="#bbbbbb" font-style="italic">Qualit&#233; acceptable</text>
<text x="507" y="304" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Si DF +30&#160;% aussi : CFR stable</text>
<text x="507" y="318" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">= d&#233;gradation relative. Plus de</text>
<text x="507" y="332" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">d&#233;ploiements, m&#234;me taux d&#39;&#233;chec.</text>
<line x1="54" y1="358" x2="794" y2="358" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- LIGNE 3 : Happiness Index -->
<rect x="54" y="358" width="740" height="70" fill="#f8f8f8"/>
<line x1="248" y1="358" x2="248" y2="428" stroke="#e0e0e0" stroke-width="0.8"/>
