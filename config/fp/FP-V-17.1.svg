<text x="72" y="760" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">LE SIGNAL LE PLUS CO&#219;TEUX</text>
<text x="72" y="776" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  Le d&#233;part d&#39;un senior sans signal pr&#233;alable. Il s&#39;&#233;tait senti d&#233;pr&#233;ci&#233; progressivement.</text>
<text x="72" y="791" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  La conversation difficile en t&#234;te-&#224;-t&#234;te, avant que &#231;a devienne structurel : c&#39;est le travail que l&#39;IA ne fait pas.</text>

<!-- BLOC COACH NOTE -->
<rect x="54" y="808" width="740" height="56" fill="#fafaf7" rx="2"/>
