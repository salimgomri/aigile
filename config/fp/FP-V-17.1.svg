<text x="72" y="393" font-family="Georgia,serif" font-size="9"
      fill="#0f2240" font-style="italic">Moyenne &#233;quipe satisfaisante</text>
<text x="265" y="380" font-family="Georgia,serif" font-size="9.5"
      fill="#bbbbbb" font-style="italic">&#201;quipe en bonne forme</text>
<text x="507" y="374" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Scores individuels homog&#232;nes ?</text>
<text x="507" y="388" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Moyenne 3.8 peut cacher un senior</text>
<text x="507" y="402" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">&#224; 2, trois juniors &#224; 4.5.</text>
<line x1="54" y1="428" x2="794" y2="428" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- LIGNE 4 : Sprint Goal -->
<rect x="54" y="428" width="740" height="70" fill="#ffffff"/>
<line x1="248" y1="428" x2="248" y2="498" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="490" y1="428" x2="490" y2="498" stroke="#e0e0e0" stroke-width="0.8"/>
<text x="72" y="447" font-family="Georgia,serif" font-size="10.5"
      fill="#0f2240" font-weight="bold">Sprint Goal 100&#160;%</text>
<text x="72" y="463" font-family="Georgia,serif" font-size="9"
      fill="#0f2240" font-style="italic">Atteinte syst&#233;matique</text>
<text x="265" y="450" font-family="Georgia,serif" font-size="9.5"
      fill="#bbbbbb" font-style="italic">&#201;quipe fiable</text>
<text x="507" y="444" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Goals formul&#233;s avec ou sans IA ?</text>
<text x="507" y="458" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Si l&#39;IA a form&#233; les goals, l&#39;atteinte</text>
<text x="507" y="472" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">mesure la conformit&#233;, pas la valeur.</text>
<line x1="54" y1="498" x2="794" y2="498" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- LIGNE 5 : Taux revision IA -->
<rect x="54" y="498" width="740" height="70" fill="#f8f8f8"/>
<line x1="248" y1="498" x2="248" y2="568" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="490" y1="498" x2="490" y2="568" stroke="#e0e0e0" stroke-width="0.8"/>
<text x="72" y="517" font-family="Georgia,serif" font-size="10.5"
      fill="#0f2240" font-weight="bold">Taux r&#233;vision IA &#8594; 0&#160;%</text>
<text x="72" y="533" font-family="Georgia,serif" font-size="9"
      fill="#0f2240" font-style="italic">Outputs accept&#233;s tels quels</text>
<text x="265" y="520" font-family="Georgia,serif" font-size="9.5"
      fill="#bbbbbb" font-style="italic">&#201;quipe efficace</text>
<text x="507" y="514" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Signal d&#39;alarme : soit le prompt est</text>
<text x="507" y="528" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">parfait (rare), soit l&#39;&#233;quipe ne relit</text>
<text x="507" y="542" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">plus. D&#233;tecter avant production.</text>
<line x1="54" y1="568" x2="794" y2="568" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- KPI MANAGERIAL IA -->
<rect x="54" y="578" width="740" height="34" fill="#0f2240" rx="2"/>
