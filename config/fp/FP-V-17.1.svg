<!-- LIGNE 1 : Velocite -->
<rect x="54" y="218" width="740" height="70" fill="#f8f8f8"/>
<line x1="248" y1="218" x2="248" y2="288" stroke="#e0e0e0" stroke-width="0.8"/>
