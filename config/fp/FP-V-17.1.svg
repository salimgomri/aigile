<text x="554" y="684" font-family="Georgia,serif" font-size="9" fill="#0f2240">Combien de propositions IA</text>
<text x="554" y="698" font-family="Georgia,serif" font-size="9" fill="#0f2240">modifi&#233;es vs accept&#233;es ?</text>
<text x="554" y="712" font-family="Georgia,serif" font-size="8.5" fill="#febd10"
