<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>

<!-- BANDE GOLD -->
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>

<!-- LOGO PLACEHOLDER -->
<rect x="6" y="60" width="42" height="42" rx="4" fill="#0f2240"/>
<text x="27" y="87" font-family="Georgia,serif" font-size="9" fill="#febd10"
      text-anchor="middle" font-weight="bold">S</text>

<!-- TEXTE VERTICAL -->
<g transform="translate(27,900) rotate(-90)">
  <text font-family="Georgia,serif" font-size="11" fill="#0f2240" font-weight="bold"
        text-anchor="middle">LE SYST&#200;ME S.A.L.I.M.</text>
</g>

<!-- HEADER -->
<rect x="54" y="0" width="740" height="78" fill="#ffffff"/>
<text x="72" y="22" font-family="Helvetica,Arial,sans-serif" font-size="8.5"
      fill="#bbbbbb" letter-spacing="1">&#201;QUIPE &#8250; SANT&#201; IA</text>

<!-- BADGE FP -->
<rect x="686" y="8" width="96" height="22" rx="11" fill="#febd10"/>
<text x="734" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5"
      fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-17.2</text>

<line x1="72" y1="30" x2="766" y2="30" stroke="#febd10" stroke-width="1"/>

<text x="72" y="58" font-family="Georgia,serif" font-size="24" fill="#0f2240"
      font-weight="bold">D&#233;tection burnout IA</text>
<text x="72" y="74" font-family="Georgia,serif" font-size="11" fill="#febd10"
      font-style="italic">Coexiste avec une productivit&#233; &#233;lev&#233;e. Invisible sans protocole actif.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="80" width="740" height="62" fill="#febd10"/>
<line x1="238" y1="88" x2="238" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
<line x1="422" y1="88" x2="422" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
<line x1="606" y1="88" x2="606" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>

<text x="72" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">POUR QUI</text>
<text x="72" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Manager, Scrum Master</text>
<text x="72" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">MG &#8226; SM</text>

<text x="256" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUOI</text>
<text x="256" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">5 signaux sp&#233;cifiques IA</text>
<text x="256" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">distincts du burnout classique</text>

<text x="440" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUAND L&#39;UTILISER</text>
<text x="440" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Apr&#232;s la phase initiale</text>
<text x="440" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">d&#39;adoption (3+ sprints d&#39;usage)</text>

<text x="624" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">VALEUR APPORT&#201;E</text>
<text x="624" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">D&#233;tecter avant l&#39;effondrement</text>
<text x="624" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">du sprint 7</text>

<!-- BANDEAU DISTINCION -->
<rect x="54" y="150" width="740" height="28" fill="#0f2240" rx="2"/>
<text x="424" y="162" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" text-anchor="middle" font-weight="bold" letter-spacing="1">DISTINCTS DU BURNOUT CLASSIQUE (CH.6)</text>
<text x="424" y="173" font-family="Georgia,serif" font-size="8.5" fill="#ffffff"
      text-anchor="middle">Signature sp&#233;cifique IA : coexiste avec une productivit&#233; &#233;lev&#233;e.</text>

<!-- ENTETE TABLE -->
<rect x="54" y="186" width="370" height="22" fill="#0f2240"/>
<rect x="424" y="186" width="370" height="22" fill="#0f2240"/>
<text x="239" y="201" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" text-anchor="middle" font-weight="bold" letter-spacing="0.5">SIGNAL OBSERV&#201;</text>
<text x="609" y="201" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" text-anchor="middle" font-weight="bold" letter-spacing="0.5">CE QUE &#199;A SIGNIFIE</text>

<!-- SIGNAL 1 : Silence Review -->
<rect x="54" y="208" width="370" height="68" fill="#f8f8f8"/>
<rect x="424" y="208" width="370" height="68" fill="#f8f8f8"/>
<rect x="54" y="208" width="6" height="68" fill="#febd10"/>
<text x="72" y="226" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#0f2240" font-weight="bold">01  Silence en Sprint Review</text>
<text x="72" y="241" font-family="Georgia,serif" font-size="9" fill="#0f2240">L&#39;&#233;quipe pr&#233;sente sans questionner.</text>
<text x="72" y="255" font-family="Georgia,serif" font-size="9" fill="#0f2240">Ne remet pas en cause les outputs.</text>
<text x="440" y="226" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">L&#39;&#233;quipe ne comprend plus ce qu&#39;elle</text>
<text x="440" y="241" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">livre. Elle valide sans inspecter.</text>
<text x="440" y="256" font-family="Georgia,serif" font-size="9" fill="#febd10"
      font-style="italic">Pilier Inspection cass&#233;.</text>
<line x1="54" y1="276" x2="794" y2="276" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- SIGNAL 2 : Retros sans tension -->
<rect x="54" y="276" width="370" height="64" fill="#ffffff"/>
<rect x="424" y="276" width="370" height="64" fill="#ffffff"/>
<rect x="54" y="276" width="6" height="64" fill="#febd10"/>
<text x="72" y="294" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#0f2240" font-weight="bold">02  R&#233;tros sans tension</text>
<text x="72" y="309" font-family="Georgia,serif" font-size="9" fill="#0f2240">Tout le monde dit que &#231;a va bien.</text>
<text x="72" y="323" font-family="Georgia,serif" font-size="9" fill="#0f2240">Aucun sujet qui frotte.</text>
<text x="440" y="294" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">L&#39;&#233;quipe a normalis&#233; l&#39;IA sans la</text>
<text x="440" y="309" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">questionner. Le silence n&#39;est pas</text>
<text x="440" y="323" font-family="Georgia,serif" font-size="9" fill="#febd10"
      font-style="italic">de la s&#233;r&#233;nit&#233;.</text>
<line x1="54" y1="340" x2="794" y2="340" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- SIGNAL 3 : HI homogene -->
<rect x="54" y="340" width="370" height="64" fill="#f8f8f8"/>
<rect x="424" y="340" width="370" height="64" fill="#f8f8f8"/>
<rect x="54" y="340" width="6" height="64" fill="#febd10"/>
<text x="72" y="358" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#0f2240" font-weight="bold">03  Happiness Index homog&#232;ne</text>
<text x="72" y="373" font-family="Georgia,serif" font-size="9" fill="#0f2240">Scores individuels tous proches.</text>
<text x="72" y="387" font-family="Georgia,serif" font-size="9" fill="#0f2240">Moyenne 3.8/5.</text>
<text x="440" y="358" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Possible conformisme d&#233;clar&#233;. La</text>
<text x="440" y="373" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">moyenne cache un senior &#224; 2,</text>
<text x="440" y="387" font-family="Georgia,serif" font-size="9" fill="#febd10"
      font-style="italic">trois juniors &#224; 4.5.</text>
<line x1="54" y1="404" x2="794" y2="404" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- SIGNAL 4 : Questions techniques -->
<rect x="54" y="404" width="370" height="64" fill="#ffffff"/>
<rect x="424" y="404" width="370" height="64" fill="#ffffff"/>
<rect x="54" y="404" width="6" height="64" fill="#febd10"/>
<text x="72" y="422" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#0f2240" font-weight="bold">04  Questions techniques rarissimes</text>
<text x="72" y="437" font-family="Georgia,serif" font-size="9" fill="#0f2240">Personne ne questionne les choix</text>
<text x="72" y="451" font-family="Georgia,serif" font-size="9" fill="#0f2240">d&#39;architecture.</text>
<text x="440" y="422" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Les d&#233;cisions sont prises par l&#39;IA</text>
<text x="440" y="437" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">et accept&#233;es. L&#39;&#233;quipe a arr&#234;t&#233;</text>
<text x="440" y="451" font-family="Georgia,serif" font-size="9" fill="#febd10"
      font-style="italic">de penser &#224; voix haute.</text>
<line x1="54" y1="468" x2="794" y2="468" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- SIGNAL 5 : Turnover senior -->
<rect x="54" y="468" width="370" height="64" fill="#fff3cd"/>
<rect x="424" y="468" width="370" height="64" fill="#fff3cd"/>
<rect x="54" y="468" width="6" height="64" fill="#cc3333"/>
<text x="72" y="486" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#cc3333" font-weight="bold">05  Turnover soudain d&#39;un senior</text>
<text x="72" y="501" font-family="Georgia,serif" font-size="9" fill="#0f2240">D&#233;part sans signal pr&#233;alable.</text>
<text x="72" y="515" font-family="Georgia,serif" font-size="9" fill="#0f2240">Aucune conversation avant.</text>
<text x="440" y="486" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">Il s&#39;est senti d&#233;pr&#233;ci&#233;</text>
<text x="440" y="501" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">progressivement. Signal le plus</text>
<text x="440" y="515" font-family="Georgia,serif" font-size="9" fill="#cc3333"
      font-style="italic">co&#251;teux et le moins anticip&#233;.</text>
<line x1="54" y1="532" x2="794" y2="532" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- PROTOCOLE DE CORRECTION -->
<rect x="54" y="542" width="740" height="28" fill="#0f2240" rx="2"/>
<text x="424" y="558" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" text-anchor="middle" font-weight="bold" letter-spacing="1">PROTOCOLE DE CORRECTION</text>
<text x="424" y="563" font-family="Georgia,serif" font-size="0" fill="none"/>

<rect x="54" y="570" width="740" height="50" fill="#f8f8f8" rx="2"/>
<text x="72" y="588" font-family="Georgia,serif" font-size="10" fill="#0f2240">
  La correction ne se fait pas en r&#233;trospective. Elle se fait en t&#234;te-&#224;-t&#234;te.</text>
<text x="72" y="604" font-family="Georgia,serif" font-size="10" fill="#0f2240">
  Avec le senior qui s&#39;est tu. Avec le dev dont le Happiness Index est sous la moyenne depuis 3 sprints.</text>
<text x="72" y="614" font-family="Georgia,serif" font-size="9" fill="#febd10"
      font-style="italic">La conversation difficile, avant que &#231;a devienne structurel : c&#39;est le travail que l&#39;IA ne fait pas.</text>

<!-- 3 ACTIONS IMMEDIATES -->
<rect x="54" y="630" width="740" height="24" fill="#febd10"/>
<text x="424" y="646" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" text-anchor="middle" font-weight="bold" letter-spacing="1">3 ACTIONS D&#200;S CETTE SEMAINE</text>

<rect x="54" y="654" width="236" height="88" fill="#f8f8f8"/>
<rect x="293" y="654" width="236" height="88" fill="#ffffff"/>
<rect x="532" y="654" width="262" height="88" fill="#f8f8f8"/>

<text x="68" y="672" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" font-weight="bold">ACTION 1</text>
<text x="68" y="688" font-family="Georgia,serif" font-size="9" fill="#0f2240">Identifie le senior le plus</text>
<text x="68" y="702" font-family="Georgia,serif" font-size="9" fill="#0f2240">silencieux depuis l&#39;adoption IA.</text>
<text x="68" y="716" font-family="Georgia,serif" font-size="9" fill="#0f2240">T&#234;te-&#224;-t&#234;te 20 min. Question :</text>
<text x="68" y="730" font-family="Georgia,serif" font-size="8.5" fill="#febd10"
      font-style="italic">&#171;&#160;Comment tu te sens dans ton r&#244;le&#160;?&#187;</text>

<text x="307" y="672" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" font-weight="bold">ACTION 2</text>
<text x="307" y="688" font-family="Georgia,serif" font-size="9" fill="#0f2240">Propose &#224; ton SM un point mensuel</text>
<text x="307" y="702" font-family="Georgia,serif" font-size="9" fill="#0f2240">15 min hors c&#233;r&#233;monie. C&#39;est toi</text>
<text x="307" y="716" font-family="Georgia,serif" font-size="9" fill="#0f2240">qui ouvres la porte.</text>
<text x="307" y="730" font-family="Georgia,serif" font-size="8.5" fill="#febd10"
      font-style="italic">Ne pas attendre qu&#39;il propose.</text>

<text x="546" y="672" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" font-weight="bold">ACTION 3</text>
<text x="546" y="688" font-family="Georgia,serif" font-size="9" fill="#0f2240">Demande &#224; un membre d&#39;&#233;quipe :</text>
<text x="546" y="702" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#171;&#160;Tu comprends vraiment ce que</text>
<text x="546" y="716" font-family="Georgia,serif" font-size="9" fill="#0f2240">tu as livr&#233; ce sprint&#160;?&#187;</text>
<text x="546" y="730" font-family="Georgia,serif" font-size="8.5" fill="#febd10"
      font-style="italic">La r&#233;ponse dit tout.</text>

<!-- NOTES -->
