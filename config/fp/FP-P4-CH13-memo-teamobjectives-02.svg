<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28" style="font-family:&#x27;Helvetica&#x27;;font-size:8.5px;fill:#bbb;">PILOTAGE PAR LA VALEUR &gt; TEAM OBJECTIVES</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="706" y="23" style="font-family:&#x27;Helvetica&#x27;;font-size:9.5px;fill:#0f2240;">IV-13.2</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58" style="font-family:&#x27;Georgia&#x27;,serif;font-size:24px;fill:#0f2240;">Team Objectives : reformulation valeur</text>
<text x="72" y="72" style="font-family:&#x27;EB Garamond&#x27;,&#x27;Georgia&#x27;,serif;font-size:11px;font-style:italic;fill:#febd10;">Passer du plan d&#x27;ex&#233;cution &#224; l&#x27;engagement sur la valeur</text>

<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<clipPath id="_c1"><rect x="238.7" y="86" width="0.6" height="50"/></clipPath>
