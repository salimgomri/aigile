<g transform="matrix(-0,-1,1,-0,-893.165,946.835)">
  <text x="-36.025px" y="920px"
        style="font-family:'Georgia',serif;font-size:11px;fill:#0f2240;">
    L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px
             26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px
             68.29px 72.906px 76.201px 86.73px"
            y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px
               920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">
      E SYST&#200;ME S.A.L.I.M.
    </tspan>
  </text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">MEMO &gt; SPRINT REVIEW</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP II-5.6</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">Les 3 questions</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">Avant de commenter un chiffre de velocite en Sprint Review.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.25;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.25;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.25;"/>

<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">MG / SM</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">3 questions a poser systematiquement avant de reagir a un chiffre de velocite</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">En Sprint Review, dans un rapport manager, ou en lisant le dashboard</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Transformer un chiffre vide en information exploitable, en 3 questions</text>

<rect x="54" y="156" width="740" height="110" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="156" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="171" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">QUESTION 1 : LE SPRINT GOAL A-T-IL ETE ATTEINT ?</text>

<text x="64" y="195" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="64" dy="0">Oui, partiel, ou non. Un Sprint Goal atteint a 100% avec une velocite en</tspan>
  <tspan x="64" dy="18">baisse n'est pas un probleme : c'est le signe que l'equipe a priorise la</tspan>
  <tspan x="64" dy="18">livraison de valeur sur le volume.</tspan>
</text>

<rect x="54" y="280" width="740" height="130" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="280" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="295" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">QUESTION 2 : Y A-T-IL EU DES EVENEMENTS EXCEPTIONNELS CE SPRINT ?</text>

<text x="64" y="319" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="64" dy="0">Conges, incident en production, changement de scope en cours de sprint,</tspan>
  <tspan x="64" dy="18">onboarding d'un nouveau membre, sprint de remboursement de dette.</tspan>
  <tspan x="64" dy="26">Tout cela fait varier la velocite. Un chiffre sans cette annotation est un</tspan>
  <tspan x="64" dy="18">chiffre qui ment par omission.</tspan>
</text>

<rect x="54" y="424" width="740" height="110" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="424" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="439" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">QUESTION 3 : LA TENDANCE SUR 3 SPRINTS EST-ELLE STABLE ?</text>

<text x="64" y="463" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="64" dy="0">Pas le point isole, la moyenne. Si l'equipe tourne autour du meme chiffre</tspan>
  <tspan x="64" dy="18">depuis 3 sprints, la capacite est stable et previsible : c'est l'information</tspan>
  <tspan x="64" dy="18">utile, pas le chiffre du dernier sprint pris isolement.</tspan>
</text>

<rect x="54" y="548" width="740" height="120" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="548" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="563" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">LA REGLE</text>

<text x="64" y="587" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="64" dy="0">Ces trois elements transforment un chiffre en information. C'est la</tspan>
  <tspan x="64" dy="18">difference entre du reporting et de la conversation.</tspan>
  <tspan x="64" dy="26">Si tu n'as pas les 3 reponses, ne commente pas le chiffre. Demande-les</tspan>
  <tspan x="64" dy="18">avant la reunion, pas pendant.</tspan>
</text>

<rect x="54" y="682" width="740" height="90" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="682" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="697" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">NOTE TERRAIN</text>

<text x="64" y="721" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.8;">
  <tspan x="64" dy="0">Pour la formulation a utiliser face a la direction, voir FP-II-5.1</tspan>
  <tspan x="64" dy="16">"Vitesse et discours". Source : Chapitre 5, p.152.</tspan>
</text>

