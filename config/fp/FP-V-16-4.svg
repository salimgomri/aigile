</defs>

<!-- FOND BLANC -->
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>

<!-- BANDE LATERALE GOLD -->
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>

<!-- TEXTE VERTICAL "LE SYSTEME S.A.L.I.M." -->
<text transform="translate(13,900) rotate(-90)"
      font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0f2240"
      letter-spacing="2">LE SYST&#200;ME S.A.L.I.M.</text>

<!-- LOGO SALIM (cercles concentricques stylises) -->
<g transform="translate(8,60)">
  <circle cx="18" cy="18" r="16" fill="none" stroke="#0f2240" stroke-width="2"/>
  <circle cx="18" cy="18" r="11" fill="none" stroke="#0f2240" stroke-width="1.5"/>
  <circle cx="18" cy="18" r="6"  fill="none" stroke="#0f2240" stroke-width="1"/>
  <circle cx="18" cy="18" r="2"  fill="#0f2240"/>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" fill="#ffffff"/>
<text x="72" y="28" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#bbbbbb">M&#201;MO R&#201;F&#201;RENCE . GOUVERNANCE IA</text>
<!-- Badge FP gold -->
<rect x="686" y="8" width="94" height="22" rx="11" fill="#febd10"/>
<text x="733" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-16.4</text>
<!-- Filet gold -->
<line x1="72" y1="36" x2="766" y2="36" stroke="#febd10" stroke-width="1"/>
<!-- Titre -->
<text x="72" y="58" font-family="Georgia,serif" font-size="26" fill="#0f2240" font-weight="bold">Accord d'&#233;quipe IA : 6 questions, 60 minutes</text>
<text x="72" y="71" font-family="EB Garamond,Georgia,serif" font-size="11" font-style="italic" fill="#febd10">Ce que tout le monde se pose sans le poser &#224; voix haute.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" fill="#febd10"/>
<!-- Separateurs verticaux -->
<line x1="239" y1="86" x2="239" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="424" y1="86" x2="424" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="609" y1="86" x2="609" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<!-- Labels -->
<text x="72"  y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">POUR QUI</text>
<text x="252" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUOI</text>
<text x="437" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUAND L'UTILISER</text>
<text x="622" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">VALEUR APPORT&#201;E</text>
<!-- Valeurs -->
<text x="72"  y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">SM / MG</text>
<text x="252" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">6 questions pour la retro accord IA</text>
<text x="437" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Avant le 3&#232;me sprint avec IA dans l'&#233;quipe</text>
<text x="622" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Gouvernance collective, pas politique descendue</text>
<rect x="66" y="154" width="662" height="22" fill="#febd10" opacity="0.15" stroke="#febd10" stroke-width="0.8" rx="3"/><text x="397" y="169" font-family="EB Garamond,Georgia,serif" font-size="9.5" font-style="italic" fill="#0f2240" text-anchor="middle">PR&#201;REQUIS : ton &#233;quipe a un working agreement de base. Sinon : 30 min en retro, 5 r&#232;gles &#233;crites. Ensuite seulement cet accord.</text><rect x="66" y="184" width="662" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="184" width="44" height="60" fill="#febd10" opacity="0.12"/><text x="88" y="219" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10" text-anchor="middle">Q1</text><text x="120" y="200" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">P&#233;rim&#232;tre et s&#233;curit&#233;</text><text x="120" y="213" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Quels outils IA sommes-nous autoris&#233;s &#224; utiliser ?</text><text x="120" y="226" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Quelles cat&#233;gories de donn&#233;es ne peuvent pas quitter notre infrastructure ?</text><text x="120" y="239" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">V&#233;rifier les CGU : opt-out d'entra&#238;nement sur donn&#233;es propri&#233;taires.</text><rect x="66" y="244" width="662" height="47" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="244" width="44" height="47" fill="#febd10" opacity="0.12"/><text x="88" y="272" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10" text-anchor="middle">Q2</text><text x="120" y="260" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Tra&#231;abilit&#233;</text><text x="120" y="273" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Quand un output IA est utilis&#233; dans un livrable,</text><text x="120" y="286" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">comment le signale-t-on dans le code, la doc ou les crit&#232;res ?</text><rect x="66" y="291" width="662" height="47" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="291" width="44" height="47" fill="#febd10" opacity="0.12"/><text x="88" y="319" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10" text-anchor="middle">Q3</text><text x="120" y="307" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Responsabilit&#233;</text><text x="120" y="320" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Qui est responsable quand un output IA introduit un bug ?</text><text x="120" y="333" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">(Note : si les r&#233;ponses divergent, tu as ton diagnostic.)</text><rect x="66" y="338" width="662" height="47" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="338" width="44" height="47" fill="#febd10" opacity="0.12"/><text x="88" y="366" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10" text-anchor="middle">Q4</text><text x="120" y="354" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Int&#233;gration nouveaux outils</text><text x="120" y="367" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Comment d&#233;cide-t-on collectivement d'int&#233;grer</text><text x="120" y="380" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">un nouvel outil IA dans notre pratique ?</text><rect x="66" y="385" width="662" height="47" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="385" width="44" height="47" fill="#febd10" opacity="0.12"/><text x="88" y="413" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10" text-anchor="middle">Q5</text><text x="120" y="401" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Pr&#233;servation des comp&#233;tences</text><text x="120" y="414" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Comment on s'assure que les comp&#233;tences de l'&#233;quipe</text><text x="120" y="427" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">ne s'atrophient pas au profit de l'IA ?</text><rect x="66" y="432" width="662" height="47" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="432" width="44" height="47" fill="#febd10" opacity="0.12"/><text x="88" y="460" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10" text-anchor="middle">Q6</text><text x="120" y="448" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">D&#233;tection des faux positifs</text><text x="120" y="461" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Comment d&#233;tectons-nous les outputs IA qui semblent corrects</text><text x="120" y="474" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">mais ne le sont pas ? Qui effectue une revue sans recourir &#224; l'IA ?</text>
<rect x="66" y="489" width="320" height="22" rx="3" fill="#0f2240"/>
<text x="76" y="504" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">FORMAT</text>
<rect x="66" y="511" width="320" height="58" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="406" y="489" width="322" height="22" rx="3" fill="#0f2240"/>
<text x="416" y="504" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">SIGNAL DE SUCC&#200;S</text>
<rect x="406" y="511" width="322" height="58" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/><text x="76" y="519" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">10 minutes par question.</text>
<text x="76" y="531" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">L'accord est r&#233;dig&#233; en live.</text>
<text x="76" y="543" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Affich&#233; dans l'espace d'&#233;quipe.</text>
<text x="76" y="555" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">R&#233;vis&#233; tous les 2 mois en retro.</text>
<text x="76" y="567" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Sign&#233; collectivement.</text>
<text x="416" y="519" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">L'accord est contest&#233; au moins</text>
<text x="416" y="531" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">une fois dans les 30 jours.</text>
<text x="416" y="543" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333"></text>
<text x="416" y="555" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Ca veut dire qu'il est vivant.</text>
<text x="416" y="567" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Un accord jamais discut&#233; est mort.</text>
<rect x="66" y="581" width="662" height="44" rx="4" fill="#f8f8f5" stroke="#febd10" stroke-width="0.8"/><text x="76" y="596" font-family="Helvetica,Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#0f2240">AVANT DE LANCER LA RETRO</text><text x="76" y="610" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Demande &#224; chaque membre d'&#233;crire anonymement sa r&#233;ponse &#224; Q3.</text><text x="76" y="622" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Les r&#233;ponses divergentes sont ton diagnostic avant m&#234;me de commencer.</text>
<!-- FOOTER -->
<line x1="66" y1="1068" x2="752" y2="1068" stroke="#febd10" stroke-width="0.8"/>
