<svg viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Helvetica, Arial, sans-serif"><defs><style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style></defs>
<!-- FOND + BANDE -->
<rect x="0" y="0" width="794" height="1123" style="fill:#fff;"/>
<rect x="0" y="0" width="54" height="1123" style="fill:#febd10;"/>

