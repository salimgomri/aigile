<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">TEMPLATE PROMPT IA &gt; AUTOMATISATION TESTS</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP I-4.8</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">GWT vers Selenium avec un LLM</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">Un prompt structur&#233; est une hypoth&#232;se. V&#233;rifie le r&#233;sultat sur le terrain.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">DEV / SM</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Structure de prompt pour g&#233;n&#233;rer un squelette de test Selenium depuis un sc&#233;nario Etant donn&#233; / Quand / Alors</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Quand l'&#233;quipe utilise Selenium et veut automatiser les tests de non-r&#233;gression pendant le sprint</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Ce qui prenait 2 heures prend 20 minutes : le d&#233;veloppeur valide et connecte plut&#244;t que d'&#233;crire de z&#233;ro</text>

<!-- 6 BLOCS NUMEROTES pleine largeur -->

<rect x="72" y="158" width="650" height="70" style="fill:#fafaf7;"/>
<circle cx="92" cy="178" r="12" style="fill:#0f2240;"/>
<text x="92" y="182" text-anchor="middle" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">1</text>
<text x="112" y="176" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">CONTEXTE</text>
<text x="112" y="194" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quel est l'objectif et le contexte pr&#233;cis ? Pr&#233;cise le framework de tests (Selenium</text>
<text x="112" y="208" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">via Cucumber), le langage cible, et que le sc&#233;nario GWT vient d'une story valid&#233;e</text>
<text x="112" y="222" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">en session des 3 amigos.</text>

<rect x="72" y="236" width="650" height="70" style="fill:#fff;"/>
<circle cx="92" cy="256" r="12" style="fill:#0f2240;"/>
<text x="92" y="260" text-anchor="middle" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">2</text>
<text x="112" y="254" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">T&#194;CHE</text>
<text x="112" y="272" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quelle t&#226;che doit r&#233;aliser l'IA ? G&#233;n&#233;rer le squelette de test Selenium correspondant</text>
<text x="112" y="286" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">au sc&#233;nario GWT fourni : une &#233;tape Selenium par ligne Etant donn&#233; / Quand / Alors /</text>
<text x="112" y="300" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Et / Mais. Pas d'impl&#233;mentation finale, un squelette &#224; compl&#233;ter.</text>

<rect x="72" y="314" width="650" height="70" style="fill:#fafaf7;"/>
<circle cx="92" cy="334" r="12" style="fill:#0f2240;"/>
<text x="92" y="338" text-anchor="middle" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">3</text>
<text x="112" y="332" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">CONTRAINTES</text>
<text x="112" y="350" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Quelles sont les contraintes, r&#232;gles ou limites ? Le ALORS doit rester c&#244;t&#233;</text>
<text x="112" y="364" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">utilisateur (ce qu'il voit, pas une requ&#234;te SQL). Si un ALORS est vague ou technique,</text>
<text x="112" y="378" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">signale-le plut&#244;t que de produire un test fragile.</text>

<rect x="72" y="392" width="650" height="70" style="fill:#fff;"/>
<circle cx="92" cy="412" r="12" style="fill:#0f2240;"/>
<text x="92" y="416" text-anchor="middle" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">4</text>
<text x="112" y="410" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">FORMAT SOUHAIT&#201;</text>
<text x="112" y="428" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Dans quel format souhaites-tu la r&#233;ponse ? Code du squelette de test, comment&#233; ligne</text>
<text x="112" y="442" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">par ligne avec la correspondance GWT, plus une liste des points &#224; brancher manuel-</text>
<text x="112" y="456" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">lement (s&#233;lecteurs, donn&#233;es de test, environnement).</text>

<rect x="72" y="470" width="650" height="86" style="fill:#fafaf7;"/>
<circle cx="92" cy="490" r="12" style="fill:#0f2240;"/>
<text x="92" y="494" text-anchor="middle" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">5</text>
<text x="112" y="488" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">EXEMPLE (OPTIONNEL)</text>
<text x="112" y="506" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Fournis un exemple de ce que tu attends. Sc&#233;nario terrain du chapitre :</text>
<text x="112" y="524" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.75;">Etant donn&#233; qu'un utilisateur est connect&#233; / Quand il clique sur Telecharger le rapport de sprint /</text>
<text x="112" y="538" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.75;">Alors un PDF est g&#233;n&#233;r&#233; en moins de 3 secondes / Et il contient les m&#233;triques des 4 derniers sprints /</text>
<text x="112" y="552" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.75;">Mais si l'abonnement est expir&#233;, un message de renouvellement s'affiche.</text>

<rect x="72" y="566" width="650" height="70" style="fill:#fff;"/>
<circle cx="92" cy="586" r="12" style="fill:#0f2240;"/>
<text x="92" y="590" text-anchor="middle" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">6</text>
<text x="112" y="584" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">ANCRAGE EMPIRIQUE</text>
<text x="112" y="602" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Sur quelle observation terrain ce prompt est-il bas&#233; ? Le format GWT est du texte</text>
<text x="112" y="616" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">structur&#233;, donc automatisable sans r&#233;&#233;criture. La rigueur du format paie deux fois :</text>
<text x="112" y="630" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">aligner l'&#233;quipe avant le sprint, automatiser pendant.</text>

<!-- BANDEAU BONNES PRATIQUES fond navy -->
<rect x="54" y="664" width="740" height="130" style="fill:#0f2240;"/>
<text x="72" y="688" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#febd10;">BONNES PRATIQUES</text>
<path d="M72,694l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<g font-family="'EB Garamond','Georgia',serif" font-size="9.5px" fill="#fff">
<text x="72" y="714">&#10003; Sois pr&#233;cis et sp&#233;cifique : un ALORS vague donne un test vague, un ALORS</text>
<text x="84" y="728">mesurable donne un test utilisable.</text>
<text x="72" y="746">&#10003; Fournis le contexte n&#233;cessaire : framework, langage, structure de page si connue.</text>
<text x="72" y="764">&#10003; D&#233;finis le format attendu : squelette comment&#233;, jamais de l'impl&#233;mentation finale.</text>
<text x="72" y="782">&#10003; V&#233;rifie le r&#233;sultat sur le terrain : le d&#233;veloppeur valide, connecte, ajuste le contexte.</text>
</g>

<!-- Bloc role / responsabilites -->
<text x="72" y="828" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">QUI FAIT QUOI</text>
<path d="M72,834l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="854" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Le PO &#233;crit les crit&#232;res en fran&#231;ais (GWT). Le LLM g&#233;n&#232;re le squelette. Le d&#233;veloppeur valide,</text>
<text x="72" y="870" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">connecte les &#233;tapes au code, ajuste les d&#233;tails du contexte. Le QA ne recopie rien : il connecte.</text>
<text x="72" y="892" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">L'IA produit une hypoth&#232;se de squelette. Le d&#233;veloppeur produit la v&#233;rification.</text>

