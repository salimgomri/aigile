<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style>
</defs>

<!-- FOND BLANC -->
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>

<!-- BANDE LATERALE GOLD -->
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>

<!-- TEXTE VERTICAL "LE SYSTEME S.A.L.I.M." -->
<text transform="translate(13,900) rotate(-90)"
      font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0f2240"
      letter-spacing="2">LE SYST&#200;ME S.A.L.I.M.</text>

<!-- LOGO SALIM (cercles concentricques stylises) -->
<g transform="translate(8,60)">
  <circle cx="18" cy="18" r="16" fill="none" stroke="#0f2240" stroke-width="2"/>
  <circle cx="18" cy="18" r="11" fill="none" stroke="#0f2240" stroke-width="1.5"/>
  <circle cx="18" cy="18" r="6"  fill="none" stroke="#0f2240" stroke-width="1"/>
  <circle cx="18" cy="18" r="2"  fill="#0f2240"/>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" fill="#ffffff"/>
<text x="72" y="28" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#bbbbbb">M&#201;MO R&#201;F&#201;RENCE . ESTIMATION COLLECTIVE IA</text>
<!-- Badge FP gold -->
<rect x="686" y="8" width="94" height="22" rx="11" fill="#febd10"/>
<text x="733" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-16.5</text>
<!-- Filet gold -->
<line x1="72" y1="36" x2="766" y2="36" stroke="#febd10" stroke-width="1"/>
<!-- Titre -->
<text x="72" y="58" font-family="Georgia,serif" font-size="26" fill="#0f2240" font-weight="bold">Estimer la compr&#233;hension, pas l'effort</text>
<text x="72" y="71" font-family="EB Garamond,Georgia,serif" font-size="11" font-style="italic" fill="#febd10">La vraie valeur du Planning Poker : la conversation, pas le chiffre.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" fill="#febd10"/>
<!-- Separateurs verticaux -->
<line x1="239" y1="86" x2="239" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="424" y1="86" x2="424" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="609" y1="86" x2="609" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<!-- Labels -->
<text x="72"  y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">POUR QUI</text>
<text x="252" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUOI</text>
<text x="437" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUAND L'UTILISER</text>
<text x="622" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">VALEUR APPORT&#201;E</text>
<!-- Valeurs -->
<text x="72"  y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">SM / PO</text>
<text x="252" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Nouveau format estimation 1 / 3 / 8+</text>
<text x="437" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">D&#232;s que l'IA g&#233;n&#232;re les stories</text>
<text x="622" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Restaurer le d&#233;saccord productif</text>
<rect x="66" y="154" width="662" height="50" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8" rx="3"/><text x="76" y="170" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">POURQUOI CHANGER LE FORMAT</text><text x="76" y="184" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Quand l'IA g&#233;n&#232;re les stories et les crit&#232;res, la conversation d'estimation dispara&#238;t. L'&#233;quipe</text><text x="76" y="197" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">re&#231;oit un livrable pr&#233;-m&#226;ch&#233; et l'accepte. Le d&#233;saccord productif n'a plus lieu. La dette de compr&#233;hension s'accumule.</text><rect x="66" y="214" width="662" height="22" fill="#0f2240"/><text x="397" y="229" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">NOUVEAU FORMAT : LE PLANNING POKER PORTE SUR LA COMPR&#201;HENSION PARTAG&#201;E</text><rect x="66" y="236" width="662" height="52" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="236" width="60" height="52" fill="#2a7a2a" opacity="0.12"/><text x="96" y="269" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#2a7a2a" text-anchor="middle">1</text><text x="140" y="254" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#2a7a2a">ALIGNEMENT TOTAL</text><text x="140" y="268" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#333333">Tout le monde comprend exactement la m&#234;me chose.</text><text x="140" y="281" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#777777">La story entre dans le sprint sans discussion.</text><rect x="66" y="288" width="662" height="52" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="288" width="60" height="52" fill="#e07020" opacity="0.12"/><text x="96" y="321" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#e07020" text-anchor="middle">3</text><text x="140" y="306" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#e07020">ZONES D'OMBRE</text><text x="140" y="320" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#333333">Des zones d'ombre subsistent et doivent &#234;tre discut&#233;es.</text><text x="140" y="333" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#777777">Ouvrir la conversation avant de valider.</text><rect x="66" y="340" width="662" height="52" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="340" width="60" height="52" fill="#cc3333" opacity="0.12"/><text x="96" y="373" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#cc3333" text-anchor="middle">8+</text><text x="140" y="358" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#cc3333">STORY NON PR&#202;TE</text><text x="140" y="372" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#333333">Des incompr&#233;hensions majeures subsistent.</text><text x="140" y="385" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#777777">La story n'entre pas dans le sprint. Discussion obligatoire.</text>
<rect x="66" y="402" width="320" height="22" rx="3" fill="#0f2240"/>
<text x="76" y="417" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">COMMENT ANIMER</text>
<rect x="66" y="424" width="320" height="78" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="406" y="402" width="322" height="22" rx="3" fill="#0f2240"/>
<text x="416" y="417" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">SI TON &#201;QUIPE N'A PLUS DE POINTS</text>
<rect x="406" y="424" width="322" height="78" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/><text x="76" y="432" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Avant le Sprint Planning :</text>
<text x="76" y="444" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">l'IA g&#233;n&#232;re une 1&#232;re version des stories.</text>
<text x="76" y="456" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333"></text>
<text x="76" y="468" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Le SM lit la story. L'&#233;quipe vote.</text>
<text x="76" y="480" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Pas de discussion avant le vote.</text>
<text x="76" y="492" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">La discussion s'ouvre seulement</text>
<text x="76" y="504" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">si les votes divergent.</text>
<text x="416" y="432" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Le principe reste le m&#234;me.</text>
<text x="416" y="444" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Remplace le vote par une question directe :</text>
<text x="416" y="456" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333"></text>
<text x="416" y="468" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">'Est-ce que tout le monde comprend</text>
<text x="416" y="480" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">la m&#234;me chose sur cette story ?'</text>
<text x="416" y="492" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333"></text>
<text x="416" y="504" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Un d&#233;saccord visible vaut mieux</text>
<text x="416" y="516" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">qu'un consensus silencieux.</text>
<rect x="66" y="514" width="662" height="40" rx="4" fill="#f8f8f5" stroke="#febd10" stroke-width="0.8"/><text x="76" y="529" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#0f2240">R&#201;F&#201;RENCE</text><text x="76" y="543" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">Mike Cohn, Agile Estimating and Planning (2002) : la valeur du Planning Poker n'a jamais &#233;t&#233; le chiffre.</text><text x="76" y="552" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#555555" font-style="italic">C'est la conversation d&#233;clench&#233;e quand deux personnes votent 2 et 13 sur la m&#234;me story.</text>
<!-- FOOTER -->
<line x1="66" y1="1068" x2="752" y2="1068" stroke="#febd10" stroke-width="0.8"/>
<!-- Badge numero navy -->
<rect x="368" y="1074" width="58" height="20" rx="10" fill="#0f2240"/>
<text x="397" y="1088" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#febd10" text-anchor="middle" font-weight="bold">V-16.5</text>
<text x="72"  y="1089" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M. &#8212; Chapitre 16</text>
<text x="677" y="1089" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">Le Syst&#232;me S.A.L.I.M.</text>
</svg>