<line x1="423.7" y1="86" x2="423.7" y2="136" style="stroke:#fff;stroke-width:0.6px;opacity:0.5;"/>
<line x1="608.7" y1="86" x2="608.7" y2="136" style="stroke:#fff;stroke-width:0.6px;opacity:0.5;"/>

<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">SM / PO / CA</text>

<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">V&#233;rifier que les conditions sont r&#233;unies pour activer le Check-in OKR</text>

<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Avant le Sprint 1 de la roadmap, ou pour calibrer une phase suivante</text>

<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">&#201;vite de sur-outiller avant que les bases ne soient pr&#234;tes</text>

<!-- TABLEAU GO/NO-GO -->
<text x="72" y="170"
      style="font-family:'Helvetica';font-size:11px;font-weight:bold;fill:#0f2240;letter-spacing:1px;">CRIT&#200;RES &#192; V&#201;RIFIER AVANT DE LANCER LA PHASE 1</text>

<rect x="72" y="184" width="650" height="26" style="fill:#0f2240;"/>
<text x="84" y="201" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#fff;">#</text>
<text x="110" y="201" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#fff;">CRIT&#200;RE DE V&#201;RIFICATION</text>
<text x="540" y="201" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#fff;">GO</text>
<text x="580" y="201" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#fff;">NO GO</text>
<text x="640" y="201" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#fff;">PRIORIT&#201;</text>

<rect x="72" y="220" width="650" height="38" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="84" y="233" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">01</text>
<text x="110" y="233" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">L'&#233;quipe et le PO acceptent d'ajouter 5 minutes en fin de Sprint Review.</text>
<text x="110" y="247" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;"></text>
<circle cx="548" cy="239" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.2px;"/>
<circle cx="588" cy="239" r="6" style="fill:none;stroke:#cc3333;stroke-width:1.2px;"/>
<text x="640" y="243" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Indispensable</text>

<rect x="72" y="258" width="650" height="38" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="84" y="271" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">02</text>
<text x="110" y="271" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">J'ai pr&#233;venu mon manager direct que je vais noter le Sprint Goal atteint </text>
<text x="110" y="285" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">ou pas, et le partager.</text>
<circle cx="548" cy="277" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.2px;"/>
<circle cx="588" cy="277" r="6" style="fill:none;stroke:#cc3333;stroke-width:1.2px;"/>
<text x="640" y="281" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Indispensable</text>

<rect x="72" y="296" width="650" height="38" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="84" y="309" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">03</text>
<text x="110" y="309" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Je sais identifier les OKR actifs de l'organisation (ou je sais qui les demand</text>
<text x="110" y="323" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">er).</text>
<circle cx="548" cy="315" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.2px;"/>
<circle cx="588" cy="315" r="6" style="fill:none;stroke:#cc3333;stroke-width:1.2px;"/>
<text x="640" y="319" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Important</text>

<rect x="72" y="334" width="650" height="38" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="84" y="347" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">04</text>
<text x="110" y="347" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Si pas de CI/CD : je commence avec 3 cadrans (On Time, Bien-&#234;tre, Blocage</text>
<text x="110" y="361" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">s Q3 oral).</text>
<circle cx="548" cy="353" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.2px;"/>
<circle cx="588" cy="353" r="6" style="fill:none;stroke:#cc3333;stroke-width:1.2px;"/>
<text x="640" y="357" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Important</text>

<rect x="72" y="372" width="650" height="38" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="84" y="385" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">05</text>
<text x="110" y="385" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">J'ai un support, m&#234;me simple (Google Sheet), pour noter Q1 d&#232;s la pr</text>
<text x="110" y="399" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">ochaine review.</text>
<circle cx="548" cy="391" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.2px;"/>
<circle cx="588" cy="391" r="6" style="fill:none;stroke:#cc3333;stroke-width:1.2px;"/>
<text x="640" y="395" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Indispensable</text>

<rect x="72" y="410" width="650" height="38" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="84" y="423" style="font-family:'Helvetica';font-size:10px;font-weight:bold;fill:#febd10;">06</text>
<text x="110" y="423" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Le manager sait qu'il pourra consulter le dashboard 15 min apr&#232;s la revie</text>
<text x="110" y="437" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">w, sans assister au Check-in.</text>
<circle cx="548" cy="429" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.2px;"/>
<circle cx="588" cy="429" r="6" style="fill:none;stroke:#cc3333;stroke-width:1.2px;"/>
<text x="640" y="433" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Utile</text>

<!-- ZONE DECISION -->
<rect x="72" y="464" width="318" height="170" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
