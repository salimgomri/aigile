<text x="88" y="486" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;letter-spacing:1px;">D&#201;CISION</text>
<line x1="88" y1="494" x2="370" y2="494" style="stroke:#febd10;stroke-width:1px;"/>

<rect x="90" y="506" width="12" height="12" style="fill:none;stroke:#2a7a2a;stroke-width:1.2px;"/>
<text x="110" y="516" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">GO : conditions 01, 02 et 05 remplies.</text>
<text x="110" y="530" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Tu peux poser Q1 d&#232;s la prochaine</text>
<text x="110" y="544" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Sprint Review.</text>

<rect x="90" y="564" width="12" height="12" style="fill:none;stroke:#cc3333;stroke-width:1.2px;"/>
<text x="110" y="574" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">NO GO : si 01 ou 02 manquent.</text>
<text x="110" y="588" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">R&#233;gler d'abord la conversation avec</text>
<text x="110" y="602" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">l'&#233;quipe ou ton manager, pas l'outil.</text>

<text x="420" y="486" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;letter-spacing:1px;">REMARQUES / ACTIONS</text>
<line x1="420" y1="494" x2="706" y2="494" style="stroke:#febd10;stroke-width:1px;"/>

<text x="420" y="514" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#bbbbbb;">&#192; mener avant la phase 1 :</text>
<line x1="420" y1="530" x2="706" y2="530" style="stroke:#e0e0e0;stroke-width:0.5px;"/>
<line x1="420" y1="550" x2="706" y2="550" style="stroke:#e0e0e0;stroke-width:0.5px;"/>
<line x1="420" y1="570" x2="706" y2="570" style="stroke:#e0e0e0;stroke-width:0.5px;"/>
<line x1="420" y1="590" x2="706" y2="590" style="stroke:#e0e0e0;stroke-width:0.5px;"/>
<line x1="420" y1="610" x2="706" y2="610" style="stroke:#e0e0e0;stroke-width:0.5px;"/>

<!-- ROADMAP RAPIDE -->
<text x="72" y="664" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;letter-spacing:1px;">RAPPEL ROADMAP : 4 PHASES, 7 SPRINTS</text>
<line x1="72" y1="672" x2="722" y2="672" style="stroke:#febd10;stroke-width:1px;"/>

<text x="72" y="692" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;"><tspan style="font-weight:bold;">Sprints 1-2</tspan> : Q1 uniquement, &#224; l'oral, en fin de Sprint Review.</text>
<text x="72" y="710" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;"><tspan style="font-weight:bold;">Sprints 3-4</tspan> : lien dashboard envoy&#233; par le SM. Ajout Q2 et Q3. Premier dashboard, m&#234;me Google Sheet.</text>
<text x="72" y="728" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;"><tspan style="font-weight:bold;">Sprints 5-6</tspan> : application Scrum Augment&#233; activ&#233;e. Saisie au fil de l'eau. Rituel de deadline pos&#233;.</text>
<text x="72" y="746" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;"><tspan style="font-weight:bold;">Sprints 7+</tspan> : cascade compl&#232;te. Le manager annote. Les tendances sur 6 sprints deviennent la conversation.</text>

