<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap');</style>
  </defs>

  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
  <rect x="0" y="0" width="54" height="1123" fill="#febd10"/>
  <text transform="rotate(-90,27,560)" x="-290" y="32"
        font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0f2240" letter-spacing="2">
    LE SYST&#200;ME S.A.L.I.M.
  </text>

  <!-- HEADER -->
  <rect x="54" y="0" width="740" height="78" fill="#ffffff"/>
  <text x="72" y="24" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#bbbbbb" letter-spacing="1">
    CHECKLIST D&#201;CISION &gt; GOUVERNANCE DONN&#201;ES
  </text>
  <rect x="680" y="8" width="100" height="22" rx="11" fill="#febd10"/>
  <text x="730" y="22" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240"
        text-anchor="middle" font-weight="bold">FP III-12.5</text>
  <line x1="72" y1="32" x2="748" y2="32" stroke="#febd10" stroke-width="1"/>
  <text x="72" y="58" font-family="Georgia,serif" font-size="22" fill="#0f2240" font-weight="bold">
    Gouvernance des donn&#233;es dashboard : 3 d&#233;cisions
  </text>
  <text x="72" y="74" font-family="EB Garamond,Georgia,serif" font-size="11"
        font-style="italic" fill="#febd10">
    &#192; valider avant tout d&#233;ploiement. Si SaaS, le DPO doit &#234;tre dans la boucle.
  </text>

  <!-- BLOC 4 CHAMPS GOLD -->
  <rect x="54" y="78" width="740" height="64" fill="#febd10"/>
  <text x="72" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">POUR QUI</text>
  <text x="72" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">SM &#183; DC &#183; CA</text>
  <line x1="232" y1="84" x2="232" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="248" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">QUOI</text>
  <text x="248" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">3 d&#233;cisions de gouvernance avant d&#233;ploiement</text>
  <line x1="432" y1="84" x2="432" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="448" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">QUAND L'UTILISER</text>
  <text x="448" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">Avant tout d&#233;ploiement SaaS ou SI interne</text>
  <line x1="622" y1="84" x2="622" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="636" y="94" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">VALEUR APPORT&#201;E</text>
  <text x="636" y="107" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">&#201;viter la suspension de l'outil post-d&#233;ploiement</text>
  <text x="72" y="128" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240"
        font-weight="bold" letter-spacing="1.5">DONN&#201;ES SENSIBLES</text>
  <text x="72" y="138" font-family="EB Garamond,Georgia,serif" font-size="9"
        font-style="italic" fill="#0f2240">Les donn&#233;es de bien-&#234;tre (Niko-Niko) sont class&#233;es sensibles. Elles ne sont jamais accessibles au management.</text>

  <!-- TABLEAU GO/NO-GO -->
  <rect x="54" y="148" width="740" height="18" fill="#0f2240"/>
  <text x="72" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">#</text>
  <text x="102" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">D&#201;CISION &#192; PRENDRE</text>
  <text x="410" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">QUESTION CL&#201;</text>
  <text x="628" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">GO</text>
  <text x="666" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">NO GO</text>
  <text x="716" y="161" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#ffffff" font-weight="bold">PRIORIT&#201;</text>

  <!-- Decision 1 : Hebergement -->
  <rect x="54" y="166" width="740" height="90" fill="#fafaf7"/>
  <line x1="54" y1="256" x2="794" y2="256" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="72" y="188" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">01</text>
  <text x="102" y="186" font-family="Georgia,serif" font-size="11" fill="#0f2240" font-weight="bold">H&#233;bergement</text>
  <text x="102" y="202" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Les m&#233;triques du dashboard</text>
  <text x="102" y="216" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">sont-elles stock&#233;es dans</text>
  <text x="102" y="230" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">ton SI ou sur SaaS externe ?</text>
  <text x="102" y="248" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Si SaaS : valide avec ton DPO avant.</text>

  <text x="410" y="188" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Le lieu de stockage est-il conform&#233; RGPD</text>
  <text x="410" y="202" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">et approuv&#233; par la DSI ?</text>
  <text x="410" y="224" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">SI interne : v&#233;rifier la politique de classification</text>
  <text x="410" y="237" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">des donn&#233;es de l'organisation.</text>

  <rect x="618" y="172" width="40" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="638" y="196" font-family="Georgia,serif" font-size="18" fill="#2a7a2a" text-anchor="middle">&#9675;</text>
  <rect x="664" y="172" width="44" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="686" y="196" font-family="Georgia,serif" font-size="18" fill="#cc3333" text-anchor="middle">&#9679;</text>
  <rect x="714" y="172" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="750" y="196" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" text-anchor="middle">BLOQUANT</text>

  <!-- Decision 2 : Acces -->
  <rect x="54" y="256" width="740" height="90" fill="#ffffff"/>
  <line x1="54" y1="346" x2="794" y2="346" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="72" y="278" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">02</text>
  <text x="102" y="276" font-family="Georgia,serif" font-size="11" fill="#0f2240" font-weight="bold">Acc&#232;s</text>
  <text x="102" y="292" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Les donn&#233;es de bien-&#234;tre</text>
  <text x="102" y="306" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">et les donn&#233;es pr&#233;-r&#233;tro</text>
  <text x="102" y="320" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">ne sont jamais accessibles</text>
  <text x="102" y="334" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">au management.</text>

  <text x="410" y="278" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">La r&#232;gle d'acc&#232;s est-elle document&#233;e</text>
  <text x="410" y="292" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">et communiqu&#233;e &#224; l'&#233;quipe ?</text>
  <text x="410" y="314" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Documenter : "Les donn&#233;es Niko-Niko</text>
  <text x="410" y="327" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">ne sont jamais accessibles au management."</text>

  <rect x="618" y="262" width="40" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="638" y="286" font-family="Georgia,serif" font-size="18" fill="#2a7a2a" text-anchor="middle">&#9675;</text>
  <rect x="664" y="262" width="44" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="686" y="286" font-family="Georgia,serif" font-size="18" fill="#cc3333" text-anchor="middle">&#9679;</text>
  <rect x="714" y="262" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="750" y="286" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" text-anchor="middle">BLOQUANT</text>

  <!-- Decision 3 : Retention -->
  <rect x="54" y="346" width="740" height="90" fill="#fafaf7"/>
  <line x1="54" y1="436" x2="794" y2="436" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="72" y="368" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#febd10" font-weight="bold">03</text>
  <text x="102" y="366" font-family="Georgia,serif" font-size="11" fill="#0f2240" font-weight="bold">R&#233;tention</text>
  <text x="102" y="382" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">Dur&#233;e d'archivage d&#233;finie</text>
  <text x="102" y="396" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">et protocole de suppression</text>
  <text x="102" y="410" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">pour les donn&#233;es sensibles.</text>
  <text x="102" y="428" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Recommandation : 12 sprints, soit ~6 mois.</text>

  <text x="410" y="368" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">La politique de r&#233;tention est-elle valid&#233;e</text>
  <text x="410" y="382" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">avec le DPO et document&#233;e ?</text>
  <text x="410" y="404" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">Donn&#233;es de bien-&#234;tre : suppression active</text>
  <text x="410" y="417" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">apr&#232;s la p&#233;riode d&#233;finie. Pas d'archivage passif.</text>

  <rect x="618" y="352" width="40" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="638" y="376" font-family="Georgia,serif" font-size="18" fill="#2a7a2a" text-anchor="middle">&#9675;</text>
  <rect x="664" y="352" width="44" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="686" y="376" font-family="Georgia,serif" font-size="18" fill="#cc3333" text-anchor="middle">&#9679;</text>
  <rect x="714" y="352" width="72" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5" rx="3"/>
  <text x="750" y="376" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" text-anchor="middle">&#192; planifier</text>

  <!-- DECISION FINALE -->
  <rect x="54" y="440" width="740" height="16" fill="#0f2240"/>
  <text x="72" y="453" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#ffffff" font-weight="bold">D&#201;CISION</text>

  <rect x="54" y="456" width="360" height="70" fill="#fafaf7"/>
  <rect x="416" y="456" width="378" height="70" fill="#fafaf7"/>
  <line x1="414" y1="456" x2="414" y2="526" stroke="#e0e0e0" stroke-width="0.8"/>

  <text x="72" y="474" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#2a7a2a" font-weight="bold">GO : D&#201;PLOIEMENT AUTORIS&#201;</text>
  <text x="72" y="490" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">&#9675;  H&#233;bergement valid&#233; DPO</text>
  <text x="72" y="506" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">&#9675;  R&#232;gle acc&#232;s document&#233;e</text>
  <text x="72" y="522" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240">&#9675;  R&#233;tention d&#233;finie et valid&#233;e</text>

  <text x="432" y="474" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#cc3333" font-weight="bold">NO GO : ACTIONS &#192; MENER AVANT</text>
  <text x="432" y="492" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#bbbbbb">1. ______________________________</text>
  <text x="432" y="508" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#bbbbbb">2. ______________________________</text>
  <text x="432" y="524" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#bbbbbb">3. ______________________________</text>

  <!-- CONTEXTE : SANS CI/CD -->
  <rect x="54" y="530" width="740" height="16" fill="#febd10"/>
  <text x="72" y="543" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#0f2240"
        font-weight="bold">CAS PARTICULIER : CADRAN QUALIT&#201; SANS ACC&#200;S CI/CD</text>

  <rect x="54" y="546" width="740" height="80" fill="#fafaf7"/>
  <text x="72" y="564" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240" font-weight="bold">
    Si tu n'as pas acc&#232;s au pipeline CI/CD, deux alternatives praticables :
  </text>
  <text x="82" y="580" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">
    (1) Source manuelle : apr&#232;s chaque d&#233;ploiement, demande &#224; un dev si un hotfix ou rollback a &#233;t&#233; n&#233;cessaire.
  </text>
  <text x="82" y="595" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">
    Une r&#233;ponse oui/non par d&#233;ploiement suffit pour estimer un CFR.
  </text>
  <text x="82" y="612" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#0f2240">
    (2) Proxy : incidents utilisateurs du sprint comme proxy du CFR. Documente la source dans le rapport.
  </text>
  <text x="82" y="626" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#bbbbbb">
    Ce que tu ne fais pas : laisser le cadran Qualit&#233; &#224; N/A. Un proxy document&#233; vaut mieux qu'un cadran vide.
  </text>

  <!-- RAPPEL PROTECTION EQUIPE -->
  <rect x="54" y="630" width="740" height="60" fill="#0f2240"/>
  <text x="72" y="650" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#febd10" font-weight="bold">
    PROTECTION DE L'&#201;QUIPE : R&#200;GLE NON N&#201;GOCIABLE
  </text>
  <text x="72" y="668" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff">
    Les donn&#233;es pr&#233;-r&#233;trospective (brouillon d'actions, verbatims d'&#233;quipe) ne sont jamais accessibles au management.
  </text>
  <text x="72" y="684" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff">
    Seul le dashboard agr&#233;g&#233; (6 cadrans + narrative) est communiqu&#233; vers l'ext&#233;rieur de l'&#233;quipe.
  </text>

  <!-- FOOTER -->
  <line x1="54" y1="1083" x2="794" y2="1083" stroke="#febd10" stroke-width="1"/>
  <rect x="372" y="1076" width="50" height="20" rx="10" fill="#0f2240"/>
  <text x="397" y="1090" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#febd10"
        text-anchor="middle" font-weight="bold">III-12</text>
  <text x="72" y="1097" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">
    SOURCE : Le Syst&#232;me S.A.L.I.M. &#183; Chapitre 12 &#183; aigile.lu
  </text>
  <text x="748" y="1097" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb"
        text-anchor="end">Le Syst&#232;me S.A.L.I.M.</text>

</svg>