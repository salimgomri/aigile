<text x="622" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">VALEUR APPORT&#201;E</text>
<!-- Valeurs -->
<text x="72"  y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">SM / CA</text>
<text x="252" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Checklist 6 signaux d'alerte</text>
<text x="437" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Tous les 2 sprints depuis adoption IA</text>
<text x="622" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Intervenir avant que DORA le capte</text>

<rect x="66" y="154" width="662" height="20" fill="#0f2240"/>
<text x="76"  y="168" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff">#</text>
<text x="116" y="168" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff">SIGNAL &#192; V&#201;RIFIER</text>
<text x="500" y="168" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff">OUI</text>
<text x="548" y="168" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff">NON</text>
<text x="590" y="168" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff">PRIORIT&#201;</text>
<rect x="66" y="176" width="662" height="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="190" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">01</text><text x="116" y="190" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">D&#233;pr&#233;ciation seniors</text><text x="116" y="204" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Les seniors parlent moins en Sprint Planning et retro.</text><rect x="494" y="184" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><rect x="542" y="184" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><text x="590" y="196" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#e07020">Haute</text><rect x="66" y="214" width="662" height="38" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="228" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">02</text><text x="116" y="228" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Happiness Index : divergence</text><text x="116" y="242" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Satisfaction g&#233;n&#233;rale monte, 'impact ce sprint' descend.</text><rect x="494" y="222" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><rect x="542" y="222" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><text x="590" y="234" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#e07020">Haute</text><rect x="66" y="252" width="662" height="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="266" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">03</text><text x="116" y="266" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Confiance artificielle juniors</text><text x="116" y="280" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Les juniors livrent vite mais ne savent pas expliquer le code.</text><rect x="494" y="260" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><rect x="542" y="260" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><text x="590" y="272" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#888888">Moyenne</text><rect x="66" y="290" width="662" height="38" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="304" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">04</text><text x="116" y="304" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Asym&#233;trie d'adoption</text><text x="116" y="318" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Certains utilisent l'IA en cach&#233;. Tensions latentes en Daily.</text><rect x="494" y="298" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><rect x="542" y="298" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><text x="590" y="310" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#e07020">Haute</text><rect x="66" y="328" width="662" height="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="342" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">05</text><text x="116" y="342" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">CFR monte avec DF</text><text x="116" y="356" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">D&#233;ploiements plus fr&#233;quents ET plus d'&#233;checs en prod.</text><rect x="494" y="336" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><rect x="542" y="336" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><text x="590" y="348" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#cc3333">Critique</text><rect x="66" y="366" width="662" height="38" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="380" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#febd10">06</text><text x="116" y="380" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Rotation pair non respect&#233;e</text><text x="116" y="394" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Le senior garde toujours le clavier. Le junior regarde.</text><rect x="494" y="374" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><rect x="542" y="374" width="16" height="16" rx="2" stroke="#0f2240" stroke-width="1" fill="none"/><text x="590" y="386" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#888888">Moyenne</text><line x1="66" y1="412" x2="728" y2="412" stroke="#febd10" stroke-width="0.8"/>
<rect x="66" y="424" width="320" height="22" rx="3" fill="#0f2240"/>
<text x="76" y="439" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">QUAND INTERVENIR</text>
<rect x="66" y="446" width="320" height="78" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="406" y="424" width="322" height="22" rx="3" fill="#0f2240"/>
<text x="416" y="439" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">ACTIONS IMM&#201;DIATES</text>
<rect x="406" y="446" width="322" height="78" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/><text x="76" y="464" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">1 signal Haute ou 1 signal Critique : intervenir</text>
<text x="76" y="477" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">ce sprint. Ne pas attendre la prochaine retro.</text>
<text x="76" y="490" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">2+ signaux Moyenne : planifier une retro</text>
<text x="76" y="503" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">d&#233;di&#233;e dans les 2 prochains sprints.</text>
<text x="76" y="516" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">0 signal : re-verifier dans 2 sprints.</text>
<text x="416" y="464" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Signal 01/02 : tete-a-tete senior (1 question ouverte).</text>
<text x="416" y="477" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Signal 03 : imposer le junior en Driver en pair.</text>
<text x="416" y="490" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Signal 04 : lancer la retro accord equipe IA.</text>
<text x="416" y="503" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Signal 05 : ralentir et reviser la DoD ce sprint.</text>
<text x="416" y="516" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#333333">Signal 06 : timer visible, rotation non negociable.</text>
<rect x="66" y="544" width="662" height="48" rx="4" fill="#0f2240"/><text x="240" y="562" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">SEUIL D'ALERTE CL&#201; : ratio DF/CFR</text><text x="397" y="578" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#cccccc" text-anchor="middle" font-style="italic">Si CFR monte pendant que DF monte : tu vas plus vite dans la mauvaise direction.</text>
