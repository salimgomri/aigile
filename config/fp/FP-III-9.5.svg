<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style>
  </defs>

  <rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
  <rect x="0" y="0" width="54" height="1123" fill="#febd10"/>
  <g transform="translate(27,900) rotate(-90)">
    <text font-family="Georgia,serif" font-size="11" fill="#0f2240" font-weight="bold"
          text-anchor="middle">LE SYST&#200;ME S.A.L.I.M.</text>
  </g>
  <g transform="translate(27,60)">
    <polygon points="0,-18 14,0 0,18 -14,0" fill="#0f2240" opacity="0.85"/>
    <text font-family="Georgia,serif" font-size="7" fill="#febd10" text-anchor="middle" dy="2.5">S</text>
  </g>
  <rect x="54" y="0" width="740" height="80" fill="#ffffff"/>
  <text x="72" y="22" font-family="Helvetica,sans-serif" font-size="8.5" fill="#bbbbbb"
        letter-spacing="1">PILOTAGE &gt; MATURIT&#201; IA</text>
  <rect x="686" y="8" width="94" height="22" rx="11" fill="#febd10"/>
  <text x="733" y="23" font-family="Helvetica,sans-serif" font-size="9.5" fill="#0f2240"
        text-anchor="middle" font-weight="bold">FP III-9.5</text>
  <line x1="72" y1="30" x2="748" y2="30" stroke="#febd10" stroke-width="1"/>
  <text x="72" y="58" font-family="Georgia,serif" font-size="22" fill="#0f2240"
        font-weight="bold">Maturit&#233; IA : signaux pour le manager</text>
  <text x="72" y="76" font-family="Georgia,serif" font-size="10" fill="#febd10"
        font-style="italic">Sais-tu si tes &#233;quipes utilisent l&#39;IA de fa&#231;on r&#233;fl&#233;chie ou de fa&#231;on aveugle ?</text>
  <rect x="54" y="80" width="740" height="72" fill="#febd10"/>
  <line x1="239" y1="88" x2="239" y2="144" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  <line x1="424" y1="88" x2="424" y2="144" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  <line x1="609" y1="88" x2="609" y2="144" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  <text x="72"  y="98" font-family="Helvetica,sans-serif" font-size="7.5" fill="#0f2240" font-weight="bold" letter-spacing="1.5">POUR QUI</text>
  <text x="257" y="98" font-family="Helvetica,sans-serif" font-size="7.5" fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUOI</text>
  <text x="442" y="98" font-family="Helvetica,sans-serif" font-size="7.5" fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUAND L&#39;UTILISER</text>
  <text x="627" y="98" font-family="Helvetica,sans-serif" font-size="7.5" fill="#0f2240" font-weight="bold" letter-spacing="1.5">VALEUR APPORT&#201;E</text>
  <text x="72"  y="118" font-family="Georgia,serif" font-size="9" fill="#0f2240" font-style="italic">MG / DC</text>
  <text x="257" y="118" font-family="Georgia,serif" font-size="9" fill="#0f2240" font-style="italic">3 signaux + seuil organisation</text>
  <text x="442" y="118" font-family="Georgia,serif" font-size="9" fill="#0f2240" font-style="italic">Revue mensuelle ou trimestrielle</text>
  <text x="627" y="118" font-family="Georgia,serif" font-size="9" fill="#0f2240" font-style="italic">&#201;valuer sans lire les outputs</text>
  <line x1="54" y1="1072" x2="794" y2="1072" stroke="#febd10" stroke-width="1"/>
  <text x="72"  y="1089" font-family="Helvetica,sans-serif" font-size="7.5" fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M. &#8212; Chapitre 9 : AIgile Manifesto</text>
  <text x="630" y="1089" font-family="Helvetica,sans-serif" font-size="7.5" fill="#bbbbbb">Le Syst&#232;me S.A.L.I.M.</text>
  <rect x="370" y="1076" width="54" height="20" rx="10" fill="#0f2240"/>
  <text x="397" y="1090" font-family="Helvetica,sans-serif" font-size="10" fill="#febd10"
        text-anchor="middle" font-weight="bold">9.5</text>

  <rect x="72" y="162" width="676" height="40" fill="#0f2240" rx="2"/>
  <text x="410" y="178" font-family="Georgia,serif" font-size="10" fill="#ffffff"
        text-anchor="middle">
    Tu n&#39;as pas besoin de lire les outputs IA pour savoir si l&#39;adoption est saine.
  </text>
  <text x="410" y="195" font-family="Georgia,serif" font-size="10" fill="#febd10"
        text-anchor="middle" font-style="italic">
    Trois signaux observables depuis ta position.
  </text>

  <rect x="72" y="214" width="676" height="100" fill="#fafaf7" rx="2"/>
  <rect x="72" y="214" width="10" height="100" fill="#2a7a2a" rx="2"/>
  <rect x="72" y="214" width="676" height="24" fill="#0f2240" rx="2"/>
  <text x="92"  y="230" font-family="Helvetica,sans-serif" font-size="8.5"
        fill="#febd10" font-weight="bold" letter-spacing="1">SIGNAL 1</text>
  <text x="92"  y="254" font-family="Georgia,serif" font-size="11"
        fill="#0f2240" font-weight="bold">Le SM explique en 2 minutes</text>
  <text x="92"  y="269" font-family="Georgia,serif" font-size="11"
        fill="#0f2240" font-weight="bold">quels outils IA sont dans la boucle et sur quelles c&#233;r&#233;monies.</text>
  <line x1="92" y1="278" x2="736" y2="278" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="92"  y="292" font-family="Georgia,serif" font-size="8.5"
        fill="#bbbbbb" font-style="italic">Si ton SM h&#233;site ou g&#233;n&#233;ralise (&#171; on utilise un peu l&#39;IA &#187;) :</text>
  <text x="92"  y="306" font-family="Georgia,serif" font-size="8.5"
        fill="#bbbbbb" font-style="italic">l&#39;usage n&#39;est pas structur&#233;. C&#39;est le premier signal d&#39;une adoption sans cadre.</text>

  <rect x="72" y="324" width="676" height="100" fill="#fafaf7" rx="2"/>
  <rect x="72" y="324" width="10" height="100" fill="#2a7a2a" rx="2"/>
  <rect x="72" y="324" width="676" height="24" fill="#0f2240" rx="2"/>
  <text x="92"  y="340" font-family="Helvetica,sans-serif" font-size="8.5"
        fill="#febd10" font-weight="bold" letter-spacing="1">SIGNAL 2</text>
  <text x="92"  y="364" font-family="Georgia,serif" font-size="11"
        fill="#0f2240" font-weight="bold">L&#39;accord IA de l&#39;&#233;quipe a &#233;t&#233; relu</text>
  <text x="92"  y="379" font-family="Georgia,serif" font-size="11"
        fill="#0f2240" font-weight="bold">il y a moins de 2 mois.</text>
  <line x1="92" y1="388" x2="736" y2="388" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="92"  y="402" font-family="Georgia,serif" font-size="8.5"
        fill="#bbbbbb" font-style="italic">Seuil d&#39;alerte : accord non r&#233;vis&#233; depuis plus de 2 mois.</text>
  <text x="92"  y="416" font-family="Georgia,serif" font-size="8.5"
        fill="#bbbbbb" font-style="italic">Un accord qui vieillit est un accord que personne ne respecte plus vraiment.</text>

  <rect x="72" y="434" width="676" height="100" fill="#fafaf7" rx="2"/>
  <rect x="72" y="434" width="10" height="100" fill="#2a7a2a" rx="2"/>
  <rect x="72" y="434" width="676" height="24" fill="#0f2240" rx="2"/>
  <text x="92"  y="450" font-family="Helvetica,sans-serif" font-size="8.5"
        fill="#febd10" font-weight="bold" letter-spacing="1">SIGNAL 3</text>
  <text x="92"  y="474" font-family="Georgia,serif" font-size="11"
        fill="#0f2240" font-weight="bold">L&#39;&#233;quipe dit non &#224; des outputs IA</text>
  <text x="92"  y="489" font-family="Georgia,serif" font-size="11"
        fill="#0f2240" font-weight="bold">sans que personne ne s&#39;en &#233;tonne.</text>
  <line x1="92" y1="498" x2="736" y2="498" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="92"  y="512" font-family="Georgia,serif" font-size="8.5"
        fill="#bbbbbb" font-style="italic">Si refuser un output IA est v&#233;cu comme une lenteur ou un frein :</text>
  <text x="92"  y="526" font-family="Georgia,serif" font-size="8.5"
        fill="#bbbbbb" font-style="italic">la valeur 4 (responsabilit&#233; humaine) n&#39;est pas int&#233;gris&#233;e.</text>

  <rect x="72" y="554" width="676" height="36" fill="#febd10" rx="2"/>
  <text x="410" y="568" font-family="Georgia,serif" font-size="10"
        fill="#0f2240" text-anchor="middle" font-weight="bold">
    Si ces 3 signaux sont au vert : l&#39;IA est dans la boucle de fa&#231;on consciente.
  </text>
  <text x="410" y="582" font-family="Georgia,serif" font-size="9"
        fill="#0f2240" text-anchor="middle">
    Un seul signal rouge : ouvrir la conversation avec le SM, pas l&#39;&#233;quipe directement.
  </text>

  
  <rect x="72" y="602" width="676" height="20" fill="#0f2240" rx="2"/>
  <text x="82" y="616" font-family="Helvetica,sans-serif" font-size="8"
        fill="#ffffff" font-weight="bold" letter-spacing="0.8">AU NIVEAU DE L&#39;ORGANISATION</text>

  <rect x="72" y="622" width="676" height="100" fill="#fafaf7" rx="2"/>
  <text x="84" y="640" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
    Si plus d&#39;un tiers de tes &#233;quipes ont un accord IA non r&#233;vis&#233; depuis plus de 2 mois :
  </text>
  <text x="84" y="655" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
    c&#39;est un signal syst&#233;mique. Ce n&#39;est pas un probl&#232;me d&#39;&#233;quipe. C&#39;est un probl&#232;me de cadre.
  </text>
  <line x1="84" y1="666" x2="736" y2="666" stroke="#febd10" stroke-width="0.8"/>
  <text x="84" y="680" font-family="Helvetica,sans-serif" font-size="8"
        fill="#0f2240" font-weight="bold">QUESTION &#192; POSER EN REVUE TRIMESTRIELLE &#192; CHAQUE SM</text>
  <rect x="84" y="686" width="652" height="28" fill="#ffffff" rx="2"
        stroke="#febd10" stroke-width="1"/>
  <text x="410" y="704" font-family="Georgia,serif" font-size="10"
        fill="#0f2240" text-anchor="middle" font-style="italic">
    &#171; Quel accord IA as-tu sign&#233; avec ton &#233;quipe et quand l&#39;avez-vous relu pour la derni&#232;re fois ? &#187;
  </text>

</svg>