<rect x="0" y="0" width="54" height="1123" style="fill:#febd10;"/>
<rect x="7" y="20" width="40" height="120" rx="4" style="fill:#0f2240;opacity:0.15;"/>
<g transform="translate(27,900) rotate(-90)"><text x="0" y="0" style="font-family:Georgia,serif;font-size:11px;font-weight:bold;fill:#0f2240;">LE SYST&#200;ME S.A.L.I.M.</text></g>
<rect x="54" y="0" width="740" height="76" style="fill:#ffffff;"/>
<text x="72" y="22" style="font-family:Helvetica;font-size:8.5px;fill:#bbbbbb;">STRAT&#201;GIE > CADRAGE C&#201;R&#201;MONIE</text>
<rect x="686" y="8" width="94" height="22" rx="11" style="fill:#febd10;"/>
<text x="733" y="22" text-anchor="middle" style="font-family:Helvetica;font-size:9.5px;font-weight:bold;fill:#0f2240;">FP IV-15.5</text>
<line x1="72" y1="30" x2="780" y2="30" style="stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="56" style="font-family:Georgia,serif;font-size:24px;font-weight:bold;fill:#0f2240;">Canvas : Dois-je lancer cette r&#233;tro ?</text>
<text x="72" y="72" style="font-family:Georgia,serif;font-size:11px;font-style:italic;fill:#febd10;">Stade Tuckman &#183; Niveau Clark &#183; D&#233;cision GO / NO GO</text>
<rect x="54" y="78" width="740" height="72" style="fill:#febd10;"/>
<text x="72" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">POUR QUI</text>
<rect x="72" y="88" width="28" height="14" rx="3" style="fill:#0f2240;"/><text x="86" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">SM</text><rect x="106" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="120" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">PO</text><rect x="140" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="154" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">DEV</text><rect x="174" y="88" width="28" height="14" rx="3" style="fill:#0f2240;"/><text x="188" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">CA</text><rect x="208" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="222" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">MG</text><rect x="242" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="256" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">DC</text>
<line x1="262" y1="82" x2="262" y2="148" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="276" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">QUOI</text>
<text x="276" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Cadrage rapide avant de lancer une r&#233;trospective : s&#233;cu</text>
<text x="276" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">rit&#233; suffisante, niveau de maturit&#233;, risque d'amplification.</text>
<line x1="466" y1="82" x2="466" y2="148" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="480" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">QUAND</text>
<text x="480" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Avant chaque r&#233;trospective quand le climat semble </text>
<text x="480" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">tendu, apr&#232;s un incident, ou en phase Storming.</text>
<line x1="628" y1="82" x2="628" y2="148" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="642" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">VALEUR APPORT&#201;E</text>
<text x="642" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Eviter la retro inutile qui ferme l'equipe. Choisir </text>
<text x="642" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">la bonne intervention au bon moment.</text>
<line x1="54" y1="150" x2="794" y2="150" style="stroke:#febd10;stroke-width:1.5px;"/>
<rect x="54" y="158" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="173" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">1. CONTEXTE : O&#217; EN EST L'&#201;QUIPE ?</text>
<rect x="54" y="180" width="365" height="110" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="72" y="198" style="font-family:Helvetica;font-size:8.5px;font-weight:bold;fill:#0f2240;">STADE TUCKMAN ACTUEL</text>
<rect x="72" y="210" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="88" y="219" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">Forming</text>
<text x="165" y="219" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">N1 Clark requis</text>
<rect x="72" y="228" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="88" y="237" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">Storming</text>
<text x="165" y="237" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">N1 + intervention 1:1 d'abord</text>
<rect x="72" y="246" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="88" y="255" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">Norming</text>
<text x="165" y="255" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">OK pour retro standard</text>
<rect x="72" y="264" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="88" y="273" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">Performing</text>
<text x="165" y="273" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">Retro avancee possible</text>
<rect x="425" y="180" width="369" height="110" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="443" y="198" style="font-family:Helvetica;font-size:8.5px;font-weight:bold;fill:#0f2240;">NIVEAU CLARK DE L'&#201;QUIPE</text>
<rect x="443" y="210" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="459" y="219" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">N1 Inclusion</text>
<text x="575" y="219" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">Les gens s'expriment</text>
<rect x="443" y="228" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="459" y="237" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">N2 Learner</text>
<text x="575" y="237" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">Erreurs vues comme apprentissage</text>
<rect x="443" y="246" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="459" y="255" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">N3 Contributor</text>
<text x="575" y="255" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">Initiatives spontanees</text>
<rect x="443" y="264" width="10" height="10" rx="2" style="fill:none;stroke:#bbbbbb;stroke-width:1px;"/>
<text x="459" y="273" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">N4 Challenger</text>
<text x="575" y="273" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">Desaccords exprimes sans crainte</text>
<rect x="54" y="298" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="313" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">2. &#201;L&#201;MENTS CL&#201;S : SIGNAUX &#192; OBSERVER</text>
<rect x="54" y="320" width="740" height="16" style="fill:#e8ecf2;"/>
<text x="72" y="332" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">SIGNAL</text>
<text x="310" y="332" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">VALEUR</text>
<text x="530" y="332" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">INTERPRETATION</text>
<rect x="54" y="336" width="740" height="26" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="353" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Score Edmondson</text>
<text x="310" y="353" style="font-family:Georgia,serif;font-size:9px;fill:#bbbbbb;">_____ / 7</text>
<text x="530" y="353" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Inf. 4 = risque fort</text>
<rect x="54" y="364" width="740" height="26" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="381" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Dernier incident</text>
<text x="310" y="381" style="font-family:Georgia,serif;font-size:9px;fill:#bbbbbb;">____________________</text>
<text x="530" y="381" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Nomme ou tue le silence ?</text>
<rect x="54" y="392" width="740" height="26" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="409" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Recto silencieux</text>
<text x="310" y="409" style="font-family:Georgia,serif;font-size:9px;fill:#bbbbbb;">Oui / Non</text>
<text x="530" y="409" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Post-its neutres = signal rouge</text>
<rect x="54" y="420" width="740" height="26" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="437" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Score Westrum</text>
<text x="310" y="437" style="font-family:Georgia,serif;font-size:9px;fill:#bbbbbb;">_____ / 7</text>
<text x="530" y="437" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Inf. 3 = culture pathologique</text>
<rect x="54" y="448" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="463" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">3. CHOIX D'INTERVENTION</text>
<rect x="54" y="470" width="24" height="44" style="fill:#2a7a2a;"/>
<rect x="78" y="470" width="716" height="44" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="96" y="486" style="font-family:Georgia,serif;font-size:10px;font-weight:bold;fill:#0f2240;">GO retro standard</text>
<text x="96" y="502" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Score Edmondson sup. 4, niveau N2+, pas d'incident recent non resolu</text>
<rect x="54" y="520" width="24" height="44" style="fill:#5a7a2a;"/>
<rect x="78" y="520" width="716" height="44" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="96" y="536" style="font-family:Georgia,serif;font-size:10px;font-weight:bold;fill:#0f2240;">GO retro adaptee</text>
<text x="96" y="552" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Score 3.5-4, equipe en Norming, incident nomme mais pas resolu</text>
<rect x="54" y="570" width="24" height="44" style="fill:#cc7700;"/>
<rect x="78" y="570" width="716" height="44" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="96" y="586" style="font-family:Georgia,serif;font-size:10px;font-weight:bold;fill:#0f2240;">NO GO : one-to-one d'abord</text>
<text x="96" y="602" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Score inf. 3.5, Storming actif, incident non nomme</text>
<rect x="54" y="620" width="24" height="44" style="fill:#cc3333;"/>
<rect x="78" y="620" width="716" height="44" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="96" y="636" style="font-family:Georgia,serif;font-size:10px;font-weight:bold;fill:#0f2240;">NO GO : pause ceremonies</text>
<text x="96" y="652" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Score inf. 3, culture pathologique confirmee Westrum</text>
<rect x="54" y="670" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="685" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">4. ALTERNATIVES SI NO GO</text>
<rect x="54" y="692" width="740" height="52" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="72" y="708" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#febd10;">01</text>
<text x="92" y="708" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">One-to-one SM / personne impactee</text>
<text x="92" y="726" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Avant toute ceremonie collective. Nommer le conflit sur les roles.</text>
<rect x="54" y="748" width="740" height="52" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="72" y="764" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#febd10;">02</text>
<text x="92" y="764" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">Retrospective sur un seul sujet</text>
<text x="92" y="782" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Pas de format libre. Un seul probleme, formule en avance, partage anonymement.</text>
<rect x="54" y="804" width="740" height="52" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="72" y="820" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#febd10;">03</text>
<text x="92" y="820" style="font-family:Georgia,serif;font-size:9.5px;font-weight:bold;fill:#0f2240;">Session de clarification des roles</text>
<text x="92" y="838" style="font-family:Georgia,serif;font-size:8.5px;fill:#555;">Format structure, pas retro. Objectif : reduire l'ambiguite, pas l'angoisse.</text>
<rect x="54" y="860" width="740" height="32" style="fill:#0f2240;"/>
<text x="424" y="874" text-anchor="middle" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#ffffff;">En Storming, les pratiques agiles amplifient les tensions au lieu de les resoudre.</text>
<text x="424" y="888" text-anchor="middle" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#febd10;">Une retro sur une equipe en conflit non resolu produit plus de bruit que de signal.</text>
<line x1="54" y1="1080" x2="794" y2="1080" style="stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="1092" style="font-family:Helvetica;font-size:7.5px;fill:#bbbbbb;">SOURCE : Le Syst&#232;me S.A.L.I.M. | Chapitre 15 | p.321-323</text>
<rect x="372" y="1080" width="46" height="20" rx="10" style="fill:#0f2240;"/>
<text x="395" y="1094" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#febd10;">IV-15.5</text>
<text x="720" y="1092" style="font-family:Helvetica;font-size:7.5px;fill:#bbbbbb;">Le Syst&#232;me S.A.L.I.M.</text>
