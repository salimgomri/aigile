<text x="110" y="261" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">Réaction en direct</text>
<text x="230" y="261" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">Que se passe-t-il quand quelqu&#39;un met un sujet inconfort</text><text x="230" y="275" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">able sur la table ?</text>
<text x="590" y="261" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#0f2240;">P1 / P8</text>
