<text x="230" y="205" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">Comment décrirais-tu l'ambiance générale lors de tes rétros </text><text x="230" y="219" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">?</text>
<text x="590" y="205" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#0f2240;">P1 / P6</text>
<rect x="690" y="195" width="50" height="14" rx="2" style="fill:none;stroke:#bbb;stroke-width:0.8px;"/>

<rect x="66" y="243" width="686" height="56" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
