<text x="110" y="317" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">Trajectoire des problèmes</text>
<text x="230" y="317" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">Quand un problème revient sur plusieurs sprints, que se pass</text><text x="230" y="331" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">e-t-il ?</text>
