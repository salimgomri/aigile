<text x="82" y="691" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">Le pattern primaire est celui qui revient le plus souvent dans tes réponses.</text>
<text x="82" y="706" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">C'est une hypothèse de travail, pas un verdict. L'équipe peut l'invalider</text>
<text x="82" y="721" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;">dès les premières minutes. Utilise aigile.lu/retro pour le scoring automatique.</text>
