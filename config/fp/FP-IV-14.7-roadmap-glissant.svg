  <rect x="76" y="256" width="218" height="36" fill="#febd10" rx="4"/>
  <rect x="76" y="280" width="218" height="12" fill="#febd10"/>
  <text x="185" y="271" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#0f2240" letter-spacing="0.5">CE QU&#8217;ON A CONFIRM&#201;</text>
  <text x="185" y="284" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#0f2240" opacity="0.85">90 % ou plus de confiance</text>
  <text x="185" y="306" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="7.5" font-weight="bold" fill="#0f2240" opacity="0.6">Horizon 1 : 0-3 mois</text>
  <circle cx="90" cy="322" r="3" fill="#febd10"/>
  <text x="100" y="326" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Sprint Goals</text>
  <text x="100" y="338" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">valid&#233;s</text>
  <circle cx="90" cy="350" r="3" fill="#febd10"/>
  <text x="100" y="354" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Engagements pris</text>
  <text x="100" y="366" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">aupr&#232;s du</text>
  <circle cx="90" cy="378" r="3" fill="#febd10"/>
  <text x="100" y="382" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">PI Objectives</text>
  <text x="100" y="394" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">act&#233;s</text>
  <text x="86" y="418" font-family="Helvetica,Arial,sans-serif" font-size="7" fill="#bbbbbb" letter-spacing="0.5">À REMPLIR PAR LE PO</text>
