  <line x1="86" y1="516" x2="284" y2="516" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="86" y1="538" x2="284" y2="538" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
