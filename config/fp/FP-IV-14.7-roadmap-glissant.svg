  <text x="407" y="271" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.5">CE QU&#8217;ON PR&#201;VOIT</text>
  <text x="407" y="284" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#ffffff" opacity="0.85">60-80 % de confiance</text>
  <text x="407" y="306" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="7.5" font-weight="bold" fill="#0f2240" opacity="0.6">Horizon 2 : 3-6 mois</text>
  <circle cx="312" cy="322" r="3" fill="#febd10"/>
  <text x="322" y="326" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">&#201;pics</text>
  <text x="322" y="338" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">identifi&#233;s,</text>
  <circle cx="312" cy="350" r="3" fill="#febd10"/>
  <text x="322" y="354" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Non encore</text>
  <text x="322" y="366" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">planifi&#233;s en</text>
  <circle cx="312" cy="378" r="3" fill="#febd10"/>
  <text x="322" y="382" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Sous r&#233;serve de</text>
  <text x="322" y="394" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">capacit&#233; et</text>
  <text x="308" y="418" font-family="Helvetica,Arial,sans-serif" font-size="7" fill="#bbbbbb" letter-spacing="0.5">À REMPLIR PAR LE PO</text>
  <line x1="308" y1="428" x2="506" y2="428" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="308" y1="450" x2="506" y2="450" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="308" y1="472" x2="506" y2="472" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="308" y1="494" x2="506" y2="494" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="308" y1="516" x2="506" y2="516" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="308" y1="538" x2="506" y2="538" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <rect x="520" y="256" width="218" height="320" fill="#fafaf7" rx="4"/>
  <rect x="520" y="256" width="218" height="36" fill="#4a4a4a" rx="4"/>
  <rect x="520" y="280" width="218" height="12" fill="#4a4a4a"/>
  <text x="629" y="271" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.5">CE QU&#8217;ON EXPLORE</text>
  <text x="629" y="284" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" font-style="italic" fill="#ffffff" opacity="0.85">Direction valid&#233;e, p&#233;rim&#232;tre ouvert</text>
  <text x="629" y="306" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="7.5" font-weight="bold" fill="#0f2240" opacity="0.6">Horizon 3 : 6-9 mois</text>
  <circle cx="534" cy="322" r="3" fill="#febd10"/>
  <text x="544" y="326" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">D&#233;cisions</text>
  <text x="544" y="338" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">business prises</text>
  <circle cx="534" cy="350" r="3" fill="#febd10"/>
  <text x="544" y="354" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">P&#233;rim&#232;tre</text>
  <text x="544" y="366" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">encore ouvert</text>
  <circle cx="534" cy="378" r="3" fill="#febd10"/>
  <text x="544" y="382" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Ne pas confondre avec</text>
  <text x="544" y="394" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">du vide</text>
  <text x="530" y="418" font-family="Helvetica,Arial,sans-serif" font-size="7" fill="#bbbbbb" letter-spacing="0.5">À REMPLIR PAR LE PO</text>
  <line x1="530" y1="428" x2="728" y2="428" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="530" y1="450" x2="728" y2="450" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="530" y1="472" x2="728" y2="472" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="530" y1="494" x2="728" y2="494" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="530" y1="516" x2="728" y2="516" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="530" y1="538" x2="728" y2="538" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <rect x="72" y="590" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="604" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.8">VOCABULAIRE PARTAG&#201; AVEC LE MANAGER</text>

  <rect x="72" y="612" width="676" height="50" fill="#ffffff" rx="2"/>
  <text x="82" y="628" font-family="Georgia,serif" font-size="8.5" font-weight="bold" fill="#0f2240">PAS de jargon agile dans le document envoy&#233; au manager.</text>
  <text x="82" y="642" font-family="Georgia,serif" font-size="8.5" font-weight="normal" fill="#0f2240">Colonne 1 : "Ce qu&#8217;on a confirm&#233;"  Colonne 2 : "Ce qu&#8217;on pr&#233;voit"  Colonne 3 : "Ce qu&#8217;on explore"</text>
  <text x="82" y="656" font-family="Georgia,serif" font-size="8.5" font-weight="normal" fill="#0f2240">Envoy&#233; avec le dashboard, pas en r&#233;union d&#233;di&#233;e.</text>
  <line x1="72" y1="1078" x2="748" y2="1078" stroke="#febd10" stroke-width="1"/>
  <rect x="372" y="1083" width="50" height="18" rx="9" fill="#0f2240"/>
  <text x="397" y="1095" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#febd10">IV-14.7</text>
  <text x="72" y="1095" font-family="Helvetica,Arial,sans-serif" font-size="7" fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M.</text>
  <text x="748" y="1095" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="7" fill="#bbbbbb">Chapitre 14 · Partie 4</text>
