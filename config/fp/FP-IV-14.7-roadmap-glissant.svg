  <text transform="translate(17,1050) rotate(-90)"
        font-family="Georgia,serif" font-size="10" font-weight="bold"
        fill="#0f2240" letter-spacing="2">LE SYST&#200;ME S.A.L.I.M.</text>
  <rect x="54" y="0" width="740" height="75" fill="#ffffff"/>
  <text x="72" y="22" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#bbbbbb" letter-spacing="1">RELATION MANAGER > ROADMAP</text>
  <rect x="695" y="8" width="90" height="22" rx="11" fill="#febd10"/>
  <text x="740" y="23" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">FP IV-14.7</text>
  <line x1="72" y1="30" x2="748" y2="30" stroke="#febd10" stroke-width="1"/>
  <text x="72" y="58" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#0f2240">Roadmap horizon glissant</text>
  <text x="72" y="74" font-family="Georgia,serif" font-size="10" font-style="italic" fill="#febd10">3 colonnes, 3 niveaux de confiance. Z&#233;ro jargon agile dans le document partag&#233;.</text>
  <rect x="54" y="78" width="740" height="68" fill="#febd10"/>
  <text x="72" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">POUR QUI</text>
  <text x="72" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">PO, SM</text>
  <line x1="252" y1="85" x2="252" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="257" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUOI</text>
  <text x="257" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Partager la</text>
  <text x="257" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">visibilit&#233;</text>
  <text x="257" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">trimestrielle au manager</text>
  <line x1="437" y1="85" x2="437" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="442" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">QUAND L&#39;UTILISER</text>
  <text x="442" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Mise &#224; jour en 5 min</text>
  <text x="442" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">apr&#232;s chaque Sprint</text>
  <text x="442" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Review, envoy&#233;e avec</text>
  <line x1="622" y1="85" x2="622" y2="138" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
  <text x="627" y="96" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="#0f2240" letter-spacing="1">VALEUR APPORT&#201;E</text>
  <text x="627" y="110" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">Le manager arr&#234;te de</text>
  <text x="627" y="122" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">demander un planning ferme</text>
  <text x="627" y="134" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#0f2240" opacity="0.85">sur 6 mois.</text>

  <rect x="72" y="162" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="176" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.8">QUI PRODUIT CE DOCUMENT</text>

  <rect x="72" y="184" width="676" height="40" fill="#fafaf7" rx="2"/>
  <circle cx="86" cy="196" r="3" fill="#febd10"/>
  <text x="96" y="200" font-family="Georgia,serif" font-size="9" fill="#0f2240">PO : produit les 3 colonnes depuis le backlog et les d&#233;cisions business.</text>
  <circle cx="86" cy="212" r="3" fill="#febd10"/>
  <text x="96" y="216" font-family="Georgia,serif" font-size="9" fill="#0f2240">SM : contribue le volet capacit&#233; (v&#233;locit&#233; historique) et les d&#233;pendances bloquantes.</text>
  <rect x="72" y="234" width="676" height="20" rx="2" fill="#0f2240"/>
  <text x="82" y="248" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.8">STRUCTURE : 3 HORIZONS DE CONFIANCE</text>

