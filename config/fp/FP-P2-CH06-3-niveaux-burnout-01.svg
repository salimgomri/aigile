<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style>
</defs>

<rect x="0" y="0" width="794" height="1123" style="fill:#ffffff;"/>
<rect x="0" y="0" width="54" height="1123" style="fill:#febd10;"/>
<g transform="translate(8,30)">
      <ellipse cx="19" cy="8" rx="6" ry="6" style="fill:#0f2240;opacity:0.5;"/>
      <rect x="14" y="14" width="10" height="22" rx="3" style="fill:#0f2240;opacity:0.5;"/>
      <rect x="9" y="38" width="20" height="3" rx="1.5" style="fill:#0f2240;opacity:0.5;"/>
    </g>
<g transform="rotate(-90, 27, 600)">
      <text x="27" y="600" text-anchor="middle"
            style="font-family:'Georgia',serif;font-size:11px;font-weight:bold;fill:#0f2240;letter-spacing:2px;">
        LE SYST&#200;ME S.A.L.I.M.
      </text>
    </g>
<rect x="54" y="0" width="740" height="72" style="fill:#ffffff;"/>
<text x="72" y="28" style="font-family:'Helvetica';font-size:8.5px;fill:#bbbbbb;">PILOTAGE &gt; DASHBOARD</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
             c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23" style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP II-6.2</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58" style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">Les 3 niveaux de burnout</text>
<text x="72" y="72" style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">Croise le score Niko-Niko avec les signaux comportementaux.</text>
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#ffffff;opacity:0.5;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#ffffff;opacity:0.5;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#ffffff;opacity:0.5;"/>
<text x="72" y="97" style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">SM, CA</text>
<text x="252" y="97" style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Grille de lecture en 3 niveaux, seuils et signaux observables</text>
<text x="437" y="97" style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L&#39;UTILISER</text>
<text x="437" y="113" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">A chaque retrospective, ou au premier signal comportemental</text>
<text x="622" y="97" style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Diagnostic rapide et action calibree au bon niveau</text>
<rect x="54" y="160" width="740" height="190" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:1px;"/>
<text x="72" y="184" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">1. NIVEAUX ET SEUILS NIKO-NIKO</text>
<rect x="66" y="190" width="716" height="20" style="fill:#0f2240;"/>
<text x="72" y="204" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#ffffff;letter-spacing:1px;">NIVEAU</text>
<text x="180" y="204" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#ffffff;letter-spacing:1px;">NIKO-NIKO</text>
<text x="330" y="204" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#ffffff;letter-spacing:1px;">SIGNAL DOMINANT</text>
<text x="480" y="204" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#ffffff;letter-spacing:1px;">ACTION</text>
<text x="700" y="204" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#ffffff;letter-spacing:1px;">STATUT</text>
<circle cx="78" cy="224" r="5" style="fill:#2a7a2a;"/>
<text x="84" y="228" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">NIVEAU 1</text>
<text x="180" y="228" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">1.7 - 2.0</text>
<text x="330" y="228" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Fatigue, recuperable</text>
<text x="480" y="228" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Sprint plus calme, retro ciblee</text>
<rect x="66" y="236" width="716" height="0.6" style="fill:#e0e0e0;"/>
<circle cx="78" cy="262" r="5" style="fill:#c9973a;"/>
<text x="84" y="266" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">NIVEAU 2</text>
<text x="180" y="266" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&lt; 1.7</text>
<text x="330" y="266" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Desengagement mental</text>
<text x="480" y="266" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Intervention causes structurelles</text>
<rect x="66" y="274" width="716" height="0.6" style="fill:#e0e0e0;"/>
<circle cx="78" cy="300" r="5" style="fill:#cc3333;"/>
<text x="84" y="304" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">NIVEAU 3</text>
<text x="180" y="304" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">outil inutilisable</text>
<text x="330" y="304" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Demissions, arrets, conflits ouverts</text>
<text x="480" y="304" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Gestion de crise, lire signaux comportementaux</text>
<rect x="66" y="312" width="716" height="0.6" style="fill:#e0e0e0;"/>
<text x="72" y="342" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;font-style:italic;fill:#bbbbbb;">Source : 9 ans d'observation terrain. Coherent avec les travaux de Maslach sur l'epuisement professionnel (1981).</text>
<rect x="54" y="370" width="343" height="240" style="fill:#0f2240;"/>
<text x="72" y="396" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#ffffff;">2. SIGNAUX EN C&#201;R&#201;MONIE</text>
<circle cx="72" cy="417" r="2" style="fill:#febd10;"/>
<text x="82" y="420" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">Daily mecanique : reponses minimales,</text>
<circle cx="72" cy="432" r="2" style="fill:#febd10;"/>
<text x="82" y="435" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">pas d'initiative, pas de questions</text>
<circle cx="72" cy="462" r="2" style="fill:#febd10;"/>
<text x="82" y="465" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">La retro genere de moins en moins</text>
<circle cx="72" cy="477" r="2" style="fill:#febd10;"/>
<text x="82" y="480" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">d'elements. Le silence s'installe.</text>
<circle cx="72" cy="507" r="2" style="fill:#febd10;"/>
<text x="82" y="510" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">Engagements de Sprint Planning revus</text>
<circle cx="72" cy="522" r="2" style="fill:#febd10;"/>
<text x="82" y="525" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">a la baisse sans explication</text>
<circle cx="72" cy="552" r="2" style="fill:#febd10;"/>
<text x="82" y="555" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">Un membre qui prenait la parole</text>
<circle cx="72" cy="567" r="2" style="fill:#febd10;"/>
<text x="82" y="570" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">regulierement disparait des</text>
<circle cx="72" cy="582" r="2" style="fill:#febd10;"/>
<text x="82" y="585" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#ffffff;">conversations</text>
<rect x="411" y="370" width="343" height="240" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:1px;"/>
<text x="429" y="396" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">3. SIGNAUX DANS LE TRAVAIL</text>
<circle cx="429" cy="417" r="2" style="fill:#febd10;"/>
<text x="439" y="420" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Taux de stories non finies en fin</text>
<circle cx="429" cy="432" r="2" style="fill:#febd10;"/>
<text x="439" y="435" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">de sprint augmente : pas par</text>
<circle cx="429" cy="447" r="2" style="fill:#febd10;"/>
<text x="439" y="450" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">complexite, par manque d'energie</text>
<circle cx="429" cy="477" r="2" style="fill:#febd10;"/>
<text x="439" y="480" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Qualite du code baisse. L'equipe</text>
<circle cx="429" cy="492" r="2" style="fill:#febd10;"/>
<text x="439" y="495" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">livre, mais au minimum viable</text>
<circle cx="429" cy="522" r="2" style="fill:#febd10;"/>
<text x="439" y="525" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Retours en Sprint Review de moins</text>
<circle cx="429" cy="537" r="2" style="fill:#febd10;"/>
<text x="439" y="540" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">en moins enthousiastes de la part</text>
<circle cx="429" cy="552" r="2" style="fill:#febd10;"/>
<text x="439" y="555" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">de l'equipe elle-meme</text>
<circle cx="429" cy="582" r="2" style="fill:#febd10;"/>
<text x="439" y="585" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Signal terrain : l'equipe arrete de</text>
<circle cx="429" cy="597" r="2" style="fill:#febd10;"/>
<text x="439" y="600" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">refactorer, les PR reviews</text>
<circle cx="429" cy="612" r="2" style="fill:#febd10;"/>
<text x="439" y="615" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">deviennent des tampons, personne</text>
<circle cx="429" cy="627" r="2" style="fill:#febd10;"/>
<text x="439" y="630" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">ne nettoie ce qui depasse</text>
<rect x="54" y="630" width="740" height="180" style="fill:#febd10;"/>
<text x="72" y="656" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">4. EN PRATIQUE, NIVEAU 3</text>
<text x="72" y="680" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">1. Renegocie tout de suite le scope avec le PO, meme si ca casse l'engagement : c'est pour proteger</text>
<text x="72" y="694" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">   ceux qui restent d'une surcharge supplementaire.</text>
<text x="72" y="722" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">2. Isole ensuite les causes structurelles, charge, conflit, management, avant toute conversation sur</text>
<text x="72" y="736" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">   un retour a la normale.</text>
<text x="72" y="764" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">3. Si un arret maladie ou un depart est en cours, verifie le protocole RH de ton organisation : il existe</text>
<text x="72" y="778" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">   deja, tu n'as pas a l'inventer.</text>
<text x="72" y="806" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">4. Ne promets aucune date de retour a la normale. La priorite, c'est d'arreter l'hemorragie.</text>
<path d="M66,1068l686,0" style="fill:none;stroke:#febd10;stroke-width:0.8px;"/>
<path d="M426,1084c0,5.519 -4.481,10 -10,10l-38,0c-5.519,0 -10,-4.481 -10,-10
             c0,-5.519 4.481,-10 10,-10l38,0c5.519,0 10,4.481 10,10Z" style="fill:#0f2240;"/>
<text x="388" y="1088" style="font-family:'Helvetica';font-size:9px;fill:#febd10;">02</text>
<text x="72" y="1089" style="font-family:'Helvetica';font-size:7.5px;fill:#bbbbbb;">SOURCE : Le Syst&#232;me S.A.L.I.M.</text>
<text x="677" y="1089" style="font-family:'Helvetica';font-size:7.5px;fill:#bbbbbb;">Le Syst&#232;me S.A.L.I.M.</text>
</svg>