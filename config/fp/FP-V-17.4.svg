<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">

<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>

<!-- LOGO PLACEHOLDER -->
<rect x="6" y="60" width="42" height="42" rx="4" fill="#0f2240"/>
<text x="27" y="87" font-family="Georgia,serif" font-size="9" fill="#febd10"
      text-anchor="middle" font-weight="bold">S</text>

<g transform="translate(27,900) rotate(-90)">
  <text font-family="Georgia,serif" font-size="11" fill="#0f2240" font-weight="bold"
        text-anchor="middle">LE SYST&#200;ME S.A.L.I.M.</text>
</g>

<!-- HEADER -->
<rect x="54" y="0" width="740" height="78" fill="#ffffff"/>
<text x="72" y="22" font-family="Helvetica,Arial,sans-serif" font-size="8.5"
      fill="#bbbbbb" letter-spacing="1">MANAGEMENT &#8250; N&#201;GOCIATION DIRECTION</text>
<rect x="686" y="8" width="96" height="22" rx="11" fill="#febd10"/>
<text x="734" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5"
      fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-17.4</text>
<line x1="72" y1="30" x2="766" y2="30" stroke="#febd10" stroke-width="1"/>
<text x="72" y="58" font-family="Georgia,serif" font-size="24" fill="#0f2240"
      font-weight="bold">N&#233;gocier la capacit&#233; IA avec la direction</text>
<text x="72" y="74" font-family="Georgia,serif" font-size="11" fill="#febd10"
      font-style="italic">Pr&#233;pare 2 phrases avant la r&#233;union. Teste-les sur ton SM d&#39;abord.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="80" width="740" height="62" fill="#febd10"/>
<line x1="238" y1="88" x2="238" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
<line x1="422" y1="88" x2="422" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
<line x1="606" y1="88" x2="606" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>

<text x="72" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">POUR QUI</text>
<text x="72" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Manager</text>
<text x="72" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">MG</text>

<text x="256" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUOI</text>
<text x="256" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">3 scripts pr&#234;ts &#224; l&#39;emploi</text>
<text x="256" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">face &#224; la direction</text>

<text x="440" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUAND L&#39;UTILISER</text>
<text x="440" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Avant toute r&#233;union o&#249;</text>
<text x="440" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">la direction cite l&#39;IA</text>

<text x="624" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">VALEUR APPORT&#201;E</text>
<text x="624" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Tenir les deux bouts sans</text>
<text x="624" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">capituler ni bloquer</text>

<!-- PRINCIPE INTRO -->
<rect x="54" y="150" width="740" height="30" fill="#0f2240" rx="2"/>
<text x="424" y="163" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" text-anchor="middle" font-weight="bold" letter-spacing="1">LOGIQUE STRUCTURELLEMENT FAUSSE</text>
<text x="424" y="176" font-family="Georgia,serif" font-size="9" fill="#ffffff"
      text-anchor="middle">L&#39;IA acc&#233;l&#232;re les t&#226;ches m&#233;caniques. Elle n&#39;acc&#233;l&#232;re pas le jugement, la confiance, la r&#233;solution complexe.</text>

<!-- SCRIPT 1 -->
<rect x="54" y="188" width="740" height="26" fill="#febd10"/>
<text x="72" y="205" font-family="Helvetica,Arial,sans-serif" font-size="8.5"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">SCRIPT 01  &#8250;  &#171; L&#39;IA vous permet de faire 2x plus. On peut doubler les objectifs. &#187;</text>

<rect x="54" y="214" width="740" height="70" fill="#f8f8f8"/>
<rect x="54" y="214" width="6" height="70" fill="#febd10"/>
<text x="72" y="232" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold">R&#201;PONSE</text>
<text x="72" y="248" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  &#171; L&#39;IA acc&#233;l&#232;re une partie significative de nos t&#226;ches m&#233;caniques.</text>
<text x="72" y="263" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  Le pourcentage restant pour la compr&#233;hension client, les d&#233;cisions d&#39;architecture,</text>
<text x="72" y="278" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  la r&#233;solution de conflits : prend le m&#234;me temps. Augmenter le volume sans augmenter</text>
<text x="72" y="282" font-family="Georgia,serif" font-size="9" fill="#bbbbbb" font-style="italic">
  la capacit&#233; humaine ne ferait qu&#39;acc&#233;l&#233;rer les erreurs. &#187;</text>
<line x1="54" y1="284" x2="794" y2="284" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- SCRIPT 2 -->
<rect x="54" y="284" width="740" height="26" fill="#febd10"/>
<text x="72" y="301" font-family="Helvetica,Arial,sans-serif" font-size="8.5"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">SCRIPT 02  &#8250;  &#171; Les concurrents livrent plus vite avec l&#39;IA. On ne peut pas rester &#224; la m&#234;me cadence. &#187;</text>

<rect x="54" y="310" width="740" height="70" fill="#ffffff"/>
<rect x="54" y="310" width="6" height="70" fill="#febd10"/>
<text x="72" y="328" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold">R&#201;PONSE</text>
<text x="72" y="344" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  &#171; Livrer plus vite n&#39;est pas notre contrainte principale. Notre contrainte est</text>
<text x="72" y="359" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  de livrer ce qui a de la valeur. L&#39;IA nous aide &#224; r&#233;duire le temps sur les t&#226;ches</text>
<text x="72" y="374" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  sans valeur. Ce temps r&#233;cup&#233;r&#233;, on le r&#233;investit dans la compr&#233;hension</text>
<text x="72" y="377" font-family="Georgia,serif" font-size="9" fill="#bbbbbb" font-style="italic">
  des vrais besoins. &#187;</text>
<line x1="54" y1="380" x2="794" y2="380" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- SCRIPT 3 -->
<rect x="54" y="380" width="740" height="26" fill="#febd10"/>
<text x="72" y="397" font-family="Helvetica,Arial,sans-serif" font-size="8.5"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">SCRIPT 03  &#8250;  &#171; Montrez-moi les donn&#233;es sur la productivit&#233; IA. &#187;</text>

<rect x="54" y="406" width="740" height="80" fill="#f8f8f8"/>
<rect x="54" y="406" width="6" height="80" fill="#febd10"/>
<text x="72" y="424" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold">R&#201;PONSE</text>
<text x="72" y="440" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  &#171; Voici les donn&#233;es : +30&#160;% de v&#233;locit&#233;, CFR stable, Lead Time en baisse.</text>
<text x="72" y="455" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  Ce que ces donn&#233;es ne montrent pas encore : l&#39;impact sur la qualit&#233;</text>
<text x="72" y="470" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  des d&#233;cisions techniques dans 2 trimestres. On mesure &#231;a comment, ensemble&#160;? &#187;</text>
<text x="72" y="482" font-family="Georgia,serif" font-size="8.5" fill="#bbbbbb"
      font-style="italic">Si la direction perçoit la question comme une esquive, voir plan B ci-dessous.</text>
<line x1="54" y1="486" x2="794" y2="486" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- PLAN B -->
<rect x="54" y="486" width="740" height="56" fill="#fff3cd" rx="0"/>
<rect x="54" y="486" width="6" height="56" fill="#0f2240"/>
<text x="72" y="504" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">PLAN B : SI LA DIRECTION PERÇOIT UNE ESQUIVE</text>
<text x="72" y="520" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  &#171; Je vous propose qu&#39;on d&#233;finisse ensemble les indicateurs de qualit&#233; technique</text>
<text x="72" y="535" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  qu&#39;on veut suivre sur les 2 prochains trimestres. J&#39;ai une premi&#232;re &#233;bauche. &#187;</text>

<!-- PREP MESURE -->
<rect x="54" y="550" width="740" height="28" fill="#0f2240" rx="2"/>
<text x="424" y="563" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" text-anchor="middle" font-weight="bold" letter-spacing="1">PR&#201;PARATION : CHIFFRER LA PART M&#201;CANIQUE AVANT LA R&#201;UNION</text>
<text x="424" y="574" font-family="Georgia,serif" font-size="0" fill="none"/>

<rect x="54" y="578" width="740" height="66" fill="#f8f8f8"/>
<text x="72" y="596" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  Sur 1 sprint : demande &#224; chaque membre de noter le temps gagn&#233; gr&#226;ce &#224; l&#39;IA sur des</text>
<text x="72" y="611" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  t&#226;ches qu&#39;il aurait faites seul de toute fa&#231;on. Estimation par sprint, pas au chronomètre.</text>
<text x="72" y="626" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  Ce chiffre te donne un ordre de grandeur honnête &#224; pr&#233;senter &#224; la direction.</text>
<text x="72" y="638" font-family="Georgia,serif" font-size="8.5" fill="#febd10"
      font-style="italic">Source : principe de mesure empirique sur une it&#233;ration (Mike Cohn)</text>

<!-- POSTURE -->
<rect x="54" y="652" width="740" height="54" fill="#fafaf7" rx="2"/>
<rect x="54" y="652" width="6" height="54" fill="#0f2240"/>
<text x="72" y="670" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">POSTURE : CE QUE CES SCRIPTS NE FONT PAS</text>
<text x="72" y="686" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  Ils ne s&#39;opposent pas &#224; la direction. Ils d&#233;placent la conversation du volume vers la valeur.</text>
<text x="72" y="699" font-family="Georgia,serif" font-size="9.5" fill="#0f2240">
  Un manager qui r&#233;pond avec des donn&#233;es et des nuances vaut mieux qu&#39;un manager qui dit oui et livre dans le mur.</text>

<!-- NOTES -->
<rect x="54" y="716" width="740" height="130" fill="#fafaf7" rx="2"/>
<rect x="54" y="716" width="740" height="20" fill="#e8e8e8" rx="2"/>
<text x="72" y="730" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">NOTES DE PR&#201;PARATION</text>
<line x1="72" y1="752" x2="780" y2="752" stroke="#e0e0e0" stroke-width="0.5"/>
<line x1="72" y1="772" x2="780" y2="772" stroke="#e0e0e0" stroke-width="0.5"/>
<line x1="72" y1="792" x2="780" y2="792" stroke="#e0e0e0" stroke-width="0.5"/>
<line x1="72" y1="812" x2="780" y2="812" stroke="#e0e0e0" stroke-width="0.5"/>
<line x1="72" y1="832" x2="780" y2="832" stroke="#e0e0e0" stroke-width="0.5"/>

