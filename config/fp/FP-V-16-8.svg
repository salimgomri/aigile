<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style>
</defs>
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>
<text transform="translate(13,900) rotate(-90)"
      font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0f2240"
      letter-spacing="2">LE SYST&#200;ME S.A.L.I.M.</text>
<g transform="translate(8,60)">
  <circle cx="18" cy="18" r="16" fill="none" stroke="#0f2240" stroke-width="2"/>
  <circle cx="18" cy="18" r="11" fill="none" stroke="#0f2240" stroke-width="1.5"/>
  <circle cx="18" cy="18" r="6"  fill="none" stroke="#0f2240" stroke-width="1"/>
  <circle cx="18" cy="18" r="2"  fill="#0f2240"/>
</g>
<rect x="54" y="0" width="740" height="72" fill="#ffffff"/>
<text x="72" y="28" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#bbbbbb">M&#201;MO R&#201;F&#201;RENCE . GOUVERNANCE IA MULTI-&#201;QUIPES</text>
<rect x="686" y="8" width="94" height="22" rx="11" fill="#febd10"/>
<text x="733" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-16.8</text>
<line x1="72" y1="36" x2="766" y2="36" stroke="#febd10" stroke-width="1"/>
<text x="72" y="58" font-family="Georgia,serif" font-size="26" fill="#0f2240" font-weight="bold">Construire une politique IA par en bas</text>
<text x="72" y="71" font-family="EB Garamond,Georgia,serif" font-size="11" font-style="italic" fill="#febd10">Une politique impos&#233;e est contourne en 30 jours. Une politique v&#233;cue s'applique.</text>
<rect x="54" y="78" width="740" height="66" fill="#febd10"/>
<line x1="239" y1="86" x2="239" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="424" y1="86" x2="424" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="609" y1="86" x2="609" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<text x="72"  y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">POUR QUI</text>
<text x="252" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUOI</text>
<text x="437" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUAND L'UTILISER</text>
<text x="622" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">VALEUR APPORT&#201;E</text>
<text x="72"  y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">DC / MG</text>
<text x="252" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">D&#233;marche ascendante : accords &#233;quipes vers politique DSI</text>
<text x="437" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Lors du d&#233;ploiement IA sur plusieurs &#233;quipes</text>
<text x="622" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Gouvernance applicable, pas d&#233;cid&#233;e dans les hauteurs</text>
<rect x="66" y="154" width="662" height="36" rx="4" fill="#1A1A1A"/><text x="397" y="170" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">LE PRINCIPE</text><text x="397" y="184" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff" text-anchor="middle">La politique IA impos&#233;e par une DSI sans consultation terrain est contourne en 30 jours. L'accord &#233;quipe construit par les praticiens s'applique.</text><rect x="66" y="198" width="662" height="22" fill="#0f2240"/><text x="397" y="213" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">D&#201;MARCHE EN 4 &#201;TAPES</text><rect x="66" y="222" width="662" height="54" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="222" width="48" height="54" fill="#febd10" opacity="0.1"/><text x="90" y="254" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#febd10" text-anchor="middle">01</text><text x="124" y="241" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Chaque &#233;quipe r&#233;dige son accord en 60 minutes</text><text x="124" y="255" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#555555">En r&#233;trospective. 6 questions (Q1 &#224; Q6). R&#233;dig&#233; en live, affich&#233; dans l'espace &#233;quipe. Partag&#233; avec la direction IT une fois stabilis&#233;.</text><rect x="66" y="276" width="662" height="54" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="276" width="48" height="54" fill="#febd10" opacity="0.1"/><text x="90" y="308" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#febd10" text-anchor="middle">02</text><text x="124" y="295" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Collecter les convergences sur Q1, Q3 et Q6</text><text x="124" y="309" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#555555">Q1 : quels outils autoris&#233;s et quelles donn&#233;es prot&#233;g&#233;es. Q3 : qui est responsable quand l'IA bugue. Q6 : comment d&#233;tecter les faux positifs IA.</text><rect x="66" y="330" width="662" height="54" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="330" width="48" height="54" fill="#febd10" opacity="0.1"/><text x="90" y="362" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#febd10" text-anchor="middle">03</text><text x="124" y="349" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Construire la politique maison &#224; partir des convergences</text><text x="124" y="363" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#555555">Ce qui revient dans toutes les &#233;quipes devient la r&#232;gle commune. Ce qui diverge reste &#224; la discr&#233;tion de chaque &#233;quipe. Politique v&#233;cue, pas descendue.</text><rect x="66" y="384" width="662" height="54" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><rect x="66" y="384" width="48" height="54" fill="#febd10" opacity="0.1"/><text x="90" y="416" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#febd10" text-anchor="middle">04</text><text x="124" y="403" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#0f2240">Valider avec la direction IT et juridique</text><text x="124" y="417" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#555555">L'accord &#233;quipe ne remplace pas une directive juridique. Il la compl&#232;te par en bas. Une fois consolid&#233;, le partager avec IT pour alignement s&#233;curit&#233; et conformit&#233;.</text>
<rect x="66" y="448" width="662" height="22" rx="3" fill="#0f2240"/>
<text x="76" y="463" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">LES 3 QUESTIONS DE CONVERGENCE INTER-&#201;QUIPES</text>
<rect x="66" y="470" width="662" height="88" rx="0" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.8"/><text x="76" y="483" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333">Q1 : Quels outils IA sont autoris&#233;s ? Quelles cat&#233;gories de donn&#233;es ne quittent</text>
<text x="76" y="495" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333">      pas l'infrastructure ? (RGPD, code propri&#233;taire, entra&#238;nement involontaire)</text>
<text x="76" y="507" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333"></text>
<text x="76" y="519" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333">Q3 : Qui est responsable quand un output IA introduit un bug en production ?</text>
<text x="76" y="531" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333">      (Les r&#233;ponses divergentes entre &#233;quipes = ton premier diagnostic.)</text>
<text x="76" y="543" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333"></text>
<text x="76" y="555" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333">Q6 : Comment d&#233;tectons-nous les outputs IA qui semblent corrects mais ne le sont pas ?</text>
<text x="76" y="567" font-family="EB Garamond,Georgia,serif" font-size="8.5" fill="#333333">      Pour les composants critiques : revue de code sans recourir &#224; l'IA.</text>
<rect x="66" y="570" width="662" height="44" rx="4" fill="#0f2240"/><text x="397" y="587" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">SIGNAL DE SUCC&#200;S</text><text x="397" y="601" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff" text-anchor="middle">La politique est contest&#233;e au moins une fois dans les 30 jours apr&#232;s publication. Ca veut dire qu'elle est vivante.</text>
<line x1="66" y1="1068" x2="752" y2="1068" stroke="#febd10" stroke-width="0.8"/>
<rect x="368" y="1074" width="58" height="20" rx="10" fill="#0f2240"/>
<text x="397" y="1088" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#febd10" text-anchor="middle" font-weight="bold">V-16.8</text>
<text x="72"  y="1089" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M. &#8212; Chapitre 16</text>
<text x="677" y="1089" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#bbbbbb">Le Syst&#232;me S.A.L.I.M.</text>
</svg>