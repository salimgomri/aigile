</defs><rect x="0" y="0" width="794" height="1123" style="fill:#fff;stroke:none;stroke-width:0px;"/><rect x="0" y="0" width="54" height="1123" style="fill:#febd10;stroke:none;stroke-width:0px;"/><g><use xlink:href="#_Image13" x="0" y="0" width="2072px" height="656px" transform="matrix(0,-1.002428,1.002604,0,5.867447,155.566358)"/></g><g transform="matrix(-0,-1,1,-0,-893.165,946.835)"><text x="-36.025px" y="920px" style="font-family:'Georgia', serif;font-size:11px;fill:#0f2240;">L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px 26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px 68.29px 72.906px 76.201px 86.73px" y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">E SYST&#200;ME S.A.L.I.M.</tspan></text></g><rect x="54" y="0" width="740" height="74" style="fill:#fff;stroke:none;stroke-width:0px;"/><text x="72" y="26" style="font-family:'Helvetica','Arial',sans-serif;font-size:8px;fill:#bbb;letter-spacing:0.5px;">TEMPLATE PROMPT IA</text><rect x="686" y="10" width="96" height="22" rx="11" style="fill:#febd10;"/><text x="692" y="25" style="font-family:'Helvetica','Arial',sans-serif;font-size:9.5px;fill:#0f2240;letter-spacing:0px;font-weight:bold;">FP V-19.2</text><line x1="72" y1="34" x2="766" y2="34" stroke="#febd10" stroke-width="1"/><text x="72" y="57" style="font-family:'EB Garamond','Georgia',serif;font-size:26px;fill:#0f2240;font-weight:bold;">Le prompt professionnel</text><text x="72" y="71" style="font-family:'EB Garamond','Georgia',serif;font-size:10.5px;fill:#febd10;font-style:italic;">Un prompt structur&#233; est une hypoth&#232;se. V&#233;rifie le r&#233;sultat sur le terrain.</text><rect x="54" y="78" width="740" height="64" style="fill:#febd10;stroke:none;stroke-width:0px;"/><text x="72" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text><text x="72" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">SM / PO / DEV / CA</text><line x1="258" y1="84" x2="258" y2="136" stroke="#0f2240" stroke-width="0.4"/><text x="264" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text><text x="264" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">5 composantes + 1 garde-fou humain</text><line x1="450" y1="84" x2="450" y2="136" stroke="#0f2240" stroke-width="0.4"/><text x="456" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">QUAND</text><text x="456" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">Avant tout prompt sur une d&#233;cision qui compte</text><line x1="638" y1="84" x2="638" y2="136" stroke="#0f2240" stroke-width="0.4"/><text x="644" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">VALEUR</text><text x="644" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">R&#233;duire les outputs vagues. Garder la d&#233;cision c&#244;t&#233; humain.</text><rect x="72" y="152" width="700" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="167" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">01   ROLE   :   Donne un contexte d&#39;expertise &#224; l&#39;IA</text><rect x="72" y="174" width="700" height="44" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="175" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">D&#233;finis qui est l&#39;IA dans ce prompt. Un SM ? Un coach ? Un d&#233;veloppeur senior ?</text><text x="80" y="191" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#c9973a;font-style:italic;">Ex : Tu es un SM avec 10 ans d&#39;exp&#233;rience en environnement bancaire r&#233;gul&#233;.</text><rect x="72" y="230" width="700" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="245" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">02   CONTEXTE   :   D&#233;cris la situation r&#233;elle</text><rect x="72" y="252" width="700" height="44" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="253" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">C&#39;est la composante qui &#233;choue en premier. D&#233;cris les briques impact&#233;es, l&#39;histoire de l&#39;&#233;quipe,</text><text x="80" y="269" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">les contraintes sp&#233;cifiques. L&#39;IA ne conna&#238;t pas ton architecture. Elle avance quand m&#234;me.</text><rect x="72" y="308" width="700" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="323" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">03   TACHE   :   Formule l&#39;action attendue pr&#233;cis&#233;ment</text><rect x="72" y="330" width="700" height="44" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="331" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Verbe d&#39;action + p&#233;rim&#232;tre + contrainte de volume.</text><text x="80" y="347" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#c9973a;font-style:italic;">Ex : Propose 5 questions d&#39;ouverture pour une r&#233;tro sous tension, format court.</text><rect x="72" y="386" width="700" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="401" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">04   FORMAT   :   Cadre le format de l&#39;output</text><rect x="72" y="408" width="700" height="44" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="409" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Liste num&#233;rot&#233;e ? Tableau ? Maximum X lignes ? Ton factuel ou directif ?</text><text x="80" y="425" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#c9973a;font-style:italic;">Ex : R&#233;ponds en liste num&#233;rot&#233;e. Maximum 3 lignes par question. Ton factuel.</text><rect x="72" y="464" width="700" height="100" style="fill:#fff3e0;stroke:#c9973a;stroke-width:1px;" rx="4"/><text x="80" y="480" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#c9973a;letter-spacing:0.3px;font-weight:bold;">05   VALIDATION   :   Le garde-fou humain</text><line x1="80" y1="484" x2="764" y2="484" stroke="#c9973a" stroke-width="0.5"/><text x="80" y="501" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Valider un output IA ne veut pas dire le relire. C&#39;est te poser une question honnete :</text><rect x="80" y="508" width="684" height="28" style="fill:#0f2240;stroke:none;stroke-width:0px;" rx="3"/><text x="388" y="527" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#febd10;font-style:italic;text-anchor:middle;">Est-ce que je prendrais cette d&#233;cision si l&#39;IA ne me l&#39;avait pas propos&#233;e ?</text><text x="80" y="551" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#cc3333;">Si la r&#233;ponse est non, l&#39;IA a d&#233;cid&#233; &#224; ta place.</text><rect x="72" y="578" width="340" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="593" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">PROTOCOLE PROMPT LIBRARY</text><rect x="72" y="600" width="340" height="108" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="603" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">1</text><text x="98" y="603" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Identifie 1 t&#226;che r&#233;p&#233;titive > 30 min</text><text x="80" y="621" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">2</text><text x="98" y="621" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Ecris le prompt avec les 5 composantes</text><text x="80" y="639" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">3</text><text x="98" y="639" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Teste sur un cas r&#233;el. Note ce qui manque</text><text x="80" y="657" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">4</text><text x="98" y="657" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Affine le Contexte : c&#39;est lui qui &#233;choue</text><text x="80" y="675" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">5</text><text x="98" y="675" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Sauvegarde. Nomme clairement</text><text x="80" y="697" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#c9973a;font-style:italic;">Cible : 10 a 15 prompts pour la majorit&#233; des situations.</text><rect x="420" y="578" width="352" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="428" y="593" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">MAINTENANCE TRIMESTRIELLE</text><rect x="420" y="600" width="352" height="108" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><circle cx="432" cy="600" r="3.5" style="fill:#febd10;"/><text x="442" y="603" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Les mod&#232;les changent tous les 6 &#224; 12 mois</text><circle cx="432" cy="618" r="3.5" style="fill:#febd10;"/><text x="442" y="621" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Ton &#233;quipe change aussi</text><circle cx="432" cy="636" r="3.5" style="fill:#febd10;"/><text x="442" y="639" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">5 seniors vs 3 juniors : prompts diff&#233;rents</text><circle cx="432" cy="654" r="3.5" style="fill:#febd10;"/><text x="442" y="657" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">R&#233;vision = Sch&#246;n appliqu&#233; &#224; tes outils</text><text x="428" y="683" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">Observation, ajustement, nommer ce qui change.</text><rect x="72" y="722" width="700" height="50" style="fill:#f8f8f8;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="737" style="font-family:'Helvetica','Arial',sans-serif;font-size:7.5px;fill:#bbb;letter-spacing:1px;">NOTES PAR ROLE :</text><text x="80" y="752" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;">PO : la priorisation IA reste une proposition. La d&#233;cision int&#232;gre les tensions stakeholders que l&#39;IA ne voit pas.</text><text x="80" y="765" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;">DEV : avant tout prompt code, d&#233;cris les briques impact&#233;es et les effets de bord. L&#39;IA avance m&#234;me si tu ne le fais pas.</text><line x1="54" y1="1082" x2="794" y2="1082" stroke="#febd10" stroke-width="1"/><text x="388" y="1096" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#febd10;font-weight:bold;text-anchor:middle;">V-19.2</text><text x="72" y="1096" style="font-family:'Helvetica','Arial',sans-serif;font-size:7.5px;fill:#bbb;letter-spacing:0px;">SOURCE : Le Syst&#232;me S.A.L.I.M.</text><text x="600" y="1096" style="font-family:'Helvetica','Arial',sans-serif;font-size:7.5px;fill:#bbb;letter-spacing:0px;">Chapitre 19 . Partie V</text></svg>