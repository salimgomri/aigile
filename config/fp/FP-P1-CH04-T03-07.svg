<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">4 indicateurs et seuils pour auditer la maturit&#233; backlog de plusieurs &#233;quipes</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
