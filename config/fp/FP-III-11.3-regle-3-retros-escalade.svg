<rect x="0" y="0" width="794" height="1123" style="fill:#fff;"/>
<rect x="0" y="0" width="54" height="1123" style="fill:#febd10;"/>

<!-- LOGO PLACEHOLDER (remplacer avec cat1.svg asset) -->
<rect x="4" y="50" width="46" height="100" rx="3" style="fill:#0f2240;opacity:0.3;"/>
<text x="27" y="108" style="font-family:Georgia,serif;font-size:7px;fill:#0f2240;text-anchor:middle;">LOGO</text>

<!-- TEXTE VERTICAL -->
<g transform="translate(27, 750) rotate(-90)">
  <text style="font-family:Georgia,serif;font-size:11px;fill:#0f2240;letter-spacing:2px;">LE SYST&#200;ME S.A.L.I.M.</text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="78" style="fill:#fff;"/>
<text x="72" y="22" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#bbb;">FACILITATION > D&#201;CISION D'ESCALADE</text>
<rect x="680" y="8" width="98" height="22" rx="11" style="fill:#febd10;"/>
<text x="690" y="23" style="font-family:Helvetica,sans-serif;font-size:9.5px;fill:#0f2240;">FP III-11.3</text>
<line x1="72" y1="30" x2="766" y2="30" style="stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="54" style="font-family:Georgia,serif;font-size:24px;fill:#0f2240;">Règle des 3 rétros : quand escalader</text>
<text x="72" y="70" style="font-family:Georgia,serif;font-size:11px;font-style:italic;fill:#febd10;">Ne refacilite pas une quatrième fois. Escale. C'est le bon canal.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<line x1="239" y1="86" x2="239" y2="136" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<line x1="424" y1="86" x2="424" y2="136" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<line x1="609" y1="86" x2="609" y2="136" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>

<text x="72" y="98" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="115" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.85;">SM / CA</text>

<text x="252" y="98" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="115" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.85;">Critères pour décider quand escalader un pattern persistant</text>

<text x="437" y="98" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="115" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.85;">Quand le même pattern revient 3 sprints consécutifs sans amélioration</text>

<text x="622" y="98" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="115" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.85;">Ne plus faciliter dans le vide. Nommer le blocage au bon niveau.</text>

<rect x="66" y="158" width="686" height="22" style="fill:#0f2240;"/>
<text x="74" y="173" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#fff;">N°</text>
<text x="110" y="173" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#fff;">CRIT&#200;RE DE V&#201;RIFICATION</text>
<text x="440" y="173" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#fff;">DESCRIPTION</text>
<text x="660" y="173" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#fff;">GO &#9675;</text>
<text x="695" y="173" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#fff;">NOGO &#9679;</text>

<rect x="66" y="180" width="686" height="58" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="82" y="202" style="font-family:Helvetica,sans-serif;font-size:10px;fill:#febd10;font-weight:bold;">01</text>
<text x="110" y="202" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">Pattern identique sur 3 sprints</text>
<rect x="108" y="208" width="50" height="12" rx="3" style="fill:#cc3333;opacity:0.15;"/>
<text x="112" y="218" style="font-family:Helvetica,sans-serif;font-size:7px;fill:#cc3333;">Critique</text>
<text x="440" y="202" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Le même pattern primaire revient 3 sprints consécuti</text>
<text x="440" y="215" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">fs.</text>
<circle cx="670" cy="202" r="8" style="fill:none;stroke:#2a7a2a;stroke-width:1.5px;"/>
<circle cx="700" cy="202" r="8" style="fill:none;stroke:#cc3333;stroke-width:1.5px;"/>

<rect x="66" y="238" width="686" height="58" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="82" y="260" style="font-family:Helvetica,sans-serif;font-size:10px;fill:#febd10;font-weight:bold;">02</text>
<text x="110" y="260" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">Zéro signal d'amélioration observé</text>
<rect x="108" y="266" width="50" height="12" rx="3" style="fill:#cc3333;opacity:0.15;"/>
<text x="112" y="276" style="font-family:Helvetica,sans-serif;font-size:7px;fill:#cc3333;">Critique</text>
<text x="440" y="260" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Aucun signal du pattern (ex: P1 : personne n'a dit q</text>
<text x="440" y="273" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">uelque chose de nouveau).</text>
<circle cx="670" cy="260" r="8" style="fill:none;stroke:#2a7a2a;stroke-width:1.5px;"/>
<circle cx="700" cy="260" r="8" style="fill:none;stroke:#cc3333;stroke-width:1.5px;"/>

<rect x="66" y="296" width="686" height="58" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="82" y="318" style="font-family:Helvetica,sans-serif;font-size:10px;fill:#febd10;font-weight:bold;">03</text>
<text x="110" y="318" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">Actions de rétro non réalisées</text>
<rect x="108" y="324" width="50" height="12" rx="3" style="fill:#febd10;opacity:0.15;"/>
<text x="112" y="334" style="font-family:Helvetica,sans-serif;font-size:7px;fill:#febd10;">Important</text>
<text x="440" y="318" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Moins de 2 actions sur 3 réalisées sur la période de</text>
<text x="440" y="331" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">s 3 sprints.</text>
<circle cx="670" cy="318" r="8" style="fill:none;stroke:#2a7a2a;stroke-width:1.5px;"/>
<circle cx="700" cy="318" r="8" style="fill:none;stroke:#cc3333;stroke-width:1.5px;"/>

<rect x="66" y="354" width="686" height="58" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="82" y="376" style="font-family:Helvetica,sans-serif;font-size:10px;fill:#febd10;font-weight:bold;">04</text>
<text x="110" y="376" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">Cause organisationnelle probable</text>
<rect x="108" y="382" width="50" height="12" rx="3" style="fill:#febd10;opacity:0.15;"/>
<text x="112" y="392" style="font-family:Helvetica,sans-serif;font-size:7px;fill:#febd10;">Important</text>
<text x="440" y="376" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Le problème dépasse le périmètre de l'équipe (cultur</text>
<text x="440" y="389" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">e MG, structure, budget).</text>
<circle cx="670" cy="376" r="8" style="fill:none;stroke:#2a7a2a;stroke-width:1.5px;"/>
<circle cx="700" cy="376" r="8" style="fill:none;stroke:#cc3333;stroke-width:1.5px;"/>

<rect x="66" y="412" width="686" height="58" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="82" y="434" style="font-family:Helvetica,sans-serif;font-size:10px;fill:#febd10;font-weight:bold;">05</text>
<text x="110" y="434" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">SM a documenté les 3 sprints</text>
<rect x="108" y="440" width="50" height="12" rx="3" style="fill:#0f2240;opacity:0.15;"/>
<text x="112" y="450" style="font-family:Helvetica,sans-serif;font-size:7px;fill:#0f2240;">Requis</text>
<text x="440" y="434" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">2 lignes par sprint : pattern + signal observé ou ab</text>
<text x="440" y="447" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">sent. Données disponibles.</text>
<circle cx="670" cy="434" r="8" style="fill:none;stroke:#2a7a2a;stroke-width:1.5px;"/>
<circle cx="700" cy="434" r="8" style="fill:none;stroke:#cc3333;stroke-width:1.5px;"/>

<rect x="66" y="470" width="686" height="58" style="fill:#fff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="82" y="492" style="font-family:Helvetica,sans-serif;font-size:10px;fill:#febd10;font-weight:bold;">06</text>
<text x="110" y="492" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">Neutralité SM vérifiée</text>
<rect x="108" y="498" width="50" height="12" rx="3" style="fill:#0f2240;opacity:0.15;"/>
<text x="112" y="508" style="font-family:Helvetica,sans-serif;font-size:7px;fill:#0f2240;">Requis</text>
<text x="440" y="492" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">SM n'est pas lui-même partie prenante du conflit ou </text>
<text x="440" y="505" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">du blocage.</text>
<circle cx="670" cy="492" r="8" style="fill:none;stroke:#2a7a2a;stroke-width:1.5px;"/>
<circle cx="700" cy="492" r="8" style="fill:none;stroke:#cc3333;stroke-width:1.5px;"/>

<rect x="66" y="544" width="686" height="22" style="fill:#0f2240;"/>
<text x="82" y="559" style="font-family:Helvetica,sans-serif;font-size:8px;fill:#fff;letter-spacing:1px;">D&#201;CISION D'ESCALADE</text>

<rect x="66" y="566" width="340" height="120" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="82" y="584" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">&#9632; ESCALE AU MANAGER DIRECT</text>
<text x="82" y="600" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Nommer formellement le blocage avec</text>
<text x="82" y="612" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">données et contexte documentés.</text>
<text x="82" y="628" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">&#9632; SI PAS DE CHANGEMENT +2 SPRINTS</text>
<text x="82" y="644" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Remonter au sponsor agile ou aux RH</text>
<text x="82" y="656" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">selon la nature du blocage.</text>
<text x="82" y="672" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#febd10;font-weight:bold;">Ce n'est pas une défaite. C'est le bon canal.</text>

<rect x="406" y="566" width="346" height="120" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="422" y="584" style="font-family:Helvetica,sans-serif;font-size:8.5px;fill:#0f2240;font-weight:bold;">DOCUMENTATION MINIMALE (3 LIGNES)</text>
<text x="422" y="604" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Sprint N : Pattern P__ . Signal observé : ___________</text>
<text x="422" y="624" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Sprint N+1 : Pattern P__ . Signal observé : __________</text>
<text x="422" y="644" style="font-family:Georgia,serif;font-size:8px;font-style:italic;fill:#0f2240;">Sprint N+2 : Pattern P__ . Signal observé : __________</text>
<text x="422" y="662" style="font-family:Helvetica,sans-serif;font-size:7.5px;fill:#0f2240;opacity:0.6;">Pas un rapport. 3 lignes suffisent pour nommer le blocage.</text>

