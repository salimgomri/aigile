  <text x="-36.025px" y="920px"
        style="font-family:'Georgia',serif;font-size:11px;fill:#0f2240;">
    L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px
             26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px
             68.29px 72.906px 76.201px 86.73px"
            y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px
               920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">
      E SYST&#200;ME S.A.L.I.M.
    </tspan>
  </text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">MEMO &gt; LECTURE RAPIDE</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP II-5.5</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">Faut-il s'inquieter ?</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">Le repere des 15% et la lecture de tendance, avant ta Sprint Review.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.25;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.25;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.25;"/>

<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">SM</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Le repere terrain des 15% pour decider si une variation de velocite merite une question</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Juste avant une Sprint Review, quand la velocite a bouge depuis le sprint precedent</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Une grille de lecture en 30 secondes, pour repondre sans surreagir ni minimiser</text>

<rect x="54" y="156" width="740" height="120" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="156" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="171" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">LE REPERE : PLUS OU MOINS 15%</text>

<text x="64" y="195" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="64" dy="0">Une variation de plus ou moins 15% d'un sprint a l'autre est normale. Elle ne</tspan>
  <tspan x="64" dy="18">merite generalement pas qu'on s'y arrete.</tspan>
  <tspan x="64" dy="26">Ce n'est pas une norme scientifique. C'est un repere terrain, observe sur des</tspan>
  <tspan x="64" dy="18">vingtaines d'equipes. Il sert a filtrer le bruit, pas a remplacer ton jugement.</tspan>
</text>

<rect x="54" y="290" width="362" height="200" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="290" width="362" height="22" style="fill:#0f2240;"/>
<text x="64" y="305" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">LES 3 REPERES DE LECTURE</text>

<text x="64" y="329" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="64" dy="0" font-weight="600">Stabilite cible : plus ou moins 15%</tspan>
  <tspan x="64" dy="16">Variation normale, sprint a sprint.</tspan>
  <tspan x="64" dy="26" font-weight="600">Fenetre d'analyse : 3 sprints</tspan>
  <tspan x="64" dy="16">Le minimum pour une tendance fiable.</tspan>
  <tspan x="64" dy="26" font-weight="600">Signal d'alerte : 4 sprints</tspan>
  <tspan x="64" dy="16">Baisse consecutive : la, tu</tspan>
  <tspan x="64" dy="14">investigues.</tspan>
</text>

<rect x="432" y="290" width="362" height="200" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="432" y="290" width="362" height="22" style="fill:#0f2240;"/>
<text x="442" y="305" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">AVANT DE COMMENTER UN CHIFFRE</text>

<text x="442" y="329" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="442" dy="0">Une seule variation ne dit rien. Regarde</tspan>
  <tspan x="442" dy="16">toujours la tendance sur 5 a 8 sprints,</tspan>
  <tspan x="442" dy="16">jamais le point isole.</tspan>
  <tspan x="442" dy="24">Si la moyenne sur 3 sprints est stable a</tspan>
  <tspan x="442" dy="16">plus ou moins 15%, ta velocite est</tspan>
  <tspan x="442" dy="16">fiable. Pas de question necessaire.</tspan>
  <tspan x="442" dy="24">Si la baisse est progressive sur 4</tspan>
  <tspan x="442" dy="16">sprints consecutifs, commence a poser</tspan>
  <tspan x="442" dy="16">des questions.</tspan>
</text>

<rect x="54" y="504" width="740" height="170" style="fill:none;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="504" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="519" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">GRILLE DE DECISION RAPIDE</text>

<text x="64" y="543" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">
  <tspan x="64" dy="0" font-weight="600">Variation isolee, dans la fourchette des 15% :</tspan>
  <tspan x="64" dy="16">Tu ne commentes pas. Une vélocité de 34 contre 41 (soit moins 17%) est limite</tspan>
  <tspan x="64" dy="16">mais reste dans l'ordre du normal si le sprint precedent etait stable.</tspan>
  <tspan x="64" dy="26" font-weight="600">Baisse sur 2 a 3 sprints, encore dans la fourchette :</tspan>
  <tspan x="64" dy="16">Tu notes le contexte (conges, story complexe, choix qualite), tu ne tires pas</tspan>
  <tspan x="64" dy="16">la sonnette d'alarme.</tspan>
  <tspan x="64" dy="26" font-weight="600">Baisse progressive sur 4 sprints consecutifs :</tspan>
  <tspan x="64" dy="16">La, tu investigues. C'est le seul cas qui justifie une question structuree</tspan>
  <tspan x="64" dy="16">en Retro ou en Refinement.</tspan>
</text>

<rect x="54" y="688" width="740" height="90" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:1px;"/>

<rect x="54" y="688" width="740" height="22" style="fill:#0f2240;"/>
<text x="64" y="703" style="font-family:'Helvetica';font-size:9px;fill:#fff;font-weight:bold;letter-spacing:1px;">NOTE TERRAIN</text>

<text x="64" y="727" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;font-style:italic;fill:#0f2240;opacity:0.8;">
  <tspan x="64" dy="0">Si la baisse vient d'un renforcement du DoD, ce repere ne s'applique pas :</tspan>
  <tspan x="64" dy="16">voir FP-II-5.4 "Ta vitesse n'est pas toi". Source : Chapitre 5, p.148-149 et p.152.</tspan>
</text>

