  <text x="-36.025px" y="920px"
        style="font-family:'Georgia',serif;font-size:11px;fill:#0f2240;">
    L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px
             26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px
             68.29px 72.906px 76.201px 86.73px"
            y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px
               920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">
      E SYST&#200;ME S.A.L.I.M.
    </tspan>
  </text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">M&#201;MO / R&#201;F&#201;RENCE &gt; DEFINITION OF DONE</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP I-4.6</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">DoD : ton contrat de qualit&#233;</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">3 niveaux de maturit&#233;, et le signal &#224; ne jamais ignorer.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">DEV / SM / MG / DC</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Les 3 niveaux d'&#233;volution de la DoD, et l'alerte allegement silencieux</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">N&#233;gociation de la DoD en r&#233;trospective, audit de maturit&#233; d'&#233;quipe</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Une DoD qui protège l'&#233;quipe plut&#244;t qu'une checklist impos&#233;e</text>

<!-- LIGNE 1 pleine largeur : DoD = protection -->
<rect x="54" y="158" width="740" height="62" style="fill:#fafaf7;"/>
<text x="72" y="180" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">POUR LE D&#201;VELOPPEUR : C'EST UN OUTIL DE PROTECTION, PAS UNE BUREAUCRATIE</text>
<path d="M72,186l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="206" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Une DoD &#224; minimum 8 crit&#232;res emp&#234;che de livrer du code non testable, non d&#233;ployable ou non document&#233;.</text>

<!-- LIGNE 2 : 3 niveaux empile -->
<text x="72" y="252" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#201;VOLUTION DE LA DoD : 3 NIVEAUX DE MATURIT&#201;</text>
<path d="M72,258l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>

<rect x="72" y="270" width="650" height="58" style="fill:#0f2240;"/>
<text x="84" y="290" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#febd10;">NIVEAU 1 . &#201;quipe d&#233;butante (moins de 6 mois de Scrum)</text>
<text x="84" y="308" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;">Code review&#233; | Tests unitaires pass&#233;s | D&#233;ploy&#233; en int&#233;gration |</text>
<text x="84" y="322" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;">Crit&#232;res d'acceptance v&#233;rifi&#233;s | Aucune r&#233;gression connue</text>

<rect x="72" y="332" width="650" height="58" style="fill:#555;"/>
<text x="84" y="352" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#febd10;">NIVEAU 2 . &#201;quipe confirm&#233;e (6 &#224; 18 mois)</text>
<text x="84" y="370" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;">Couverture sup&#233;rieure &#224; 70% | Tests d'int&#233;gration pass&#233;s |</text>
<text x="84" y="384" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;">Documentation mise &#224; jour | Revue UX si applicable</text>

<rect x="72" y="394" width="650" height="58" style="fill:#888;"/>
<text x="84" y="414" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#fff;">NIVEAU 3 . &#201;quipe mature (18 mois et plus)</text>
<text x="84" y="432" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;">Tests de performance pass&#233;s | Scan s&#233;curit&#233; effectu&#233; |</text>
<text x="84" y="446" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;">D&#233;ployable en production &#224; tout moment | Monitoring configur&#233;</text>

<text x="72" y="470" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.6;">Les seuils indiqu&#233;s sont des rep&#232;res terrain, non des normes Scrum.</text>

<!-- LIGNE 3 : DoD vs DoOD -->
<text x="72" y="510" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">CETTE DoD PORTE SUR LA SORTIE, PAS SUR L'USAGE</text>
<path d="M72,516l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="536" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Cette DoD dit ce qui est livr&#233;. Elle ne dit rien sur l'usage r&#233;el six mois apr&#232;s. Une Definition of</text>
<text x="72" y="552" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Outcome Done (valeur r&#233;alis&#233;e) rel&#232;ve d'un r&#233;f&#233;rentiel compl&#233;mentaire (SGEP).</text>

<!-- LIGNE 4 : alerte allegement -->
<rect x="54" y="592" width="740" height="100" style="fill:#fafaf7;"/>
<text x="72" y="616" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#cc3333;">ALERTE : DoD ALL&#201;G&#201;E SANS D&#201;CISION EXPLICITE</text>
<path d="M72,622l650,0" style="fill:none;stroke:#cc3333;stroke-width:1px;"/>
<text x="72" y="644" style="font-family:'Georgia',serif;font-size:13px;font-weight:bold;fill:#0f2240;">DoD all&#233;g&#233;e sans d&#233;cision = dette non trac&#233;e = v&#233;locit&#233; qui chute dans 3 &#224; 5 sprints</text>
<text x="72" y="666" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">La DoD doit &#233;voluer en r&#233;trospective, pas unilat&#233;ralement. Une remont&#233;e brutale de v&#233;locit&#233;</text>
<text x="72" y="680" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">apr&#232;s un all&#233;gement silencieux est un signal &#224; v&#233;rifier, pas &#224; c&#233;l&#233;brer en comit&#233;.</text>

<!-- LIGNE 5 : audit multi-equipes pour DSI -->
<text x="72" y="730" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">POUR LE DSI : COMPARER PLUSIEURS &#201;QUIPES</text>
<path d="M72,736l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="756" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Applique la m&#234;me grille INVEST/DoD &#224; chaque &#233;quipe et compare les &#233;carts, pas les valeurs</text>
<text x="72" y="772" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">absolues. 5/6 et 6/6 sur INVEST ne sont pas comparables sans regarder l'anciennet&#233; Scrum :</text>
<text x="72" y="788" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">utilise les 3 niveaux de maturit&#233; DoD ci-dessus comme r&#233;f&#233;rentiel commun.</text>

<!-- bandeau bas -->
<rect x="54" y="828" width="740" height="56" style="fill:#0f2240;"/>
<text x="72" y="850" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#febd10;">KPI CHAPITRE 4</text>
<text x="72" y="868" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#fff;">DoD : minimum 8 crit&#232;res d&#233;finis, v&#233;rifiables ET respect&#233;s. INVEST : 6/6 avant Sprint Planning.</text>

