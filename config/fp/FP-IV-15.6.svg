<text x="480" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">QUAND</text>
<text x="480" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Avant une decision d'investissement sur un programme cu</text>
<text x="480" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">lturel. En reponse a un coaching sur la transformation.</text>
<line x1="628" y1="82" x2="628" y2="148" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="642" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">VALEUR APPORT&#201;E</text>
<text x="642" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Transformer le sujet culture en argument livraison m</text>
<text x="642" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">esurable. Critere objectif avant de signer.</text>
<line x1="54" y1="150" x2="794" y2="150" style="stroke:#febd10;stroke-width:1.5px;"/>
<rect x="54" y="158" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="173" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">STRUCTURE DE LA LECTURE</text>
<rect x="54" y="180" width="246" height="60" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="177" y="198" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#0f2240;">OBJECTIF</text>
<text x="68" y="214" style="font-family:Georgia,serif;font-size:8px;fill:#0f2240;">Valider si la culture est un facteur de performance mes</text>
<text x="68" y="228" style="font-family:Georgia,serif;font-size:8px;fill:#0f2240;">urable dans ton organisation.</text>
<rect x="301" y="180" width="246" height="60" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="424" y="198" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#0f2240;">STRUCTURE</text>
<text x="315" y="214" style="font-family:Georgia,serif;font-size:8px;fill:#0f2240;">Contexte, diagnostic Westrum, lecture DORA, decision in</text>
<text x="315" y="228" style="font-family:Georgia,serif;font-size:8px;fill:#0f2240;">vestissement.</text>
<rect x="548" y="180" width="246" height="60" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="671" y="198" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#0f2240;">USAGE</text>
<text x="562" y="214" style="font-family:Georgia,serif;font-size:8px;fill:#0f2240;">Avant un comite de direction. En reponse a une proposit</text>
<text x="562" y="228" style="font-family:Georgia,serif;font-size:8px;fill:#0f2240;">ion de coaching culturel.</text>
<rect x="54" y="248" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="263" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">1. CONTEXTE</text>
<rect x="54" y="270" width="365" height="110" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="72" y="288" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Situation de depart</text>
<rect x="72" y="296" width="330" height="60" rx="2" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="86" y="314" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">Decris ici la situation actuelle :</text>
<text x="86" y="330" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">investissements deja faits, resultats obtenus,</text>
<text x="86" y="346" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">points de blocage identifies.</text>
<rect x="54" y="248" width="740" height="22" style="fill:#1a3560;"/>
<text x="424" y="263" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">2. SYNTH&#200;SE</text>
<rect x="425" y="270" width="369" height="110" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="443" y="288" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Faits cles DORA 2024</text>
<text x="443" y="304" style="font-family:Helvetica;font-size:8px;fill:#febd10;">01</text>
<text x="460" y="304" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Culture generative = scores DORA significativement meilleurs</text>
<text x="443" y="320" style="font-family:Helvetica;font-size:8px;fill:#febd10;">02</text>
<text x="460" y="320" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Lien culture/performance est causal, pas correlatif</text>
<text x="443" y="336" style="font-family:Helvetica;font-size:8px;fill:#febd10;">03</text>
<text x="460" y="336" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Les 3 socles sont interdependants : coordination,</text>
<text x="460" y="350" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">management, culture. Un seul manquant bloque les deux autres.</text>
<text x="443" y="368" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;font-style:italic;">Source : DORA 2024 / Westrum, 2004</text>
<rect x="54" y="388" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="403" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">3. DIAGNOSTIC WESTRUM DE TON P&#201;RIM&#200;TRE</text>
<rect x="54" y="410" width="365" height="120" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<rect x="72" y="420" width="10" height="10" rx="2" style="fill:none;stroke:#cc3333;stroke-width:1.5px;"/>
<text x="88" y="429" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Pathologique</text>
<text x="230" y="429" style="font-family:Georgia,serif;font-size:9px;fill:#bbbbbb;">Score : Inf. 3/7</text>
<rect x="72" y="450" width="10" height="10" rx="2" style="fill:none;stroke:#cc7700;stroke-width:1.5px;"/>
<text x="88" y="459" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Bureaucratique</text>
<text x="230" y="459" style="font-family:Georgia,serif;font-size:9px;fill:#bbbbbb;">Score : 3 a 5/7</text>
<rect x="72" y="480" width="10" height="10" rx="2" style="fill:none;stroke:#2a7a2a;stroke-width:1.5px;"/>
<text x="88" y="489" style="font-family:Georgia,serif;font-size:9px;font-weight:bold;fill:#0f2240;">Generative</text>
<text x="230" y="489" style="font-family:Georgia,serif;font-size:9px;fill:#bbbbbb;">Score : Sup. 5.5/7</text>
<text x="72" y="508" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Score Westrum actuel : _______ / 7</text>
<text x="72" y="524" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">Passer le survey sur aigile.lu (6 items, anonyme)</text>
<rect x="54" y="388" width="740" height="22" style="fill:#1a3560;"/>
<text x="424" y="403" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">4. D&#201;CISIONS RECOMMAND&#201;ES</text>
<rect x="425" y="410" width="369" height="120" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="443" y="426" style="font-family:Helvetica;font-size:8px;fill:#febd10;">01</text>
<text x="458" y="426" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">Passer le Westrum Culture Survey sur ton perimetre</text>
<text x="458" y="440" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">aigile.lu. Score agrege par equipe. Comparer avec DORA actuel.</text>
<text x="443" y="462" style="font-family:Helvetica;font-size:8px;fill:#febd10;">02</text>
<text x="458" y="462" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">Observer la correlation Westrum + DORA sur 2 trimestres</text>
<text x="458" y="476" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">Si Westrum monte et DORA suit : le lien causal est confirme chez </text>
<text x="443" y="498" style="font-family:Helvetica;font-size:8px;fill:#febd10;">03</text>
<text x="458" y="498" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#0f2240;">Arbitrer : intervenir sur contexte avant pratiques</text>
<text x="458" y="512" style="font-family:Georgia,serif;font-size:8px;fill:#bbbbbb;">Un score Westrum inferieur a 3 signifie que les pratiques agiles </text>
<rect x="54" y="538" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="553" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">5. ACTIONS &#192; MENER</text>
<rect x="54" y="560" width="740" height="18" style="fill:#e8ecf2;"/>
<text x="72" y="573" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">ACTION</text>
<text x="480" y="573" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">RESPONSABLE</text>
<text x="650" y="573" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">&#201;CH&#201;ANCE</text>
<rect x="54" y="578" width="740" height="26" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="595" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Passer le Westrum Culture Survey</text>
<text x="480" y="595" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">DSI / DRH</text>
<text x="650" y="595" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">Cette semaine</text>
<rect x="54" y="606" width="740" height="26" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="623" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Lire le score + comparer DORA</text>
<text x="480" y="623" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">DSI + Coach agile</text>
<text x="650" y="623" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">Semaine suivante</text>
<rect x="54" y="634" width="740" height="26" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="651" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Presenter les 3 socles au CODIR</text>
<text x="480" y="651" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">DSI</text>
<text x="650" y="651" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">Prochain CODIR</text>
<rect x="54" y="662" width="740" height="26" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="679" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Decider budget intervention culturelle</text>
<text x="480" y="679" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">DSI</text>
<text x="650" y="679" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;font-style:italic;">Apres validation score</text>
<rect x="54" y="690" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="705" text-anchor="middle" style="font-family:Helvetica;font-size:9px;font-weight:bold;fill:#ffffff;">6. INDICATEURS DE SUIVI</text>
<rect x="54" y="712" width="740" height="18" style="fill:#e8ecf2;"/>
<text x="72" y="725" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">INDICATEUR</text>
<text x="430" y="725" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">SEUIL CIBLE</text>
<text x="620" y="725" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;">FREQUENCE</text>
<rect x="54" y="730" width="740" height="26" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="747" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Score Edmondson moyen</text>
<text x="430" y="747" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#2a7a2a;">Sup. 5.5 / 7</text>
<text x="620" y="747" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;">Trimestriel</text>
<rect x="54" y="758" width="740" height="26" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="775" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Score Westrum culture</text>
<text x="430" y="775" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#2a7a2a;">Generatif sup. 5.5 / 7</text>
<text x="620" y="775" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;">Trimestriel</text>
<rect x="54" y="786" width="740" height="26" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.3px;"/>
<text x="72" y="803" style="font-family:Georgia,serif;font-size:8.5px;fill:#0f2240;">Correlation Westrum + DORA</text>
<text x="430" y="803" style="font-family:Georgia,serif;font-size:8.5px;font-weight:bold;fill:#2a7a2a;">Progression parallele</text>
<text x="620" y="803" style="font-family:Georgia,serif;font-size:8.5px;fill:#bbbbbb;">Sur 2 trimestres</text>
<rect x="54" y="814" width="740" height="36" style="fill:#0f2240;"/>
<text x="424" y="828" text-anchor="middle" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#ffffff;">Le Westrum Culture Survey te donnera plus d&#39;information sur tes risques de livraison</text>
<text x="424" y="844" text-anchor="middle" style="font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#febd10;">que ton dashboard de velocite.</text>
