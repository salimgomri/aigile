<text x="72" y="56" style="font-family:Georgia,serif;font-size:24px;font-weight:bold;fill:#0f2240;">Synthese Culture pour le D&#233;cideur</text>
<text x="72" y="72" style="font-family:Georgia,serif;font-size:11px;font-style:italic;fill:#febd10;">DORA 2024 &#183; Westrum &#183; Edmondson &#183; Argument ROI</text>
<rect x="54" y="78" width="740" height="72" style="fill:#febd10;"/>
<text x="72" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">POUR QUI</text>
<rect x="72" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="86" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">SM</text><rect x="106" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="120" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">PO</text><rect x="140" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="154" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">DEV</text><rect x="174" y="88" width="28" height="14" rx="3" style="fill:#bbbbbb;"/><text x="188" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">CA</text><rect x="208" y="88" width="28" height="14" rx="3" style="fill:#0f2240;"/><text x="222" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">MG</text><rect x="242" y="88" width="28" height="14" rx="3" style="fill:#0f2240;"/><text x="256" y="98.5" text-anchor="middle" style="font-family:Helvetica;font-size:8px;font-weight:bold;fill:#ffffff;">DC</text>
<line x1="262" y1="82" x2="262" y2="148" style="stroke:#0f2240;stroke-width:0.5px;opacity:0.3;"/>
<text x="276" y="88" style="font-family:Helvetica;font-size:7.5px;font-weight:bold;fill:#0f2240;letter-spacing:1.5;">QUOI</text>
<text x="276" y="102" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">Cadre de lecture culture = performance livraison pour DSI et dire</text>
<text x="276" y="116" style="font-family:Georgia,serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.85;">cteurs. Arguments bases sur DORA 2024.</text>
