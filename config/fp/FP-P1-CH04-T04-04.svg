  <ellipse cx="19" cy="34" rx="12" ry="30" style="fill:none;stroke:#0f2240;stroke-width:1.1px;opacity:0.4;" transform="rotate(8 19 34)"/>
  <ellipse cx="19" cy="34" rx="7" ry="22" style="fill:none;stroke:#0f2240;stroke-width:1.1px;opacity:0.3;" transform="rotate(8 19 34)"/>
  <circle cx="19" cy="6" r="3.2" style="fill:#0f2240;"/>
  <path d="M19,9 L19,28 M19,16 L11,24 M19,16 L27,24 M19,28 L13,40 M19,28 L25,40"
        style="stroke:#0f2240;stroke-width:1.6px;stroke-linecap:round;fill:none;"/>
</g>


<!-- TEXTE VERTICAL -->
<g transform="matrix(-0,-1,1,-0,-893.165,946.835)">
  <text x="-36.025px" y="920px"
        style="font-family:'Georgia',serif;font-size:11px;fill:#0f2240;">
    L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px
             26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px
             68.29px 72.906px 76.201px 86.73px"
            y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px
               920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">
      E SYST&#200;ME S.A.L.I.M.
    </tspan>
  </text>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" style="fill:#fff;"/>
<text x="72" y="28"
      style="font-family:'Helvetica';font-size:8.5px;fill:#bbb;">CHECKLIST D&#201;CISION &gt; SPIKE</text>
<path d="M780,19c0,6.071 -4.929,11 -11,11l-72,0c-6.071,0 -11,-4.929 -11,-11
         c0,-6.071 4.929,-11 11,-11l72,0c6.071,0 11,4.929 11,11Z" style="fill:#febd10;"/>
<text x="708" y="23"
      style="font-family:'Helvetica';font-size:9.5px;fill:#0f2240;">FP I-4.4</text>
<path d="M72,36l694,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<text x="72" y="58"
      style="font-family:'Georgia',serif;font-size:26px;fill:#0f2240;">Spike : le lancer ou pas</text>
<text x="72" y="72"
      style="font-family:'EB Garamond','Georgia',serif;font-size:11px;font-style:italic;fill:#febd10;">L&#232;ve l'incertitude avant qu'elle co&#251;te un sprint.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" style="fill:#febd10;"/>
<rect x="238.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="423.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<rect x="608.7" y="86" width="0.6" height="50" style="fill:#0f2240;opacity:0.18;"/>
<text x="72" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text>
<text x="72" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">SM / PO / DEV / DC</text>
<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Crit&#232;res pour distinguer un spike l&#233;gitime d'une d&#233;rive ou d'un &#233;vitement</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Quand une story ne peut pas &#234;tre estim&#233;e par manque d'information critique</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">&#201;viter un sprint perdu ou une estimation forc&#233;e sur une incompr&#233;hension</text>

<!-- Tableau Go/No-Go -->
<text x="72" y="172" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">EST-CE UN SPIKE L&#201;GITIME ?</text>
<path d="M72,178l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>

<rect x="72" y="190" width="650" height="24" style="fill:#0f2240;"/>
<text x="84" y="206" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#fff;">#</text>
<text x="110" y="206" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#fff;">CRIT&#200;RE DE V&#201;RIFICATION</text>
<text x="540" y="206" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#fff;">GO &#9675;</text>
<text x="600" y="206" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#fff;">NO GO &#9679;</text>
<text x="665" y="206" style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#fff;">NOTES</text>

<g font-family="'EB Garamond','Georgia',serif" font-size="9px" fill="#0f2240">
<rect x="72" y="214" width="650" height="34" style="fill:#fafaf7;"/>
<text x="84" y="234">01</text>
<text x="110" y="230">La question tient en une phrase</text>
<text x="110" y="244" style="font-style:italic;opacity:0.65;">Si tu ne peux pas la formuler avant de cr&#233;er le ticket, le spike n'est pas pr&#234;t</text>
<circle cx="546" cy="232" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.3px;"/>
<circle cx="608" cy="232" r="3" style="fill:#cc3333;"/>

<rect x="72" y="248" width="650" height="34" style="fill:#fff;"/>
<text x="84" y="268">02</text>
<text x="110" y="264">La vraie contrainte est la connaissance, pas le temps</text>
<text x="110" y="278" style="font-style:italic;opacity:0.65;">Si la contrainte est le d&#233;lai, le spike n'est pas la bonne r&#233;ponse</text>
<circle cx="546" cy="266" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.3px;"/>
<circle cx="608" cy="266" r="3" style="fill:#cc3333;"/>

<rect x="72" y="282" width="650" height="34" style="fill:#fafaf7;"/>
<text x="84" y="302">03</text>
<text x="110" y="298">Une dur&#233;e time-box&#233;e est fix&#233;e avant de commencer</text>
<text x="110" y="312" style="font-style:italic;opacity:0.65;">D&#233;cid&#233;e en Sprint Planning, elle ne bouge pas</text>
<circle cx="546" cy="300" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.3px;"/>
<circle cx="608" cy="300" r="3" style="fill:#cc3333;"/>

<rect x="72" y="316" width="650" height="34" style="fill:#fff;"/>
<text x="84" y="336">04</text>
<text x="110" y="332">Le livrable attendu est une page : pas du code</text>
<text x="110" y="346" style="font-style:italic;opacity:0.65;">R&#233;ponse, exploration, risques r&#233;siduels, prochaine action. Prototypes jetables</text>
<circle cx="546" cy="334" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.3px;"/>
<circle cx="608" cy="334" r="3" style="fill:#cc3333;"/>

<rect x="72" y="350" width="650" height="34" style="fill:#fafaf7;"/>
<text x="84" y="370">05</text>
<text x="110" y="366">Une pr&#233;sentation en Sprint Review est pr&#233;vue</text>
<text x="110" y="380" style="font-style:italic;opacity:0.65;">Un spike non pr&#233;sent&#233; est de la connaissance perdue. 5 minutes suffisent</text>
<circle cx="546" cy="368" r="6" style="fill:none;stroke:#2a7a2a;stroke-width:1.3px;"/>
<circle cx="608" cy="368" r="3" style="fill:#cc3333;"/>
</g>

<!-- Time-boxing reference -->
<text x="72" y="425" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">DUR&#201;ES DE R&#201;F&#201;RENCE (D&#201;CID&#201;ES AVANT, NE BOUGENT PAS)</text>
<path d="M72,431l650,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>

<rect x="72" y="443" width="206" height="60" style="fill:#fafaf7;"/>
<text x="84" y="463" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">Question simple</text>
<text x="84" y="482" style="font-family:'Georgia',serif;font-size:18px;font-weight:bold;fill:#0f2240;">2 &#224; 4h</text>

<rect x="294" y="443" width="206" height="60" style="fill:#fafaf7;"/>
<text x="306" y="463" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">Exploration technique</text>
<text x="306" y="482" style="font-family:'Georgia',serif;font-size:18px;font-weight:bold;fill:#0f2240;">1 jour</text>

<rect x="516" y="443" width="206" height="60" style="fill:#fafaf7;"/>
<text x="528" y="463" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#0f2240;">Prototype</text>
<text x="528" y="482" style="font-family:'Georgia',serif;font-size:18px;font-weight:bold;fill:#0f2240;">2 &#224; 3 jours max</text>

<text x="72" y="524" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.7;">Un spike qui d&#233;passe un sprint signale que la question &#233;tait trop large : d&#233;coupe-le.</text>

<!-- Decision -->
<text x="72" y="568" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">D&#201;CISION</text>
<path d="M72,574l300,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<rect x="72" y="586" width="300" height="100" style="fill:#fafaf7;"/>
<text x="84" y="608" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&#9633; GO : question pr&#233;cise, time-box fix&#233;,</text>
<text x="84" y="622" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">livrable une page identifi&#233;.</text>
<text x="84" y="646" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">&#9632; NO GO : si la contrainte est le d&#233;lai,</text>
<text x="84" y="660" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">d&#233;cide quand m&#234;me, assume le risque,</text>
<text x="84" y="674" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">trace la d&#233;cision.</text>

<text x="424" y="568" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">REMARQUES / ACTIONS</text>
<path d="M424,574l298,0" style="fill:none;stroke:#febd10;stroke-width:1px;"/>
<rect x="424" y="586" width="298" height="100" style="fill:#fafaf7;"/>
<text x="436" y="608" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Pour le DSI : un spike est un investissement</text>
<text x="436" y="622" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">l&#233;gitime tant que la dur&#233;e est born&#233;e et le</text>
<text x="436" y="636" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">livrable une d&#233;cision concr&#232;te.</text>
<text x="436" y="660" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Un spike dans chaque sprint = signal d'alerte</text>
<text x="436" y="674" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">sur le Refinement, pas une bonne pratique.</text>

<!-- bandeau bas -->
<rect x="54" y="716" width="740" height="64" style="fill:#0f2240;"/>
<text x="72" y="740" style="font-family:'Helvetica';font-size:8.5px;font-weight:bold;fill:#febd10;">CE QUE TU FAIS D&#200;S LUNDI</text>
<text x="72" y="758" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#fff;">Avant de forcer un chiffre : sait-on ce qu'il faudrait savoir pour estimer ? Si non, c'est un spike.</text>
<text x="72" y="772" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#fff;">Time-boxe-le, lance-le avant le Sprint Planning. Tu arrives avec une d&#233;cision, pas une incertitude.</text>

<text x="72" y="812" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;font-style:italic;fill:#0f2240;opacity:0.6;">Kent Beck, Extreme Programming Explained (2000) ; Ron Jeffries, Essential XP (2001).</text>

