<rect x="462" y="504" width="110" height="14" rx="3" style="fill:#0f2240;"/>
<text x="517" y="514" text-anchor="middle"
      style="font-family:'Helvetica';font-size:7px;font-weight:bold;fill:#ffffff;">Challenger Safety (N4)</text>
<foreignObject x="438" y="524" width="346" height="60">
  <body xmlns="http://www.w3.org/1999/xhtml">
    <p style="font-family:Georgia,serif;font-size:9px;color:#0f2240;margin:0;line-height:1.4;">Apr&#232;s une r&#233;tro difficile : &#171; Y a-t-il des sujets qu'on n'a pas os&#233; aborder ? &#187;</p>
  </body>
</foreignObject>

<rect x="54" y="596" width="370" height="95" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="72" y="616"
      style="font-family:'Helvetica';font-size:11px;font-weight:bold;fill:#febd10;">05</text>
<rect x="92" y="604" width="110" height="14" rx="3" style="fill:#0f2240;"/>
<text x="147" y="614" text-anchor="middle"
      style="font-family:'Helvetica';font-size:7px;font-weight:bold;fill:#ffffff;">Challenger Safety (N4)</text>
<foreignObject x="68" y="624" width="346" height="60">
  <body xmlns="http://www.w3.org/1999/xhtml">
    <p style="font-family:Georgia,serif;font-size:9px;color:#0f2240;margin:0;line-height:1.4;">Si quelqu'un est puni implicitement pour avoir soulev&#233; un probl&#232;me, nomme-le.</p>
  </body>
</foreignObject>

<rect x="424" y="596" width="370" height="95" style="fill:#ffffff;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="442" y="616"
      style="font-family:'Helvetica';font-size:11px;font-weight:bold;fill:#febd10;">06</text>
<rect x="462" y="604" width="110" height="14" rx="3" style="fill:#0f2240;"/>
<text x="517" y="614" text-anchor="middle"
      style="font-family:'Helvetica';font-size:7px;font-weight:bold;fill:#ffffff;">Tous niveaux</text>
<foreignObject x="438" y="624" width="346" height="60">
