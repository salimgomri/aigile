<foreignObject x="438" y="424" width="346" height="60">
  <body xmlns="http://www.w3.org/1999/xhtml">
    <p style="font-family:Georgia,serif;font-size:9px;color:#0f2240;margin:0;line-height:1.4;">Reconnais une erreur de facilitation que tu as faite sur le sprint pass&#233;.</p>
  </body>
