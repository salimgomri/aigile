    <p style="font-family:Georgia,serif;font-size:9px;color:#0f2240;margin:0;line-height:1.4;">Une fois par sprint : identifie une situation o&#249; tu aurais pu mod&#233;liser et tu ne l'as pas fait.</p>
  </body>
</foreignObject>

<!-- NOTE BAS -->
<rect x="54" y="696" width="740" height="30" style="fill:#febd10;opacity:0.15;"/>
<text x="424" y="716" text-anchor="middle"
      style="font-family:'Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;">La s&#233;curit&#233; se construit par accumulation de moments o&#249; quelqu'un a pris un risque interpersonnel et o&#249; rien de n&#233;gatif ne s'est pass&#233;.</text>

<!-- RÈGLE CLEF -->
<rect x="54" y="734" width="740" height="22" style="fill:#0f2240;"/>
<text x="424" y="749" text-anchor="middle"
