<!-- 3 rappels clés -->
<rect x="54" y="756" width="240" height="80" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="174" y="772" text-anchor="middle"
      style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#0f2240;">SI SCORE BAS</text>
<text x="72" y="790" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">Intervenir sur le contexte,</text>
<text x="72" y="804" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">pas sur les pratiques.</text>
<text x="72" y="818" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">Score bas # manager mauvais.</text>

<rect x="300" y="756" width="240" height="80" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="420" y="772" text-anchor="middle"
      style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#0f2240;">SI &#201;QUIPE EN STORMING</text>
<text x="316" y="790" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">Ne pas lancer de r&#233;tro.</text>
<text x="316" y="804" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">Nommer les tensions en</text>
<text x="316" y="818" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">one-to-one d'abord.</text>

<rect x="546" y="756" width="248" height="80" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<text x="670" y="772" text-anchor="middle"
      style="font-family:'Helvetica';font-size:8px;font-weight:bold;fill:#0f2240;">SI INCIDENT GRAVE</text>
<text x="562" y="790" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">Mesure ponctuelle hors</text>
<text x="562" y="804" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">cycle accept&#233;e.</text>
<text x="562" y="818" style="font-family:'Georgia',serif;font-size:8.5px;fill:#0f2240;">Signal d'entr&#233;e, pas verdict.</text>

