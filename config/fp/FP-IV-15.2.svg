<foreignObject x="68" y="524" width="346" height="60">
  <body xmlns="http://www.w3.org/1999/xhtml">
    <p style="font-family:Georgia,serif;font-size:9px;color:#0f2240;margin:0;line-height:1.4;">Quand quelqu'un propose une id&#233;e impopulaire, retiens les r&#233;actions 30 secondes.</p>
  </body>
