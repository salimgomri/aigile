<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 794 1123" width="794" height="1123">

<!-- FOND -->
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>

<!-- LOGO PLACEHOLDER -->
<rect x="6" y="60" width="42" height="42" rx="4" fill="#0f2240"/>
<text x="27" y="87" font-family="Georgia,serif" font-size="9" fill="#febd10"
      text-anchor="middle" font-weight="bold">S</text>

<!-- TEXTE VERTICAL -->
<g transform="translate(27,900) rotate(-90)">
  <text font-family="Georgia,serif" font-size="11" fill="#0f2240" font-weight="bold"
        text-anchor="middle">LE SYST&#200;ME S.A.L.I.M.</text>
</g>

<!-- HEADER -->
<rect x="54" y="0" width="740" height="78" fill="#ffffff"/>
<text x="72" y="22" font-family="Helvetica,Arial,sans-serif" font-size="8.5"
      fill="#bbbbbb" letter-spacing="1">GOUVERNANCE &#8250; IA LOCALE</text>
<rect x="686" y="8" width="96" height="22" rx="11" fill="#febd10"/>
<text x="734" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5"
      fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-17.3</text>
<line x1="72" y1="30" x2="766" y2="30" stroke="#febd10" stroke-width="1"/>
<text x="72" y="58" font-family="Georgia,serif" font-size="24" fill="#0f2240"
      font-weight="bold">IA Policy One-Pager</text>
<text x="72" y="74" font-family="Georgia,serif" font-size="11" fill="#febd10"
      font-style="italic">L&#39;absence de cadre ne prot&#232;ge pas le manager, elle l&#39;expose.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="80" width="740" height="62" fill="#febd10"/>
<line x1="238" y1="88" x2="238" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
<line x1="422" y1="88" x2="422" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>
<line x1="606" y1="88" x2="606" y2="134" stroke="#0f2240" stroke-width="0.5" opacity="0.3"/>

<text x="72" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">POUR QUI</text>
<text x="72" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Manager, Directeur / DSI</text>
<text x="72" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">MG &#8226; DC</text>

<text x="256" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUOI</text>
<text x="256" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Cadre de gouvernance IA</text>
<text x="256" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">local en 6 rubriques</text>

<text x="440" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">QUAND L&#39;UTILISER</text>
<text x="440" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">D&#232;s la 1e adoption IA</text>
<text x="440" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Sans attendre la DSI</text>

<text x="624" y="100" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#0f2240" font-weight="bold" letter-spacing="1.5">VALEUR APPORT&#201;E</text>
<text x="624" y="116" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Accountability claire.</text>
<text x="624" y="129" font-family="Georgia,serif" font-size="9" fill="#0f2240"
      font-style="italic">Protection du manager.</text>

<!-- PRINCIPE -->
<rect x="54" y="150" width="740" height="28" fill="#0f2240" rx="2"/>
<text x="424" y="163" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#febd10" text-anchor="middle" font-weight="bold" letter-spacing="1">&#201;QUIPE &#8250; 30 MINUTES &#8250; FORMAT A4</text>
<text x="424" y="173" font-family="Georgia,serif" font-size="8.5" fill="#ffffff"
      text-anchor="middle">L&#39;important est le d&#233;bat, pas la perfection du document. Une policy non discut&#233;e n&#39;est pas appliqu&#233;e.</text>

<!-- 6 RUBRIQUES en 2 colonnes x 3 lignes -->

<!-- RUBRIQUE 01 PERIMETRE -->
<rect x="54" y="186" width="362" height="90" fill="#f8f8f8"/>
<rect x="54" y="186" width="362" height="22" fill="#0f2240"/>
<text x="72" y="202" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#febd10" font-weight="bold">01 &#8250; P&#201;RIM&#200;TRE</text>
<text x="72" y="222" font-family="Georgia,serif" font-size="9" fill="#0f2240">Quels outils IA sont autoris&#233;s dans notre contexte ?</text>
<text x="72" y="237" font-family="Georgia,serif" font-size="8.5" fill="#bbbbbb"
      font-style="italic">donn&#233;es publiques &#8226; donn&#233;es clients &#8226; code propri&#233;taire</text>
<text x="72" y="253" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#9658; Ce qui est permis / interdit : ...</text>
<line x1="72" y1="262" x2="402" y2="262" stroke="#e0e0e0" stroke-width="0.5"/>
<text x="72" y="271" font-family="Georgia,serif" font-size="8" fill="#bbbbbb"
      font-style="italic">......................................................................................................</text>

<!-- RUBRIQUE 02 TRACABILITE -->
<rect x="432" y="186" width="362" height="90" fill="#f8f8f8"/>
<rect x="432" y="186" width="362" height="22" fill="#0f2240"/>
<text x="450" y="202" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#febd10" font-weight="bold">02 &#8250; TRA&#199;ABILIT&#201;</text>
<text x="450" y="222" font-family="Georgia,serif" font-size="9" fill="#0f2240">Comment signaler un output IA int&#233;gr&#233; ?</text>
<text x="450" y="237" font-family="Georgia,serif" font-size="8.5" fill="#bbbbbb"
      font-style="italic">commentaire code &#8226; mention crit&#232;res &#8226; tag Jira</text>
<text x="450" y="253" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#9658; Visibilit&#233; source IA : ...</text>
<line x1="450" y1="262" x2="780" y2="262" stroke="#e0e0e0" stroke-width="0.5"/>
<text x="450" y="271" font-family="Georgia,serif" font-size="8" fill="#bbbbbb"
      font-style="italic">......................................................................................................</text>

<!-- RUBRIQUE 03 RESPONSABILITE -->
<rect x="54" y="284" width="362" height="90" fill="#ffffff"/>
<rect x="54" y="284" width="362" height="22" fill="#0f2240"/>
<text x="72" y="300" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#febd10" font-weight="bold">03 &#8250; RESPONSABILIT&#201;</text>
<text x="72" y="320" font-family="Georgia,serif" font-size="9" fill="#0f2240">Qui valide les outputs IA avant int&#233;gration ?</text>
<text x="72" y="335" font-family="Georgia,serif" font-size="8.5" fill="#bbbbbb"
      font-style="italic">validation avant int&#233;gration &#8226; ownership si incident</text>
<text x="72" y="351" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#9658; Accountable d&#233;sign&#233; : ...</text>
<line x1="72" y1="360" x2="402" y2="360" stroke="#e0e0e0" stroke-width="0.5"/>
<text x="72" y="369" font-family="Georgia,serif" font-size="8" fill="#bbbbbb"
      font-style="italic">......................................................................................................</text>

<!-- RUBRIQUE 04 CONFIDENTIALITE -->
<rect x="432" y="284" width="362" height="90" fill="#ffffff"/>
<rect x="432" y="284" width="362" height="22" fill="#0f2240"/>
<text x="450" y="300" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#febd10" font-weight="bold">04 &#8250; CONFIDENTIALIT&#201;</text>
<text x="450" y="320" font-family="Georgia,serif" font-size="9" fill="#0f2240">Quelles donn&#233;es hors prompt IA externe ?</text>
<text x="450" y="335" font-family="Georgia,serif" font-size="8.5" fill="#bbbbbb"
      font-style="italic">noms clients &#8226; infos financi&#232;res &#8226; code sous NDA</text>
<text x="450" y="351" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#9658; Donn&#233;es interdites : ...</text>
<line x1="450" y1="360" x2="780" y2="360" stroke="#e0e0e0" stroke-width="0.5"/>
<text x="450" y="369" font-family="Georgia,serif" font-size="8" fill="#bbbbbb"
      font-style="italic">......................................................................................................</text>

<!-- RUBRIQUE 05 REVISION -->
<rect x="54" y="382" width="362" height="90" fill="#f8f8f8"/>
<rect x="54" y="382" width="362" height="22" fill="#0f2240"/>
<text x="72" y="398" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#febd10" font-weight="bold">05 &#8250; R&#201;VISION</text>
<text x="72" y="418" font-family="Georgia,serif" font-size="9" fill="#0f2240">R&#233;vis&#233;e toutes les 2 rétros. Elle est</text>
<text x="72" y="432" font-family="Georgia,serif" font-size="9" fill="#0f2240">vivante, pas fig&#233;e. Port&#233;e par le SM.</text>
<text x="72" y="449" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#9658; Prochaine r&#233;vision : ...</text>
<line x1="72" y1="458" x2="402" y2="458" stroke="#e0e0e0" stroke-width="0.5"/>
<text x="72" y="466" font-family="Georgia,serif" font-size="8" fill="#bbbbbb"
      font-style="italic">Cadence : toutes les 2 r&#233;tros</text>

<!-- RUBRIQUE 06 FORMAT -->
<rect x="432" y="382" width="362" height="90" fill="#f8f8f8"/>
<rect x="432" y="382" width="362" height="22" fill="#0f2240"/>
<text x="450" y="398" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#febd10" font-weight="bold">06 &#8250; FORMAT</text>
<text x="450" y="418" font-family="Georgia,serif" font-size="9" fill="#0f2240">1 page A4. Affich&#233; dans l&#39;espace d&#39;&#233;quipe.</text>
<text x="450" y="432" font-family="Georgia,serif" font-size="9" fill="#0f2240">Sign&#233; collectivement. Visible et amendable.</text>
<text x="450" y="449" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#9658; Format choisi : ...</text>
<line x1="450" y1="458" x2="780" y2="458" stroke="#e0e0e0" stroke-width="0.5"/>
<text x="450" y="466" font-family="Georgia,serif" font-size="8" fill="#bbbbbb"
      font-style="italic">Notion &#8226; Confluence &#8226; Miro &#8226; feuille A4 plastifi&#233;e</text>

<!-- CHECKLIST VALIDATION -->
<rect x="54" y="480" width="740" height="28" fill="#febd10"/>
<text x="424" y="499" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" text-anchor="middle" font-weight="bold" letter-spacing="1">CHECKLIST DE VALIDATION : LA POLICY EST PR&#202;TE QUAND...</text>

<rect x="54" y="508" width="740" height="88" fill="#fafaf7"/>
<text x="72" y="530" font-family="Georgia,serif" font-size="10" fill="#0f2240">
  &#9744;  Chaque membre peut citer les outils interdits</text>
<text x="72" y="550" font-family="Georgia,serif" font-size="10" fill="#0f2240">
  &#9744;  Le responsable de validation des outputs IA est nomm&#233;</text>
<text x="72" y="570" font-family="Georgia,serif" font-size="10" fill="#0f2240">
  &#9744;  La date de prochaine r&#233;vision est dans le calendrier</text>
<text x="72" y="590" font-family="Georgia,serif" font-size="10" fill="#0f2240">
  &#9744;  Le document est affich&#233; et sign&#233; collectivement</text>

<!-- RGPD ALERTE -->
<rect x="54" y="606" width="740" height="52" fill="#fff3cd" rx="2"/>
<rect x="54" y="606" width="6" height="52" fill="#cc3333"/>
<text x="72" y="624" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#cc3333" font-weight="bold" letter-spacing="0.5">RGPD : 3 QUESTIONS &#192; POSER &#192; TON &#201;QUIPE MAINTENANT</text>
<text x="72" y="640" font-family="Georgia,serif" font-size="9" fill="#0f2240">1. A-t-on pass&#233; des noms ou pr&#233;noms de clients dans un prompt ?</text>
<text x="72" y="652" font-family="Georgia,serif" font-size="9" fill="#0f2240">2. Des num&#233;ros de contrat ? 3. Des donn&#233;es de sant&#233; ou financi&#232;res identifiantes ?</text>
<text x="466" y="652" font-family="Georgia,serif" font-size="9" fill="#cc3333"
      font-style="italic">  Si oui : consulter le DPO.</text>

<!-- RELATION ACCORD EQUIPE -->
<rect x="54" y="668" width="740" height="46" fill="#f0f4f8" rx="2"/>
<rect x="54" y="668" width="6" height="46" fill="#0f2240"/>
<text x="72" y="685" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">RELATION AVEC L&#39;ACCORD D&#39;&#201;QUIPE IA (CH.16)</text>
<text x="72" y="700" font-family="Georgia,serif" font-size="9" fill="#0f2240">La policy = cadre de gouvernance et de responsabilit&#233;.</text>
<text x="72" y="712" font-family="Georgia,serif" font-size="9" fill="#0f2240">L&#39;accord = engagement collectif de pratique. Les deux sont n&#233;cessaires : ils se compl&#232;tent.</text>

<!-- POLICY LOCALE VS POLITIQUE ENTREPRISE -->
<rect x="54" y="724" width="740" height="46" fill="#f8f8f8" rx="2"/>
<rect x="54" y="724" width="6" height="46" fill="#febd10"/>
<text x="72" y="741" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">QUAND LA POLITIQUE D&#39;ENTREPRISE ARRIVERA</text>
<text x="72" y="756" font-family="Georgia,serif" font-size="9" fill="#0f2240">La policy locale conserve : traçabilit&#233;, responsabilit&#233; &#233;quipe, rythme de r&#233;vision. Elle</text>
<text x="72" y="768" font-family="Georgia,serif" font-size="9" fill="#0f2240">ne devient pas obsolète : elle se recentre. C&#39;est un sous-ensemble, pas un doublon.</text>

<!-- NOTES -->
<rect x="54" y="780" width="740" height="80" fill="#fafaf7" rx="2"/>
<rect x="54" y="780" width="740" height="20" fill="#e8e8e8" rx="2"/>
<text x="72" y="794" font-family="Helvetica,Arial,sans-serif" font-size="8"
      fill="#0f2240" font-weight="bold" letter-spacing="0.5">NOTES DE CONSTRUCTION</text>
<line x1="72" y1="814" x2="780" y2="814" stroke="#e0e0e0" stroke-width="0.5"/>
<line x1="72" y1="832" x2="780" y2="832" stroke="#e0e0e0" stroke-width="0.5"/>
<line x1="72" y1="850" x2="780" y2="850" stroke="#e0e0e0" stroke-width="0.5"/>

<!-- FOOTER -->
<line x1="54" y1="870" x2="794" y2="870" stroke="#febd10" stroke-width="1"/>
<rect x="380" y="862" width="48" height="16" rx="8" fill="#0f2240"/>
<text x="404" y="874" font-family="Helvetica,Arial,sans-serif" font-size="9"
      fill="#febd10" text-anchor="middle" font-weight="bold">V-17</text>
<text x="72" y="884" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#bbbbbb">SOURCE : Le Syst&#232;me S.A.L.I.M. &#8212; Chapitre 17</text>
<text x="766" y="884" font-family="Helvetica,Arial,sans-serif" font-size="7.5"
      fill="#bbbbbb" text-anchor="end">Le Syst&#232;me S.A.L.I.M.</text>

