  <style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap');</style>
</defs>

<!-- FOND BLANC -->
<rect x="0" y="0" width="794" height="1123" fill="#ffffff"/>

<!-- BANDE LATERALE GOLD -->
<rect x="0" y="0" width="54" height="1123" fill="#febd10"/>

<!-- TEXTE VERTICAL "LE SYSTEME S.A.L.I.M." -->
<text transform="translate(13,900) rotate(-90)"
      font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#0f2240"
      letter-spacing="2">LE SYST&#200;ME S.A.L.I.M.</text>

<!-- LOGO SALIM (cercles concentricques stylises) -->
<g transform="translate(8,60)">
  <circle cx="18" cy="18" r="16" fill="none" stroke="#0f2240" stroke-width="2"/>
  <circle cx="18" cy="18" r="11" fill="none" stroke="#0f2240" stroke-width="1.5"/>
  <circle cx="18" cy="18" r="6"  fill="none" stroke="#0f2240" stroke-width="1"/>
  <circle cx="18" cy="18" r="2"  fill="#0f2240"/>
</g>

<!-- HEADER BLANC -->
<rect x="54" y="0" width="740" height="72" fill="#ffffff"/>
<text x="72" y="28" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#bbbbbb">CHECKLIST D&#201;CISION . D&#201;FINITION OF DONE IA</text>
<!-- Badge FP gold -->
<rect x="686" y="8" width="94" height="22" rx="11" fill="#febd10"/>
<text x="733" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-16.3</text>
<!-- Filet gold -->
<line x1="72" y1="36" x2="766" y2="36" stroke="#febd10" stroke-width="1"/>
<!-- Titre -->
<text x="72" y="58" font-family="Georgia,serif" font-size="26" fill="#0f2240" font-weight="bold">R&#233;&#233;crire la DoD &#224; l'&#232;re IA</text>
<text x="72" y="71" font-family="EB Garamond,Georgia,serif" font-size="11" font-style="italic" fill="#febd10">Si l'&#233;quipe ne peut pas expliquer le livrable sans l'IA : la story est simul&#233;e.</text>

<!-- BLOC 4 CHAMPS GOLD -->
<rect x="54" y="78" width="740" height="66" fill="#febd10"/>
<!-- Separateurs verticaux -->
<line x1="239" y1="86" x2="239" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="424" y1="86" x2="424" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<line x1="609" y1="86" x2="609" y2="136" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
<!-- Labels -->
<text x="72"  y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">POUR QUI</text>
<text x="252" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUOI</text>
<text x="437" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">QUAND L'UTILISER</text>
<text x="622" y="97" font-family="Helvetica,Arial,sans-serif" font-size="7.5" fill="#0f2240" letter-spacing="1.5" font-weight="bold">VALEUR APPORT&#201;E</text>
<!-- Valeurs -->
<text x="72"  y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">SM / DEV</text>
<text x="252" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">Exercice retro 45 min + tableau DoD IA</text>
<text x="437" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">D&#232;s l'adoption de l'IA dans les sprints</text>
<text x="622" y="113" font-family="EB Garamond,Georgia,serif" font-size="9" font-style="italic" fill="#0f2240" opacity="0.85">&#201;liminer les stories 'simul&#233;es'</text>
<rect x="66" y="154" width="662" height="22" fill="#0f2240"/><text x="397" y="170" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">EXERCICE : R&#201;ECRIRE LA DoD EN R&#201;TROSPECTIVE . 45 MINUTES</text><rect x="66" y="178" width="662" height="36" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="200" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10">01</text><rect x="102" y="186" width="44" height="16" rx="8" fill="#febd10" opacity="0.2"/><text x="124" y="198" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" text-anchor="middle" font-weight="bold">10 min</text><text x="158" y="200" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#333333">Liste les crit&#232;res DoD actuels sur un tableau.</text><rect x="66" y="214" width="662" height="36" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="236" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10">02</text><rect x="102" y="222" width="44" height="16" rx="8" fill="#febd10" opacity="0.2"/><text x="124" y="234" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" text-anchor="middle" font-weight="bold">15 min</text><text x="158" y="236" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#333333">Pour chaque crit&#232;re : 'L'IA pourrait-elle satisfaire &#231;a sans que l'&#233;quipe comprenne vraiment ?'</text><rect x="66" y="250" width="662" height="36" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="272" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10">03</text><rect x="102" y="258" width="44" height="16" rx="8" fill="#febd10" opacity="0.2"/><text x="124" y="270" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" text-anchor="middle" font-weight="bold">15 min</text><text x="158" y="272" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#333333">Pour chaque crit&#232;re &#224; risque : ajouter un crit&#232;re de validation humaine explicite.</text><rect x="66" y="286" width="662" height="36" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="308" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#febd10">04</text><rect x="102" y="294" width="44" height="16" rx="8" fill="#febd10" opacity="0.2"/><text x="124" y="306" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" text-anchor="middle" font-weight="bold">5 min</text><text x="158" y="308" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#333333">Vote sur les 3 crit&#232;res prioritaires &#224; renforcer ce sprint.</text><rect x="66" y="332" width="662" height="28" rx="4" fill="#febd10" opacity="0.15" stroke="#febd10" stroke-width="1"/><text x="397" y="350" font-family="EB Garamond,Georgia,serif" font-size="10" font-style="italic" fill="#0f2240" text-anchor="middle">Signal de succ&#232;s : l'&#233;quipe identifie au moins 2 crit&#232;res qu'elle n'aurait jamais questionn&#233;s avant l'IA.</text><rect x="66" y="370" width="662" height="22" fill="#0f2240"/><text x="210" y="385" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">CRIT&#200;RE DoD CLASSIQUE</text><line x1="356" y1="370" x2="356" y2="392" stroke="#febd10" stroke-width="0.6"/><text x="555" y="385" font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">QUESTION &#192; POSER &#192; L'&#200;RE IA</text><rect x="66" y="392" width="662" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="412" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" font-weight="bold">Code review&#233; par un pair</text><line x1="356" y1="392" x2="356" y2="426" stroke="#e0e0e0" stroke-width="0.6"/><text x="366" y="412" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">A-t-on relu le code IA avec le m&#234;me niveau d'attention qu'un code &#233;crit &#224; la main ?</text><rect x="66" y="426" width="662" height="34" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="446" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" font-weight="bold">Tests unitaires pass&#233;s 100 %</text><line x1="356" y1="426" x2="356" y2="460" stroke="#e0e0e0" stroke-width="0.6"/><text x="366" y="446" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Tests &#233;crits par l'&#233;quipe ou g&#233;n&#233;r&#233;s ? Quelqu'un a v&#233;rifi&#233; leur pertinence ?</text><rect x="66" y="460" width="662" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="480" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" font-weight="bold">Crit&#232;res d'acceptance v&#233;rifi&#233;s</text><line x1="356" y1="460" x2="356" y2="494" stroke="#e0e0e0" stroke-width="0.6"/><text x="366" y="480" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Crit&#232;res g&#233;n&#233;r&#233;s sans discussion ? L'&#233;quipe comprend ce qu'elle valide ?</text><rect x="66" y="494" width="662" height="34" fill="#f8f8f5" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="514" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" font-weight="bold">Aucune r&#233;gression connue</text><line x1="356" y1="494" x2="356" y2="528" stroke="#e0e0e0" stroke-width="0.6"/><text x="366" y="514" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">A-t-on test&#233; les cas limites que l'IA aurait pu ignorer ?</text><rect x="66" y="528" width="662" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/><text x="76" y="548" font-family="EB Garamond,Georgia,serif" font-size="9" fill="#0f2240" font-weight="bold">S&#233;curit&#233; de base v&#233;rifi&#233;e</text><line x1="356" y1="528" x2="356" y2="562" stroke="#e0e0e0" stroke-width="0.6"/><text x="366" y="548" font-family="EB Garamond,Georgia,serif" font-size="8.5" font-style="italic" fill="#555555">Scanner de s&#233;curit&#233; lanc&#233; ? Donn&#233;es sensibles dans les prompts ?</text><rect x="66" y="572" width="662" height="40" rx="4" fill="#0f2240"/><text x="397" y="588" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#febd10" text-anchor="middle">R&#200;GLE PRATIQUE</text><text x="397" y="602" font-family="EB Garamond,Georgia,serif" font-size="9.5" fill="#ffffff" text-anchor="middle">Si l'&#233;quipe utilise l'IA pour produire un livrable, elle doit pouvoir l'expliquer sans l'IA.</text>
<!-- FOOTER -->
<line x1="66" y1="1068" x2="752" y2="1068" stroke="#febd10" stroke-width="0.8"/>
