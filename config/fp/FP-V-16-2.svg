<text x="733" y="23" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#0f2240" text-anchor="middle" font-weight="bold">FP V-16.2</text>
<!-- Filet gold -->
<line x1="72" y1="36" x2="766" y2="36" stroke="#febd10" stroke-width="1"/>
<!-- Titre -->
<text x="72" y="58" font-family="Georgia,serif" font-size="26" fill="#0f2240" font-weight="bold">DORA &#224; l'&#232;re IA : ce que tu surveilles</text>
<text x="72" y="71" font-family="EB Garamond,Georgia,serif" font-size="11" font-style="italic" fill="#febd10">L'IA am&#233;liore la vitesse, pas automatiquement la fiabilit&#233;.</text>

