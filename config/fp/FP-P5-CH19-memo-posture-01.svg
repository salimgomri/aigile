</defs><rect x="0" y="0" width="794" height="1123" style="fill:#fff;stroke:none;stroke-width:0px;"/><rect x="0" y="0" width="54" height="1123" style="fill:#febd10;stroke:none;stroke-width:0px;"/><g><use xlink:href="#_Image13" x="0" y="0" width="2072px" height="656px" transform="matrix(0,-1.002428,1.002604,0,5.867447,155.566358)"/></g><g transform="matrix(-0,-1,1,-0,-893.165,946.835)"><text x="-36.025px" y="920px" style="font-family:'Georgia', serif;font-size:11px;fill:#0f2240;">L<tspan x="-29.056px -21.54px -18.557px -12.055px -4.958px 1.544px 8.679px 16.196px 26.725px 34.242px 37.225px 43.726px 47.021px 54.731px 58.026px 64.995px 68.29px 72.906px 76.201px 86.73px" y="920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px 920px">E SYST&#200;ME S.A.L.I.M.</tspan></text></g><rect x="54" y="0" width="740" height="74" style="fill:#fff;stroke:none;stroke-width:0px;"/><text x="72" y="26" style="font-family:'Helvetica','Arial',sans-serif;font-size:8px;fill:#bbb;letter-spacing:0.5px;">POSTURE > SM AIGILE</text><rect x="686" y="10" width="96" height="22" rx="11" style="fill:#febd10;"/><text x="692" y="25" style="font-family:'Helvetica','Arial',sans-serif;font-size:9.5px;fill:#0f2240;letter-spacing:0px;font-weight:bold;">FP V-19.1</text><line x1="72" y1="34" x2="766" y2="34" stroke="#febd10" stroke-width="1"/><text x="72" y="57" style="font-family:'EB Garamond','Georgia',serif;font-size:26px;fill:#0f2240;font-weight:bold;">Posture AIgile quotidienne</text><text x="72" y="71" style="font-family:'EB Garamond','Georgia',serif;font-size:10.5px;fill:#febd10;font-style:italic;">Avant d&#39;ouvrir un outil IA, une seule question : pourquoi ?</text><rect x="54" y="78" width="740" height="64" style="fill:#febd10;stroke:none;stroke-width:0px;"/><text x="72" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">POUR QUI</text><text x="72" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">SM / CA</text><line x1="258" y1="84" x2="258" y2="136" stroke="#0f2240" stroke-width="0.4"/><text x="264" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text><text x="264" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">La ligne entre augmentation et substitution</text><line x1="450" y1="84" x2="450" y2="136" stroke="#0f2240" stroke-width="0.4"/><text x="456" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">QUAND</text><text x="456" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">Chaque fois qu&#39;un outil IA entre dans ta pratique</text><line x1="638" y1="84" x2="638" y2="136" stroke="#0f2240" stroke-width="0.4"/><text x="644" y="93" style="font-family:'Helvetica','Arial',sans-serif;font-size:7px;fill:#0f2240;letter-spacing:1.5px;">VALEUR</text><text x="644" y="107" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;fill:#0f2240;font-style:italic;">Garder la d&#233;cision c&#244;t&#233; humain. Toujours.</text><rect x="72" y="152" width="700" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="167" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">LA QUESTION AVANT L&#39;OUTIL</text><rect x="72" y="174" width="700" height="68" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="178" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Avant d&#39;ouvrir un outil IA dans ta pratique, pose-toi cette question :</text><rect x="80" y="186" width="684" height="30" style="fill:#0f2240;stroke:none;stroke-width:0px;" rx="4"/><text x="388" y="206" style="font-family:'EB Garamond','Georgia',serif;font-size:11px;fill:#febd10;font-style:italic;text-anchor:middle;">Pourquoi cet outil, pour ce probl&#232;me, maintenant ?</text><text x="80" y="232" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#cc3333;">Si la r&#233;ponse est parce que tout le monde le fait, c&#39;est l&#39;absence de posture.</text><rect x="72" y="256" width="340" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="271" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">CE QUE L&#39;IA NE FAIT PAS</text><rect x="72" y="278" width="340" height="188" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="280" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;font-weight:bold;">L&#39;IA ne lit pas la pi&#232;ce.</text><text x="80" y="296" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Le silence d&#39;une Daily qui n&#39;est pas de</text><text x="80" y="311" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">la concentration mais de la r&#233;signation.</text><line x1="80" y1="322" x2="404" y2="322" stroke="#e0e0e0" stroke-width="0.5"/><text x="80" y="338" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;font-weight:bold;">L&#39;IA ne sait pas que 90 % atteint</text><text x="80" y="354" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">cache un accord tacite pour &#233;viter</text><text x="80" y="369" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">ce qui coince vraiment.</text><line x1="80" y1="380" x2="404" y2="380" stroke="#e0e0e0" stroke-width="0.5"/><text x="80" y="396" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;font-weight:bold;">L&#39;IA ne transforme pas une r&#233;tro</text><text x="80" y="412" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">qui d&#233;rive en conversation qui atterrit.</text><text x="80" y="428" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#c9973a;font-style:italic;">Ce travail appartient &#224; un humain.</text><text x="80" y="449" style="font-family:'EB Garamond','Georgia',serif;font-size:7px;fill:#bbb;font-style:italic;">Source : SGEP (Jocham, Coleman, Sutherland)</text><rect x="420" y="256" width="352" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="428" y="271" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">CE QUE L&#39;IA FAIT BIEN</text><rect x="420" y="278" width="352" height="188" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><circle cx="432" cy="277" r="3.5" style="fill:#febd10;"/><text x="442" y="280" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Pr&#233;parer r&#233;tro, review, rapport</text><text x="442" y="295" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">5 &#224; 8h/sprint descendent &#224; 1h30-2h.</text><line x1="428" y1="305" x2="764" y2="305" stroke="#e0e0e0" stroke-width="0.5"/><circle cx="432" cy="319" r="3.5" style="fill:#febd10;"/><text x="442" y="322" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">R&#233;v&#233;ler des patterns invisibles</text><text x="442" y="337" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">V&#233;locit&#233; plate 6 sprints. Sujets</text><text x="442" y="350" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">de r&#233;tro qui tournent en boucle.</text><line x1="428" y1="360" x2="764" y2="360" stroke="#e0e0e0" stroke-width="0.5"/><circle cx="432" cy="374" r="3.5" style="fill:#febd10;"/><text x="442" y="377" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Propositions. Jamais d&#233;cisions.</text><text x="442" y="392" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">La Prompt Library est une offre</text><text x="442" y="405" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">&#224; l&#39;&#233;quipe, pas une imposition.</text><line x1="428" y1="415" x2="764" y2="415" stroke="#e0e0e0" stroke-width="0.5"/><circle cx="432" cy="429" r="3.5" style="fill:#febd10;"/><text x="442" y="432" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Ces heures ne sont pas r&#233;cup&#233;r&#233;es.</text><text x="442" y="447" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">Elles sont d&#233;plac&#233;es vers ce que</text><text x="442" y="460" style="font-family:'EB Garamond','Georgia',serif;font-size:8px;fill:#666;">l&#39;IA ne voit pas.</text><rect x="72" y="480" width="700" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="495" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">LES 3 REFLEXES DU SM AIGILE</text><rect x="72" y="502" width="700" height="123" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="507" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">01</text><text x="104" y="507" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;font-weight:bold;">J&#39;utilise l&#39;IA comme outil de pr&#233;paration. Jamais de substitution.</text><text x="104" y="522" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">L&#39;output IA est un point de d&#233;part. Je valide &#224; la lumi&#232;re de ce que je sais de mon &#233;quipe.</text><line x1="80" y1="533" x2="764" y2="533" stroke="#e0e0e0" stroke-width="0.5"/><text x="80" y="551" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">02</text><text x="104" y="551" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;font-weight:bold;">Je prot&#232;ge la friction productive.</text><text x="104" y="566" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">40 min d&#39;estimation collective, ce n&#39;est pas du gaspillage. C&#39;est l&#224; que l&#39;&#233;quipe s&#39;aligne.</text><line x1="80" y1="577" x2="764" y2="577" stroke="#e0e0e0" stroke-width="0.5"/><text x="80" y="595" style="font-family:'Helvetica','Arial',sans-serif;font-size:10px;fill:#febd10;letter-spacing:0px;font-weight:bold;">03</text><text x="104" y="595" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;font-weight:bold;">Je reste praticien r&#233;flexif. J&#39;observe. J&#39;ajuste. Je nomme.</text><text x="104" y="610" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Question trimestrielle : est-ce que mes outils IA renforcent ou affaiblissent l&#39;intelligence collective ?</text><rect x="72" y="640" width="340" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="80" y="655" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">SUPERVISION PAIR A PAIR (90 MIN)</text><rect x="72" y="662" width="340" height="98" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><text x="80" y="666" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Format : 2 SM, 90 min, questions directes.</text><line x1="80" y1="676" x2="404" y2="676" stroke="#e0e0e0" stroke-width="0.5"/><circle cx="84" cy="691" r="3.5" style="fill:#febd10;"/><text x="94" y="694" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Quel outil IA j&#39;utilise et pourquoi ?</text><circle cx="84" cy="708" r="3.5" style="fill:#febd10;"/><text x="94" y="711" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Quel impact j&#39;observe sur mon &#233;quipe ?</text><circle cx="84" cy="725" r="3.5" style="fill:#febd10;"/><text x="94" y="728" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Aurais-je pris la m&#234;me d&#233;cision sans ?</text><text x="80" y="750" style="font-family:'EB Garamond','Georgia',serif;font-size:7px;fill:#bbb;font-style:italic;">Source : Sch&#246;n, The Reflective Practitioner, 1983</text><rect x="420" y="640" width="352" height="22" style="fill:#0f2240;stroke:none;stroke-width:0px;"/><text x="428" y="655" style="font-family:'Helvetica','Arial',sans-serif;font-size:8.5px;fill:#fff;letter-spacing:0.5px;font-weight:bold;">EN UNE PHRASE</text><rect x="420" y="662" width="352" height="98" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/><rect x="428" y="664" width="336" height="70" style="fill:#0f2240;stroke:none;stroke-width:0px;" rx="4"/><text x="596" y="690" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#febd10;font-style:italic;text-anchor:middle;">Je suis augment&#233; parce que</text><text x="596" y="706" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#febd10;font-style:italic;text-anchor:middle;">je d&#233;cide comment utiliser l&#39;IA.</text><text x="596" y="723" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;font-style:italic;text-anchor:middle;">Je ne suis pas remplac&#233; parce que</text><text x="596" y="739" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#fff;font-style:italic;text-anchor:middle;">je lis ce que l&#39;IA ne voit pas.</text><line x1="54" y1="1082" x2="794" y2="1082" stroke="#febd10" stroke-width="1"/><text x="388" y="1096" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#febd10;font-weight:bold;text-anchor:middle;">V-19.1</text><text x="72" y="1096" style="font-family:'Helvetica','Arial',sans-serif;font-size:7.5px;fill:#bbb;letter-spacing:0px;">SOURCE : Le Syst&#232;me S.A.L.I.M.</text><text x="600" y="1096" style="font-family:'Helvetica','Arial',sans-serif;font-size:7.5px;fill:#bbb;letter-spacing:0px;">Chapitre 19 . Partie V</text></svg>