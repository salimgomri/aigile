<!-- KPI 1 Taux revision -->
<rect x="54" y="172" width="740" height="58" fill="#f8f8f8"/>
<line x1="210" y1="172" x2="210" y2="230" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="420" y1="172" x2="420" y2="230" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="600" y1="172" x2="600" y2="230" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="54" y="172" width="5" height="58" fill="#febd10"/>
<text x="72" y="190" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">01</text>
<text x="72" y="205" font-family="Georgia,serif" font-size="9" fill="#0f2240">Taux de r&#233;vision</text>
<text x="72" y="219" font-family="Georgia,serif" font-size="9" fill="#0f2240">outputs IA</text>
<text x="220" y="196" font-family="Georgia,serif" font-size="9" fill="#0f2240">Modifications</text>
<text x="220" y="210" font-family="Georgia,serif" font-size="9" fill="#0f2240">visibles sur</text>
<text x="220" y="224" font-family="Georgia,serif" font-size="9" fill="#0f2240">outputs int&#233;gr&#233;s</text>
<text x="430" y="196" font-family="Georgia,serif" font-size="9" fill="#cc3333">Taux proche</text>
<text x="430" y="210" font-family="Georgia,serif" font-size="9" fill="#cc3333">de 0 &#37;</text>
<text x="610" y="196" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">L&#39;&#233;quipe ne relit plus.</text>
<text x="610" y="210" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Pose la question en</text>
<text x="610" y="224" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Daily cette semaine.</text>
<line x1="54" y1="230" x2="794" y2="230" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- KPI 2 Ratio DF/CFR -->
<rect x="54" y="230" width="740" height="58" fill="#ffffff"/>
<line x1="210" y1="230" x2="210" y2="288" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="420" y1="230" x2="420" y2="288" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="600" y1="230" x2="600" y2="288" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="54" y="230" width="5" height="58" fill="#febd10"/>
<text x="72" y="248" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">02</text>
<text x="72" y="263" font-family="Georgia,serif" font-size="9" fill="#0f2240">Ratio DF / CFR</text>
<text x="72" y="277" font-family="Georgia,serif" font-size="8.5" fill="#bbbbbb" font-style="italic">Deploy Freq / Change Fail Rate</text>
<text x="220" y="254" font-family="Georgia,serif" font-size="9" fill="#0f2240">DF et CFR</text>
<text x="220" y="268" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#233;voluent dans</text>
<text x="220" y="282" font-family="Georgia,serif" font-size="9" fill="#0f2240">le m&#234;me sens</text>
<text x="430" y="254" font-family="Georgia,serif" font-size="9" fill="#cc3333">CFR monte</text>
<text x="430" y="268" font-family="Georgia,serif" font-size="9" fill="#cc3333">plus vite que DF</text>
<text x="610" y="254" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Alerte qualit&#233;.</text>
<text x="610" y="268" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Regarder les d&#233;cisions</text>
<text x="610" y="282" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">tech non questionn&#233;es.</text>
<line x1="54" y1="288" x2="794" y2="288" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- KPI 3 Discussion Sprint Planning -->
<rect x="54" y="288" width="740" height="58" fill="#f8f8f8"/>
<line x1="210" y1="288" x2="210" y2="346" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="420" y1="288" x2="420" y2="346" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="600" y1="288" x2="600" y2="346" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="54" y="288" width="5" height="58" fill="#febd10"/>
<text x="72" y="306" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">03</text>
<text x="72" y="321" font-family="Georgia,serif" font-size="9" fill="#0f2240">Taux discussion</text>
<text x="72" y="335" font-family="Georgia,serif" font-size="9" fill="#0f2240">r&#233;elle Planning</text>
<text x="220" y="306" font-family="Georgia,serif" font-size="9" fill="#0f2240">Sup&#233;rieur</text>
<text x="220" y="320" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#224; 50 &#37;</text>
<text x="430" y="306" font-family="Georgia,serif" font-size="9" fill="#cc3333">Moins de 50 &#37;</text>
<text x="430" y="320" font-family="Georgia,serif" font-size="9" fill="#cc3333">de discussion</text>
<text x="430" y="334" font-family="Georgia,serif" font-size="9" fill="#cc3333">r&#233;elle</text>
<text x="610" y="306" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Action sprint suivant.</text>
<text x="610" y="320" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Demande au SM le</text>
<text x="610" y="334" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">ratio de la semaine.</text>
<line x1="54" y1="346" x2="794" y2="346" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- KPI 4 Stories solo vs collab -->
<rect x="54" y="346" width="740" height="58" fill="#ffffff"/>
<line x1="210" y1="346" x2="210" y2="404" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="420" y1="346" x2="420" y2="404" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="600" y1="346" x2="600" y2="404" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="54" y="346" width="5" height="58" fill="#febd10"/>
<text x="72" y="364" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">04</text>
<text x="72" y="379" font-family="Georgia,serif" font-size="9" fill="#0f2240">Stories solo</text>
<text x="72" y="393" font-family="Georgia,serif" font-size="9" fill="#0f2240">vs collaboration</text>
<text x="220" y="364" font-family="Georgia,serif" font-size="9" fill="#0f2240">R&#233;partition</text>
<text x="220" y="378" font-family="Georgia,serif" font-size="9" fill="#0f2240">&#233;quilibr&#233;e</text>
<text x="220" y="392" font-family="Georgia,serif" font-size="9" fill="#0f2240">entre devs</text>
<text x="430" y="364" font-family="Georgia,serif" font-size="9" fill="#cc3333">1 dev = 60 &#37;</text>
<text x="430" y="378" font-family="Georgia,serif" font-size="9" fill="#cc3333">du code sur</text>
<text x="430" y="392" font-family="Georgia,serif" font-size="9" fill="#cc3333">3 sprints cons.</text>
<text x="610" y="364" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Asym&#233;trie adoption.</text>
<text x="610" y="378" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Visible depuis</text>
<text x="610" y="392" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">l&#39;outil de suivi.</text>
<line x1="54" y1="404" x2="794" y2="404" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- KPI 5 Tete-a-tete seniors -->
<rect x="54" y="404" width="740" height="58" fill="#f8f8f8"/>
<line x1="210" y1="404" x2="210" y2="462" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="420" y1="404" x2="420" y2="462" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="600" y1="404" x2="600" y2="462" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="54" y="404" width="5" height="58" fill="#febd10"/>
<text x="72" y="422" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">05</text>
<text x="72" y="437" font-family="Georgia,serif" font-size="9" fill="#0f2240">T&#234;te-&#224;-t&#234;te</text>
<text x="72" y="451" font-family="Georgia,serif" font-size="9" fill="#0f2240">seniors / trimestre</text>
<text x="220" y="422" font-family="Georgia,serif" font-size="9" fill="#0f2240">Au moins 1</text>
<text x="220" y="436" font-family="Georgia,serif" font-size="9" fill="#0f2240">par senior</text>
<text x="220" y="450" font-family="Georgia,serif" font-size="9" fill="#0f2240">par trimestre</text>
<text x="430" y="422" font-family="Georgia,serif" font-size="9" fill="#cc3333">0 entretien</text>
<text x="430" y="436" font-family="Georgia,serif" font-size="9" fill="#cc3333">sur la perception</text>
<text x="430" y="450" font-family="Georgia,serif" font-size="9" fill="#cc3333">du r&#244;le</text>
<text x="610" y="422" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Planifier cette semaine.</text>
<text x="610" y="436" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Question : &#171;&#160;Comment</text>
<text x="610" y="450" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">tu te sens dans ton r&#244;le ?&#160;&#187;</text>
<line x1="54" y1="462" x2="794" y2="462" stroke="#e0e0e0" stroke-width="0.8"/>

<!-- KPI 6 IA Policy -->
<rect x="54" y="462" width="740" height="58" fill="#ffffff"/>
<line x1="210" y1="462" x2="210" y2="520" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="420" y1="462" x2="420" y2="520" stroke="#e0e0e0" stroke-width="0.8"/>
<line x1="600" y1="462" x2="600" y2="520" stroke="#e0e0e0" stroke-width="0.8"/>
<rect x="54" y="462" width="5" height="58" fill="#febd10"/>
<text x="72" y="480" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#0f2240" font-weight="bold">06</text>
<text x="72" y="495" font-family="Georgia,serif" font-size="9" fill="#0f2240">IA Policy</text>
<text x="72" y="509" font-family="Georgia,serif" font-size="9" fill="#0f2240">One-Pager</text>
<text x="220" y="480" font-family="Georgia,serif" font-size="9" fill="#0f2240">R&#233;dig&#233;e,</text>
<text x="220" y="494" font-family="Georgia,serif" font-size="9" fill="#0f2240">partag&#233;e,</text>
<text x="220" y="508" font-family="Georgia,serif" font-size="9" fill="#0f2240">r&#233;vis&#233;e 1 fois</text>
<text x="430" y="480" font-family="Georgia,serif" font-size="9" fill="#cc3333">Non r&#233;dig&#233;e</text>
<text x="430" y="494" font-family="Georgia,serif" font-size="9" fill="#cc3333">ou non</text>
<text x="430" y="508" font-family="Georgia,serif" font-size="9" fill="#cc3333">discut&#233;e</text>
<text x="610" y="480" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">Voir FP V-17.3.</text>
<text x="610" y="494" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">30 minutes en</text>
<text x="610" y="508" font-family="Georgia,serif" font-size="8.5" fill="#0f2240">&#233;quipe suffisent.</text>
<line x1="54" y1="520" x2="794" y2="520" stroke="#e0e0e0" stroke-width="0.8"/>

