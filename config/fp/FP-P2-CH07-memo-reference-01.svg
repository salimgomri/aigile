<text x="252" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUOI</text>
<text x="252" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Lire les 4 m&#233;triques DORA et leur niveau</text>
<text x="437" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">QUAND L'UTILISER</text>
<text x="437" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">R&#233;trospective, Sprint Review, dashboard</text>
<text x="622" y="97"
      style="font-family:'Helvetica';font-size:7.5px;fill:#0f2240;letter-spacing:1.5px;">VALEUR APPORT&#201;E</text>
<text x="622" y="113"
      style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#0f2240;opacity:0.65;">Diagnostic technique sans lire le code</text>

<!-- ============================================================ -->
<!-- LIGNE 1 (2 colonnes) : Bloc 1 + Bloc 2 -->
<!-- ============================================================ -->
<rect x="54" y="160" width="362" height="180" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<rect x="54" y="160" width="362" height="22" style="fill:#0f2240;"/>
<text x="68" y="175" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">1. LES 4 M&#201;TRIQUES (NIVEAU ELITE)</text>

<text x="68" y="202" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">Deployment Frequency (livraison)</text>
<text x="68" y="216" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Elite : plusieurs fois / jour</text>
<text x="68" y="231" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">Lead Time for Changes (rapidit&#233;)</text>
<text x="68" y="245" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Elite : moins d'1 heure (commit &#8594; prod)</text>
<text x="68" y="260" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">Change Failure Rate (qualit&#233;)</text>
<text x="68" y="274" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Elite : 0 &#224; 5 % de d&#233;ploiements en &#233;chec</text>
<text x="68" y="289" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">Mean Time to Recovery (r&#233;silience)</text>
<text x="68" y="303" style="font-family:'EB Garamond','Georgia',serif;font-size:9.5px;fill:#0f2240;">Elite : moins d'1 heure de r&#233;tablissement</text>

<text x="68" y="325" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#bbb;">Seuils State of DevOps 2019. Les &#233;ditions</text>
<text x="68" y="337" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#bbb;">2023-2024 ont l&#233;g&#232;rement relev&#233; Elite.</text>

<rect x="430" y="160" width="362" height="180" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<rect x="430" y="160" width="362" height="22" style="fill:#0f2240;"/>
<text x="444" y="175" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">2. LIRE LES M&#201;TRIQUES ENSEMBLE</text>

<text x="444" y="200" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#8226; DF haute + CFR haute</text>
<text x="456" y="213" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">&#201;quipe casse beaucoup. Tests insuffisants.</text>
<text x="456" y="225" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Aller plus lentement pour aller plus vite.</text>

<text x="444" y="244" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#8226; DF basse + MTTR long</text>
<text x="456" y="257" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">D&#233;ploiements rares, chaque incident est</text>
<text x="456" y="269" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">une crise. Priorit&#233; : automatiser.</text>

<text x="444" y="288" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#8226; DF basse + CFR bas</text>
<text x="456" y="301" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Illusion de qualit&#233; : tout est test&#233; &#224; la</text>
<text x="456" y="313" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">main. Vrai risque : Lead Time et r&#233;activit&#233;.</text>

<text x="444" y="332" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#8226; Tous niveaux Elite</text>
<text x="456" y="345" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Partage les pratiques avec les autres &#233;quipes.</text>

<!-- ============================================================ -->
<!-- LIGNE 2 (pleine largeur) : Bloc 3 - Posture SM facilitateur -->
<!-- ============================================================ -->
<rect x="54" y="358" width="738" height="160" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<rect x="54" y="358" width="738" height="22" style="fill:#0f2240;"/>
<text x="68" y="373" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">3. TU N'ES PAS L'ING&#201;NIEUR : TU ES LE FACILITATEUR</text>

<text x="68" y="402" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">En r&#233;trospective, 15 minutes en d&#233;but de c&#233;r&#233;monie, pose ces 3 questions ouvertes :</text>

<text x="68" y="430" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#8594; Qu'est-ce qui vous emp&#234;che de d&#233;ployer plus souvent ?</text>
<text x="68" y="455" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#8594; Quand un bug arrive en prod, qu'est-ce qui prend le plus de temps pour le corriger ?</text>
<text x="68" y="480" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#0f2240;">&#8594; Quel pourcentage de nos d&#233;ploiements se passe sans stress ?</text>

<text x="68" y="505" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#bbb;">Si personne ne mord la premi&#232;re fois, reviens dans 2 sprints avec le tableau du bloc 2 sous les yeux.</text>

<!-- ============================================================ -->
<!-- LIGNE 3 (pleine largeur) : Bloc 4 - Cadran Qualite dashboard -->
<!-- ============================================================ -->
<rect x="54" y="536" width="738" height="120" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<rect x="54" y="536" width="738" height="22" style="fill:#0f2240;"/>
<text x="68" y="551" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">4. LE CADRAN QUALIT&#201; DU DASHBOARD (CHAPITRE 8)</text>

<text x="68" y="580" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">M&#233;trique principale : CFR (Change Failure Rate)</text>
<text x="68" y="598" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">CFR &lt; 5 % = Vert &#160;&#160;&#8226;&#160;&#160; 5-15 % = Ambre &#160;&#160;&#8226;&#160;&#160; &gt; 15 % = Rouge</text>

<text x="68" y="623" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">Indicateur secondaire : taux de bugs entrants (pas les bugs trait&#233;s, les bugs d&#233;tect&#233;s)</text>
<text x="68" y="641" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;font-style:italic;fill:#bbb;">Si ce taux baisse sur 5 sprints, la qualit&#233; s'am&#233;liore structurellement (Forsgren, Humble, Kim, Accelerate).</text>

<!-- ============================================================ -->
<!-- LIGNE 4 (pleine largeur, fond creme) : Bloc 5 - En pratique -->
<!-- ============================================================ -->
<rect x="54" y="674" width="738" height="120" style="fill:#fafaf7;stroke:#e0e0e0;stroke-width:0.5px;"/>
<rect x="54" y="674" width="738" height="22" style="fill:#0f2240;"/>
<text x="68" y="689" style="font-family:'Helvetica';font-size:9px;font-weight:bold;fill:#fff;">5. EN PRATIQUE : PAR O&#217; COMMENCER</text>

<text x="68" y="718" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">D&#233;marre par une seule m&#233;trique : la Deployment Frequency.</text>
<text x="68" y="736" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Compteur simple (post-it ou champ CI). Apr&#232;s 3 sprints : baseline. Ajoute le Lead Time.</text>

<text x="68" y="761" style="font-family:'EB Garamond','Georgia',serif;font-size:10px;fill:#0f2240;">Pas de pipeline automatis&#233; ? Mesure le Lead Time &#224; la main.</text>
<text x="68" y="779" style="font-family:'EB Garamond','Georgia',serif;font-size:9px;fill:#0f2240;">Date du premier commit vs date de mise en prod, sur un tableur, sur un sprint.</text>

<text x="68" y="784" style="font-family:'EB Garamond','Georgia',serif;font-size:8.5px;font-style:italic;fill:#bbb;">Ne pas mesurer les 4 simultan&#233;ment : l'effort de collecte noie le signal.</text>

